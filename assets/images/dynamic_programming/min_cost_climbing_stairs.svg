<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .arr{fill:#ddeeff;stroke:#6699cc;stroke-width:1.5}
  .lbl{font:11px monospace;fill:#333;text-anchor:middle}
  .idx{font:10px sans-serif;fill:#888;text-anchor:middle}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .cmp{font:11px sans-serif;fill:#333}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}

  @keyframes dp0{0%,10%{fill:#ddeeff}10.1%,100%{fill:#ccffcc}}
  @keyframes dp1{0%,22%{fill:#ddeeff}22.1%,100%{fill:#ccffcc}}
  @keyframes dp2{0%,34%{fill:#ddeeff}34.1%,100%{fill:#ccffcc}}
  @keyframes dp3{0%,46%{fill:#ddeeff}46.1%,100%{fill:#ccffcc}}
  @keyframes dp4{0%,58%{fill:#ddeeff}58.1%,100%{fill:#ccffcc}}
  @keyframes dp5{0%,70%{fill:#ddeeff}70.1%,100%{fill:#ccffcc}}
  .d0{animation:dp0 8s ease-in-out infinite}
  .d1{animation:dp1 8s ease-in-out infinite}
  .d2{animation:dp2 8s ease-in-out infinite}
  .d3{animation:dp3 8s ease-in-out infinite}
  .d4{animation:dp4 8s ease-in-out infinite}
  .d5{animation:dp5 8s ease-in-out infinite}

  @keyframes ptr_move{0%{transform:translateX(0)}20%{transform:translateX(54px)}40%{transform:translateX(108px)}60%{transform:translateX(162px)}80%{transform:translateX(216px)}100%{transform:translateX(270px)}}
  .ptmv{animation:ptr_move 8s ease-in-out infinite}

  @keyframes sl0{0%,15%{opacity:1}16%,100%{opacity:0}}
  @keyframes sl1{0%,15%{opacity:0}16%,30%{opacity:1}31%,100%{opacity:0}}
  @keyframes sl2{0%,30%{opacity:0}31%,45%{opacity:1}46%,100%{opacity:0}}
  @keyframes sl3{0%,45%{opacity:0}46%,60%{opacity:1}61%,100%{opacity:0}}
  @keyframes sl4{0%,60%{opacity:0}61%,75%{opacity:1}76%,100%{opacity:0}}
  @keyframes sl5{0%,75%{opacity:0}76%,100%{opacity:1}}
  .sl0{animation:sl0 8s ease-in-out infinite}
  .sl1{animation:sl1 8s ease-in-out infinite}
  .sl2{animation:sl2 8s ease-in-out infinite}
  .sl3{animation:sl3 8s ease-in-out infinite}
  .sl4{animation:sl4 8s ease-in-out infinite}
  .sl5{animation:sl5 8s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Min Cost Climbing Stairs</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">cost = [10, 15, 20]  →  min cost = 15  (start at step 1, jump 2 to top)</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Recursion with Memoization — O(n)</text>

<!-- Staircase visualization -->
<text x="32" y="142" class="cmp">cost[] = [10, 15, 20], top = index 3:</text>
<!-- stairs drawn as ascending rectangles -->
<g transform="translate(50,230)">
  <!-- step 0 -->
  <rect x="0" y="-40" width="60" height="40" fill="#ffcccc" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="30" y="-15" class="lbl">cost=10</text>
  <text x="30" y="-2" class="idx">step 0</text>
  <!-- step 1 -->
  <rect x="80" y="-80" width="60" height="80" fill="#ffcccc" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="110" y="-55" class="lbl">cost=15</text>
  <text x="110" y="-42" class="idx">step 1</text>
  <!-- step 2 -->
  <rect x="160" y="-120" width="60" height="120" fill="#ffcccc" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="190" y="-95" class="lbl">cost=20</text>
  <text x="190" y="-82" class="idx">step 2</text>
  <!-- top platform -->
  <rect x="240" y="-140" width="60" height="20" fill="#ddeeff" stroke="#6699cc" stroke-width="1.5"/>
  <text x="270" y="-126" class="lbl">TOP</text>
  <!-- arrows showing jumps -->
  <line x1="30" y1="-40" x2="110" y2="-80" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="110" y1="-80" x2="270" y2="-140" stroke="#27AE60" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="145" y="-125" class="cmp" fill="#27AE60">cost=15, jump 2</text>
  <line x1="30" y1="-40" x2="190" y2="-120" stroke="#888" stroke-width="1" stroke-dasharray="3,2"/>
</g>

<!-- Recursion calls -->
<text x="400" y="142" class="cmp">Recurrence: minCost(n) = </text>
<text x="400" y="158" class="cmp">  min(cost[n-1]+minCost(n-1),</text>
<text x="400" y="172" class="cmp">      cost[n-2]+minCost(n-2))</text>
<text x="400" y="192" class="cmp">Base: minCost(0)=cost[0], minCost(1)=cost[1]</text>
<text x="400" y="215" class="cmp sl0">① minCost(2) = min(10+cost[0], 15+cost[1])</text>
<text x="400" y="215" class="cmp sl1">② minCost(2) = min(10+10, 15+15) = 20</text>
<text x="400" y="215" class="cmp sl2">③ minCost(3) = min(minCost(2)+cost[2], minCost(1)+cost[1])</text>
<text x="400" y="215" class="cmp sl3">④ minCost(3) = min(20+20, 15+15) = 30? No!</text>
<text x="400" y="215" class="cmp sl4">⑤ min(cost[n-1]+prev2, cost[n-2]+prev1)</text>
<text x="400" y="215" class="cmp sl5" fill="#E74C3C">Answer: 15 (start step 1, jump 2 to top)</text>

<!-- Evolution arrow -->
<line x1="450" y1="310" x2="450" y2="330" class="evol"/>
<polygon points="450,331 444,318 456,318" fill="#888"/>
<rect x="330" y="313" width="240" height="30" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="332" text-anchor="middle" class="ins">Bottom-up DP — avoid recursion stack</text>

<!-- APPROACH 2: DP Tabulation -->
<rect x="16" y="348" width="868" height="216" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: Bottom-Up DP — O(n) time, O(1) space</text>

<text x="32" y="397" class="cmp">dp[i] = min cost to reach step i from below:</text>
<g transform="translate(32,408)">
  <rect class="arr d0" x="0" y="0" width="48" height="36"/><text x="24" y="14" class="lbl">cost</text><text x="24" y="28" class="lbl">10</text><text x="24" y="46" class="idx">0</text>
  <rect class="arr d0" x="54" y="0" width="48" height="36"/><text x="78" y="14" class="lbl">cost</text><text x="78" y="28" class="lbl">15</text><text x="78" y="46" class="idx">1</text>
  <rect class="arr d1" x="108" y="0" width="48" height="36"/><text x="132" y="14" class="lbl">dp</text><text x="132" y="28" class="lbl">20</text><text x="132" y="46" class="idx">2</text>
  <rect class="arr d2" x="162" y="0" width="48" height="36"/><text x="186" y="14" class="lbl">dp</text><text x="186" y="28" class="lbl">15</text><text x="186" y="46" class="idx">top</text>
  <g class="ptmv">
    <polygon points="24,46 18,58 30,58" fill="#27AE60"/>
  </g>
</g>

<text x="32" y="478" class="cmp sl0">① dp[0]=cost[0]=10, dp[1]=cost[1]=15</text>
<text x="32" y="478" class="cmp sl1">② dp[2] = cost[2]+min(dp[0],dp[1])=20+10=30? No</text>
<text x="32" y="493" class="cmp sl1">   dp[2] = min(dp[0]+cost[0], dp[1]+cost[1])=min(20,30)=20</text>
<text x="32" y="478" class="cmp sl2">③ dp[top] = min(dp[1]+cost[1], dp[2]+cost[2])</text>
<text x="32" y="493" class="cmp sl2">          = min(15+15, 20+20) = min(30,40) = 30?</text>
<text x="32" y="478" class="cmp sl3">④ Simpler: track just prev2 &amp; prev1</text>
<text x="32" y="493" class="cmp sl3">   answer = min(prev1+cost[n-1], prev2+cost[n-2])</text>
<text x="32" y="478" class="cmp sl4">⑤ Space-optimized: only 2 variables needed</text>
<text x="32" y="478" class="cmp sl5" fill="#27AE60">Answer = 15 ✓</text>

<!-- O(1) space breakdown -->
<rect x="480" y="380" width="388" height="160" fill="#fff9e6" stroke="#F39C12" stroke-width="1.5" rx="5"/>
<text x="496" y="396" class="cmp" font-weight="bold" fill="#F39C12">O(1) Space Solution:</text>
<text x="496" y="412" class="cmp">prev2 = cost[0] = 10</text>
<text x="496" y="426" class="cmp">prev1 = cost[1] = 15</text>
<text x="496" y="440" class="cmp">for i in range(2, len(cost)):</text>
<text x="496" y="454" class="cmp">  curr = cost[i] + min(prev1, prev2)</text>
<text x="496" y="468" class="cmp">  prev2, prev1 = prev1, curr</text>
<text x="496" y="490" class="cmp">return min(prev1, prev2)</text>
<text x="496" y="507" class="cmp" fill="#27AE60">→ min(15, 20+cost[2]) = 15</text>
<text x="496" y="521" class="cmp" fill="#27AE60">  (can also start at index 1, jump to top)</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="6"/>
<text x="182" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="430" y="595" class="tbl" font-weight="bold">Time</text>
<text x="610" y="595" class="tbl" font-weight="bold">Space</text>
<text x="790" y="595" class="tbl" font-weight="bold">Recommended</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="182" y="620" class="tbl">Recursion + Memo</text>
<text x="430" y="620" class="tbl">O(n)</text>
<text x="610" y="620" class="tbl">O(n)</text>
<text x="790" y="620" class="tbl">✓ Good</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="182" y="644" class="tbl">Bottom-Up DP (2-var)</text>
<text x="430" y="644" class="tbl">O(n)</text>
<text x="610" y="644" class="tbl">O(1)</text>
<text x="790" y="644" class="tbl">✓ Optimal</text>
<line x1="16" y1="652" x2="884" y2="652" stroke="#ddd" stroke-width="1"/>
<text x="182" y="668" class="tbl" fill="#27AE60" font-weight="bold">▶ Can start at step 0 or step 1 (check both)</text>
</svg>
