<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .app1{fill:#E74C3C}.app2{fill:#27AE60}
  .box{fill:#fff;stroke:#ccc;stroke-width:1.5;rx:6}
  .arr{fill:#ddeeff;stroke:#6699cc;stroke-width:1.5}
  .hlA{fill:#ffcccc;stroke:#E74C3C;stroke-width:2}
  .hlB{fill:#ccffcc;stroke:#27AE60;stroke-width:2}
  .lbl{font:11px monospace;fill:#333;text-anchor:middle}
  .idx{font:10px sans-serif;fill:#888;text-anchor:middle}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .cmp{font:11px sans-serif;fill:#333}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .thd{fill:#f0f0f0;stroke:#bbb;stroke-width:1}
  .tdc{fill:#fff;stroke:#bbb;stroke-width:1}

  @keyframes hl_a0{0%,100%{fill:#ffcccc}40%{fill:#E74C3C;fill-opacity:0.7}}
  @keyframes hl_a1{0%,8%{fill:#ddeeff}8.1%,30%{fill:#ffcccc}30.1%,100%{fill:#ddeeff}}
  @keyframes hl_a2{0%,16%{fill:#ddeeff}16.1%,54%{fill:#ffcccc}54.1%,100%{fill:#ddeeff}}
  @keyframes hl_a3{0%,24%{fill:#ddeeff}24.1%,100%{fill:#ffcccc}}

  .hla0{animation:hl_a0 8s ease-in-out infinite}
  .hla1{animation:hl_a1 8s ease-in-out infinite}
  .hla2{animation:hl_a2 8s ease-in-out infinite}
  .hla3{animation:hl_a3 8s ease-in-out infinite}

  /* Approach 2: dp[] fill animations */
  @keyframes dp0{0%,10%{fill:#ddeeff}10.1%,100%{fill:#ccffcc}}
  @keyframes dp1{0%,20%{fill:#ddeeff}20.1%,100%{fill:#ccffcc}}
  @keyframes dp2{0%,32%{fill:#ddeeff}32.1%,100%{fill:#ccffcc}}
  @keyframes dp3{0%,44%{fill:#ddeeff}44.1%,100%{fill:#ccffcc}}
  @keyframes dp4{0%,56%{fill:#ddeeff}56.1%,100%{fill:#ccffcc}}
  @keyframes dp5{0%,68%{fill:#ddeeff}68.1%,100%{fill:#ccffcc}}
  @keyframes dp6{0%,80%{fill:#ddeeff}80.1%,100%{fill:#ccffcc}}
  .d0{animation:dp0 8s ease-in-out infinite}
  .d1{animation:dp1 8s ease-in-out infinite}
  .d2{animation:dp2 8s ease-in-out infinite}
  .d3{animation:dp3 8s ease-in-out infinite}
  .d4{animation:dp4 8s ease-in-out infinite}
  .d5{animation:dp5 8s ease-in-out infinite}
  .d6{animation:dp6 8s ease-in-out infinite}

  @keyframes pt_move{0%{transform:translateX(0)}15%{transform:translateX(48px)}30%{transform:translateX(96px)}45%{transform:translateX(144px)}60%{transform:translateX(192px)}75%{transform:translateX(240px)}90%,100%{transform:translateX(288px)}}
  .dpt{animation:pt_move 8s ease-in-out infinite}

  /* step labels */
  @keyframes sl0{0%,14%{opacity:1}15%,100%{opacity:0}}
  @keyframes sl1{0%,14%{opacity:0}15%,28%{opacity:1}29%,100%{opacity:0}}
  @keyframes sl2{0%,28%{opacity:0}29%,42%{opacity:1}43%,100%{opacity:0}}
  @keyframes sl3{0%,42%{opacity:0}43%,56%{opacity:1}57%,100%{opacity:0}}
  @keyframes sl4{0%,56%{opacity:0}57%,70%{opacity:1}71%,100%{opacity:0}}
  @keyframes sl5{0%,70%{opacity:0}71%,84%{opacity:1}85%,100%{opacity:0}}
  @keyframes sl6{0%,84%{opacity:0}85%,100%{opacity:1}}
  .sl0{animation:sl0 8s ease-in-out infinite}
  .sl1{animation:sl1 8s ease-in-out infinite}
  .sl2{animation:sl2 8s ease-in-out infinite}
  .sl3{animation:sl3 8s ease-in-out infinite}
  .sl4{animation:sl4 8s ease-in-out infinite}
  .sl5{animation:sl5 8s ease-in-out infinite}
  .sl6{animation:sl6 8s ease-in-out infinite}
</style>

<!-- Title -->
<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Longest Increasing Subsequence</text>

<!-- Problem strip -->
<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">nums = [10, 9, 2, 5, 3, 7, 101, 18]  →  LIS length = 4  (e.g., [2,3,7,18] or [2,5,7,101])</text>

<!-- ===== APPROACH 1: RECURSIVE DP ===== -->
<rect x="16" y="92" width="868" height="220" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Recursive DP — O(2ⁿ)</text>

<!-- Array display -->
<text x="32" y="142" class="cmp">Array:</text>
<g transform="translate(90,125)">
  <rect class="arr hla0" x="0" y="0" width="42" height="36"/><text x="21" y="23" class="lbl">10</text><text x="21" y="40" class="idx">0</text>
  <rect class="arr hla1" x="48" y="0" width="42" height="36"/><text x="69" y="23" class="lbl">9</text><text x="69" y="40" class="idx">1</text>
  <rect class="arr hla2" x="96" y="0" width="42" height="36"/><text x="117" y="23" class="lbl">2</text><text x="117" y="40" class="idx">2</text>
  <rect class="arr hla2" x="144" y="0" width="42" height="36"/><text x="165" y="23" class="lbl">5</text><text x="165" y="40" class="idx">3</text>
  <rect class="arr hla3" x="192" y="0" width="42" height="36"/><text x="213" y="23" class="lbl">3</text><text x="213" y="40" class="idx">4</text>
  <rect class="arr hla3" x="240" y="0" width="42" height="36"/><text x="261" y="23" class="lbl">7</text><text x="261" y="40" class="idx">5</text>
  <rect class="arr" x="288" y="0" width="42" height="36"/><text x="309" y="23" class="lbl">101</text><text x="309" y="40" class="idx">6</text>
  <rect class="arr" x="336" y="0" width="42" height="36"/><text x="357" y="23" class="lbl">18</text><text x="357" y="40" class="idx">7</text>
</g>

<!-- Recursion tree partial -->
<text x="530" y="142" class="cmp">Recursion tree (partial):</text>
<text x="530" y="165" class="cmp" fill="#E74C3C">lis(0,−∞)</text>
<line x1="570" y1="168" x2="540" y2="182" stroke="#aaa" stroke-width="1"/>
<line x1="570" y1="168" x2="610" y2="182" stroke="#aaa" stroke-width="1"/>
<text x="530" y="195" class="cmp" fill="#E74C3C">lis(1,10)</text>
<text x="600" y="195" class="cmp" fill="#888">skip(1)</text>
<line x1="605" y1="198" x2="590" y2="210" stroke="#aaa" stroke-width="1"/>
<line x1="605" y1="198" x2="630" y2="210" stroke="#aaa" stroke-width="1"/>
<text x="575" y="222" class="cmp" fill="#E74C3C" font-size="10">lis(2,10)</text>
<text x="625" y="222" class="cmp" fill="#888" font-size="10">skip(2)</text>
<text x="530" y="240" class="cmp" fill="#888" font-size="10">⋮ overlapping subproblems → exponential</text>

<!-- Step labels A -->
<g x="32" y="155">
  <text x="32" y="200" class="cmp sl0">① Pick starting index i, check all j&gt;i</text>
  <text x="32" y="215" class="cmp sl0">   where nums[j]&gt;nums[i], recurse</text>
  <text x="32" y="200" class="cmp sl1">② Many subproblems recomputed</text>
  <text x="32" y="215" class="cmp sl1">   (e.g., lis(2,*) called many times)</text>
  <text x="32" y="200" class="cmp sl2">③ Worst case: every element can be</text>
  <text x="32" y="215" class="cmp sl2">   in/out of subsequence → O(2ⁿ)</text>
</g>

<!-- ===== APPROACH 2: DP + PATIENCE SORT ===== -->
<rect x="16" y="328" width="868" height="234" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="328" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="342" width="868" height="14" fill="#27AE60"/>
<text x="32" y="347" class="sec" fill="white">Approach 2: DP O(n²) / Patience Sort O(n log n)</text>

<!-- Array for DP -->
<text x="32" y="380" class="cmp">dp[i] = LIS length ending at index i:</text>
<g transform="translate(32,390)">
  <rect class="arr d0" x="0" y="0" width="48" height="36"/><text x="24" y="18" class="lbl">10</text><text x="24" y="30" class="lbl" font-size="10">dp=1</text><text x="24" y="46" class="idx">0</text>
  <rect class="arr d1" x="54" y="0" width="48" height="36"/><text x="78" y="18" class="lbl">9</text><text x="78" y="30" class="lbl" font-size="10">dp=1</text><text x="78" y="46" class="idx">1</text>
  <rect class="arr d2" x="108" y="0" width="48" height="36"/><text x="132" y="18" class="lbl">2</text><text x="132" y="30" class="lbl" font-size="10">dp=1</text><text x="132" y="46" class="idx">2</text>
  <rect class="arr d3" x="162" y="0" width="48" height="36"/><text x="186" y="18" class="lbl">5</text><text x="186" y="30" class="lbl" font-size="10">dp=2</text><text x="186" y="46" class="idx">3</text>
  <rect class="arr d4" x="216" y="0" width="48" height="36"/><text x="240" y="18" class="lbl">3</text><text x="240" y="30" class="lbl" font-size="10">dp=2</text><text x="240" y="46" class="idx">4</text>
  <rect class="arr d5" x="270" y="0" width="48" height="36"/><text x="294" y="18" class="lbl">7</text><text x="294" y="30" class="lbl" font-size="10">dp=3</text><text x="294" y="46" class="idx">5</text>
  <rect class="arr d6" x="324" y="0" width="48" height="36"/><text x="348" y="18" class="lbl">101</text><text x="348" y="30" class="lbl" font-size="10">dp=4</text><text x="348" y="46" class="idx">6</text>
  <rect class="arr d6" x="378" y="0" width="48" height="36"/><text x="402" y="18" class="lbl">18</text><text x="402" y="30" class="lbl" font-size="10">dp=4</text><text x="402" y="46" class="idx">7</text>
  <!-- pointer -->
  <g class="dpt">
    <polygon points="24,50 18,62 30,62" fill="#27AE60"/>
  </g>
</g>

<!-- Step labels B (right side) -->
<g>
  <text x="510" y="378" class="cmp sl0">① dp[i]=1 initially (each elem alone)</text>
  <text x="510" y="393" class="cmp sl0">   Scan j&lt;i: if nums[j]&lt;nums[i], update</text>
  <text x="510" y="378" class="cmp sl1">② dp[3]=2 since nums[2]=2&lt;nums[3]=5</text>
  <text x="510" y="393" class="cmp sl1">   dp[3]=max(dp[3], dp[2]+1)=2</text>
  <text x="510" y="378" class="cmp sl2">③ dp[5]=3 since nums[4]=3&lt;nums[5]=7</text>
  <text x="510" y="393" class="cmp sl2">   dp[5]=max(dp[5], dp[4]+1)=3</text>
  <text x="510" y="378" class="cmp sl3">④ dp[6]=4 since nums[5]=7&lt;nums[6]=101</text>
  <text x="510" y="393" class="cmp sl3">   Answer = max(dp) = 4</text>
  <text x="510" y="378" class="cmp sl4">⑤ Patience Sort (O(n log n)):</text>
  <text x="510" y="393" class="cmp sl4">   Maintain tails[], binary search</text>
  <text x="510" y="408" class="cmp sl4">   for replacement position</text>
</g>

<!-- Patience sort tails box -->
<rect x="510" y="420" width="360" height="90" fill="#e8f5e9" stroke="#27AE60" stroke-width="1" rx="4"/>
<text x="530" y="438" class="cmp" fill="#27AE60" font-weight="bold">Patience Sort tails[] progression:</text>
<text x="530" y="454" class="cmp">10 → [10]</text>
<text x="530" y="468" class="cmp"> 9 → [9]     (replace 10 with 9)</text>
<text x="530" y="482" class="cmp"> 2 → [2]     (replace 9 with 2)</text>
<text x="530" y="496" class="cmp"> 5 → [2,5]    3→[2,3]  7→[2,3,7]  101→[2,3,7,101]  18→[2,3,7,18]</text>
<text x="530" y="510" class="cmp" fill="#27AE60">len(tails) = 4 = LIS length</text>

<!-- Evolution arrow -->
<line x1="450" y1="260" x2="450" y2="326" class="evol"/>
<polygon points="450,327 444,314 456,314" fill="#888"/>
<rect x="360" y="278" width="180" height="40" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="293" text-anchor="middle" class="ins">Memoize → O(n²) DP</text>
<text x="450" y="309" text-anchor="middle" class="ins">Patience Sort → O(n log n)</text>

<!-- Complexity table -->
<rect x="16" y="580" width="868" height="96" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="580" width="868" height="26" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="6"/>
<text x="182" y="597" class="tbl" font-weight="bold">Approach</text>
<text x="430" y="597" class="tbl" font-weight="bold">Time</text>
<text x="610" y="597" class="tbl" font-weight="bold">Space</text>
<text x="790" y="597" class="tbl" font-weight="bold">Recommended</text>
<rect x="16" y="606" width="868" height="24" fill="#fff5f5"/>
<text x="182" y="622" class="tbl">Recursive DP</text>
<text x="430" y="622" class="tbl">O(2ⁿ)</text>
<text x="610" y="622" class="tbl">O(n)</text>
<text x="790" y="622" class="tbl">✗ TLE</text>
<rect x="16" y="630" width="868" height="24" fill="#f0fff0"/>
<text x="182" y="646" class="tbl">DP / Patience Sort</text>
<text x="430" y="646" class="tbl">O(n²) / O(n log n)</text>
<text x="610" y="646" class="tbl">O(n)</text>
<text x="790" y="646" class="tbl">✓ Optimal</text>
<rect x="16" y="654" width="868" height="22" fill="#f0fff0"/>
<text x="182" y="666" class="tbl" fill="#27AE60" font-weight="bold">▶ Patience Sort preferred for interviews</text>
</svg>
