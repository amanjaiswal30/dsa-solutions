<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .arr{fill:#ddeeff;stroke:#6699cc;stroke-width:1.5}
  .lbl{font:11px monospace;fill:#333;text-anchor:middle}
  .idx{font:10px sans-serif;fill:#888;text-anchor:middle}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .cmp{font:11px sans-serif;fill:#333}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .cell{stroke-width:1.2}

  @keyframes sl0{0%,18%{opacity:1}19%,100%{opacity:0}}
  @keyframes sl1{0%,18%{opacity:0}19%,36%{opacity:1}37%,100%{opacity:0}}
  @keyframes sl2{0%,36%{opacity:0}37%,54%{opacity:1}55%,100%{opacity:0}}
  @keyframes sl3{0%,54%{opacity:0}55%,72%{opacity:1}73%,100%{opacity:0}}
  @keyframes sl4{0%,72%{opacity:0}73%,100%{opacity:1}}
  .sl0{animation:sl0 8s ease-in-out infinite}
  .sl1{animation:sl1 8s ease-in-out infinite}
  .sl2{animation:sl2 8s ease-in-out infinite}
  .sl3{animation:sl3 8s ease-in-out infinite}
  .sl4{animation:sl4 8s ease-in-out infinite}

  @keyframes hl_match{0%,25%{fill:#fff}26%,100%{fill:#ccffcc}}
  @keyframes hl_ans{0%,55%{fill:#fff}56%,100%{fill:#ffcc99}}
  .hmatch{animation:hl_match 8s ease-in-out infinite}
  .hans{animation:hl_ans 8s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Longest Palindromic Subsequence</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">s = "bbbab"  →  LPS length = 4  ("bbbb" — not contiguous, bbab→bbbb is a subsequence)</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Recursion — O(2ⁿ)</text>

<text x="32" y="144" class="cmp">s = "b b b a b"</text>
<g transform="translate(32,152)">
  <rect class="arr" x="0" y="0" width="42" height="36"/><text x="21" y="23" class="lbl">b</text><text x="21" y="47" class="idx">0</text>
  <rect class="arr" x="48" y="0" width="42" height="36"/><text x="69" y="23" class="lbl">b</text><text x="69" y="47" class="idx">1</text>
  <rect class="arr" x="96" y="0" width="42" height="36"/><text x="117" y="23" class="lbl">b</text><text x="117" y="47" class="idx">2</text>
  <rect class="arr" x="144" y="0" width="42" height="36"/><text x="165" y="23" class="lbl">a</text><text x="165" y="47" class="idx">3</text>
  <rect class="arr" x="192" y="0" width="42" height="36"/><text x="213" y="23" class="lbl">b</text><text x="213" y="47" class="idx">4</text>
</g>

<text x="300" y="144" class="cmp">Recurrence:</text>
<text x="300" y="162" class="cmp">lps(l, r):</text>
<text x="300" y="178" class="cmp">  if l==r: return 1</text>
<text x="300" y="194" class="cmp">  if s[l]==s[r]: return 2+lps(l+1,r-1)</text>
<text x="300" y="210" class="cmp">  else: return max(lps(l+1,r), lps(l,r-1))</text>

<text x="32" y="215" class="cmp sl0">① s[0]='b', s[4]='b' → match!</text>
<text x="32" y="230" class="cmp sl0">   lps(0,4) = 2 + lps(1,3)</text>
<text x="32" y="215" class="cmp sl1">② s[1]='b', s[3]='a' → no match</text>
<text x="32" y="230" class="cmp sl1">   lps(1,3) = max(lps(2,3), lps(1,2))</text>
<text x="32" y="215" class="cmp sl2">③ lps(2,3): s[2]='b',s[3]='a' → no match</text>
<text x="32" y="230" class="cmp sl2">   =max(lps(3,3),lps(2,2))=max(1,1)=1</text>
<text x="32" y="215" class="cmp sl3">④ lps(1,2): s[1]='b',s[2]='b' → match!</text>
<text x="32" y="230" class="cmp sl3">   =2+lps(2,1)=2+0=2</text>
<text x="32" y="215" class="cmp sl4">⑤ Without memo: O(2ⁿ) — huge redundancy</text>

<!-- Evolution arrow -->
<line x1="450" y1="310" x2="450" y2="328" class="evol"/>
<polygon points="450,329 444,317 456,317" fill="#888"/>
<rect x="310" y="313" width="280" height="28" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">Key insight: LPS(s) = LCS(s, reverse(s))</text>

<!-- APPROACH 2: 2D DP on interval -->
<rect x="16" y="346" width="868" height="216" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="346" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="360" width="868" height="14" fill="#27AE60"/>
<text x="32" y="365" class="sec" fill="white">Approach 2: 2D DP — O(n²) time, O(n²) space</text>

<text x="32" y="396" class="cmp">dp[i][j] = LPS length for s[i..j]. Fill diagonals bottom-up:</text>
<!-- DP table 5x5 for "bbbab" -->
<g transform="translate(32,408)">
  <!-- Row/col headers -->
  <text x="25" y="14" class="cmp" text-anchor="middle"></text>
  <text x="61" y="14" class="cmp" text-anchor="middle">b(0)</text>
  <text x="95" y="14" class="cmp" text-anchor="middle">b(1)</text>
  <text x="129" y="14" class="cmp" text-anchor="middle">b(2)</text>
  <text x="163" y="14" class="cmp" text-anchor="middle">a(3)</text>
  <text x="197" y="14" class="cmp" text-anchor="middle">b(4)</text>
  <text x="10" y="40" class="cmp" text-anchor="middle">b(0)</text>
  <text x="10" y="72" class="cmp" text-anchor="middle">b(1)</text>
  <text x="10" y="104" class="cmp" text-anchor="middle">b(2)</text>
  <text x="10" y="136" class="cmp" text-anchor="middle">a(3)</text>
  <text x="10" y="168" class="cmp" text-anchor="middle">b(4)</text>

  <!-- dp values - only upper triangle matters -->
  <!-- diagonal (len=1): all 1 -->
  <rect class="hmatch cell" x="45" y="20" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="60" y="39" class="lbl">1</text>
  <rect class="hmatch cell" x="79" y="52" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="94" y="71" class="lbl">1</text>
  <rect class="hmatch cell" x="113" y="84" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="128" y="103" class="lbl">1</text>
  <rect class="hmatch cell" x="147" y="116" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="162" y="135" class="lbl">1</text>
  <rect class="hmatch cell" x="181" y="148" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="196" y="167" class="lbl">1</text>

  <!-- len=2 -->
  <rect class="hmatch cell" x="79" y="20" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="94" y="39" class="lbl">2</text><!-- bb -->
  <rect class="hmatch cell" x="113" y="52" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="128" y="71" class="lbl">2</text><!-- bb -->
  <rect x="147" y="84" width="30" height="30" fill="#fff" stroke="#aaa" class="cell"/>
  <text x="162" y="103" class="lbl">1</text><!-- ba -->
  <rect class="hmatch cell" x="181" y="116" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="196" y="135" class="lbl">1</text><!-- ab -->

  <!-- len=3 -->
  <rect class="hmatch cell" x="113" y="20" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="128" y="39" class="lbl">3</text><!-- bbb -->
  <rect class="hmatch cell" x="147" y="52" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="162" y="71" class="lbl">2</text><!-- bba -->
  <rect class="hmatch cell" x="181" y="84" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="196" y="103" class="lbl">3</text><!-- bab -->

  <!-- len=4 -->
  <rect class="hmatch cell" x="147" y="20" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="162" y="39" class="lbl">3</text><!-- bbba -->
  <rect class="hmatch cell" x="181" y="52" width="30" height="30" fill="#fff" stroke="#aaa"/>
  <text x="196" y="71" class="lbl">4</text><!-- bbab: bbbb? b,b,b,b→4 -->

  <!-- len=5: answer -->
  <rect class="hans cell" x="181" y="20" width="30" height="30" fill="#fff" stroke="#27AE60" stroke-width="2.5"/>
  <text x="196" y="39" class="lbl" fill="#27AE60" font-weight="bold">4</text><!-- bbbab → 4 -->
</g>

<text x="300" y="430" class="cmp sl0">① Fill main diagonal: dp[i][i]=1 (single char)</text>
<text x="300" y="430" class="cmp sl1">② len=2: bb→2, bb→2, ba→1, ab→1</text>
<text x="300" y="430" class="cmp sl2">③ len=3: bbb→3, bba→2, bab→3</text>
<text x="300" y="430" class="cmp sl3">④ len=4: bbba→3, bbab→4</text>
<text x="300" y="430" class="cmp sl4" fill="#27AE60">⑤ len=5: bbbab → dp[0][4]=4 ✓</text>

<!-- Insight box right -->
<rect x="300" y="455" width="570" height="96" fill="#fff9e6" stroke="#F39C12" stroke-width="1.5" rx="5"/>
<text x="316" y="472" class="cmp" font-weight="bold" fill="#F39C12">Transition rules:</text>
<text x="316" y="488" class="cmp">if s[i]==s[j]:   dp[i][j] = 2 + dp[i+1][j-1]</text>
<text x="316" y="504" class="cmp">else:            dp[i][j] = max(dp[i+1][j], dp[i][j-1])</text>
<text x="316" y="524" class="cmp" fill="#27AE60">Shortcut: LPS(s) = LCS(s, reverse(s))</text>
<text x="316" y="538" class="cmp" fill="#27AE60">→ LCS("bbbab", "babbb") = 4</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="6"/>
<text x="182" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="430" y="595" class="tbl" font-weight="bold">Time</text>
<text x="610" y="595" class="tbl" font-weight="bold">Space</text>
<text x="790" y="595" class="tbl" font-weight="bold">Recommended</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="182" y="620" class="tbl">Recursion (no memo)</text>
<text x="430" y="620" class="tbl">O(2ⁿ)</text>
<text x="610" y="620" class="tbl">O(n)</text>
<text x="790" y="620" class="tbl">✗ TLE</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="182" y="644" class="tbl">2D DP interval</text>
<text x="430" y="644" class="tbl">O(n²)</text>
<text x="610" y="644" class="tbl">O(n²)</text>
<text x="790" y="644" class="tbl">✓ Optimal</text>
<line x1="16" y1="652" x2="884" y2="652" stroke="#ddd" stroke-width="1"/>
<text x="182" y="668" class="tbl" fill="#27AE60" font-weight="bold">▶ Fill diagonals: dp[i][j] uses dp[i+1][j-1], dp[i+1][j], dp[i][j-1]</text>
</svg>
