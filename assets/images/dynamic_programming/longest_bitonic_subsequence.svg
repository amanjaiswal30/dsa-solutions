<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .arr{fill:#ddeeff;stroke:#6699cc;stroke-width:1.5}
  .lbl{font:11px monospace;fill:#333;text-anchor:middle}
  .idx{font:10px sans-serif;fill:#888;text-anchor:middle}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .cmp{font:11px sans-serif;fill:#333}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}

  @keyframes hl_asc{0%,30%{fill:#ddeeff}31%,100%{fill:#ffcccc}}
  @keyframes hl_desc{0%,60%{fill:#ddeeff}61%,100%{fill:#ccffcc}}
  .hlas{animation:hl_asc 8s ease-in-out infinite}
  .hlds{animation:hl_desc 8s ease-in-out infinite}

  @keyframes sl0{0%,18%{opacity:1}19%,100%{opacity:0}}
  @keyframes sl1{0%,18%{opacity:0}19%,36%{opacity:1}37%,100%{opacity:0}}
  @keyframes sl2{0%,36%{opacity:0}37%,54%{opacity:1}55%,100%{opacity:0}}
  @keyframes sl3{0%,54%{opacity:0}55%,72%{opacity:1}73%,100%{opacity:0}}
  @keyframes sl4{0%,72%{opacity:0}73%,100%{opacity:1}}
  .sl0{animation:sl0 8s ease-in-out infinite}
  .sl1{animation:sl1 8s ease-in-out infinite}
  .sl2{animation:sl2 8s ease-in-out infinite}
  .sl3{animation:sl3 8s ease-in-out infinite}
  .sl4{animation:sl4 8s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Longest Bitonic Subsequence</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">nums=[1,11,2,10,4,5,2,1] → LBS=6 ([1,2,10,4,2,1] increases then decreases)</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Brute Force — O(2ⁿ)</text>

<text x="32" y="144" class="cmp">nums = [1, 11, 2, 10, 4, 5, 2, 1]</text>
<g transform="translate(32,152)">
  <rect class="arr" x="0" y="0" width="42" height="36"/><text x="21" y="23" class="lbl">1</text><text x="21" y="47" class="idx">0</text>
  <rect class="arr" x="48" y="0" width="42" height="36"/><text x="69" y="23" class="lbl">11</text><text x="69" y="47" class="idx">1</text>
  <rect class="arr" x="96" y="0" width="42" height="36"/><text x="117" y="23" class="lbl">2</text><text x="117" y="47" class="idx">2</text>
  <rect class="arr" x="144" y="0" width="42" height="36"/><text x="165" y="23" class="lbl">10</text><text x="165" y="47" class="idx">3</text>
  <rect class="arr" x="192" y="0" width="42" height="36"/><text x="213" y="23" class="lbl">4</text><text x="213" y="47" class="idx">4</text>
  <rect class="arr" x="240" y="0" width="42" height="36"/><text x="261" y="23" class="lbl">5</text><text x="261" y="47" class="idx">5</text>
  <rect class="arr" x="288" y="0" width="42" height="36"/><text x="309" y="23" class="lbl">2</text><text x="309" y="47" class="idx">6</text>
  <rect class="arr" x="336" y="0" width="42" height="36"/><text x="357" y="23" class="lbl">1</text><text x="357" y="47" class="idx">7</text>
</g>

<text x="32" y="215" class="cmp sl0">① Try every element as the "peak"</text>
<text x="32" y="230" class="cmp sl0">   Find LIS ending at peak (going up)</text>
<text x="32" y="215" class="cmp sl1">② Find LDS starting at peak (going down)</text>
<text x="32" y="230" class="cmp sl1">   Bitonic length = LIS + LDS - 1</text>
<text x="32" y="215" class="cmp sl2">③ Try all 2ⁿ subsequences → O(2ⁿ) TLE</text>
<text x="32" y="215" class="cmp sl3">④ Key obs: precompute LIS from left,</text>
<text x="32" y="230" class="cmp sl3">   LDS from right for each position</text>
<text x="32" y="215" class="cmp sl4">⑤ Then: LBS[i] = lis[i] + lds[i] - 1</text>

<!-- bitonic shape chart -->
<g transform="translate(400,140)">
  <text x="60" y="0" class="cmp" text-anchor="middle">Bitonic shape:</text>
  <!-- axis -->
  <line x1="0" y1="70" x2="200" y2="70" stroke="#aaa" stroke-width="1"/>
  <line x1="0" y1="0" x2="0" y2="70" stroke="#aaa" stroke-width="1"/>
  <!-- ascending part -->
  <polyline points="0,65 30,50 60,60 90,30 120,55 150,45" fill="none" stroke="#E74C3C" stroke-width="2"/>
  <!-- descending part -->
  <polyline points="150,45 170,60 200,65" fill="none" stroke="#27AE60" stroke-width="2"/>
  <circle cx="150" cy="45" r="4" fill="#F39C12"/>
  <text x="150" y="40" class="cmp" text-anchor="middle" fill="#F39C12" font-size="9">peak</text>
  <text x="60" y="85" class="cmp" fill="#E74C3C">ascending</text>
  <text x="180" y="85" class="cmp" fill="#27AE60" text-anchor="middle">desc</text>
</g>

<!-- Evolution arrow -->
<line x1="450" y1="310" x2="450" y2="328" class="evol"/>
<polygon points="450,329 444,317 456,317" fill="#888"/>
<rect x="280" y="313" width="340" height="28" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">Compute LIS[i] (L→R) and LDS[i] (R→L) in O(n²)</text>

<!-- APPROACH 2: DP LIS+LDS -->
<rect x="16" y="346" width="868" height="216" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="346" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="360" width="868" height="14" fill="#27AE60"/>
<text x="32" y="365" class="sec" fill="white">Approach 2: DP (LIS from left + LIS from right) — O(n²)</text>

<!-- LIS from left row -->
<text x="32" y="397" class="cmp">LIS[] (LIS ending at each index, left to right):</text>
<g transform="translate(32,407)">
  <rect class="arr hlas" x="0" y="0" width="42" height="36"/><text x="21" y="14" class="lbl">1</text><text x="21" y="27" class="lbl" font-size="9">lis=1</text><text x="21" y="46" class="idx">1</text>
  <rect class="arr hlas" x="48" y="0" width="42" height="36"/><text x="69" y="14" class="lbl">11</text><text x="69" y="27" class="lbl" font-size="9">lis=2</text><text x="69" y="46" class="idx">11</text>
  <rect class="arr hlas" x="96" y="0" width="42" height="36"/><text x="117" y="14" class="lbl">2</text><text x="117" y="27" class="lbl" font-size="9">lis=2</text><text x="117" y="46" class="idx">2</text>
  <rect class="arr hlas" x="144" y="0" width="42" height="36"/><text x="165" y="14" class="lbl">10</text><text x="165" y="27" class="lbl" font-size="9">lis=3</text><text x="165" y="46" class="idx">10</text>
  <rect class="arr hlas" x="192" y="0" width="42" height="36"/><text x="213" y="14" class="lbl">4</text><text x="213" y="27" class="lbl" font-size="9">lis=3</text><text x="213" y="46" class="idx">4</text>
  <rect class="arr hlas" x="240" y="0" width="42" height="36"/><text x="261" y="14" class="lbl">5</text><text x="261" y="27" class="lbl" font-size="9">lis=4</text><text x="261" y="46" class="idx">5</text>
  <rect class="arr hlas" x="288" y="0" width="42" height="36"/><text x="309" y="14" class="lbl">2</text><text x="309" y="27" class="lbl" font-size="9">lis=2</text><text x="309" y="46" class="idx">2</text>
  <rect class="arr hlas" x="336" y="0" width="42" height="36"/><text x="357" y="14" class="lbl">1</text><text x="357" y="27" class="lbl" font-size="9">lis=1</text><text x="357" y="46" class="idx">1</text>
</g>

<!-- LDS from right row -->
<text x="32" y="468" class="cmp">LDS[] (LIS from right = decreasing subseq length at each index):</text>
<g transform="translate(32,478)">
  <rect class="arr hlds" x="0" y="0" width="42" height="36"/><text x="21" y="14" class="lbl">1</text><text x="21" y="27" class="lbl" font-size="9">lds=1</text><text x="21" y="46" class="idx">1</text>
  <rect class="arr hlds" x="48" y="0" width="42" height="36"/><text x="69" y="14" class="lbl">11</text><text x="69" y="27" class="lbl" font-size="9">lds=4</text><text x="69" y="46" class="idx">11</text>
  <rect class="arr hlds" x="96" y="0" width="42" height="36"/><text x="117" y="14" class="lbl">2</text><text x="117" y="27" class="lbl" font-size="9">lds=3</text><text x="117" y="46" class="idx">2</text>
  <rect class="arr hlds" x="144" y="0" width="42" height="36"/><text x="165" y="14" class="lbl">10</text><text x="165" y="27" class="lbl" font-size="9">lds=4</text><text x="165" y="46" class="idx">10</text>
  <rect class="arr hlds" x="192" y="0" width="42" height="36"/><text x="213" y="14" class="lbl">4</text><text x="213" y="27" class="lbl" font-size="9">lds=3</text><text x="213" y="46" class="idx">4</text>
  <rect class="arr hlds" x="240" y="0" width="42" height="36"/><text x="261" y="14" class="lbl">5</text><text x="261" y="27" class="lbl" font-size="9">lds=3</text><text x="261" y="46" class="idx">5</text>
  <rect class="arr hlds" x="288" y="0" width="42" height="36"/><text x="309" y="14" class="lbl">2</text><text x="309" y="27" class="lbl" font-size="9">lds=2</text><text x="309" y="46" class="idx">2</text>
  <rect class="arr hlds" x="336" y="0" width="42" height="36"/><text x="357" y="14" class="lbl">1</text><text x="357" y="27" class="lbl" font-size="9">lds=1</text><text x="357" y="46" class="idx">1</text>
</g>

<!-- LBS computation box -->
<rect x="440" y="396" width="440" height="152" fill="#fff9e6" stroke="#F39C12" stroke-width="1.5" rx="5"/>
<text x="456" y="412" class="cmp" font-weight="bold" fill="#F39C12">LBS[i] = LIS[i] + LDS[i] - 1:</text>
<text x="456" y="428" class="cmp">Index:  0   1   2   3   4   5   6   7</text>
<text x="456" y="444" class="cmp">LIS:    1   2   2   3   3   4   2   1</text>
<text x="456" y="460" class="cmp">LDS:    1   4   3   4   3   3   2   1</text>
<text x="456" y="476" class="cmp">LBS:    1   5   4   6   5   6   3   1</text>
<text x="456" y="496" class="cmp" fill="#27AE60" font-weight="bold">max(LBS) = 6  at index 3 or 5</text>
<text x="456" y="512" class="cmp">Subsequence: [1,2,10,4,2,1] ✓</text>
<text x="456" y="530" class="cmp" fill="#888">Must have LIS[i]&gt;1 and LDS[i]&gt;1 for true bitonic</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="6"/>
<text x="182" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="430" y="595" class="tbl" font-weight="bold">Time</text>
<text x="610" y="595" class="tbl" font-weight="bold">Space</text>
<text x="790" y="595" class="tbl" font-weight="bold">Recommended</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="182" y="620" class="tbl">Brute Force</text>
<text x="430" y="620" class="tbl">O(2ⁿ)</text>
<text x="610" y="620" class="tbl">O(n)</text>
<text x="790" y="620" class="tbl">✗ TLE</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="182" y="644" class="tbl">LIS from L + LIS from R</text>
<text x="430" y="644" class="tbl">O(n²)</text>
<text x="610" y="644" class="tbl">O(n)</text>
<text x="790" y="644" class="tbl">✓ Optimal</text>
<line x1="16" y1="652" x2="884" y2="652" stroke="#ddd" stroke-width="1"/>
<text x="182" y="668" class="tbl" fill="#27AE60" font-weight="bold">▶ LBS[i] = LIS[i] + LDS[i] - 1; answer = max(LBS)</text>
</svg>
