<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: DP - cell states */
@keyframes dp_ptr{0%,10%{transform:translateX(0)}22%,30%{transform:translateX(60px)}42%,50%{transform:translateX(120px)}62%,70%{transform:translateX(180px)}82%,90%{transform:translateX(240px)}100%{transform:translateX(0)}}
.dpp{animation:dp_ptr 7s ease-in-out infinite}
@keyframes dl0{0%,10%{opacity:1}22%,100%{opacity:0}}
@keyframes dl1{0%,21%{opacity:0}22%,42%{opacity:1}43%,100%{opacity:0}}
@keyframes dl2{0%,41%{opacity:0}42%,62%{opacity:1}63%,100%{opacity:0}}
@keyframes dl3{0%,61%{opacity:0}62%,82%{opacity:1}83%,100%{opacity:0}}
@keyframes dl4{0%,81%{opacity:0}82%,90%{opacity:1}91%,100%{opacity:0}}
.dl0{animation:dl0 7s ease-in-out infinite}.dl1{animation:dl1 7s ease-in-out infinite}
.dl2{animation:dl2 7s ease-in-out infinite}.dl3{animation:dl3 7s ease-in-out infinite}
.dl4{animation:dl4 7s ease-in-out infinite}
/* Approach 2: Greedy */
@keyframes gp{0%,10%{transform:translateX(0)}22%,30%{transform:translateX(60px)}42%,50%{transform:translateX(120px)}62%,70%{transform:translateX(180px)}82%,90%{transform:translateX(240px)}100%{transform:translateX(0)}}
.gptr{animation:gp 7s ease-in-out infinite}
@keyframes gl0{0%,10%{opacity:1}22%,100%{opacity:0}}
@keyframes gl1{0%,21%{opacity:0}22%,42%{opacity:1}43%,100%{opacity:0}}
@keyframes gl2{0%,41%{opacity:0}42%,62%{opacity:1}63%,100%{opacity:0}}
@keyframes gl3{0%,61%{opacity:0}62%,82%{opacity:1}83%,100%{opacity:0}}
@keyframes gl4{0%,81%{opacity:0}82%,90%{opacity:1}91%,100%{opacity:0}}
.gl0{animation:gl0 7s ease-in-out infinite}.gl1{animation:gl1 7s ease-in-out infinite}
.gl2{animation:gl2 7s ease-in-out infinite}.gl3{animation:gl3 7s ease-in-out infinite}
.gl4{animation:gl4 7s ease-in-out infinite}
@keyframes maxr_hl{0%,41%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}42%,62%{fill:#D5F5E3;stroke:#27AE60;stroke-width:3}63%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
.mrh{animation:maxr_hl 7s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Jump Game (Can Reach End?)</text>
<rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
<text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">nums=[2,3,1,1,4] → true (jump from 0→1→4 or 0→1→2→3→4)</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">nums[i] = max jump length from index i. Can we reach last index? Greedy: track max reachable.</text>

<!-- APPROACH 1: DP -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: DP (can[i] = reachable?) — O(n²) time, O(n) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">can[i]=true if ∃j&lt;i where can[j]=true and j+nums[j]≥i. O(n²) inner loop.</text>
<!-- Array: [2,3,1,1,4] at x: 279..519 (60px pitch) -->
<rect x="279" y="175" width="54" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="306" y="201" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="339" y="175" width="54" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="366" y="201" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="399" y="175" width="54" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="426" y="201" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="459" y="175" width="54" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="486" y="201" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="519" y="175" width="54" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="546" y="201" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<!-- can[] array -->
<text x="270" y="231" font-family="Arial" font-size="9" fill="#555" text-anchor="end">can[]:</text>
<rect x="279" y="221" width="54" height="20" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" rx="2"/><text x="306" y="235" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">T</text>
<rect x="339" y="221" width="54" height="20" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" rx="2"/><text x="366" y="235" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">T</text>
<rect x="399" y="221" width="54" height="20" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" rx="2"/><text x="426" y="235" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">T</text>
<rect x="459" y="221" width="54" height="20" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" rx="2"/><text x="486" y="235" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">T</text>
<rect x="519" y="221" width="54" height="20" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="546" y="235" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">T</text>
<!-- pointer -->
<g class="dpp" transform="translate(306,175)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#E74C3C"/>
</g>
<!-- Step labels -->
<text class="dl0" x="450" y="268" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">can[0]=true (start). can[1]: j=0, 0+2=2≥1 → T. can[1]=true</text>
<text class="dl1" x="450" y="268" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">can[2]: j=0,0+2=2≥2✓ → T. j=1,1+3=4≥2✓. can[2]=true</text>
<text class="dl2" x="450" y="268" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">can[3]: j=0,2≥3?No. j=1,4≥3✓ → T. can[3]=true</text>
<text class="dl3" x="450" y="268" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">can[4]: many j satisfy. can[4]=true ✓</text>
<text class="dl4" x="450" y="268" font-family="Arial" font-size="11" fill="#888" text-anchor="middle">Answer: can[n-1]=true ✓. But O(n²) — greedy is faster!</text>
<text x="450" y="295" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">For each i, check all j&lt;i → O(n²). Can we do better?</text>
<text x="450" y="312" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Key insight: only need to track the maximum reachable index, not all previous states.</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="200" y="329" width="500" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Greedy: track maxReach. If i &gt; maxReach → can't proceed → false. O(n)</text>

<!-- APPROACH 2: Greedy -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Greedy (Max Reach) — O(n) time, O(1) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">maxReach=0. For each i≤maxReach: maxReach=max(maxReach, i+nums[i]). Return maxReach≥n-1.</text>
<!-- Same array -->
<rect x="279" y="425" width="54" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="306" y="451" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="339" y="425" width="54" height="42" class="mrh" rx="3"/><text x="366" y="451" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="399" y="425" width="54" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="426" y="451" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="459" y="425" width="54" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="486" y="451" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="519" y="425" width="54" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="546" y="451" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<!-- Scanning pointer -->
<g class="gptr" transform="translate(306,425)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#27AE60"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">i</text>
</g>
<!-- maxReach tracker -->
<rect x="155" y="425" width="115" height="42" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5" rx="4"/>
<text x="213" y="441" font-family="Arial" font-size="10" font-weight="bold" fill="#E67E22" text-anchor="middle">maxReach</text>
<text class="gl0" x="213" y="458" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">0</text>
<text class="gl1" x="213" y="458" font-family="Arial" font-size="13" font-weight="bold" fill="#E67E22" text-anchor="middle">2</text>
<text class="gl2" x="213" y="458" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">4</text>
<text class="gl3" x="213" y="458" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">4</text>
<text class="gl4" x="213" y="458" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">4 ✓</text>
<!-- Step labels -->
<text class="gl0" x="600" y="445" font-family="Arial" font-size="11" fill="#555">i=0: 0≤maxReach(0). maxReach=max(0,0+2)=2</text>
<text class="gl1" x="600" y="445" font-family="Arial" font-size="11" fill="#27AE60">i=1: 1≤2✓. maxReach=max(2,1+3)=4</text>
<text class="gl2" x="600" y="445" font-family="Arial" font-size="11" fill="#555">i=2: 2≤4✓. maxReach=max(4,2+1)=4</text>
<text class="gl3" x="600" y="445" font-family="Arial" font-size="11" fill="#555">i=3: 3≤4✓. maxReach=max(4,3+1)=4</text>
<text class="gl4" x="600" y="445" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">maxReach=4≥n-1=4 → true ✓</text>
<text x="450" y="506" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">If i&gt;maxReach at any point → unreachable → return false immediately.</text>
<text x="450" y="522" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Single pass, no extra space. Greedy insight: always maximize reach from current position.</text>
<text x="450" y="538" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Jump Game II (min jumps): similar greedy with level-tracking. O(n).</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">DP (can[] array)</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n²)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle">O(n)</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Greedy (maxReach) ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
