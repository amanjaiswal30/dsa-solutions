<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .arr{fill:#ddeeff;stroke:#6699cc;stroke-width:1.5}
  .lbl{font:11px monospace;fill:#333;text-anchor:middle}
  .idx{font:10px sans-serif;fill:#888;text-anchor:middle}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .cmp{font:11px sans-serif;fill:#333}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .cell{stroke-width:1.2}

  @keyframes sl0{0%,18%{opacity:1}19%,100%{opacity:0}}
  @keyframes sl1{0%,18%{opacity:0}19%,36%{opacity:1}37%,100%{opacity:0}}
  @keyframes sl2{0%,36%{opacity:0}37%,54%{opacity:1}55%,100%{opacity:0}}
  @keyframes sl3{0%,54%{opacity:0}55%,72%{opacity:1}73%,100%{opacity:0}}
  @keyframes sl4{0%,72%{opacity:0}73%,100%{opacity:1}}
  .sl0{animation:sl0 8s ease-in-out infinite}
  .sl1{animation:sl1 8s ease-in-out infinite}
  .sl2{animation:sl2 8s ease-in-out infinite}
  .sl3{animation:sl3 8s ease-in-out infinite}
  .sl4{animation:sl4 8s ease-in-out infinite}

  @keyframes hl_diag{0%,25%{fill:#fff}26%,100%{fill:#ccffcc}}
  @keyframes hl_max{0%,55%{fill:#fff}56%,100%{fill:#ffcc99}}
  .hdg{animation:hl_diag 8s ease-in-out infinite}
  .hmx{animation:hl_max 8s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Longest Common Substring</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">s1="ABCBA", s2="ABCBX" → LCS substring length=4 ("ABCB")</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Brute Force — O(n³)</text>

<text x="32" y="144" class="cmp">s1 = "ABCBA"    s2 = "ABCBX"</text>
<g transform="translate(32,152)">
  <rect class="arr" x="0" y="0" width="36" height="36"/><text x="18" y="23" class="lbl">A</text><text x="18" y="47" class="idx">0</text>
  <rect class="arr" x="42" y="0" width="36" height="36"/><text x="60" y="23" class="lbl">B</text><text x="60" y="47" class="idx">1</text>
  <rect class="arr" x="84" y="0" width="36" height="36"/><text x="102" y="23" class="lbl">C</text><text x="102" y="47" class="idx">2</text>
  <rect class="arr" x="126" y="0" width="36" height="36"/><text x="144" y="23" class="lbl">B</text><text x="144" y="47" class="idx">3</text>
  <rect class="arr" x="168" y="0" width="36" height="36"/><text x="186" y="23" class="lbl">A</text><text x="186" y="47" class="idx">4</text>
</g>
<g transform="translate(32,212)">
  <rect class="arr" x="0" y="0" width="36" height="36"/><text x="18" y="23" class="lbl">A</text><text x="18" y="47" class="idx">0</text>
  <rect class="arr" x="42" y="0" width="36" height="36"/><text x="60" y="23" class="lbl">B</text><text x="60" y="47" class="idx">1</text>
  <rect class="arr" x="84" y="0" width="36" height="36"/><text x="102" y="23" class="lbl">C</text><text x="102" y="47" class="idx">2</text>
  <rect class="arr" x="126" y="0" width="36" height="36"/><text x="144" y="23" class="lbl">B</text><text x="144" y="47" class="idx">3</text>
  <rect class="arr" x="168" y="0" width="36" height="36"/><text x="186" y="23" class="lbl">X</text><text x="186" y="47" class="idx">4</text>
</g>

<text x="290" y="155" class="cmp sl0">① Fix starting positions (i,j) in s1,s2</text>
<text x="290" y="170" class="cmp sl0">   Expand while chars match, track max</text>
<text x="290" y="155" class="cmp sl1">② i=0,j=0: A=A,B=B,C=C,B=B,A≠X → len=4</text>
<text x="290" y="170" class="cmp sl1">   Record maxLen=4</text>
<text x="290" y="155" class="cmp sl2">③ Try all O(n²) start pairs</text>
<text x="290" y="170" class="cmp sl2">   O(n) expansion each → O(n³) total</text>
<text x="290" y="155" class="cmp sl3">④ Key difference from LCS:</text>
<text x="290" y="170" class="cmp sl3">   Must be CONTIGUOUS (no skipping)</text>
<text x="290" y="155" class="cmp sl4" fill="#E74C3C">⑤ O(n³) → too slow for large inputs</text>

<!-- Evolution arrow -->
<line x1="450" y1="310" x2="450" y2="328" class="evol"/>
<polygon points="450,329 444,317 456,317" fill="#888"/>
<rect x="290" y="313" width="320" height="28" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">dp[i][j] = length of common substring ending at i,j</text>

<!-- APPROACH 2: 2D DP -->
<rect x="16" y="346" width="868" height="216" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="346" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="360" width="868" height="14" fill="#27AE60"/>
<text x="32" y="365" class="sec" fill="white">Approach 2: 2D DP — O(m×n) time, O(m×n) space</text>

<text x="32" y="397" class="cmp">dp[i][j] = length of longest common substring ending at s1[i-1],s2[j-1]:</text>
<!-- DP table 6x6 -->
<g transform="translate(32,408)">
  <!-- Column headers -->
  <text x="27" y="14" class="cmp" text-anchor="middle"></text>
  <text x="63" y="14" class="cmp" text-anchor="middle">A</text>
  <text x="99" y="14" class="cmp" text-anchor="middle">B</text>
  <text x="135" y="14" class="cmp" text-anchor="middle">C</text>
  <text x="171" y="14" class="cmp" text-anchor="middle">B</text>
  <text x="207" y="14" class="cmp" text-anchor="middle">X</text>
  <!-- Row headers -->
  <text x="10" y="42" class="cmp" text-anchor="middle">A</text>
  <text x="10" y="78" class="cmp" text-anchor="middle">B</text>
  <text x="10" y="114" class="cmp" text-anchor="middle">C</text>
  <text x="10" y="150" class="cmp" text-anchor="middle">B</text>
  <text x="10" y="186" class="cmp" text-anchor="middle">A</text>

  <!-- Row 1 (s1[0]=A) -->
  <rect class="hdg cell" x="45" y="20" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="62" y="41" class="lbl">1</text>
  <rect x="81" y="20" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="98" y="41" class="lbl">0</text>
  <rect x="117" y="20" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="134" y="41" class="lbl">0</text>
  <rect x="153" y="20" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="170" y="41" class="lbl">0</text>
  <rect x="189" y="20" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="206" y="41" class="lbl">0</text>

  <!-- Row 2 (s1[1]=B) -->
  <rect x="45" y="56" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="62" y="77" class="lbl">0</text>
  <rect class="hdg cell" x="81" y="56" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="98" y="77" class="lbl">2</text>
  <rect x="117" y="56" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="134" y="77" class="lbl">0</text>
  <rect x="153" y="56" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="170" y="77" class="lbl">0</text>
  <rect x="189" y="56" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="206" y="77" class="lbl">0</text>

  <!-- Row 3 (s1[2]=C) -->
  <rect x="45" y="92" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="62" y="113" class="lbl">0</text>
  <rect x="81" y="92" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="98" y="113" class="lbl">0</text>
  <rect class="hdg cell" x="117" y="92" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="134" y="113" class="lbl">3</text>
  <rect x="153" y="92" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="170" y="113" class="lbl">0</text>
  <rect x="189" y="92" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="206" y="113" class="lbl">0</text>

  <!-- Row 4 (s1[3]=B) -->
  <rect x="45" y="128" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="62" y="149" class="lbl">0</text>
  <rect class="hdg cell" x="81" y="128" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="98" y="149" class="lbl">1</text>
  <rect x="117" y="128" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="134" y="149" class="lbl">0</text>
  <rect class="hmx cell" x="153" y="128" width="34" height="34" fill="#fff" stroke="#27AE60" stroke-width="2"/>
  <text x="170" y="149" class="lbl" fill="#27AE60" font-weight="bold">4</text>
  <rect x="189" y="128" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="206" y="149" class="lbl">0</text>

  <!-- Row 5 (s1[4]=A) -->
  <rect class="hdg cell" x="45" y="164" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="62" y="185" class="lbl">1</text>
  <rect x="81" y="164" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="98" y="185" class="lbl">0</text>
  <rect x="117" y="164" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="134" y="185" class="lbl">0</text>
  <rect x="153" y="164" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="170" y="185" class="lbl">0</text>
  <rect x="189" y="164" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/><text x="206" y="185" class="lbl">0</text>
</g>

<!-- Step labels right -->
<text x="310" y="430" class="cmp sl0">① dp[i][j]: if s1[i-1]==s2[j-1]:</text>
<text x="310" y="445" class="cmp sl0">   dp[i][j] = dp[i-1][j-1] + 1</text>
<text x="310" y="430" class="cmp sl1">② else: dp[i][j] = 0 (substring breaks!)</text>
<text x="310" y="445" class="cmp sl1">   (Key difference from LCS!)</text>
<text x="310" y="430" class="cmp sl2">③ Track maxLen and ending position</text>
<text x="310" y="445" class="cmp sl2">   to reconstruct the substring</text>
<text x="310" y="430" class="cmp sl3">④ dp[4][4]=4 → "ABCB" (len=4)</text>
<text x="310" y="445" class="cmp sl3">   This is the highlighted orange cell</text>
<text x="310" y="430" class="cmp sl4" fill="#27AE60">⑤ Answer = max dp value = 4 ✓</text>

<!-- Insight box -->
<rect x="440" y="430" width="432" height="112" fill="#fff9e6" stroke="#F39C12" stroke-width="1.5" rx="5"/>
<text x="456" y="447" class="cmp" font-weight="bold" fill="#F39C12">LCS vs LCSubstring:</text>
<text x="456" y="463" class="cmp">LCS (subsequence): dp[i][j] = dp[i-1][j-1]+1</text>
<text x="456" y="477" class="cmp">                    or max(dp[i-1][j], dp[i][j-1])</text>
<text x="456" y="491" class="cmp">LCSubstring:       dp[i][j] = dp[i-1][j-1]+1</text>
<text x="456" y="505" class="cmp">                    or ZERO (no skip allowed!)</text>
<text x="456" y="525" class="cmp" fill="#27AE60" font-weight="bold">maxLen = max(dp[i][j]) over all i,j</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="6"/>
<text x="182" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="430" y="595" class="tbl" font-weight="bold">Time</text>
<text x="610" y="595" class="tbl" font-weight="bold">Space</text>
<text x="790" y="595" class="tbl" font-weight="bold">Recommended</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="182" y="620" class="tbl">Brute Force</text>
<text x="430" y="620" class="tbl">O(n³)</text>
<text x="610" y="620" class="tbl">O(1)</text>
<text x="790" y="620" class="tbl">✗ TLE</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="182" y="644" class="tbl">2D DP</text>
<text x="430" y="644" class="tbl">O(m×n)</text>
<text x="610" y="644" class="tbl">O(m×n)</text>
<text x="790" y="644" class="tbl">✓ Optimal</text>
<line x1="16" y1="652" x2="884" y2="652" stroke="#ddd" stroke-width="1"/>
<text x="182" y="668" class="tbl" fill="#27AE60" font-weight="bold">▶ Reset to 0 on mismatch — substring must be contiguous</text>
</svg>
