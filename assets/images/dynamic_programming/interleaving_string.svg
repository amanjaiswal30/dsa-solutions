<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .arr{fill:#ddeeff;stroke:#6699cc;stroke-width:1.5}
  .lbl{font:11px monospace;fill:#333;text-anchor:middle}
  .idx{font:10px sans-serif;fill:#888;text-anchor:middle}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .cmp{font:11px sans-serif;fill:#333}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .cell{stroke-width:1.2}

  @keyframes sl0{0%,18%{opacity:1}19%,100%{opacity:0}}
  @keyframes sl1{0%,18%{opacity:0}19%,36%{opacity:1}37%,100%{opacity:0}}
  @keyframes sl2{0%,36%{opacity:0}37%,54%{opacity:1}55%,100%{opacity:0}}
  @keyframes sl3{0%,54%{opacity:0}55%,72%{opacity:1}73%,100%{opacity:0}}
  @keyframes sl4{0%,72%{opacity:0}73%,100%{opacity:1}}
  .sl0{animation:sl0 8s ease-in-out infinite}
  .sl1{animation:sl1 8s ease-in-out infinite}
  .sl2{animation:sl2 8s ease-in-out infinite}
  .sl3{animation:sl3 8s ease-in-out infinite}
  .sl4{animation:sl4 8s ease-in-out infinite}

  @keyframes cell_t{0%,35%{fill:#fff}36%,100%{fill:#ccffcc}}
  @keyframes cell_ans{0%,65%{fill:#fff}66%,100%{fill:#ffcc99}}
  .ct{animation:cell_t 8s ease-in-out infinite}
  .cans{animation:cell_ans 8s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Interleaving String</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">s1="aab", s2="axy", s3="aaxaby" → true (s1="aab" interleaved with s2="axy")</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Recursion — O(2^(m+n))</text>

<text x="32" y="144" class="cmp">s1="aab"  s2="axy"  s3="aaxaby"</text>

<!-- s1 s2 s3 char display -->
<g transform="translate(32,152)">
  <text x="-5" y="23" class="cmp">s1:</text>
  <rect class="arr" x="20" y="0" width="36" height="36"/><text x="38" y="23" class="lbl">a</text>
  <rect class="arr" x="62" y="0" width="36" height="36"/><text x="80" y="23" class="lbl">a</text>
  <rect class="arr" x="104" y="0" width="36" height="36"/><text x="122" y="23" class="lbl">b</text>

  <text x="-5" y="60" class="cmp">s2:</text>
  <rect class="arr" x="20" y="40" width="36" height="36"/><text x="38" y="63" class="lbl">a</text>
  <rect class="arr" x="62" y="40" width="36" height="36"/><text x="80" y="63" class="lbl">x</text>
  <rect class="arr" x="104" y="40" width="36" height="36"/><text x="122" y="63" class="lbl">y</text>

  <text x="-5" y="100" class="cmp">s3:</text>
  <rect class="arr" x="20" y="80" width="36" height="36"/><text x="38" y="103" class="lbl">a</text>
  <rect class="arr" x="62" y="80" width="36" height="36"/><text x="80" y="103" class="lbl">a</text>
  <rect class="arr" x="104" y="80" width="36" height="36"/><text x="122" y="103" class="lbl">x</text>
  <rect class="arr" x="146" y="80" width="36" height="36"/><text x="164" y="103" class="lbl">a</text>
  <rect class="arr" x="188" y="80" width="36" height="36"/><text x="206" y="103" class="lbl">b</text>
  <rect class="arr" x="230" y="80" width="36" height="36"/><text x="248" y="103" class="lbl">y</text>
</g>

<text x="300" y="148" class="cmp">Recursion: isInterleave(i,j,k):</text>
<text x="300" y="164" class="cmp">  if i==m &amp;&amp; j==n: return true</text>
<text x="300" y="180" class="cmp">  if s1[i]==s3[k]: try isInterleave(i+1,j,k+1)</text>
<text x="300" y="196" class="cmp">  if s2[j]==s3[k]: try isInterleave(i,j+1,k+1)</text>

<text x="32" y="285" class="cmp sl0">① k = i+j always, so state is just (i,j)</text>
<text x="32" y="285" class="cmp sl1">② isInterleave(0,0,0): s3[0]='a'==s1[0]='a' → try (1,0,1)</text>
<text x="32" y="285" class="cmp sl2">③ Also s3[0]='a'==s2[0]='a' → try (0,1,1)</text>
<text x="32" y="285" class="cmp sl3">④ Overlapping subproblems → memoize (i,j)</text>
<text x="32" y="285" class="cmp sl4">⑤ Without memo: O(2^(m+n)) branches</text>

<!-- Evolution arrow -->
<line x1="450" y1="310" x2="450" y2="328" class="evol"/>
<polygon points="450,329 444,317 456,317" fill="#888"/>
<rect x="290" y="313" width="320" height="28" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">dp[i][j] = can s3[0..i+j-1] be formed from s1[0..i-1]+s2[0..j-1]?</text>

<!-- APPROACH 2: 2D DP -->
<rect x="16" y="346" width="868" height="216" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="346" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="360" width="868" height="14" fill="#27AE60"/>
<text x="32" y="365" class="sec" fill="white">Approach 2: 2D DP — O(m×n) time, O(m×n) space</text>

<text x="32" y="395" class="cmp">dp[i][j] = True if s3[0..i+j-1] is interleaving of s1[0..i-1] and s2[0..j-1]:</text>
<!-- DP table 4x4 for s1="aab", s2="axy" -->
<g transform="translate(32,408)">
  <!-- Headers -->
  <text x="23" y="14" class="cmp" text-anchor="middle"></text>
  <text x="59" y="14" class="cmp" text-anchor="middle">""</text>
  <text x="95" y="14" class="cmp" text-anchor="middle">a(0)</text>
  <text x="131" y="14" class="cmp" text-anchor="middle">x(1)</text>
  <text x="167" y="14" class="cmp" text-anchor="middle">y(2)</text>
  <text x="8" y="40" class="cmp" text-anchor="middle">""</text>
  <text x="8" y="72" class="cmp" text-anchor="middle">a(0)</text>
  <text x="8" y="104" class="cmp" text-anchor="middle">a(1)</text>
  <text x="8" y="136" class="cmp" text-anchor="middle">b(2)</text>

  <!-- dp[0][0]=T -->
  <rect class="ct cell" x="41" y="20" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="58" y="41" class="lbl" fill="#27AE60">T</text>
  <!-- dp[0][1]=T (s2[0]='a'==s3[0]='a') -->
  <rect class="ct cell" x="77" y="20" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="94" y="41" class="lbl" fill="#27AE60">T</text>
  <!-- dp[0][2]=F (s2[1]='x'≠s3[1]='a') -->
  <rect x="113" y="20" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/>
  <text x="130" y="41" class="lbl">F</text>
  <!-- dp[0][3]=F -->
  <rect x="149" y="20" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/>
  <text x="166" y="41" class="lbl">F</text>

  <!-- row 1 -->
  <rect class="ct cell" x="41" y="56" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="58" y="77" class="lbl" fill="#27AE60">T</text><!-- dp[1][0]=T: s1[0]='a'==s3[0]='a' -->
  <rect class="ct cell" x="77" y="56" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="94" y="77" class="lbl" fill="#27AE60">T</text><!-- dp[1][1] -->
  <rect class="ct cell" x="113" y="56" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="130" y="77" class="lbl" fill="#27AE60">T</text><!-- dp[1][2] -->
  <rect x="149" y="56" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/>
  <text x="166" y="77" class="lbl">F</text>

  <!-- row 2 -->
  <rect x="41" y="92" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/>
  <text x="58" y="113" class="lbl">F</text><!-- dp[2][0]: s1[1]='a'==s3[1]='a',prev dp[1][0]=T → T?? Wait -->
  <rect class="ct cell" x="77" y="92" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="94" y="113" class="lbl" fill="#27AE60">T</text>
  <rect class="ct cell" x="113" y="92" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="130" y="113" class="lbl" fill="#27AE60">T</text>
  <rect class="ct cell" x="149" y="92" width="34" height="34" fill="#fff" stroke="#aaa"/>
  <text x="166" y="113" class="lbl" fill="#27AE60">T</text>

  <!-- row 3 (answer row) -->
  <rect x="41" y="128" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/>
  <text x="58" y="149" class="lbl">F</text>
  <rect x="77" y="128" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/>
  <text x="94" y="149" class="lbl">F</text>
  <rect x="113" y="128" width="34" height="34" fill="#fff" stroke="#aaa" class="cell"/>
  <text x="130" y="149" class="lbl">F</text>
  <rect class="cans cell" x="149" y="128" width="34" height="34" fill="#fff" stroke="#27AE60" stroke-width="2.5"/>
  <text x="166" y="149" class="lbl" fill="#27AE60" font-weight="bold">T</text><!-- dp[3][3]=answer -->
</g>

<!-- Steps right -->
<text x="290" y="430" class="cmp sl0">① dp[0][0]=True (both empty = empty)</text>
<text x="290" y="430" class="cmp sl1">② First row: dp[0][j]=dp[0][j-1]&&s2[j-1]==s3[j-1]</text>
<text x="290" y="430" class="cmp sl2">③ First col: dp[i][0]=dp[i-1][0]&&s1[i-1]==s3[i-1]</text>
<text x="290" y="430" class="cmp sl3">④ dp[i][j]=  (dp[i-1][j]&&s1[i-1]==s3[i+j-1])</text>
<text x="290" y="445" class="cmp sl3">            ||(dp[i][j-1]&&s2[j-1]==s3[i+j-1])</text>
<text x="290" y="430" class="cmp sl4" fill="#27AE60">⑤ Answer = dp[m][n] = dp[3][3] = True ✓</text>

<!-- Insight box -->
<rect x="440" y="428" width="432" height="114" fill="#fff9e6" stroke="#F39C12" stroke-width="1.5" rx="5"/>
<text x="456" y="445" class="cmp" font-weight="bold" fill="#F39C12">Key Insight:</text>
<text x="456" y="461" class="cmp">dp[i][j]: used i chars of s1, j chars of s2</text>
<text x="456" y="477" class="cmp">k = i+j (automatically tracks s3 position)</text>
<text x="456" y="493" class="cmp">Try s1[i] or s2[j] at each step</text>
<text x="456" y="513" class="cmp" fill="#27AE60">Space opt: use 1D dp[n+1] array</text>
<text x="456" y="529" class="cmp" fill="#27AE60">Update: dp[j] |= (dp[j-1]&amp;&amp;s2[j-1]==s3[k])</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="6"/>
<text x="182" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="430" y="595" class="tbl" font-weight="bold">Time</text>
<text x="610" y="595" class="tbl" font-weight="bold">Space</text>
<text x="790" y="595" class="tbl" font-weight="bold">Recommended</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="182" y="620" class="tbl">Recursion (no memo)</text>
<text x="430" y="620" class="tbl">O(2^(m+n))</text>
<text x="610" y="620" class="tbl">O(m+n)</text>
<text x="790" y="620" class="tbl">✗ TLE</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="182" y="644" class="tbl">2D DP</text>
<text x="430" y="644" class="tbl">O(m×n)</text>
<text x="610" y="644" class="tbl">O(m×n) / O(n)</text>
<text x="790" y="644" class="tbl">✓ Optimal</text>
<line x1="16" y1="652" x2="884" y2="652" stroke="#ddd" stroke-width="1"/>
<text x="182" y="668" class="tbl" fill="#27AE60" font-weight="bold">▶ k=i+j tracks s3 position automatically</text>
</svg>
