<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .arr{fill:#ddeeff;stroke:#6699cc;stroke-width:1.5}
  .lbl{font:11px monospace;fill:#333;text-anchor:middle}
  .idx{font:10px sans-serif;fill:#888;text-anchor:middle}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .cmp{font:11px sans-serif;fill:#333}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .cell{stroke-width:1.2}

  @keyframes sl0{0%,18%{opacity:1}19%,100%{opacity:0}}
  @keyframes sl1{0%,18%{opacity:0}19%,36%{opacity:1}37%,100%{opacity:0}}
  @keyframes sl2{0%,36%{opacity:0}37%,54%{opacity:1}55%,100%{opacity:0}}
  @keyframes sl3{0%,54%{opacity:0}55%,72%{opacity:1}73%,100%{opacity:0}}
  @keyframes sl4{0%,72%{opacity:0}73%,100%{opacity:1}}
  .sl0{animation:sl0 8s ease-in-out infinite}
  .sl1{animation:sl1 8s ease-in-out infinite}
  .sl2{animation:sl2 8s ease-in-out infinite}
  .sl3{animation:sl3 8s ease-in-out infinite}
  .sl4{animation:sl4 8s ease-in-out infinite}

  @keyframes hl_diag{0%,25%{fill:#fff}26%,100%{fill:#ccffcc}}
  @keyframes hl_ans{0%,60%{fill:#fff}61%,100%{fill:#ffcc99}}
  .hd{animation:hl_diag 8s ease-in-out infinite}
  .ha{animation:hl_ans 8s ease-in-out infinite}
  @keyframes mat_hl{0%,15%{opacity:1}16%,100%{opacity:0.3}}
  @keyframes mat_hl2{0%,15%{opacity:0.3}16%,50%{opacity:1}51%,100%{opacity:0.3}}
  @keyframes mat_hl3{0%,50%{opacity:0.3}51%,100%{opacity:1}}
  .m1{animation:mat_hl 8s ease-in-out infinite}
  .m2{animation:mat_hl2 8s ease-in-out infinite}
  .m3{animation:mat_hl3 8s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Matrix Chain Multiplication</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">dims=[10,30,5,60] → 3 matrices: A(10×30), B(30×5), C(5×60) → min ops=4500</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Recursion — O(2ⁿ) / Catalan number</text>

<!-- Matrix visuals -->
<g class="m1" transform="translate(32,130)">
  <rect x="0" y="0" width="50" height="70" fill="#ffcccc" stroke="#E74C3C" stroke-width="1.5" rx="3"/>
  <text x="25" y="30" class="lbl">A</text>
  <text x="25" y="48" class="lbl" font-size="9">10×30</text>
</g>
<g class="m2" transform="translate(92,130)">
  <rect x="0" y="0" width="50" height="70" fill="#ffe0cc" stroke="#F39C12" stroke-width="1.5" rx="3"/>
  <text x="25" y="30" class="lbl">B</text>
  <text x="25" y="48" class="lbl" font-size="9">30×5</text>
</g>
<g class="m3" transform="translate(152,130)">
  <rect x="0" y="0" width="50" height="70" fill="#ccffcc" stroke="#27AE60" stroke-width="1.5" rx="3"/>
  <text x="25" y="30" class="lbl">C</text>
  <text x="25" y="48" class="lbl" font-size="9">5×60</text>
</g>

<text x="230" y="144" class="cmp">Two ways to parenthesize A×B×C:</text>
<rect x="230" y="152" width="300" height="44" fill="#fff0f0" stroke="#E74C3C" stroke-width="1" rx="3"/>
<text x="245" y="170" class="cmp" fill="#E74C3C">(A×B)×C: 10·30·5 + 10·5·60 = 1500+3000 = 4500</text>
<text x="245" y="188" class="cmp" fill="#888">A×(B×C): 30·5·60 + 10·30·60 = 9000+18000 = 27000</text>

<text x="32" y="225" class="cmp sl0">① mcm(i,j): min cost to multiply matrices i..j</text>
<text x="32" y="240" class="cmp sl0">   Try every split point k: i≤k&lt;j</text>
<text x="32" y="225" class="cmp sl1">② Cost = mcm(i,k)+mcm(k+1,j)+dims[i-1]·dims[k]·dims[j]</text>
<text x="32" y="225" class="cmp sl2">③ mcm(1,3): try k=1: mcm(1,1)+mcm(2,3)+10·30·60=18450</text>
<text x="32" y="240" class="cmp sl2">            try k=2: mcm(1,2)+mcm(3,3)+10·5·60=4500 ✓</text>
<text x="32" y="225" class="cmp sl3">④ Many subproblems recomputed → O(n³) with memo</text>
<text x="32" y="225" class="cmp sl4">⑤ Without memo: exponential (Catalan number)</text>

<!-- Evolution arrow -->
<line x1="450" y1="310" x2="450" y2="328" class="evol"/>
<polygon points="450,329 444,317 456,317" fill="#888"/>
<rect x="280" y="313" width="340" height="28" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">Fill DP table diagonally: dp[i][j] = min cost for matrices i..j</text>

<!-- APPROACH 2: DP -->
<rect x="16" y="346" width="868" height="216" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="346" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="360" width="868" height="14" fill="#27AE60"/>
<text x="32" y="365" class="sec" fill="white">Approach 2: Bottom-Up DP — O(n³) time, O(n²) space</text>

<text x="32" y="395" class="cmp">dp[i][j] = min multiplications for chain from matrix i to j (1-indexed):</text>
<!-- DP table 3x3 for matrices 1,2,3 -->
<g transform="translate(32,408)">
  <!-- Headers -->
  <text x="25" y="14" class="cmp" text-anchor="middle"></text>
  <text x="65" y="14" class="cmp" text-anchor="middle">1(A)</text>
  <text x="105" y="14" class="cmp" text-anchor="middle">2(B)</text>
  <text x="145" y="14" class="cmp" text-anchor="middle">3(C)</text>
  <text x="10" y="40" class="cmp" text-anchor="middle">1(A)</text>
  <text x="10" y="78" class="cmp" text-anchor="middle">2(B)</text>
  <text x="10" y="116" class="cmp" text-anchor="middle">3(C)</text>

  <!-- Diagonal: len=1 → 0 -->
  <rect class="hd cell" x="45" y="20" width="38" height="38" fill="#fff" stroke="#aaa"/>
  <text x="64" y="43" class="lbl">0</text>
  <rect class="hd cell" x="85" y="58" width="38" height="38" fill="#fff" stroke="#aaa"/>
  <text x="104" y="81" class="lbl">0</text>
  <rect class="hd cell" x="125" y="96" width="38" height="38" fill="#fff" stroke="#aaa"/>
  <text x="144" y="119" class="lbl">0</text>

  <!-- len=2 -->
  <rect class="hd cell" x="85" y="20" width="38" height="38" fill="#fff" stroke="#aaa"/>
  <text x="104" y="38" class="lbl">1500</text><!-- A×B: 10·30·5=1500 -->
  <text x="104" y="52" class="lbl" font-size="8">k=1</text>
  <rect class="hd cell" x="125" y="58" width="38" height="38" fill="#fff" stroke="#aaa"/>
  <text x="144" y="76" class="lbl">9000</text><!-- B×C: 30·5·60=9000 -->
  <text x="144" y="90" class="lbl" font-size="8">k=2</text>

  <!-- len=3: answer -->
  <rect class="ha cell" x="125" y="20" width="38" height="38" fill="#fff" stroke="#27AE60" stroke-width="2.5"/>
  <text x="144" y="38" class="lbl" fill="#27AE60" font-weight="bold">4500</text>
  <text x="144" y="52" class="lbl" font-size="8" fill="#27AE60">k=2</text>
</g>

<!-- Steps right -->
<text x="240" y="418" class="cmp sl0">① len=1: dp[i][i]=0 (single matrix, no mult)</text>
<text x="240" y="418" class="cmp sl1">② len=2: dp[1][2]=10·30·5=1500 (A×B)</text>
<text x="240" y="433" class="cmp sl1">         dp[2][3]=30·5·60=9000 (B×C)</text>
<text x="240" y="418" class="cmp sl2">③ len=3: try k=1: dp[1][1]+dp[2][3]+10·30·60=18000</text>
<text x="240" y="433" class="cmp sl2">              k=2: dp[1][2]+dp[3][3]+10·5·60=4500 ✓</text>
<text x="240" y="418" class="cmp sl3">④ dp[1][3] = min(18000,4500) = 4500 (k=2)</text>
<text x="240" y="418" class="cmp sl4" fill="#27AE60">⑤ Answer = dp[1][n] = 4500 ✓</text>

<!-- Key pattern box -->
<rect x="450" y="396" width="420" height="148" fill="#fff9e6" stroke="#F39C12" stroke-width="1.5" rx="5"/>
<text x="466" y="413" class="cmp" font-weight="bold" fill="#F39C12">DP Recurrence:</text>
<text x="466" y="429" class="cmp">for length in range(2, n+1):  # chain length</text>
<text x="466" y="445" class="cmp">  for i in range(1, n-length+2):  # start</text>
<text x="466" y="461" class="cmp">    j = i + length - 1           # end</text>
<text x="466" y="477" class="cmp">    for k in range(i, j):        # split</text>
<text x="466" y="493" class="cmp">      cost = dp[i][k]+dp[k+1][j]</text>
<text x="466" y="509" class="cmp">            +dims[i-1]*dims[k]*dims[j]</text>
<text x="466" y="525" class="cmp">      dp[i][j] = min(dp[i][j], cost)</text>
<text x="466" y="541" class="cmp" fill="#27AE60">return dp[1][n]  → 4500 ✓</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="6"/>
<text x="182" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="430" y="595" class="tbl" font-weight="bold">Time</text>
<text x="610" y="595" class="tbl" font-weight="bold">Space</text>
<text x="790" y="595" class="tbl" font-weight="bold">Recommended</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="182" y="620" class="tbl">Recursion (no memo)</text>
<text x="430" y="620" class="tbl">O(Catalan(n))</text>
<text x="610" y="620" class="tbl">O(n)</text>
<text x="790" y="620" class="tbl">✗ TLE</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="182" y="644" class="tbl">Bottom-Up DP</text>
<text x="430" y="644" class="tbl">O(n³)</text>
<text x="610" y="644" class="tbl">O(n²)</text>
<text x="790" y="644" class="tbl">✓ Optimal</text>
<line x1="16" y1="652" x2="884" y2="652" stroke="#ddd" stroke-width="1"/>
<text x="182" y="668" class="tbl" fill="#27AE60" font-weight="bold">▶ Fill diagonally; dp[i][j]=min over k: dp[i][k]+dp[k+1][j]+dims[i-1]*dims[k]*dims[j]</text>
</svg>
