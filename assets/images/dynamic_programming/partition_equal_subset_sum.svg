<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .arr{fill:#ddeeff;stroke:#6699cc;stroke-width:1.5}
  .lbl{font:11px monospace;fill:#333;text-anchor:middle}
  .idx{font:10px sans-serif;fill:#888;text-anchor:middle}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .cmp{font:11px sans-serif;fill:#333}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .cell{stroke-width:1.2}

  @keyframes sl0{0%,18%{opacity:1}19%,100%{opacity:0}}
  @keyframes sl1{0%,18%{opacity:0}19%,36%{opacity:1}37%,100%{opacity:0}}
  @keyframes sl2{0%,36%{opacity:0}37%,54%{opacity:1}55%,100%{opacity:0}}
  @keyframes sl3{0%,54%{opacity:0}55%,72%{opacity:1}73%,100%{opacity:0}}
  @keyframes sl4{0%,72%{opacity:0}73%,100%{opacity:1}}
  .sl0{animation:sl0 8s ease-in-out infinite}
  .sl1{animation:sl1 8s ease-in-out infinite}
  .sl2{animation:sl2 8s ease-in-out infinite}
  .sl3{animation:sl3 8s ease-in-out infinite}
  .sl4{animation:sl4 8s ease-in-out infinite}

  /* DP table cell highlights */
  @keyframes cell_hl{0%,30%{fill:#fff}30.1%,100%{fill:#ccffcc}}
  .ch0{animation:cell_hl 8s 0s ease-in-out infinite}
  .ch1{animation:cell_hl 8s 0.4s ease-in-out infinite}
  .ch2{animation:cell_hl 8s 0.8s ease-in-out infinite}
  .ch3{animation:cell_hl 8s 1.2s ease-in-out infinite}
  .ch4{animation:cell_hl 8s 1.6s ease-in-out infinite}
  .ch5{animation:cell_hl 8s 2.0s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Partition Equal Subset Sum</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">nums=[1,5,11,5] → true  ({1,5,5} and {11}, sum=11 each)</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Recursion — O(2ⁿ)</text>

<text x="32" y="144" class="cmp">nums = [1, 5, 11, 5],   total = 22,   target = 11</text>
<g transform="translate(32,152)">
  <rect class="arr" x="0" y="0" width="46" height="36"/><text x="23" y="23" class="lbl">1</text><text x="23" y="46" class="idx">0</text>
  <rect class="arr" x="52" y="0" width="46" height="36"/><text x="75" y="23" class="lbl">5</text><text x="75" y="46" class="idx">1</text>
  <rect class="arr" x="104" y="0" width="46" height="36"/><text x="127" y="23" class="lbl">11</text><text x="127" y="46" class="idx">2</text>
  <rect class="arr" x="156" y="0" width="46" height="36"/><text x="179" y="23" class="lbl">5</text><text x="179" y="46" class="idx">3</text>
</g>

<text x="280" y="144" class="cmp">Recursion: canPartition(idx, remaining):</text>
<text x="280" y="162" class="cmp" fill="#E74C3C">canPartition(0, 11)</text>
<text x="280" y="178" class="cmp">├─ include 1 → canPartition(1, 10)</text>
<text x="280" y="194" class="cmp">│  ├─ include 5 → canPartition(2, 5)</text>
<text x="280" y="210" class="cmp">│  │  ├─ include 11 → 5-11&lt;0 ✗</text>
<text x="280" y="226" class="cmp">│  │  └─ skip 11 → canPartition(3, 5)</text>
<text x="280" y="242" class="cmp">│  │     └─ include 5 → rem=0 ✓ TRUE</text>
<text x="280" y="260" class="cmp" fill="#888" font-size="10">└─ skip 1 → canPartition(1, 11) → ...</text>

<text x="32" y="215" class="cmp sl0">① total=22, target=22/2=11</text>
<text x="32" y="230" class="cmp sl0">   If total odd → return False</text>
<text x="32" y="215" class="cmp sl1">② At each element: include or skip</text>
<text x="32" y="230" class="cmp sl1">   If remaining==0 → True</text>
<text x="32" y="215" class="cmp sl2">③ 1+5+5=11 → True partition found</text>
<text x="32" y="215" class="cmp sl3">④ Many subproblems overlap → memoize</text>
<text x="32" y="215" class="cmp sl4">⑤ Reduce to 0/1 Knapsack on target</text>

<!-- Evolution arrow -->
<line x1="450" y1="310" x2="450" y2="328" class="evol"/>
<polygon points="450,329 444,317 456,317" fill="#888"/>
<rect x="290" y="313" width="320" height="28" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">0/1 Knapsack DP: dp[j] = can sum j be formed?</text>

<!-- APPROACH 2: DP -->
<rect x="16" y="346" width="868" height="216" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="346" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="360" width="868" height="14" fill="#27AE60"/>
<text x="32" y="365" class="sec" fill="white">Approach 2: 1D DP (0/1 Knapsack) — O(n×target) time, O(target) space</text>

<text x="32" y="397" class="cmp">dp[j] = True if subset with sum j exists. dp[0]=True. Process each num:</text>

