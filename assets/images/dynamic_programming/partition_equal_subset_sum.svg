<!-- Step labels right side -->
<text x="360" y="430" class="cmp sl0">① Compute target=sum/2=11</text>
<text x="360" y="445" class="cmp sl0">   If odd sum → impossible</text>
<text x="360" y="430" class="cmp sl1">② dp[0]=True; process num=1</text>
<text x="360" y="445" class="cmp sl1">   dp[1]=True (0+1=1)</text>
<text x="360" y="430" class="cmp sl2">③ Process num=5: update RIGHT to LEFT</text>
<text x="360" y="445" class="cmp sl2">   dp[5]=T, dp[6]=T (from dp[1]+5)</text>
<text x="360" y="430" class="cmp sl3">④ Process num=11: dp[11]=True (0+11)</text>
<text x="360" y="430" class="cmp sl4" fill="#27AE60">⑤ Process num=5: dp[11] still True ✓</text>
<text x="360" y="445" class="cmp sl4" fill="#27AE60">   Answer = dp[11] = True</text>

<!-- Key insight box -->
<rect x="560" y="426" width="322" height="112" fill="#fff9e6" stroke="#F39C12" stroke-width="1.5" rx="5"/>
<text x="576" y="443" class="cmp" font-weight="bold" fill="#F39C12">Key: Iterate RIGHT to LEFT!</text>
<text x="576" y="459" class="cmp">for num in nums:           # 0/1 knapsack</text>
<text x="576" y="473" class="cmp">  for j in range(target, num-1, -1):</text>
<text x="576" y="487" class="cmp">    dp[j] |= dp[j - num]</text>
<text x="576" y="503" class="cmp">                           # right→left</text>
<text x="576" y="519" class="cmp" fill="#27AE60">return dp[target]  → True ✓</text>

