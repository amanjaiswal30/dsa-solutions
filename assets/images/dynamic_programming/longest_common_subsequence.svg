<rect x="180" y="540" width="36" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" rx="2"/><text x="198" y="559" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">0</text>
<rect x="216" y="540" width="36" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" rx="2"/><text x="234" y="559" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="252" y="540" width="36" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" rx="2"/><text x="270" y="559" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="288" y="540" width="36" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" rx="2"/><text x="306" y="559" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="324" y="540" width="36" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="3" rx="2"/><text x="342" y="559" font-family="Arial" font-size="14" font-weight="bold" fill="#27AE60" text-anchor="middle">3</text>
<!-- Step labels -->
<text class="sl0" x="650" y="460" font-family="Arial" font-size="11" fill="#555">Row 0: all 0 (base case)</text>
<text class="sl1" x="650" y="460" font-family="Arial" font-size="11" fill="#555">A=A: dp[1][1]=1+dp[0][0]=1 ✓</text>
<text class="sl2" x="650" y="460" font-family="Arial" font-size="11" fill="#555">B=B: dp[2][3]=1+dp[1][2]=2 ✓</text>
<text class="sl3" x="650" y="460" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">D=D: dp[4][4]=1+dp[3][3]=3 ✓</text>
<text x="450" y="555" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">LCS = dp[m][n] = 3. Backtrack from dp[m][n] to find actual LCS string.</text>
<text x="450" y="570" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Space: O(n) with rolling array (only need previous row). Key 2D DP template!</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
