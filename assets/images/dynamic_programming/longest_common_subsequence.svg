<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(2^(m+n))</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle">O(m+n) stack</text>
