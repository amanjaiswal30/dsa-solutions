<rect x="252" y="484" width="36" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" rx="2"/><text x="270" y="503" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="288" y="484" width="36" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="306" y="503" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60" text-anchor="middle">2</text>
<rect x="324" y="484" width="36" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" rx="2"/><text x="342" y="503" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">2</text>
