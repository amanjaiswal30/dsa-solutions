<!-- Row 0: [0,0,0,0,0] -->
<rect x="180" y="428" width="36" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="1" rx="2"/><text x="198" y="447" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">0</text>
