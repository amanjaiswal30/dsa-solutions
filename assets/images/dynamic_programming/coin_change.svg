<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Recursion tree */
@keyframes rl0{0%,15%{opacity:1}16%,100%{opacity:0}}
@keyframes rl1{0%,15%{opacity:0}16%,40%{opacity:1}41%,100%{opacity:0}}
@keyframes rl2{0%,40%{opacity:0}41%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes rl3{0%,65%{opacity:0}66%,80%{opacity:1}81%,100%{opacity:0}}
.rl0{animation:rl0 6s ease-in-out infinite}.rl1{animation:rl1 6s ease-in-out infinite}
.rl2{animation:rl2 6s ease-in-out infinite}.rl3{animation:rl3 6s ease-in-out infinite}
/* Approach 2: DP table filling (amount 0..6) */
@keyframes d0{0%,8%{fill:#EBF5FB;stroke:#3498DB}9%,100%{fill:#D5F5E3;stroke:#27AE60;stroke-width:2}}
@keyframes d1{0%,16%{fill:#EBF5FB;stroke:#3498DB}17%,100%{fill:#D5F5E3;stroke:#27AE60;stroke-width:2}}
@keyframes d2{0%,24%{fill:#EBF5FB;stroke:#3498DB}25%,100%{fill:#D5F5E3;stroke:#27AE60;stroke-width:2}}
@keyframes d3{0%,32%{fill:#EBF5FB;stroke:#3498DB}33%,100%{fill:#D5F5E3;stroke:#27AE60;stroke-width:2}}
@keyframes d4{0%,40%{fill:#EBF5FB;stroke:#3498DB}41%,100%{fill:#D5F5E3;stroke:#27AE60;stroke-width:2}}
@keyframes d5{0%,48%{fill:#EBF5FB;stroke:#3498DB}49%,100%{fill:#D5F5E3;stroke:#27AE60;stroke-width:2}}
@keyframes d6{0%,56%{fill:#EBF5FB;stroke:#3498DB}57%,100%{fill:#D5F5E3;stroke:#27AE60;stroke-width:2}}
.d0{animation:d0 8s ease-in-out infinite}.d1{animation:d1 8s ease-in-out infinite}
.d2{animation:d2 8s ease-in-out infinite}.d3{animation:d3 8s ease-in-out infinite}
.d4{animation:d4 8s ease-in-out infinite}.d5{animation:d5 8s ease-in-out infinite}
.d6{animation:d6 8s ease-in-out infinite}
@keyframes dp_ptr{0%,8%{transform:translateX(0)}16%,24%{transform:translateX(48px)}32%,40%{transform:translateX(96px)}48%,56%{transform:translateX(144px)}64%,72%{transform:translateX(192px)}80%,88%{transform:translateX(240px)}96%,100%{transform:translateX(288px)}}
.dpp{animation:dp_ptr 8s ease-in-out infinite}
@keyframes sl0{0%,8%{opacity:1}16%,100%{opacity:0}}
@keyframes sl1{0%,15%{opacity:0}16%,40%{opacity:1}41%,100%{opacity:0}}
@keyframes sl2{0%,40%{opacity:0}41%,56%{opacity:1}57%,100%{opacity:0}}
@keyframes sl3{0%,55%{opacity:0}56%,75%{opacity:1}76%,100%{opacity:0}}
@keyframes sl4{0%,75%{opacity:0}76%,90%{opacity:1}91%,100%{opacity:0}}
.sl0{animation:sl0 8s ease-in-out infinite}.sl1{animation:sl1 8s ease-in-out infinite}
.sl2{animation:sl2 8s ease-in-out infinite}.sl3{animation:sl3 8s ease-in-out infinite}
.sl4{animation:sl4 8s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Coin Change (Minimum Coins)</text>
<rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
<text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">coins=[1,3,4], amount=6 → min 2 coins (3+3). dp[i]=min coins to make amount i.</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Classic unbounded knapsack. dp[i] = min(dp[i-c]+1) for each coin c. Build up from 0.</text>

<!-- APPROACH 1: Recursion + Memoization -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Recursion + Memoization (Top-Down) — O(n·coins) time</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">coinChange(amount) = 1 + min(coinChange(amount-c)) for each coin c. Cache results.</text>
<!-- Recursion tree for amount=6, coins=[1,3,4] -->
<!-- Root: 6 -->
<rect x="412" y="162" width="76" height="24" fill="#FDEBD0" stroke="#E67E22" stroke-width="1.5" rx="3"/>
<text x="450" y="179" font-family="Arial" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">amt=6</text>
<!-- Level 1: -1→5, -3→3, -4→2 -->
<line x1="430" y1="186" x2="300" y2="205" stroke="#AAA" stroke-width="1"/>
<line x1="450" y1="186" x2="450" y2="205" stroke="#AAA" stroke-width="1"/>
<line x1="470" y1="186" x2="590" y2="205" stroke="#AAA" stroke-width="1"/>
<rect x="262" y="205" width="76" height="24" fill="#EBF5FB" stroke="#3498DB" stroke-width="1" rx="3"/>
<text x="300" y="222" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">-1 → amt=5</text>
<rect x="412" y="205" width="76" height="24" fill="#EBF5FB" stroke="#3498DB" stroke-width="1" rx="3"/>
<text x="450" y="222" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">-3 → amt=3</text>
<rect x="552" y="205" width="76" height="24" fill="#EBF5FB" stroke="#3498DB" stroke-width="1" rx="3"/>
<text x="590" y="222" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">-4 → amt=2</text>
<!-- Level 2 labels (some) -->
<text x="300" y="255" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">... many branches ...</text>
<text x="450" y="255" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">-3→0(base!)</text>
<text x="590" y="255" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">-1→1, -4→-2(invalid)</text>
<!-- Labels cycling -->
<text class="rl0" x="450" y="285" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">coinChange(6) calls -1→5, -3→3, -4→2</text>
<text class="rl1" x="450" y="285" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">coinChange(3) calls -1→2, -3→0✓ base!, -4→invalid</text>
<text class="rl2" x="450" y="285" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">coin(3) via -3: 1 coin! But called coin(3) from both 6 and 5!</text>
<text class="rl3" x="450" y="285" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">Memoization caches: coin(3)=1, coin(2)=2, coin(6)=2 ✓</text>
<text x="450" y="310" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Without memo: exponential. With memo: O(amount × |coins|). But top-down adds stack overhead.</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="200" y="329" width="500" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Build dp[0..amount] bottom-up: dp[i] = min(dp[i-c]+1). No recursion needed!</text>

<!-- APPROACH 2: Bottom-Up DP -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Bottom-Up DP — O(n·coins) time, O(n) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">dp[i] = min dp[i-c]+1 for each coin c (if i≥c). dp[0]=0, dp[i]=∞ initially.</text>
<!-- DP array: 7 cells for amounts 0..6 at x: 237,285,333,381,429,477,525 -->
<rect x="237" y="425" width="42" height="42" class="d0" rx="3"/>
<text x="258" y="441" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">dp[0]</text>
<text x="258" y="457" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">0</text>
<rect x="285" y="425" width="42" height="42" class="d1" rx="3"/>
<text x="306" y="441" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">dp[1]</text>
<text x="306" y="457" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="333" y="425" width="42" height="42" class="d2" rx="3"/>
<text x="354" y="441" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">dp[2]</text>
<text x="354" y="457" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="381" y="425" width="42" height="42" class="d3" rx="3"/>
<text x="402" y="441" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">dp[3]</text>
<text x="402" y="457" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="429" y="425" width="42" height="42" class="d4" rx="3"/>
<text x="450" y="441" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">dp[4]</text>
<text x="450" y="457" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="477" y="425" width="42" height="42" class="d5" rx="3"/>
<text x="498" y="441" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">dp[5]</text>
<text x="498" y="457" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="525" y="425" width="42" height="42" class="d6" rx="3"/>
<text x="546" y="441" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">dp[6]</text>
<text x="546" y="457" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<!-- coins label -->
<rect x="155" y="428" width="72" height="36" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5" rx="4"/>
<text x="191" y="443" font-family="Arial" font-size="10" font-weight="bold" fill="#E67E22" text-anchor="middle">coins:</text>
<text x="191" y="457" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">[1, 3, 4]</text>
<!-- pointer -->
<g class="dpp" transform="translate(258,425)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#27AE60"/>
</g>
<!-- Step labels -->
<text class="sl0" x="450" y="498" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">dp[0]=0 (base). dp[1]: -1→dp[0]+1=1. dp[1]=1</text>
<text class="sl1" x="450" y="498" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">dp[2]: -1→dp[1]+1=2. dp[2]=2</text>
<text class="sl2" x="450" y="498" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">dp[3]: -1→dp[2]+1=3, -3→dp[0]+1=1. dp[3]=1 (use coin-3)</text>
<text class="sl3" x="450" y="498" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">dp[4]: -1→dp[3]+1=2, -3→dp[1]+1=2, -4→dp[0]+1=1. dp[4]=1</text>
<text class="sl4" x="450" y="498" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">dp[6]: -3→dp[3]+1=2, -4→dp[2]+1=3... dp[6]=2 (3+3) ✓</text>
<text x="450" y="540" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Each dp[i] computed from previous values → no redundancy. O(amount × coins) total.</text>
<text x="450" y="556" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">If dp[amount]==∞ → impossible. Variation: coin change 2 (count ways) → sum instead of min.</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison (n = amount)</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Recursion + Memoization</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle">O(n · |coins|)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle">O(n) + stack</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Bottom-Up DP ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n · |coins|)</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
