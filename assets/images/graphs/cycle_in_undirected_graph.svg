<svg width="900" height="590" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="590" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Detect Cycle in an Undirected Graph</text>
  <rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
  <text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">Edges: 0-1, 1-2, 2-3, 3-1 → true (cycle: 1-2-3-1)</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Undirected: must skip parent node when visiting neighbors. Back edge to non-parent visited node = cycle.</text>

  <!-- Approach 1: DFS with Parent -->
  <rect x="15" y="115" width="250" height="335" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="250" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="250" height="15" fill="#E74C3C"/>
  <text x="140" y="140" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Approach 1: DFS + Parent</text>
  <text x="140" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">O(V+E) time | O(V) space</text>

  <text x="25" y="175" font-family="Arial" font-size="10" font-weight="bold" fill="#2C3E50">Visit recursively, track parent:</text>
  <rect x="25" y="181" width="230" height="80" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="140" y="197" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">dfs(node=0, parent=-1)</text>
  <text x="140" y="210" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">  visit 1 (parent=0)</text>
  <text x="140" y="223" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">    visit 2 (parent=1)</text>
  <text x="140" y="236" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">      visit 3 (parent=2)</text>
  <text x="140" y="251" font-family="Arial" font-size="9" fill="#E74C3C" font-weight="bold" text-anchor="middle">3's nbr 1: visited &amp; 1≠parent(2) → CYCLE! ✓</text>

  <text x="25" y="278" font-family="Arial" font-size="10" fill="#555">The key check:</text>
  <rect x="25" y="284" width="230" height="28" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="140" y="299" font-family="Arial" font-size="9" fill="#E74C3C" font-weight="bold" text-anchor="middle">visited[nbr] &amp;&amp; nbr != parent → cycle!</text>

  <text x="25" y="328" font-family="Arial" font-size="10" fill="#E74C3C">⚠ Loop all vertices (disconnected graph)</text>
  <text x="25" y="346" font-family="Arial" font-size="10" fill="#888">Parent param avoids false back-edge</text>
  <text x="25" y="364" font-family="Arial" font-size="10" fill="#888">Recursion stack O(V) in worst case</text>
  <text x="25" y="382" font-family="Arial" font-size="10" fill="#888">BFS eliminates recursion overflow risk</text>
  <text x="25" y="400" font-family="Arial" font-size="10" fill="#888">Works ONLY for undirected graphs</text>
  <text x="25" y="418" font-family="Arial" font-size="10" fill="#888">(Directed needs color-based DFS)</text>
  <text x="25" y="436" font-family="Arial" font-size="10" fill="#888">Union-Find: no parent tracking needed!</text>

  <!-- Evolution Arrow 1 -->
  <line x1="265" y1="287" x2="317" y2="287" stroke="#7F8C8D" stroke-width="2"/>
  <polygon points="317,283 325,287 317,291" fill="#7F8C8D"/>
  <rect x="265" y="263" width="52" height="48" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
  <text x="291" y="277" font-family="Arial" font-size="8" fill="#555" text-anchor="middle" font-weight="bold">💡 BFS</text>
  <text x="291" y="289" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">iterative,</text>
  <text x="291" y="301" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">safer!</text>

  <!-- Approach 2: BFS with Parent -->
  <rect x="320" y="115" width="250" height="335" fill="#FFFFFF" stroke="#E67E22" stroke-width="2" rx="7"/>
  <rect x="320" y="115" width="250" height="40" fill="#E67E22" rx="7"/>
  <rect x="320" y="140" width="250" height="15" fill="#E67E22"/>
  <text x="445" y="140" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Approach 2: BFS + Parent</text>
  <text x="445" y="153" font-family="Arial" font-size="10" fill="#FAD7A0" text-anchor="middle">O(V+E) time | O(V) space</text>

  <text x="330" y="175" font-family="Arial" font-size="10" font-weight="bold" fill="#2C3E50">Queue with (node, parent) pairs:</text>
  <rect x="330" y="181" width="230" height="80" fill="#FEF9E7" stroke="#E67E22" rx="3"/>
  <text x="445" y="197" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">Queue:[(0,-1)], visited[0]=true</text>
  <text x="445" y="210" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">Poll(0,-1): add (1,0); visited[1]=T</text>
  <text x="445" y="223" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">Poll(1,0): add (2,1); visited[2]=T</text>
  <text x="445" y="236" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">Poll(2,1): add (3,2); visited[3]=T</text>
  <text x="445" y="251" font-family="Arial" font-size="9" fill="#E74C3C" font-weight="bold" text-anchor="middle">Poll(3,2): nbr 1 visited &amp; 1≠2 → CYCLE! ✓</text>

  <text x="330" y="278" font-family="Arial" font-size="10" fill="#555">BFS cycle check:</text>
  <rect x="330" y="284" width="230" height="28" fill="#FEF9E7" stroke="#E67E22" rx="3"/>
  <text x="445" y="299" font-family="Arial" font-size="9" fill="#E74C3C" font-weight="bold" text-anchor="middle">visited[nbr] &amp;&amp; nbr!=parent → cycle!</text>

  <text x="330" y="328" font-family="Arial" font-size="10" fill="#888">Iterative: no stack overflow risk</text>
  <text x="330" y="346" font-family="Arial" font-size="10" fill="#888">Store parent in pair or separate array</text>
  <text x="330" y="364" font-family="Arial" font-size="10" fill="#888">Same logic as DFS, BFS traversal order</text>
  <text x="330" y="382" font-family="Arial" font-size="10" fill="#888">Handle disconnected: loop all nodes</text>
  <text x="330" y="400" font-family="Arial" font-size="10" fill="#888">Both DFS/BFS: O(V+E), O(V) space</text>
  <text x="330" y="418" font-family="Arial" font-size="10" fill="#888">Union-Find: skip parent tracking!</text>
  <text x="330" y="436" font-family="Arial" font-size="10" fill="#888">BFS often preferred in interviews</text>

  <!-- Evolution Arrow 2 -->
  <line x1="570" y1="287" x2="622" y2="287" stroke="#7F8C8D" stroke-width="2"/>
  <polygon points="622,283 630,287 622,291" fill="#7F8C8D"/>
  <rect x="570" y="263" width="52" height="48" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
  <text x="596" y="277" font-family="Arial" font-size="8" fill="#555" text-anchor="middle" font-weight="bold">💡 Union</text>
  <text x="596" y="289" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">Find!</text>
  <text x="596" y="301" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">O(α(V))</text>

  <!-- Approach 3: Union-Find -->
  <rect x="628" y="115" width="257" height="335" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="628" y="115" width="257" height="40" fill="#27AE60" rx="7"/>
  <rect x="628" y="140" width="257" height="15" fill="#27AE60"/>
  <text x="756" y="140" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Approach 3: Union-Find ⭐</text>
  <text x="756" y="153" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">O(E·α(V)) time | O(V) space</text>

  <text x="638" y="175" font-family="Arial" font-size="10" font-weight="bold" fill="#2C3E50">Per edge: find if already same set:</text>
  <rect x="638" y="181" width="237" height="80" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="756" y="197" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">parent=[0,1,2,3] initially</text>
  <text x="756" y="210" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">Edge(0,1): find(0)≠find(1) → union</text>
  <text x="756" y="223" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">Edge(1,2): find(1)≠find(2) → union</text>
  <text x="756" y="236" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">Edge(2,3): find(2)≠find(3) → union</text>
  <text x="756" y="251" font-family="Arial" font-size="9" fill="#27AE60" font-weight="bold" text-anchor="middle">Edge(3,1): find(3)==find(1) → CYCLE! ✓</text>

  <text x="638" y="278" font-family="Arial" font-size="10" fill="#555">Core operations:</text>
  <rect x="638" y="284" width="237" height="28" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="756" y="299" font-family="Arial" font-size="9" fill="#333" text-anchor="middle">find(x): with path compression O(α)</text>
  <text x="756" y="311" font-family="Arial" font-size="9" fill="#27AE60" font-weight="bold" text-anchor="middle">if find(u)==find(v): return cycle!</text>

  <text x="638" y="332" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">No parent tracking required!</text>
  <text x="638" y="350" font-family="Arial" font-size="10" fill="#888">Path compression + union by rank</text>
  <text x="638" y="368" font-family="Arial" font-size="10" fill="#888">α(V) ≈ O(1) amortized per operation</text>
  <text x="638" y="386" font-family="Arial" font-size="10" fill="#888">Best for edge-list input format</text>
  <text x="638" y="404" font-family="Arial" font-size="10" fill="#888">Doesn't work for directed graphs!</text>
  <text x="638" y="422" font-family="Arial" font-size="10" fill="#888">Use DFS White-Gray-Black for directed</text>
  <text x="638" y="440" font-family="Arial" font-size="10" fill="#888">Most efficient for undirected cycle!</text>

  <!-- Complexity Table -->
  <rect x="15" y="463" width="870" height="118" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="463" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="478" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="483" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
  <line x1="15" y1="493" x2="885" y2="493" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="493" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="510" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="510" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
  <text x="750" y="510" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
  <line x1="15" y1="518" x2="885" y2="518" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="518" width="870" height="21" fill="#FDEDEC"/>
  <text x="200" y="532" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">DFS with Parent Tracking</text>
  <text x="500" y="532" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(V+E)</text>
  <text x="750" y="532" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(V) + recursion stack</text>
  <line x1="15" y1="539" x2="885" y2="539" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="539" width="870" height="21" fill="#FEF9E7"/>
  <text x="200" y="553" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">BFS with Parent Tracking</text>
  <text x="500" y="553" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(V+E)</text>
  <text x="750" y="553" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(V)</text>
  <line x1="15" y1="560" x2="885" y2="560" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="560" width="870" height="21" fill="#EAFAF1"/>
  <text x="200" y="574" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Union-Find ⭐</text>
  <text x="500" y="574" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(E·α(V))</text>
  <text x="750" y="574" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(V)</text>
  <line x1="370" y1="493" x2="370" y2="581" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="493" x2="620" y2="581" stroke="#DEE2E6" stroke-width="1"/>
</svg>
