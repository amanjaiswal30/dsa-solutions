<svg width="900" height="570" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="570" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Topological Sort (DAG Ordering)</text>
  <rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
  <text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">Graph: 5→0, 5→2, 4→0, 4→1, 2→3, 3→1 → [5,4,2,3,1,0] or [4,5,2,3,1,0]</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Linear ordering of vertices where for every directed edge u→v, u comes before v. Only possible for DAGs.</text>

  <!-- Approach 1: Kahn's BFS -->
  <rect x="15" y="115" width="390" height="330" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="390" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="390" height="15" fill="#E74C3C"/>
  <text x="210" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Kahn's BFS</text>
  <text x="210" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">O(V+E) time | O(V+E) space</text>

  <text x="30" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Process 0-indegree nodes iteratively:</text>
  <rect x="30" y="184" width="360" height="80" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="200" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Compute indegrees: 0=2, 1=2, 2=1, 3=1, 4=0, 5=0</text>
  <text x="210" y="215" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Queue=[4,5] (indegree=0)</text>
  <text x="210" y="230" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Poll 4: result=[4]; dec indeg[0]=1, indeg[1]=1</text>
  <text x="210" y="245" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Poll 5: result=[4,5]; dec indeg[0]=0→add, indeg[2]=0→add</text>
  <text x="210" y="263" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">Continue: [4,5,0,2,3,1] — valid topo order ✓</text>

  <text x="30" y="284" font-family="Arial" font-size="11" fill="#555">Cycle detection bonus:</text>
  <rect x="30" y="290" width="360" height="20" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="304" font-family="Arial" font-size="10" fill="#E74C3C" text-anchor="middle">if result.size != V → cycle exists! (used in Course Schedule)</text>

  <text x="30" y="328" font-family="Arial" font-size="11" fill="#E74C3C">⚠ Requires building adj list + indegrees</text>
  <text x="30" y="346" font-family="Arial" font-size="11" fill="#888">Multiple valid orders may exist</text>
  <text x="30" y="364" font-family="Arial" font-size="11" fill="#888">Queue can be a PriorityQueue for lex order</text>
  <text x="30" y="382" font-family="Arial" font-size="11" fill="#888">Easy to detect cycle: count != V</text>
  <text x="30" y="400" font-family="Arial" font-size="11" fill="#888">Good for iterative / bottom-up style</text>
  <text x="30" y="418" font-family="Arial" font-size="11" fill="#888">DFS: post-order + stack (reverse order)</text>
  <text x="30" y="436" font-family="Arial" font-size="11" fill="#888">DFS simpler code for many interview Qs</text>

  <!-- Evolution Arrow -->
  <line x1="410" y1="278" x2="480" y2="278" stroke="#7F8C8D" stroke-width="2.5"/>
  <polygon points="480,273 492,278 480,283" fill="#7F8C8D"/>
  <rect x="410" y="250" width="72" height="56" fill="#ECF0F1" stroke="#BDC3C7" rx="5"/>
  <text x="446" y="264" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" font-weight="bold">💡 DFS</text>
  <text x="446" y="276" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">post-order</text>
  <text x="446" y="288" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">+ reverse!</text>

  <!-- Approach 2: DFS with Stack -->
  <rect x="492" y="115" width="393" height="330" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="492" y="115" width="393" height="40" fill="#27AE60" rx="7"/>
  <rect x="492" y="140" width="393" height="15" fill="#27AE60"/>
  <text x="688" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: DFS + Stack ⭐</text>
  <text x="688" y="153" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">O(V+E) time | O(V+E) space</text>

  <text x="505" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Post-order DFS, push to stack:</text>
  <rect x="505" y="184" width="362" height="80" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="200" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">visited={}; stack=[]</text>
  <text x="686" y="215" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">DFS(5): visit neighbors 0,2 first (recursively)</text>
  <text x="686" y="230" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">  DFS(0): no unvisited neighbors → stack.push(0)</text>
  <text x="686" y="245" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">  DFS(2): DFS(3): DFS(1)→push(1); push(3); push(2)</text>
  <text x="686" y="263" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">push(5), DFS(4)→push(4); pop stack → [4,5,2,3,1,0] ✓</text>

  <text x="505" y="284" font-family="Arial" font-size="11" fill="#555">Key: push AFTER all neighbors processed:</text>
  <rect x="505" y="290" width="362" height="20" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="304" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">Post-order push = reverse topological order!</text>

  <text x="505" y="328" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Post-order = reverse topo order!</text>
  <text x="505" y="346" font-family="Arial" font-size="11" fill="#888">Pop stack → correct ordering</text>
  <text x="505" y="364" font-family="Arial" font-size="11" fill="#888">Cycle detection: track "in-stack" nodes</text>
  <text x="505" y="382" font-family="Arial" font-size="11" fill="#888">(not just visited — need 3-color)</text>
  <text x="505" y="400" font-family="Arial" font-size="11" fill="#888">Recursion depth O(V) worst case</text>
  <text x="505" y="418" font-family="Arial" font-size="11" fill="#888">Handle disconnected: loop all nodes</text>
  <text x="505" y="436" font-family="Arial" font-size="11" fill="#888">Used in: alien dictionary, build order</text>

  <!-- Complexity Table -->
  <rect x="15" y="457" width="870" height="104" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="457" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="472" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="477" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
  <line x1="15" y1="487" x2="885" y2="487" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="487" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="504" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="504" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
  <text x="750" y="504" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
  <line x1="15" y1="512" x2="885" y2="512" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="512" width="870" height="24" fill="#FDEDEC"/>
  <text x="200" y="528" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Kahn's BFS (Topological Sort)</text>
  <text x="500" y="528" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(V+E)</text>
  <text x="750" y="528" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(V+E)</text>
  <line x1="15" y1="536" x2="885" y2="536" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="536" width="870" height="24" fill="#EAFAF1"/>
  <text x="200" y="552" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">DFS Post-Order + Stack ⭐</text>
  <text x="500" y="552" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(V+E)</text>
  <text x="750" y="552" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(V+E)</text>
  <line x1="370" y1="487" x2="370" y2="560" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="487" x2="620" y2="560" stroke="#DEE2E6" stroke-width="1"/>
</svg>
