<svg width="900" height="480" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="480" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Minimum Spanning Tree</text>
  <rect x="780" y="12" width="100" height="28" fill="#F39C12" rx="14"/>
  <text x="830" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">V=4, edges=[[0,1,10],[0,2,6],[0,3,5],[1,3,15],[2,3,4]]  -&gt;  MST weight = 4+5+10 = 19</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Connect all vertices with V-1 edges at minimum total weight, no cycles.</text>

  <!-- Graph nodes -->
  <g font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
    <circle cx="150" cy="230" r="26" fill="#3498DB"/>
    <text x="150" y="235">0</text>

    <circle cx="420" cy="130" r="26" fill="#3498DB"/>
    <text x="420" y="135">1</text>

    <circle cx="420" cy="330" r="26" fill="#3498DB"/>
    <text x="420" y="335">2</text>

    <circle cx="690" cy="230" r="26" fill="#3498DB"/>
    <text x="690" y="235">3</text>
  </g>

  <!-- Non-MST edges (grey, dashed): 0-2 (6), 1-3 (15) -->
  <g stroke="#BDC3C7" stroke-width="2" stroke-dasharray="6,5" fill="none">
    <line x1="167" y1="248" x2="399" y2="316"/>
    <line x1="437" y1="152" x2="675" y2="212"/>
  </g>
  <g font-family="Arial" font-size="11" fill="#95A5A6">
    <text x="260" y="300">6</text>
    <text x="555" y="165">15</text>
  </g>

  <!-- MST edges (green, solid, thick): 2-3 (4), 0-3 (5), 0-1 (10) -->
  <g stroke="#27AE60" stroke-width="5" fill="none">
    <line x1="446" y1="322" x2="664" y2="238"/>
    <line x1="176" y1="222" x2="664" y2="228"/>
    <line x1="176" y1="215" x2="394" y2="144"/>
  </g>
  <g font-family="Arial" font-size="12" font-weight="bold" fill="#1E8449">
    <text x="555" y="300">4</text>
    <text x="400" y="212">5</text>
    <text x="270" y="165">10</text>
  </g>

  <text x="60" y="400" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Kruskal's: sort edges 4,5,6,10,15 — take 4 (2-3), 5 (0-3), skip 6 (0-2, cycle), take 10 (0-1).</text>
  <text x="60" y="422" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Prim's: grow from vertex 0 — always add the cheapest edge leaving the current tree, same result.</text>
  <text x="60" y="444" font-family="Arial" font-size="11" fill="#1E8449">Green = MST edges (4+5+10=19). Grey dashed = rejected (would form a cycle, or cost more).</text>
</svg>
