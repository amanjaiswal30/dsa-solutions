<svg width="900" height="580" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes step1 { 0%,8%{opacity:0.5} 12%,100%{opacity:1} }
  @keyframes step2 { 0%,18%{opacity:0.5} 22%,100%{opacity:1} }
  @keyframes step3 { 0%,28%{opacity:0.5} 32%,100%{opacity:1} }
  @keyframes approach-pulse { 0%,40%{stroke-width:2} 50%,60%{stroke-width:2.5} 70%,100%{stroke-width:2} }
  @keyframes arrow-glow { 0%,30%{opacity:0.6;stroke:#7F8C8D} 50%,70%{opacity:1;stroke:#3498DB} 90%,100%{opacity:0.6;stroke:#7F8C8D} }
  @keyframes row1 { 0%,45%{fill:#FDEDEC} 50%,55%{fill:#D5F5E3} 60%,100%{fill:#FDEDEC} }
  @keyframes row2 { 0%,55%{fill:#EAFAF1} 60%,65%{fill:#D5F5E3} 70%,100%{fill:#EAFAF1} }
  .anim-step1{animation:step1 9s ease-in-out infinite}
  .anim-step2{animation:step2 9s ease-in-out infinite}
  .anim-step3{animation:step3 9s ease-in-out infinite}
  .anim-approach1{animation:approach-pulse 9s ease-in-out infinite}
  .anim-approach2{animation:approach-pulse 9s ease-in-out 1.5s infinite}
  .anim-arrow{animation:arrow-glow 9s ease-in-out infinite}
  .anim-row1{animation:row1 9s ease-in-out infinite}
  .anim-row2{animation:row2 9s ease-in-out infinite}
</style>
  <rect width="900" height="580" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Detect Cycle in a Directed Graph</text>
  <rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
  <text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">0→1→2→3 → false (DAG)</text>
  <text x="300" y="81" font-family="Arial" font-size="12" fill="#555">|</text>
  <text x="315" y="81" font-family="Arial" font-size="12" fill="#555">0→1→2→3→1 → true (cycle: 1→2→3→1)</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Directed cycle: path that returns to a vertex following edge direction. Need to track current DFS path.</text>

  <!-- Approach 1: DFS White-Gray-Black -->
  <rect x="15" y="115" width="390" height="345" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7" class="anim-approach1"/>
  <rect x="15" y="115" width="390" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="390" height="15" fill="#E74C3C"/>
  <text x="210" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: DFS White-Gray-Black</text>
  <text x="210" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">O(V+E) time | O(V) space</text>

  <text x="30" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Three-state DFS on 0→1→2→3→1:</text>
  <rect x="30" y="184" width="360" height="80" fill="#FDEDEC" stroke="#E74C3C" rx="3" class="anim-step1"/>
  <text x="210" y="200" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">color[0]: W→G; visit 1: color[1]: W→G</text>
  <text x="210" y="215" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">visit 2: color[2]: W→G; visit 3: color[3]: W→G</text>
  <text x="210" y="230" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">3's neighbor is 1: color[1]==GRAY → BACK EDGE!</text>
  <text x="210" y="248" font-family="Arial" font-size="10" fill="#E74C3C" font-weight="bold" text-anchor="middle">Cycle detected! → return true ✓</text>
  <text x="210" y="263" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">(Gray neighbor = ancestor in current path)</text>

  <text x="30" y="286" font-family="Arial" font-size="11" fill="#555">No-cycle case 0→1→2→3:</text>
  <rect x="30" y="292" width="360" height="36" fill="#FDEDEC" stroke="#E74C3C" rx="3" class="anim-step2"/>
  <text x="210" y="307" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Visit 0→1→2→3; 3 has no neighbors → Black</text>
  <text x="210" y="321" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">All become Black with no Gray encounter → false ✓</text>

  <text x="30" y="350" font-family="Arial" font-size="11" fill="#555">Color meanings:</text>
  <rect x="30" y="356" width="360" height="44" fill="#FDEDEC" stroke="#E74C3C" rx="3" class="anim-step3"/>
  <text x="210" y="372" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">White(0)=unvisited, Gray(1)=in current DFS path</text>
  <text x="210" y="386" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Black(2)=fully explored (no cycle through this node)</text>
  <text x="210" y="402" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">Gray→Gray edge = back edge = cycle ✓</text>

  <text x="30" y="430" font-family="Arial" font-size="11" fill="#E74C3C">⚠ Must handle disconnected components!</text>
  <text x="30" y="448" font-family="Arial" font-size="11" fill="#888">Loop all vertices, start DFS from unvisited ones</text>

  <!-- Evolution Arrow -->
  <line x1="410" y1="290" x2="480" y2="290" stroke="#7F8C8D" stroke-width="2.5" class="anim-arrow"/>
  <polygon points="480,285 492,290 480,295" fill="#7F8C8D"/>
  <rect x="410" y="262" width="72" height="56" fill="#ECF0F1" stroke="#BDC3C7" rx="5"/>
  <text x="446" y="276" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" font-weight="bold">💡 Kahn's</text>
  <text x="446" y="288" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">BFS topo</text>
  <text x="446" y="300" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">sort!</text>

  <!-- Approach 2: Kahn's -->
  <rect x="492" y="115" width="393" height="345" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7" class="anim-approach2"/>
  <rect x="492" y="115" width="393" height="40" fill="#27AE60" rx="7"/>
  <rect x="492" y="140" width="393" height="15" fill="#27AE60"/>
  <text x="688" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Kahn's Algorithm ⭐</text>
  <text x="688" y="153" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">O(V+E) time | O(V) space</text>

  <text x="505" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Topological sort: if impossible → cycle exists:</text>
  <rect x="505" y="184" width="362" height="80" fill="#EAFAF1" stroke="#27AE60" rx="3" class="anim-step1"/>
  <text x="686" y="200" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Compute indegrees for all vertices</text>
  <text x="686" y="215" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Add vertices with indegree=0 to queue</text>
  <text x="686" y="230" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Process: decrement neighbors' indegrees</text>
  <text x="686" y="248" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">count != V → cycle exists! count == V → no cycle ✓</text>
  <text x="686" y="263" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">Cycle nodes never get indegree=0, so never processed</text>

  <text x="505" y="284" font-family="Arial" font-size="11" fill="#555">Cycle case 1→2→3→1:</text>
  <rect x="505" y="290" width="362" height="44" fill="#EAFAF1" stroke="#27AE60" rx="3" class="anim-step2"/>
  <text x="686" y="305" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Indegrees: 1=1, 2=1, 3=1 → Queue empty!</text>
  <text x="686" y="323" font-family="Arial" font-size="10" fill="#E74C3C" font-weight="bold" text-anchor="middle">count=0 ≠ V=3 → cycle detected! ✓</text>

  <text x="505" y="354" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Key insight:</text>
  <rect x="505" y="360" width="362" height="28" fill="#EAFAF1" stroke="#27AE60" rx="3" class="anim-step3"/>
  <text x="686" y="375" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Cyclic nodes form a "stuck" group — no node can</text>
  <text x="686" y="387" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">have indegree=0 while cycle is intact</text>

  <text x="505" y="412" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Elegant cycle detection without DFS coloring!</text>
  <text x="505" y="430" font-family="Arial" font-size="11" fill="#888">Works as basis for topological sort too</text>
  <text x="505" y="448" font-family="Arial" font-size="11" fill="#888">Easily extended to Course Schedule II</text>

  <!-- Complexity Table -->
  <rect x="15" y="472" width="870" height="100" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="472" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="487" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="492" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
  <line x1="15" y1="502" x2="885" y2="502" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="502" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="519" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="519" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
  <text x="750" y="519" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
  <line x1="15" y1="527" x2="885" y2="527" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="527" width="870" height="21" fill="#FDEDEC" class="anim-row1"/>
  <text x="200" y="541" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">DFS White-Gray-Black</text>
  <text x="500" y="541" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(V+E)</text>
  <text x="750" y="541" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(V)</text>
  <line x1="15" y1="548" x2="885" y2="548" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="548" width="870" height="21" fill="#EAFAF1" class="anim-row2"/>
  <text x="200" y="562" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Kahn's Algorithm ⭐</text>
  <text x="500" y="562" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(V+E)</text>
  <text x="750" y="562" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(V)</text>
  <line x1="370" y1="502" x2="370" y2="569" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="502" x2="620" y2="569" stroke="#DEE2E6" stroke-width="1"/>
</svg>
