<svg width="900" height="570" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="570" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Course Schedule — Can You Finish All Courses?</text>
  <rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
  <text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">numCourses=2, prerequisites=[[1,0]] → true</text>
  <text x="400" y="81" font-family="Arial" font-size="12" fill="#555">|  [[1,0],[0,1]] → false (cycle!)</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Model as directed graph: edge [a,b] means b→a. Detect cycle. If cycle exists → impossible. DAG = possible.</text>

  <!-- Approach 1: BFS Kahn's -->
  <rect x="15" y="115" width="390" height="330" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="390" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="390" height="15" fill="#E74C3C"/>
  <text x="210" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: BFS (Kahn's Algorithm)</text>
  <text x="210" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">O(V+E) time | O(V+E) space</text>

  <text x="30" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Count indegrees, process 0-indegree courses:</text>
  <rect x="30" y="184" width="360" height="72" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="200" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Build adj: 0→1 (take 0 first to unlock 1)</text>
  <text x="210" y="215" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Indegrees: [0]=0, [1]=1 → Queue=[0]</text>
  <text x="210" y="230" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Poll 0: completed++, decrease indeg[1] → add 1</text>
  <text x="210" y="248" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">completed=2==numCourses → return true ✓</text>

  <text x="30" y="278" font-family="Arial" font-size="11" fill="#555">Cycle case [[1,0],[0,1]]:</text>
  <rect x="30" y="284" width="360" height="28" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="299" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Indegrees: [0]=1, [1]=1 → Queue=[] (empty!)</text>
  <text x="210" y="311" font-family="Arial" font-size="10" fill="#E74C3C" font-weight="bold" text-anchor="middle">completed=0 ≠ 2 → return false (cycle detected!) ✓</text>

  <text x="30" y="334" font-family="Arial" font-size="11" fill="#E74C3C">⚠ Requires building adjacency list + indegrees</text>
  <text x="30" y="352" font-family="Arial" font-size="11" fill="#888">Detects cycle by counting completed courses</text>
  <text x="30" y="370" font-family="Arial" font-size="11" fill="#888">DFS uses three-color (White/Gray/Black) states</text>
  <text x="30" y="388" font-family="Arial" font-size="11" fill="#888">Both approach detect cycle: BFS by count, DFS by Gray</text>
  <text x="30" y="406" font-family="Arial" font-size="11" fill="#888">Both O(V+E) — choose based on preference</text>
  <text x="30" y="424" font-family="Arial" font-size="11" fill="#888">DFS simpler to code for cycle detection</text>

  <!-- Evolution Arrow -->
  <line x1="410" y1="278" x2="480" y2="278" stroke="#7F8C8D" stroke-width="2.5"/>
  <polygon points="480,273 492,278 480,283" fill="#7F8C8D"/>
  <rect x="410" y="250" width="72" height="56" fill="#ECF0F1" stroke="#BDC3C7" rx="5"/>
  <text x="446" y="264" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" font-weight="bold">💡 DFS</text>
  <text x="446" y="276" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">Gray node</text>
  <text x="446" y="288" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">= cycle!</text>

  <!-- Approach 2: DFS -->
  <rect x="492" y="115" width="393" height="330" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="492" y="115" width="393" height="40" fill="#27AE60" rx="7"/>
  <rect x="492" y="140" width="393" height="15" fill="#27AE60"/>
  <text x="688" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: DFS Cycle Detection ⭐</text>
  <text x="688" y="153" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">O(V+E) time | O(V+E) space</text>

  <text x="505" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">3-state DFS: 0=unvisited, 1=visiting, 2=visited:</text>
  <rect x="505" y="184" width="362" height="72" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="200" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">state[course]=1 when starting DFS (visiting)</text>
  <text x="686" y="215" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">if neighbor state==1 → CYCLE! return false</text>
  <text x="686" y="230" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">state[course]=2 when done (visited)</text>
  <text x="686" y="248" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">No cycle found in any DFS → return true ✓</text>

  <text x="505" y="276" font-family="Arial" font-size="11" fill="#555">Trace [[1,0],[0,1]] (0→1, 1→0):</text>
  <rect x="505" y="282" width="362" height="36" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="297" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">DFS from 0: state[0]=1, visit 1: state[1]=1</text>
  <text x="686" y="311" font-family="Arial" font-size="10" fill="#E74C3C" font-weight="bold" text-anchor="middle">Visit 0 again: state[0]==1 → CYCLE → return false ✓</text>

  <text x="505" y="352" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Key: state=1 in current DFS path detects cycle!</text>
  <text x="505" y="370" font-family="Arial" font-size="11" fill="#888">State=2 means safely processed (no cycle)</text>
  <text x="505" y="388" font-family="Arial" font-size="11" fill="#888">Handle disconnected components: loop all nodes</text>
  <text x="505" y="406" font-family="Arial" font-size="11" fill="#888">Both approaches detect same cycle condition</text>
  <text x="505" y="424" font-family="Arial" font-size="11" fill="#888">Extension: Course Schedule II returns actual order</text>

  <!-- Complexity Table -->
  <rect x="15" y="457" width="870" height="104" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="457" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="472" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="477" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
  <line x1="15" y1="487" x2="885" y2="487" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="487" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="504" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="504" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
  <text x="750" y="504" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
  <line x1="15" y1="512" x2="885" y2="512" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="512" width="870" height="24" fill="#FDEDEC"/>
  <text x="200" y="528" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">BFS - Kahn's Topological Sort</text>
  <text x="500" y="528" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(V+E)</text>
  <text x="750" y="528" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(V+E)</text>
  <line x1="15" y1="536" x2="885" y2="536" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="536" width="870" height="24" fill="#EAFAF1"/>
  <text x="200" y="552" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">DFS - Three-State Cycle Detection ⭐</text>
  <text x="500" y="552" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(V+E)</text>
  <text x="750" y="552" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(V+E)</text>
  <line x1="370" y1="487" x2="370" y2="560" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="487" x2="620" y2="560" stroke="#DEE2E6" stroke-width="1"/>
</svg>
