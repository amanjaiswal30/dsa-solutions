<svg width="900" height="480" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="480" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Dijkstra's Algorithm</text>
  <rect x="780" y="12" width="100" height="28" fill="#F39C12" rx="14"/>
  <text x="830" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">src=0 -&gt; shortest dist to 1 is via 0-&gt;2-&gt;1 (1+2=3), cheaper than direct edge 0-&gt;1 (4)</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Greedy: always finalize the closest unvisited vertex next, then relax its edges.</text>

  <!-- Graph nodes -->
  <g font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">
    <circle cx="120" cy="230" r="26" fill="#27AE60"/>
    <text x="120" y="235">0</text>
    <text x="120" y="270" font-size="11" fill="#2C3E50" font-weight="normal">dist=0</text>

    <circle cx="330" cy="150" r="26" fill="#3498DB"/>
    <text x="330" y="155">1</text>
    <text x="330" y="190" font-size="11" fill="#2C3E50" font-weight="normal">dist=3</text>

    <circle cx="330" cy="310" r="26" fill="#3498DB"/>
    <text x="330" y="315">2</text>
    <text x="330" y="350" font-size="11" fill="#2C3E50" font-weight="normal">dist=1</text>

    <circle cx="540" cy="230" r="26" fill="#E67E22"/>
    <text x="540" y="235">3</text>
    <text x="540" y="270" font-size="11" fill="#2C3E50" font-weight="normal">dist=4</text>

    <circle cx="750" cy="230" r="26" fill="#E74C3C"/>
    <text x="750" y="235">4</text>
    <text x="750" y="270" font-size="11" fill="#2C3E50" font-weight="normal">dist=7</text>
  </g>

  <!-- Edges -->
  <g stroke="#95A5A6" stroke-width="2" fill="none">
    <line x1="144" y1="215" x2="306" y2="163"/>
    <line x1="130" y1="255" x2="320" y2="296"/>
    <line x1="330" y1="284" x2="330" y2="176"/>
    <line x1="356" y1="160" x2="516" y2="222"/>
    <line x1="356" y1="300" x2="516" y2="238"/>
    <line x1="566" y1="230" x2="726" y2="230"/>
  </g>
  <g font-family="Arial" font-size="11" fill="#2C3E50">
    <text x="205" y="180">4</text>
    <text x="200" y="290">1</text>
    <text x="345" y="230">2</text>
    <text x="440" y="200">1</text>
    <text x="440" y="280">5</text>
    <text x="645" y="220">3</text>
  </g>

  <!-- Highlighted shortest path edges 0-2, 2-1, 1-3, 3-4 -->
  <g stroke="#27AE60" stroke-width="4" fill="none" opacity="0.6">
    <line x1="130" y1="255" x2="320" y2="296"/>
    <line x1="330" y1="284" x2="330" y2="176"/>
    <line x1="356" y1="160" x2="516" y2="222"/>
    <line x1="566" y1="230" x2="726" y2="230"/>
  </g>

  <text x="60" y="410" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Min-heap pops smallest tentative distance first: 0, 2, 1, 3, 4 (green path shows shortest tree).</text>
  <text x="60" y="432" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Stale heap entries (worse distances) are skipped when popped — lazy deletion.</text>
  <text x="60" y="454" font-family="Arial" font-size="11" fill="#E74C3C">Requires non-negative edge weights — negative edges need Bellman-Ford instead.</text>
</svg>
