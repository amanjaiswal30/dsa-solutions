<svg width="900" height="580" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes step_hl1 { 0%,10%,100%{fill:#FDEDEC;stroke:#E74C3C} 15%,28%{fill:#D5F5E3;stroke:#27AE60} 32%,100%{fill:#FDEDEC;stroke:#E74C3C} }
  @keyframes step_hl2 { 0%,45%,55%,100%{fill:#EAFAF1;stroke:#27AE60} 58%,72%{fill:#D5F5E3;stroke:#1E8449} 76%,100%{fill:#EAFAF1;stroke:#27AE60} }
  @keyframes arr_pulse { 0%,100%{opacity:1} 50%{opacity:0.65} }
  .sh1{animation:step_hl1 8s ease-in-out infinite}
  .sh2{animation:step_hl2 8s ease-in-out infinite}
  .ap{animation:arr_pulse 8s ease-in-out infinite}
</style>
  <rect width="900" height="580" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="17" font-weight="bold" fill="white">Clone a Linked List with Next and Random Pointers</text>
  <rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
  <text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">1→2→3 where node1.random=3, node2.random=1, node3.random=2</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Deep copy: new nodes with identical next and random pointer structure</text>

  <!-- Approach 1: HashMap -->
  <rect x="15" y="115" width="390" height="330" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="390" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="390" height="15" fill="#E74C3C"/>
  <text x="210" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: HashMap</text>
  <text x="210" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">O(n) time | O(n) space</text>

  <text x="30" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Pass 1: Create clone nodes, store mapping:</text>
  <rect class="sh1" x="30" y="184" width="360" height="40" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="199" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">HashMap: {orig1→clone1, orig2→clone2, orig3→clone3}</text>
  <text x="210" y="214" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Each clone has same value but no pointers set yet</text>

  <text x="30" y="244" font-family="Arial" font-size="11" fill="#555">Pass 2: Set next and random pointers:</text>
  <rect x="30" y="250" width="360" height="52" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="265" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">clone.next = map.get(orig.next)</text>
  <text x="210" y="279" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">clone.random = map.get(orig.random)</text>
  <text x="210" y="293" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">Return map.get(head) ✓</text>

  <text x="30" y="328" font-family="Arial" font-size="11" fill="#E74C3C">⚠ HashMap stores n extra node references</text>
  <text x="30" y="346" font-family="Arial" font-size="11" fill="#888">Simple and clean 2-pass approach</text>
  <text x="30" y="364" font-family="Arial" font-size="11" fill="#888">O(n) extra space scales with list size</text>
  <text x="30" y="382" font-family="Arial" font-size="11" fill="#888">Can do same with interleaving O(1) space!</text>
  <text x="30" y="400" font-family="Arial" font-size="11" fill="#888">Uses map lookup instead of pointer tricks</text>
  <text x="30" y="418" font-family="Arial" font-size="11" fill="#888">Both approaches make exactly 2 passes</text>

  <!-- Evolution Arrow -->
  <line class="ap" x1="410" y1="268" x2="480" y2="268" stroke="#7F8C8D" stroke-width="2.5"/>
  <polygon class="ap" points="480,263 492,268 480,273" fill="#7F8C8D"/>
  <rect x="410" y="240" width="72" height="56" fill="#ECF0F1" stroke="#BDC3C7" rx="5"/>
  <text x="446" y="254" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" font-weight="bold">💡 Embed</text>
  <text x="446" y="266" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">clones in-</text>
  <text x="446" y="278" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">place!</text>

  <!-- Approach 2: In-place Interleaving -->
  <rect x="492" y="115" width="393" height="330" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="492" y="115" width="393" height="40" fill="#27AE60" rx="7"/>
  <rect x="492" y="140" width="393" height="15" fill="#27AE60"/>
  <text x="688" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: In-place Interleaving ⭐</text>
  <text x="688" y="153" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">O(n) time | O(1) space</text>

  <text x="505" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Step 1: Interleave clone after each original:</text>
  <rect class="sh2" x="505" y="184" width="362" height="28" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="199" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">1→1'→2→2'→3→3' (clones inserted after originals)</text>
  <text x="686" y="211" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">clone.next = curr.next; curr.next = clone</text>

  <text x="505" y="232" font-family="Arial" font-size="11" fill="#555">Step 2: Set random pointers for clones:</text>
  <rect x="505" y="238" width="362" height="28" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="253" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">curr.next.random = curr.random.next</text>
  <text x="686" y="265" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">(clone's random = original's random's clone)</text>

  <text x="505" y="286" font-family="Arial" font-size="11" fill="#555">Step 3: Separate original and cloned lists:</text>
  <rect x="505" y="292" width="362" height="40" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="307" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">copyCurr.next = curr.next; curr.next = curr.next.next</text>
  <text x="686" y="322" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">Original restored: 1→2→3; Clone: 1'→2'→3' ✓</text>

  <text x="505" y="362" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">No extra HashMap — O(1) space!</text>
  <text x="505" y="380" font-family="Arial" font-size="11" fill="#888">Uses the interleaved structure as implicit map</text>
  <text x="505" y="398" font-family="Arial" font-size="11" fill="#888">curr.random.next = the random's clone</text>
  <text x="505" y="416" font-family="Arial" font-size="11" fill="#888">3 passes but still O(n) overall</text>
  <text x="505" y="434" font-family="Arial" font-size="11" fill="#888">Restores original list as side effect</text>

  <!-- Complexity Table -->
  <rect x="15" y="457" width="870" height="114" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="457" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="472" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="477" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
  <line x1="15" y1="487" x2="885" y2="487" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="487" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="504" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="504" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
  <text x="750" y="504" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
  <line x1="15" y1="512" x2="885" y2="512" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="512" width="870" height="24" fill="#FDEDEC"/>
  <text x="200" y="528" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">HashMap</text>
  <text x="500" y="528" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
  <text x="750" y="528" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n)</text>
  <line x1="15" y1="536" x2="885" y2="536" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="536" width="870" height="24" fill="#EAFAF1"/>
  <text x="200" y="552" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">In-place Interleaving ⭐</text>
  <text x="500" y="552" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
  <text x="750" y="552" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
  <line x1="370" y1="487" x2="370" y2="560" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="487" x2="620" y2="560" stroke="#DEE2E6" stroke-width="1"/>
</svg>
