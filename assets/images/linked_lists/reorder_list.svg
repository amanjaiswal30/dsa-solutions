<svg width="900" height="540" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes s1 { 0%,5%,100%{fill:#EAFAF1;stroke:#27AE60} 15%,35%{fill:#D5F5E3;stroke:#1E8449} 40%,100%{fill:#EAFAF1;stroke:#27AE60} }
  @keyframes s2 { 0%,45%,55%,100%{fill:#EAFAF1;stroke:#27AE60} 60%,80%{fill:#D5F5E3;stroke:#1E8449} 85%,100%{fill:#EAFAF1;stroke:#27AE60} }
  @keyframes s3 { 0%,85%,95%,100%{fill:#EAFAF1;stroke:#27AE60} 98%,100%{fill:#D5F5E3;stroke:#1E8449} }
  @keyframes ar { 0%,100%{opacity:1} 50%{opacity:0.65} }
  .st1{animation:s1 8s ease-in-out infinite}
  .st2{animation:s2 8s ease-in-out infinite}
  .st3{animation:s3 8s ease-in-out infinite}
  .ar{animation:ar 8s ease-in-out infinite}
</style>
  <rect width="900" height="540" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Reorder List (L1→Ln→L2→Ln-1→...)</text>
  <rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
  <text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">Input: 1→2→3→4→5</text>
  <text x="290" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">→  Output: 1→5→2→4→3</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Interleave front and back nodes in-place: L1→Ln→L2→Ln-1→L3→Ln-2→...</text>

  <!-- Single Optimal Approach with 3 phases -->
  <rect x="15" y="115" width="870" height="295" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="15" y="115" width="870" height="40" fill="#27AE60" rx="7"/>
  <rect x="15" y="140" width="870" height="15" fill="#27AE60"/>
  <text x="450" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Optimal: 3-Step In-Place Approach ⭐</text>
  <text x="450" y="153" font-family="Arial" font-size="11" fill="#D5F5E3" text-anchor="middle">O(n) time | O(1) space — find middle → reverse second half → merge alternately</text>

  <!-- Step 1 -->
  <rect class="st1" x="30" y="165" width="260" height="210" fill="#EAFAF1" stroke="#27AE60" stroke-width="1.5" rx="5"/>
  <rect x="30" y="165" width="260" height="28" fill="#27AE60" rx="5"/>
  <rect x="30" y="180" width="260" height="13" fill="#27AE60"/>
  <text x="160" y="180" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Step 1: Find Middle</text>
  <text x="45" y="212" font-family="Arial" font-size="10" fill="#2C3E50">Use slow (1 step) + fast (2 steps):</text>
  <rect x="45" y="218" width="230" height="52" fill="#FFFFFF" stroke="#27AE60" rx="3"/>
  <text x="160" y="233" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">start: slow=1, fast=1</text>
  <text x="160" y="248" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">step1: slow=2, fast=3</text>
  <text x="160" y="263" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">step2: slow=3, fast=5 → STOP</text>
  <text x="45" y="290" font-family="Arial" font-size="10" fill="#555">Middle = node(3)</text>
  <text x="45" y="306" font-family="Arial" font-size="10" fill="#555">First half: 1→2→3</text>
  <text x="45" y="322" font-family="Arial" font-size="10" fill="#555">Second half starts at: 4→5</text>
  <text x="45" y="340" font-family="Arial" font-size="10" fill="#888">while(fast.next!=null &amp;&amp;</text>
  <text x="45" y="354" font-family="Arial" font-size="10" fill="#888">      fast.next.next!=null)</text>
  <text x="45" y="368" font-family="Arial" font-size="10" fill="#888">slow/fast pointers split list</text>

  <!-- Arrow between steps -->
  <line class="ar" x1="293" y1="267" x2="316" y2="267" stroke="#7F8C8D" stroke-width="2"/>
  <polygon class="ar" points="314,262 325,267 314,272" fill="#7F8C8D"/>

  <!-- Step 2 -->
  <rect class="st2" x="328" y="165" width="248" height="210" fill="#EAFAF1" stroke="#27AE60" stroke-width="1.5" rx="5"/>
  <rect x="328" y="165" width="248" height="28" fill="#1A8A55" rx="5"/>
  <rect x="328" y="180" width="248" height="13" fill="#1A8A55"/>
  <text x="452" y="180" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Step 2: Reverse 2nd Half</text>
  <text x="343" y="212" font-family="Arial" font-size="10" fill="#2C3E50">Reverse second half in-place:</text>
  <rect x="343" y="218" width="218" height="52" fill="#FFFFFF" stroke="#27AE60" rx="3"/>
  <text x="452" y="233" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">second = slow.next = node(4)</text>
  <text x="452" y="248" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">slow.next = null (split the list)</text>
  <text x="452" y="263" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">reverse(4→5) → 5→4 ✓</text>
  <text x="343" y="290" font-family="Arial" font-size="10" fill="#555">First half: 1→2→3 (head)</text>
  <text x="343" y="306" font-family="Arial" font-size="10" fill="#555">Second half: 5→4 (reversed)</text>
  <text x="343" y="322" font-family="Arial" font-size="10" fill="#888">Standard 3-pointer reversal:</text>
  <text x="343" y="338" font-family="Arial" font-size="10" fill="#888">prev=null, curr=4, next=null</text>
  <text x="343" y="354" font-family="Arial" font-size="10" fill="#888">flip pointers until curr=null</text>
  <text x="343" y="370" font-family="Arial" font-size="10" fill="#888">return prev (new head = 5)</text>

  <!-- Arrow between steps -->
  <line class="ar" x1="579" y1="267" x2="602" y2="267" stroke="#7F8C8D" stroke-width="2"/>
  <polygon class="ar" points="600,262 611,267 600,272" fill="#7F8C8D"/>

  <!-- Step 3 -->
  <rect x="614" y="165" width="271" height="210" fill="#EAFAF1" stroke="#27AE60" stroke-width="1.5" rx="5"/>
  <rect x="614" y="165" width="271" height="28" fill="#0E6B42" rx="5"/>
  <rect x="614" y="180" width="271" height="13" fill="#0E6B42"/>
  <text x="749" y="180" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Step 3: Merge Alternately</text>
  <text x="629" y="212" font-family="Arial" font-size="10" fill="#2C3E50">Weave first and second halves:</text>
  <rect x="629" y="218" width="241" height="64" fill="#FFFFFF" stroke="#27AE60" rx="3"/>
  <text x="749" y="233" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">first=1, second=5</text>
  <text x="749" y="248" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">1→5→2→4→3 (weave while second≠null)</text>
  <text x="749" y="263" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">first.next=second; second.next=first.next</text>
  <text x="749" y="279" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">Result: 1→5→2→4→3 ✓</text>
  <text x="629" y="302" font-family="Arial" font-size="10" fill="#555">temp1=first.next, temp2=second.next</text>
  <text x="629" y="318" font-family="Arial" font-size="10" fill="#555">first.next=second; second.next=temp1</text>
  <text x="629" y="334" font-family="Arial" font-size="10" fill="#555">advance: first=temp1, second=temp2</text>
  <text x="629" y="350" font-family="Arial" font-size="10" fill="#888">Loop until second==null</text>
  <text x="629" y="366" font-family="Arial" font-size="10" fill="#888">Works for both odd/even lengths</text>

  <!-- Complexity Table -->
  <rect x="15" y="422" width="870" height="105" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="422" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="437" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="442" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Step-by-Step Complexity</text>
  <line x1="15" y1="452" x2="885" y2="452" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="452" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="469" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Step</text>
  <text x="500" y="469" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
  <text x="750" y="469" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
  <line x1="15" y1="477" x2="885" y2="477" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="477" width="870" height="24" fill="#EAFAF1"/>
  <text x="200" y="493" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Find Middle + Reverse + Merge</text>
  <text x="500" y="493" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n) + O(n) + O(n) = O(n)</text>
  <text x="750" y="493" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
  <line x1="15" y1="501" x2="885" y2="501" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="501" width="870" height="24" fill="#EAFAF1"/>
  <text x="200" y="517" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Overall (3-step optimal) ⭐</text>
  <text x="500" y="517" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
  <text x="750" y="517" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
  <line x1="370" y1="452" x2="370" y2="525" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="452" x2="620" y2="525" stroke="#DEE2E6" stroke-width="1"/>
</svg>
