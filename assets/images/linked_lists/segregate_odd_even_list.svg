<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes step1 { 0%,8%,100%{fill:#EAFAF1;stroke:#27AE60} 15%,35%{fill:#D5F5E3;stroke:#1E8449} 40%,100%{fill:#EAFAF1;stroke:#27AE60} }
  @keyframes step2 { 0%,45%,55%,100%{fill:#EAFAF1;stroke:#27AE60} 60%,80%{fill:#D5F5E3;stroke:#1E8449} 85%,100%{fill:#EAFAF1;stroke:#27AE60} }
  @keyframes step3 { 0%,85%,95%,100%{fill:#EAFAF1;stroke:#27AE60} 98%,100%{fill:#D5F5E3;stroke:#1E8449} }
  .s1{animation:step1 8s ease-in-out infinite}
  .s2{animation:step2 8s ease-in-out infinite}
  .s3{animation:step3 8s ease-in-out infinite}
</style>
  <rect width="900" height="500" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="17" font-weight="bold" fill="white">Segregate Even and Odd Valued Nodes in a Linked List</text>
  <rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
  <text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">17→15→8→12→10→5→4</text>
  <text x="340" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">→  8→12→10→4→17→15→5</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Group by VALUE (even/odd), preserve original relative order within each group.</text>

  <!-- Single Optimal Approach -->
  <rect x="15" y="115" width="870" height="265" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="15" y="115" width="870" height="40" fill="#27AE60" rx="7"/>
  <rect x="15" y="140" width="870" height="15" fill="#27AE60"/>
  <text x="450" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Optimal: Two Dummy Nodes Approach ⭐</text>
  <text x="450" y="153" font-family="Arial" font-size="11" fill="#D5F5E3" text-anchor="middle">O(n) time | O(1) space — single pass, in-place, preserves relative order</text>

  <!-- Two column layout -->
  <!-- Left: Algorithm steps -->
  <text x="30" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Step 1: Initialize two dummy heads:</text>
  <rect class="s1" x="30" y="184" width="400" height="28" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="230" y="200" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">evenDummy→null, evenTail=evenDummy</text>
  <text x="230" y="212" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">oddDummy→null,  oddTail=oddDummy</text>

  <text x="30" y="232" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Step 2: Traverse, route each node by value:</text>
  <rect class="s2" x="30" y="238" width="400" height="60" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="230" y="254" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">curr=17 (odd) → oddTail.next=17; oddTail=17</text>
  <text x="230" y="269" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">curr=15 (odd) → oddTail.next=15; oddTail=15</text>
  <text x="230" y="284" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">curr=8  (even)→ evenTail.next=8;  evenTail=8</text>
  <text x="230" y="299" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">curr=12 (even)→ evenTail.next=12; evenTail=12 ...</text>

  <text x="30" y="318" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Step 3: Connect even list to odd list:</text>
  <rect class="s3" x="30" y="324" width="400" height="28" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="230" y="340" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">oddTail.next = null  (terminate odd list)</text>
  <text x="230" y="352" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">evenTail.next = oddDummy.next → Result: 8→12→10→4→17→15→5 ✓</text>

  <!-- Right: Visual trace -->
  <line x1="450" y1="165" x2="450" y2="370" stroke="#DEE2E6" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="465" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Final state of both lists before connect:</text>
  <rect x="465" y="184" width="420" height="72" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="675" y="200" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Even list: evenDummy→8→12→10→4</text>
  <text x="675" y="215" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Odd  list: oddDummy→17→15→5</text>
  <text x="675" y="235" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">After connect: 8→12→10→4→17→15→5 ✓</text>

  <text x="465" y="278" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Key code pattern:</text>
  <rect x="465" y="284" width="420" height="68" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="675" y="300" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">if (curr.val % 2 == 0) { evenTail.next = curr;}</text>
  <text x="675" y="315" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">else                 { oddTail.next = curr; }</text>
  <text x="675" y="330" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">tail = tail.next; curr = curr.next;</text>
  <text x="675" y="348" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">No new nodes created — O(1) space ✓</text>

  <!-- Complexity Table -->
  <rect x="15" y="392" width="870" height="98" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="392" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="407" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="412" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Analysis</text>
  <line x1="15" y1="422" x2="885" y2="422" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="422" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="439" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Step</text>
  <text x="500" y="439" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
  <text x="750" y="439" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
  <line x1="15" y1="447" x2="885" y2="447" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="447" width="870" height="24" fill="#EAFAF1"/>
  <text x="200" y="463" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Two Dummy Nodes (Traverse + Rearrange) ⭐</text>
  <text x="500" y="463" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
  <text x="750" y="463" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
  <line x1="15" y1="471" x2="885" y2="471" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="471" width="870" height="18" fill="#F8F9FA"/>
  <text x="450" y="484" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">Note: Segregates by VALUE. See "Segregate Odd/Even Position" for positional segregation.</text>
  <line x1="370" y1="422" x2="370" y2="489" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="422" x2="620" y2="489" stroke="#DEE2E6" stroke-width="1"/>
</svg>
