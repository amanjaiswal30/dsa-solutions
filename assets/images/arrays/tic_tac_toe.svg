<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Hardcoded - row/col/diag checks highlight */
@keyframes chk0{0%,12%{fill:#FDEBD0;stroke:#E67E22;stroke-width:2.5}13%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
@keyframes chk1{0%,12%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}13%,26%{fill:#FDEBD0;stroke:#E67E22;stroke-width:2.5}27%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
@keyframes chk2{0%,26%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}27%,42%{fill:#FDEBD0;stroke:#E67E22;stroke-width:2.5}43%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
@keyframes diag_hl{0%,55%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}56%,75%{fill:#D5F5E3;stroke:#27AE60;stroke-width:3}76%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
.chk0{animation:chk0 8s ease-in-out infinite}.chk1{animation:chk1 8s ease-in-out infinite}
.chk2{animation:chk2 8s ease-in-out infinite}
.diagf{animation:diag_hl 8s ease-in-out infinite}
@keyframes ll0{0%,12%{opacity:1}13%,100%{opacity:0}}
@keyframes ll1{0%,13%{opacity:0}14%,27%{opacity:1}28%,100%{opacity:0}}
@keyframes ll2{0%,27%{opacity:0}28%,43%{opacity:1}44%,100%{opacity:0}}
@keyframes ll3{0%,43%{opacity:0}44%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes ll4{0%,56%{opacity:0}57%,75%{opacity:1}76%,100%{opacity:0}}
@keyframes ll5{0%,76%{opacity:0}77%,88%{opacity:1}89%,100%{opacity:0}}
.ll0{animation:ll0 8s ease-in-out infinite}.ll1{animation:ll1 8s ease-in-out infinite}
.ll2{animation:ll2 8s ease-in-out infinite}.ll3{animation:ll3 8s ease-in-out infinite}
.ll4{animation:ll4 8s ease-in-out infinite}.ll5{animation:ll5 8s ease-in-out infinite}
/* Approach 2: Count arrays */
@keyframes cnt_upd{0%,15%{opacity:0}16%,85%{opacity:1}86%,100%{opacity:0}}
.cnt{animation:cnt_upd 8s ease-in-out infinite}
@keyframes gl0{0%,15%{opacity:1}16%,100%{opacity:0}}
@keyframes gl1{0%,15%{opacity:0}16%,38%{opacity:1}39%,100%{opacity:0}}
@keyframes gl2{0%,38%{opacity:0}39%,62%{opacity:1}63%,100%{opacity:0}}
@keyframes gl3{0%,62%{opacity:0}63%,78%{opacity:1}79%,100%{opacity:0}}
@keyframes gl4{0%,78%{opacity:0}79%,90%{opacity:1}91%,100%{opacity:0}}
.gl0{animation:gl0 8s ease-in-out infinite}.gl1{animation:gl1 8s ease-in-out infinite}
.gl2{animation:gl2 8s ease-in-out infinite}.gl3{animation:gl3 8s ease-in-out infinite}
.gl4{animation:gl4 8s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Tic-Tac-Toe — Check Win Condition</text>
<rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
<text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">board=[[X,X,X],[O,O,_],[_,_,O]], player=X → X wins (row 0)!</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">After each move, check if current player wins. Generic N×N: use count arrays, detect N-in-a-row.</text>

<!-- APPROACH 1: Hardcoded 3×3 Check -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Hardcoded 3×3 — O(1) per check, O(n²) board</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Explicitly check all 3 rows, 3 columns, 2 diagonals with 8 hardcoded conditions.</text>
<!-- Tic-tac-toe board: cells 44×44, gap=4, pitch=48. start_x=268, start_y=170 -->
<!-- Row 0: [X,X,X]  Row 1: [O,O,_]  Row 2: [_,_,O] -->
<rect x="268" y="170" width="44" height="44" class="chk0" rx="3"/><text x="290" y="198" font-family="Arial" font-size="18" font-weight="bold" fill="#E74C3C" text-anchor="middle">X</text>
<rect x="316" y="170" width="44" height="44" class="chk0" rx="3"/><text x="338" y="198" font-family="Arial" font-size="18" font-weight="bold" fill="#E74C3C" text-anchor="middle">X</text>
<rect x="364" y="170" width="44" height="44" class="chk0" rx="3"/><text x="386" y="198" font-family="Arial" font-size="18" font-weight="bold" fill="#E74C3C" text-anchor="middle">X</text>
<rect x="268" y="218" width="44" height="44" class="chk1" rx="3"/><text x="290" y="246" font-family="Arial" font-size="18" font-weight="bold" fill="#3498DB" text-anchor="middle">O</text>
<rect x="316" y="218" width="44" height="44" class="chk1" rx="3"/><text x="338" y="246" font-family="Arial" font-size="18" font-weight="bold" fill="#3498DB" text-anchor="middle">O</text>
<rect x="364" y="218" width="44" height="44" fill="#F2F3F4" stroke="#BDC3C7" stroke-width="1" rx="3"/><text x="386" y="246" font-family="Arial" font-size="12" fill="#CCC" text-anchor="middle">_</text>
<rect x="268" y="266" width="44" height="44" fill="#F2F3F4" stroke="#BDC3C7" stroke-width="1" rx="3"/><text x="290" y="294" font-family="Arial" font-size="12" fill="#CCC" text-anchor="middle">_</text>
<rect x="316" y="266" width="44" height="44" fill="#F2F3F4" stroke="#BDC3C7" stroke-width="1" rx="3"/><text x="338" y="294" font-family="Arial" font-size="12" fill="#CCC" text-anchor="middle">_</text>
<rect x="364" y="266" width="44" height="44" class="chk2" rx="3"/><text x="386" y="294" font-family="Arial" font-size="18" font-weight="bold" fill="#3498DB" text-anchor="middle">O</text>
<!-- Check labels -->
<text class="ll0" x="580" y="198" font-family="Arial" font-size="11" fill="#555">Checking row 0: board[0][0..2]</text>
<text class="ll1" x="580" y="198" font-family="Arial" font-size="11" fill="#555">Row 0: X,X,X → all same? ✓</text>
<text class="ll2" x="580" y="198" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Row 0 = all X → X WINS! ✓</text>
<text class="ll3" x="580" y="198" font-family="Arial" font-size="11" fill="#888">(Would also check rows 1,2)</text>
<text class="ll4" x="580" y="198" font-family="Arial" font-size="11" fill="#888">(Would also check 3 cols)</text>
<text class="ll5" x="580" y="198" font-family="Arial" font-size="11" fill="#888">(Would also check 2 diags)</text>
<text x="450" y="298" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">8 checks total: 3 rows + 3 cols + 2 diagonals. Fast but only works for 3×3!</text>
<text x="450" y="315" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Hardcoded: board[0][0]==board[0][1]==board[0][2] etc. O(1) per check.</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="200" y="329" width="500" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 For N×N: maintain row/col/diag count arrays → O(1) per move check</text>

<!-- APPROACH 2: Generic N×N with Count Arrays -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Generic N×N Count Arrays — O(1) per move, O(n) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">row[n], col[n], diag, anti_diag counters (+1 for X, -1 for O). Win when |count|==N.</text>
<!-- Same board -->
<rect x="268" y="425" width="44" height="44" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="290" y="453" font-family="Arial" font-size="18" font-weight="bold" fill="#E74C3C" text-anchor="middle">X</text>
<rect x="316" y="425" width="44" height="44" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="338" y="453" font-family="Arial" font-size="18" font-weight="bold" fill="#E74C3C" text-anchor="middle">X</text>
<rect x="364" y="425" width="44" height="44" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="386" y="453" font-family="Arial" font-size="18" font-weight="bold" fill="#E74C3C" text-anchor="middle">X</text>
<rect x="268" y="473" width="44" height="44" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="290" y="501" font-family="Arial" font-size="18" font-weight="bold" fill="#3498DB" text-anchor="middle">O</text>
<rect x="316" y="473" width="44" height="44" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="338" y="501" font-family="Arial" font-size="18" font-weight="bold" fill="#3498DB" text-anchor="middle">O</text>
<rect x="364" y="473" width="44" height="44" fill="#F2F3F4" stroke="#BDC3C7" stroke-width="1" rx="3"/><text x="386" y="501" font-family="Arial" font-size="12" fill="#CCC" text-anchor="middle">_</text>
<rect x="268" y="521" width="44" height="44" fill="#F2F3F4" stroke="#BDC3C7" stroke-width="1" rx="3"/><text x="290" y="549" font-family="Arial" font-size="12" fill="#CCC" text-anchor="middle">_</text>
<rect x="316" y="521" width="44" height="44" fill="#F2F3F4" stroke="#BDC3C7" stroke-width="1" rx="3"/><text x="338" y="549" font-family="Arial" font-size="12" fill="#CCC" text-anchor="middle">_</text>
<rect x="364" y="521" width="44" height="44" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="386" y="549" font-family="Arial" font-size="18" font-weight="bold" fill="#3498DB" text-anchor="middle">O</text>
<!-- Count arrays display -->
<g class="cnt">
<rect x="450" y="425" width="400" height="130" fill="#F8F9FA" stroke="#DEE2E6" rx="5"/>
<text x="650" y="447" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Count Arrays (X=+1, O=-1, win=±N=±3)</text>
<text x="460" y="468" font-family="Arial" font-size="11" fill="#555">row[0]=1+1+1=3 → |3|==N=3 → X WINS! ✓</text>
<text x="460" y="486" font-family="Arial" font-size="11" fill="#555">row[1]=(-1)+(-1)+0=-2</text>
<text x="460" y="504" font-family="Arial" font-size="11" fill="#555">col[0]=1+(-1)+0=0, col[1]=1+(-1)+0=0</text>
<text x="460" y="522" font-family="Arial" font-size="11" fill="#555">col[2]=1+0+(-1)=0</text>
<text x="460" y="540" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">diag=1+(-1)+(-1)=-1, anti_diag=1+(-1)+0=0</text>
</g>
<!-- Step labels -->
<text class="gl0" x="450" y="428" font-family="Arial" font-size="11" fill="#555">After each move(row,col,player):</text>
<text class="gl1" x="450" y="428" font-family="Arial" font-size="11" fill="#555">val = (player=='X') ? +1 : -1</text>
<text class="gl2" x="450" y="428" font-family="Arial" font-size="11" fill="#555">rows[row]+=val, cols[col]+=val</text>
<text class="gl3" x="450" y="428" font-family="Arial" font-size="11" fill="#555">if(row==col) diag+=val</text>
<text class="gl4" x="450" y="428" font-family="Arial" font-size="11" fill="#27AE60">if |count|==N → return winner ✓</text>
<text x="450" y="557" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Check after each move instead of scanning entire board. Works for N×N board!</text>
<text x="450" y="572" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Total space: O(n) for arrays. Constant-time check per move. Scalable!</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time per move</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Hardcoded 3×3 (8 checks)</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1) — but only 3×3!</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n²)</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Count Arrays (Generic N×N) ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1) — works any N!</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
