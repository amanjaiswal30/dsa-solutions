<svg width="900" height="900" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: HashSet scan */
@keyframes hs_scan{0%,5%{transform:translateX(0)}18%,22%{transform:translateX(48px)}34%,38%{transform:translateX(96px)}50%,54%{transform:translateX(144px)}66%,70%{transform:translateX(192px)}85%,100%{transform:translateX(0)}}
.hs{animation:hs_scan 7s ease-in-out infinite}
@keyframes hsl0{0%,5%{opacity:1}18%,100%{opacity:0}}
@keyframes hsl1{0%,17%{opacity:0}18%,34%{opacity:1}35%,100%{opacity:0}}
@keyframes hsl2{0%,33%{opacity:0}34%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes hsl3{0%,49%{opacity:0}50%,66%{opacity:1}67%,100%{opacity:0}}
@keyframes hsl4{0%,65%{opacity:0}66%,85%{opacity:1}86%,100%{opacity:0}}
.hsl0{animation:hsl0 7s ease-in-out infinite}
.hsl1{animation:hsl1 7s ease-in-out infinite}
.hsl2{animation:hsl2 7s ease-in-out infinite}
.hsl3{animation:hsl3 7s ease-in-out infinite}
.hsl4{animation:hsl4 7s ease-in-out infinite}
@keyframes dup_hl{0%,66%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}67%,85%{fill:#FDF2F8;stroke:#E74C3C;stroke-width:3}86%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
.dhl{animation:dup_hl 7s ease-in-out infinite}
/* Approach 2: Sort */
@keyframes sort_ptr{0%,8%{transform:translateX(0)}25%,33%{transform:translateX(48px)}50%,58%{transform:translateX(96px)}75%,83%{transform:translateX(144px)}95%,100%{transform:translateX(0)}}
.sp2{animation:sort_ptr 6s ease-in-out infinite}
/* Approach 3: Floyd's - slow/fast pointers */
@keyframes slow_ptr{0%,8%{transform:translateX(48px)}20%,25%{transform:translateX(144px)}37%,42%{transform:translateX(192px)}54%,59%{transform:translateX(96px)}71%,76%{transform:translateX(144px)}88%,100%{transform:translateX(48px)}}
.slw{animation:slow_ptr 7s ease-in-out infinite}
@keyframes fast_ptr{0%,8%{transform:translateX(144px)}20%,25%{transform:translateX(96px)}37%,42%{transform:translateX(144px)}54%,59%{transform:translateX(144px)}71%,76%{transform:translateX(144px)}88%,100%{transform:translateX(144px)}}
.fst{animation:fast_ptr 7s ease-in-out infinite}
@keyframes fl0{0%,8%{opacity:1}20%,100%{opacity:0}}
@keyframes fl1{0%,19%{opacity:0}20%,37%{opacity:1}38%,100%{opacity:0}}
@keyframes fl2{0%,36%{opacity:0}37%,54%{opacity:1}55%,100%{opacity:0}}
@keyframes fl3{0%,53%{opacity:0}54%,71%{opacity:1}72%,100%{opacity:0}}
@keyframes fl4{0%,70%{opacity:0}71%,88%{opacity:1}89%,100%{opacity:0}}
.fl0{animation:fl0 7s ease-in-out infinite}
.fl1{animation:fl1 7s ease-in-out infinite}
.fl2{animation:fl2 7s ease-in-out infinite}
.fl3{animation:fl3 7s ease-in-out infinite}
.fl4{animation:fl4 7s ease-in-out infinite}
</style>
<rect width="900" height="900" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Find the Duplicate Number</text>
<rect x="820" y="12" width="62" height="28" fill="#F39C12" rx="14"/>
<text x="851" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">arr=[1,3,4,2,2], n=5 → duplicate = 2</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Array of n+1 integers in [1..n]. Exactly one duplicate. Floyd's cycle detection: O(n) time, O(1) space.</text>

<!-- APPROACH 1: HashSet -->
<rect x="15" y="115" width="870" height="185" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: HashSet — O(n) time, O(n) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Add each element to set. If already present, it's the duplicate!</text>
<!-- Array [1,3,4,2,2], 5 elements, start_x=333 -->
<rect x="333" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="381" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="429" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="477" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="498" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="525" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="dhl"/>
<text x="546" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<g class="hs" transform="translate(354,178)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#E74C3C"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">i</text>
</g>
<!-- HashSet labels -->
<text class="hsl0" x="665" y="199" font-family="Arial" font-size="11" fill="#555">set={1}</text>
<text class="hsl1" x="665" y="199" font-family="Arial" font-size="11" fill="#555">set={1,3}</text>
<text class="hsl2" x="665" y="199" font-family="Arial" font-size="11" fill="#555">set={1,3,4}</text>
<text class="hsl3" x="665" y="199" font-family="Arial" font-size="11" fill="#555">set={1,3,4,2}</text>
<text class="hsl4" x="665" y="199" font-family="Arial" font-size="11" fill="#E74C3C" font-weight="bold">2 in set! dup=2 ✓</text>
<text x="450" y="248" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">When 2 seen again at index 4: already in set → duplicate = 2 ✓</text>
<text x="450" y="265" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">O(n) extra space. Can we do O(1) space? Sort approach or in-place sign marking.</text>
<text x="450" y="282" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Floyd's cycle detection treats array as linked list: arr[i] → arr[arr[i]] etc.</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="300" x2="450" y2="337" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,337 450,345 456,337" fill="#7F8C8D"/>
<rect x="270" y="304" width="360" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="319" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Sort + adjacent check reduces space to O(1)*</text>

<!-- APPROACH 2: Sort -->
<rect x="15" y="345" width="870" height="185" fill="#FFFFFF" stroke="#F39C12" stroke-width="2" rx="7"/>
<rect x="15" y="345" width="870" height="40" fill="#F39C12" rx="7"/>
<rect x="15" y="370" width="870" height="15" fill="#F39C12"/>
<text x="450" y="370" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Sort — O(n log n) time, O(1) space</text>
<text x="450" y="383" font-family="Arial" font-size="10" fill="#FEF9E7" text-anchor="middle">Sort array → scan adjacent elements → first pair with arr[i]==arr[i+1] is duplicate</text>
<!-- Sorted [1,2,2,3,4] -->
<text x="220" y="430" font-family="Arial" font-size="11" fill="#555">Sorted:</text>
<rect x="333" y="408" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="434" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="381" y="408" width="42" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="3" rx="3"/>
<text x="402" y="434" font-family="Arial" font-size="14" font-weight="bold" fill="#E74C3C" text-anchor="middle">2</text>
<rect x="429" y="408" width="42" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="3" rx="3"/>
<text x="450" y="434" font-family="Arial" font-size="14" font-weight="bold" fill="#E74C3C" text-anchor="middle">2</text>
<rect x="477" y="408" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="498" y="434" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="525" y="408" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="546" y="434" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<g class="sp2" transform="translate(354,408)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#F39C12"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#F39C12" text-anchor="middle">ptr</text>
</g>
<text x="450" y="468" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">arr[1]==arr[2]==2 → duplicate = 2 ✓</text>
<text x="450" y="485" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Sorts in O(n log n). Modifies array (constraint: must not modify in O(n) time O(1) space version).</text>
<text x="450" y="502" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Floyd's cycle: treats as implicit linked list → O(n) time, O(1) space, no modification!</text>

<!-- Arrow 2→3 -->
<line x1="450" y1="530" x2="450" y2="567" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,567 450,575 456,567" fill="#7F8C8D"/>
<rect x="240" y="534" width="420" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="549" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Floyd's cycle: arr[i] is "next pointer" → duplicate = cycle start!</text>

<!-- APPROACH 3: Floyd's Cycle Detection -->
<rect x="15" y="575" width="870" height="185" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="575" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="600" width="870" height="15" fill="#27AE60"/>
<text x="450" y="600" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 3: Floyd's Cycle Detection — O(n) time, O(1) space ⭐</text>
<text x="450" y="613" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Phase 1: slow=arr[slow], fast=arr[arr[fast]] until meet. Phase 2: slow2=0, move both by 1 until meet.</text>
<!-- Array [1,3,4,2,2] again -->
<rect x="333" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="381" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="429" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="477" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="dhl"/>
<text x="498" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="525" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="dhl"/>
<text x="546" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<!-- Index labels -->
<text x="354" y="683" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[0]=1</text>
<text x="402" y="683" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[1]=3</text>
<text x="450" y="683" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[2]=4</text>
<text x="498" y="683" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">[3]=2!</text>
<text x="546" y="683" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">[4]=2!</text>
<!-- Slow/fast pointers -->
<g class="slw" transform="translate(333,628)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#3498DB"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">slow</text>
</g>
<g class="fst" transform="translate(333,628)">
  <polygon points="-7,55 7,55 0,46" fill="#9B59B6"/>
  <text x="0" y="70" font-family="Arial" font-size="9" fill="#9B59B6" text-anchor="middle">fast</text>
</g>
<!-- Floyd's step labels -->
<text class="fl0" x="650" y="648" font-family="Arial" font-size="10" fill="#555">slow=arr[0]=1, fast=arr[arr[0]]=arr[1]=3</text>
<text class="fl1" x="650" y="648" font-family="Arial" font-size="10" fill="#555">slow=arr[1]=3, fast=arr[arr[3]]=arr[2]=4</text>
<text class="fl2" x="650" y="648" font-family="Arial" font-size="10" fill="#555">slow=arr[3]=2, fast=arr[arr[4]]=arr[2]=4</text>
<text class="fl3" x="650" y="648" font-family="Arial" font-size="10" fill="#555">slow=arr[2]=4 meets fast! Phase 2→</text>
<text class="fl4" x="650" y="648" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">slow2=0,slow meet at 2 → dup=2 ✓</text>

<!-- Complexity Table -->
<rect x="15" y="772" width="870" height="123" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="772" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="787" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="792" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="802" x2="885" y2="802" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="802" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="818" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="818" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="818" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="825" x2="885" y2="825" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="825" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="840" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">HashSet</text>
<text x="500" y="840" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
<text x="750" y="840" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n)</text>
<line x1="15" y1="847" x2="885" y2="847" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="847" width="870" height="22" fill="#FEF9E7"/>
<text x="200" y="862" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Sort + Adjacent Check</text>
<text x="500" y="862" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n log n)</text>
<text x="750" y="862" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)*</text>
<line x1="15" y1="869" x2="885" y2="869" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="869" width="870" height="26" fill="#EAFAF1"/>
<text x="200" y="886" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Floyd's Cycle ⭐</text>
<text x="500" y="886" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<text x="750" y="886" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
<line x1="370" y1="802" x2="370" y2="895" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="802" x2="620" y2="895" stroke="#DEE2E6" stroke-width="1"/>
</svg>
