<svg width="900" height="520" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes pulse_nonzero {
    0%,45%{opacity:1}
    50%,55%{opacity:0.35}
    100%{opacity:1}
  }
  .nz{animation:pulse_nonzero 5s ease-in-out infinite}
  @keyframes gather {
    0%,15%{transform:translateX(0)}
    35%,50%{transform:translateX(-52px)}
    70%,100%{transform:translateX(0)}
  }
  .gz{animation:gather 5s ease-in-out infinite}
  .cell{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}
  .zero{fill:#FDEBD0;stroke:#E67E22;stroke-width:2}
  .done{fill:#D5F5E3;stroke:#27AE60;stroke-width:2}
</style>
<rect width="900" height="520" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="white">Shift All Zeros to the End</text>
<rect x="780" y="12" width="98" height="28" fill="#27AE60" rx="14"/>
<text x="829" y="30" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Easy</text>

<rect x="15" y="68" width="870" height="72" fill="white" stroke="#DEE2E6" rx="6"/>
<text x="28" y="92" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2C3E50">Problem</text>
<text x="28" y="112" font-family="Arial,sans-serif" font-size="12" fill="#555">Move every 0 to the right side of the array while keeping the relative order of non-zero elements. Do it in-place.</text>
<text x="28" y="130" font-family="Arial,sans-serif" font-size="11" fill="#777">Example: [0,1,0,3,12] ’ [1,3,12,0,0]</text>

<text x="28" y="168" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2C3E50">Before</text>
<g transform="translate(28,178)" class="gz">
  <rect class="zero" x="0" y="0" width="44" height="44" rx="4"/><text x="22" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2C3E50" text-anchor="middle">0</text>
  <rect class="cell nz" x="52" y="0" width="44" height="44" rx="4"/><text x="74" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2C3E50" text-anchor="middle">1</text>
  <rect class="zero" x="104" y="0" width="44" height="44" rx="4"/><text x="126" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2C3E50" text-anchor="middle">0</text>
  <rect class="cell nz" x="156" y="0" width="44" height="44" rx="4"/><text x="178" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2C3E50" text-anchor="middle">3</text>
  <rect class="cell nz" x="208" y="0" width="44" height="44" rx="4"/><text x="230" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2C3E50" text-anchor="middle">12</text>
</g>

<text x="28" y="268" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2C3E50">After (stable partition)</text>
<g transform="translate(28,278)">
  <rect class="done" x="0" y="0" width="44" height="44" rx="4"/><text x="22" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2C3E50" text-anchor="middle">1</text>
  <rect class="done" x="52" y="0" width="44" height="44" rx="4"/><text x="74" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2C3E50" text-anchor="middle">3</text>
  <rect class="done" x="104" y="0" width="44" height="44" rx="4"/><text x="126" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2C3E50" text-anchor="middle">12</text>
  <rect class="zero" x="156" y="0" width="44" height="44" rx="4"/><text x="178" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2C3E50" text-anchor="middle">0</text>
  <rect class="zero" x="208" y="0" width="44" height="44" rx="4"/><text x="230" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2C3E50" text-anchor="middle">0</text>
</g>

<rect x="15" y="355" width="870" height="150" fill="white" stroke="#27AE60" stroke-width="2" rx="8"/>
<text x="30" y="385" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#27AE60">Optimal idea  one pass</text>
<text x="38" y="412" font-family="Arial,sans-serif" font-size="12" fill="#444">" Keep pointer <tspan font-weight="bold">k</tspan> = next index to place a non-zero.</text>
<text x="38" y="432" font-family="Arial,sans-serif" font-size="12" fill="#444">" Scan <tspan font-weight="bold">i</tspan> from left to right; when nums[i] ` 0, swap nums[k] and nums[i], then k++.</text>
<text x="38" y="452" font-family="Arial,sans-serif" font-size="12" fill="#444">" Or: copy non-zeros to the front, then fill the tail with zeros  same complexity, often clearer.</text>
<text x="38" y="478" font-family="Arial,sans-serif" font-size="12" fill="#27AE60" font-weight="bold">Time O(n) · Space O(1)</text>
</svg>
