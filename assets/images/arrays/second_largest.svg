<svg width="900" height="900" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes s1_ptr{0%,10%{transform:translateX(0)}30%,45%{transform:translateX(48px)}80%,100%{transform:translateX(0)}}
.s1p{animation:s1_ptr 4s ease-in-out infinite}
@keyframes s1_found{0%,45%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}46%,80%{fill:#D5F5E3;stroke:#27AE60;stroke-width:3}81%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
.s1f{animation:s1_found 4s ease-in-out infinite}
@keyframes p1_ptr{0%,5%{transform:translateX(0)}15%,18%{transform:translateX(48px)}25%,28%{transform:translateX(96px)}35%,38%{transform:translateX(144px)}45%,48%{transform:translateX(192px)}55%,100%{transform:translateX(0)}}
.p1p{animation:p1_ptr 6s ease-in-out infinite}
@keyframes p1_lbl{0%,50%{opacity:0}55%,88%{opacity:1}92%,100%{opacity:0}}
.p1l{animation:p1_lbl 6s ease-in-out infinite}
@keyframes p2_ptr{0%,53%{transform:translateX(0)}63%,66%{transform:translateX(48px)}73%,76%{transform:translateX(96px)}83%,86%{transform:translateX(144px)}93%,96%{transform:translateX(192px)}100%{transform:translateX(0)}}
.p2p{animation:p2_ptr 6s ease-in-out infinite}
@keyframes sp_ptr{0%,5%{transform:translateX(0)}18%,22%{transform:translateX(48px)}34%,38%{transform:translateX(96px)}50%,54%{transform:translateX(144px)}66%,70%{transform:translateX(192px)}85%,100%{transform:translateX(0)}}
.spp{animation:sp_ptr 7s ease-in-out infinite}
@keyframes sl0{0%,5%{opacity:1}18%,100%{opacity:0}}
@keyframes sl1{0%,17%{opacity:0}18%,34%{opacity:1}35%,100%{opacity:0}}
@keyframes sl2{0%,33%{opacity:0}34%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes sl3{0%,49%{opacity:0}50%,66%{opacity:1}67%,100%{opacity:0}}
@keyframes sl4{0%,65%{opacity:0}66%,85%{opacity:1}86%,100%{opacity:0}}
.sl0{animation:sl0 7s ease-in-out infinite}
.sl1{animation:sl1 7s ease-in-out infinite}
.sl2{animation:sl2 7s ease-in-out infinite}
.sl3{animation:sl3 7s ease-in-out infinite}
.sl4{animation:sl4 7s ease-in-out infinite}
</style>
<rect width="900" height="900" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Second Largest Element in Array</text>
<rect x="820" y="12" width="62" height="28" fill="#27AE60" rx="14"/>
<text x="851" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Easy</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">arr=[3,1,4,5,9] → Second Largest = 5</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Find the second largest distinct element. Must not equal the maximum value.</text>

<!-- APPROACH 1: Sort -->
<rect x="15" y="115" width="870" height="185" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Sort — O(n log n) time, O(1) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Sort descending → scan until element ≠ max found</text>
<text x="160" y="200" font-family="Arial" font-size="11" fill="#555">Sorted ↓:</text>
<!-- Sorted [9,5,4,3,1], start_x=333 -->
<rect x="333" y="178" width="42" height="42" fill="#FDEBD0" stroke="#E67E22" stroke-width="3" rx="3"/>
<text x="354" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9</text>
<rect x="381" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="s1f"/>
<text x="402" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="429" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="477" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="498" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="525" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="546" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<g class="s1p" transform="translate(354,178)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#E74C3C"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">ptr</text>
</g>
<text x="354" y="232" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[0] max</text>
<text x="402" y="232" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">[1]≠max!</text>
<text x="450" y="250" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">ptr[0]=9 (is max), ptr[1]=5 (5≠9) → second largest = 5 ✓</text>
<text x="450" y="267" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Skip while arr[i]==arr[0] (handles duplicates). Return -1 if all same.</text>
<text x="450" y="284" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Drawback: sorting is O(n log n) — can we do it faster?</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="300" x2="450" y2="337" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,337 450,345 456,337" fill="#7F8C8D"/>
<rect x="310" y="304" width="280" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="319" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Linear scan avoids sorting entirely!</text>

<!-- APPROACH 2: Two-pass -->
<rect x="15" y="345" width="870" height="185" fill="#FFFFFF" stroke="#F39C12" stroke-width="2" rx="7"/>
<rect x="15" y="345" width="870" height="40" fill="#F39C12" rx="7"/>
<rect x="15" y="370" width="870" height="15" fill="#F39C12"/>
<text x="450" y="370" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Two-pass — O(n) time, O(1) space</text>
<text x="450" y="383" font-family="Arial" font-size="10" fill="#FEF9E7" text-anchor="middle">Pass 1: find max. Pass 2: find largest element &lt; max</text>
<!-- Array [3,1,4,5,9] -->
<rect x="333" y="403" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="429" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="381" y="403" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="429" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="429" y="403" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="429" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="477" y="403" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="498" y="429" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="525" y="403" width="42" height="42" fill="#FDEBD0" stroke="#E67E22" stroke-width="3" rx="3"/>
<text x="546" y="429" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9</text>
<!-- Pass 1 pointer (orange, sweeps right) -->
<g class="p1p" transform="translate(354,403)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#F39C12"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#F39C12" text-anchor="middle">pass1</text>
</g>
<!-- Max label appears after pass 1 -->
<text class="p1l" x="680" y="429" font-family="Arial" font-size="12" font-weight="bold" fill="#E74C3C">max=9</text>
<!-- Pass 2 pointer (green, below boxes) -->
<g class="p2p" transform="translate(354,403)">
  <polygon points="-7,55 7,55 0,46" fill="#27AE60"/>
  <text x="0" y="70" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">pass2</text>
</g>
<text x="450" y="492" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Pass 1 finds max=9. Pass 2 finds largest value &lt; 9 → 5 ✓</text>
<text x="450" y="509" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Two O(n) scans = O(2n) = O(n). Simple and correct.</text>
<text x="450" y="526" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Can we combine both passes into one? Yes — track both simultaneously!</text>

<!-- Arrow 2→3 -->
<line x1="450" y1="530" x2="450" y2="567" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,567 450,575 456,567" fill="#7F8C8D"/>
<rect x="290" y="534" width="320" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="549" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Track max and secondMax simultaneously!</text>

<!-- APPROACH 3: Single-pass -->
<rect x="15" y="575" width="870" height="185" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="575" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="600" width="870" height="15" fill="#27AE60"/>
<text x="450" y="600" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 3: Single-pass — O(n) time, O(1) space ⭐</text>
<text x="450" y="613" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Track max and secondMax in one sweep — optimal!</text>
<!-- Array [3,1,4,5,9] -->
<rect x="333" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="381" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="429" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="477" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="498" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="525" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="546" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9</text>
<g class="spp" transform="translate(354,628)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#27AE60"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">i</text>
</g>
<!-- Step-by-step state labels -->
<text class="sl0" x="672" y="650" font-family="Arial" font-size="11" fill="#555">max=3, 2nd=-∞</text>
<text class="sl1" x="672" y="650" font-family="Arial" font-size="11" fill="#555">max=3, 2nd=1</text>
<text class="sl2" x="672" y="650" font-family="Arial" font-size="11" fill="#555">max=4, 2nd=3</text>
<text class="sl3" x="672" y="650" font-family="Arial" font-size="11" fill="#555">max=5, 2nd=4</text>
<text class="sl4" x="672" y="650" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">max=9, 2nd=5 ✓</text>
<text x="450" y="690" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">if x&gt;max: secondMax=max; max=x  elif x&gt;secondMax &amp;&amp; x≠max: secondMax=x</text>
<text x="450" y="707" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">One pass, O(1) extra space — optimal! Final: secondMax=5 ✓</text>
<text x="450" y="722" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Init max=secondMax=MIN_VALUE. Return -1 if secondMax is still MIN_VALUE.</text>
<text x="450" y="737" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Handles duplicates correctly: only update 2nd if x ≠ max.</text>

<!-- Complexity Table -->
<rect x="15" y="772" width="870" height="123" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="772" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="787" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="792" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="802" x2="885" y2="802" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="802" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="818" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="818" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="818" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="825" x2="885" y2="825" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="825" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="840" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Sort</text>
<text x="500" y="840" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n log n)</text>
<text x="750" y="840" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)</text>
<line x1="15" y1="847" x2="885" y2="847" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="847" width="870" height="22" fill="#FEF9E7"/>
<text x="200" y="862" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Two-pass</text>
<text x="500" y="862" font-family="Arial" font-size="11" fill="#F39C12" text-anchor="middle">O(n)</text>
<text x="750" y="862" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)</text>
<line x1="15" y1="869" x2="885" y2="869" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="869" width="870" height="26" fill="#EAFAF1"/>
<text x="200" y="886" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Single-pass ⭐</text>
<text x="500" y="886" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<text x="750" y="886" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
<line x1="370" y1="802" x2="370" y2="895" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="802" x2="620" y2="895" stroke="#DEE2E6" stroke-width="1"/>
</svg>
