<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Brute - window rectangle slides, 4 positions */
@keyframes brut_win{0%,12%{transform:translateX(0)}25%,37%{transform:translateX(48px)}50%,62%{transform:translateX(96px)}75%,87%{transform:translateX(144px)}100%{transform:translateX(0)}}
.bw{animation:brut_win 7s ease-in-out infinite}
@keyframes bl0{0%,12%{opacity:1}25%,100%{opacity:0}}
@keyframes bl1{0%,24%{opacity:0}25%,37%{opacity:1}38%,100%{opacity:0}}
@keyframes bl2{0%,49%{opacity:0}50%,62%{opacity:1}63%,100%{opacity:0}}
@keyframes bl3{0%,74%{opacity:0}75%,87%{opacity:1}88%,100%{opacity:0}}
.bl0{animation:bl0 7s ease-in-out infinite}.bl1{animation:bl1 7s ease-in-out infinite}
.bl2{animation:bl2 7s ease-in-out infinite}.bl3{animation:bl3 7s ease-in-out infinite}
@keyframes bmax_show{0%,49%{opacity:0}50%,100%{opacity:1}}
.bmx{animation:bmax_show 7s ease-in-out infinite}
/* Approach 2: Sliding Window */
@keyframes sw_l{0%,10%{transform:translateX(0)}28%,38%{transform:translateX(48px)}55%,65%{transform:translateX(96px)}82%,92%{transform:translateX(144px)}100%{transform:translateX(0)}}
@keyframes sw_r{0%,10%{transform:translateX(96px)}28%,38%{transform:translateX(144px)}55%,65%{transform:translateX(192px)}82%,92%{transform:translateX(240px)}100%{transform:translateX(96px)}}
.sl{animation:sw_l 7s ease-in-out infinite}.sr{animation:sw_r 7s ease-in-out infinite}
@keyframes swl0{0%,10%{opacity:1}28%,100%{opacity:0}}
@keyframes swl1{0%,27%{opacity:0}28%,38%{opacity:1}39%,100%{opacity:0}}
@keyframes swl2{0%,54%{opacity:0}55%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes swl3{0%,81%{opacity:0}82%,92%{opacity:1}93%,100%{opacity:0}}
.swl0{animation:swl0 7s ease-in-out infinite}.swl1{animation:swl1 7s ease-in-out infinite}
.swl2{animation:swl2 7s ease-in-out infinite}.swl3{animation:swl3 7s ease-in-out infinite}
@keyframes swmax{0%,54%{opacity:0}55%,100%{opacity:1}}
.swmx{animation:swmax 7s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Max Sum Subarray of Size K</text>
<rect x="790" y="12" width="92" height="28" fill="#F39C12" rx="14"/>
<text x="836" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Easy/Med</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">arr=[2,1,5,1,3,2], k=3 → max sum = 9 (subarray [5,1,3])</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Find maximum sum subarray of exactly k elements. Sliding window avoids recomputation → O(n).</text>

<!-- APPROACH 1: Brute Force -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Brute Force — O(n·k) time, O(1) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">For each starting index i, sum k elements. Track maximum sum seen.</text>
<!-- 6 boxes: x=309,357,405,453,501,549 -->
<rect x="309" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="330" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="357" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="378" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="405" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="426" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="453" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="474" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="501" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="522" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="549" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="570" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<!-- Sliding window bracket (orange) that moves -->
<g class="bw">
  <rect x="303" y="169" width="156" height="54" fill="none" stroke="#E67E22" stroke-width="3" stroke-dasharray="5,3" rx="4"/>
  <text x="381" y="167" font-family="Arial" font-size="9" fill="#E67E22" text-anchor="middle">window</text>
</g>
<!-- Step labels -->
<text class="bl0" x="450" y="247" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">i=0: sum(arr[0..2]) = 2+1+5 = 8, max=8</text>
<text class="bl1" x="450" y="247" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">i=1: sum(arr[1..3]) = 1+5+1 = 7, max=8</text>
<text class="bl2" x="450" y="247" font-family="Arial" font-size="12" fill="#27AE60" font-weight="bold" text-anchor="middle">i=2: sum(arr[2..4]) = 5+1+3 = 9, max=9 ✓ NEW MAX!</text>
<text class="bl3" x="450" y="247" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">i=3: sum(arr[3..5]) = 1+3+2 = 6, max=9</text>
<text class="bmx" x="450" y="270" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">Max sum = 9 at index 2 ✓</text>
<text x="450" y="294" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Problem: re-sums k elements for every start index → O(n·k). Overlapping work!</text>
<text x="450" y="310" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Insight: consecutive windows share k-1 elements. Just add new, remove old!</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="260" y="329" width="380" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Slide window: sum += arr[right] – arr[left-1] → O(n)</text>

<!-- APPROACH 2: Sliding Window -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Sliding Window — O(n) time, O(1) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Maintain sum of k elements. Slide right: add arr[right], subtract arr[left-1]</text>
<!-- Same 6 boxes -->
<rect x="309" y="425" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="330" y="451" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="357" y="425" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="378" y="451" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="405" y="425" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="426" y="451" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="453" y="425" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="474" y="451" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="501" y="425" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="522" y="451" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="549" y="425" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="570" y="451" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<!-- L pointer (moves right) -->
<g class="sl" transform="translate(309,425)">
  <polygon points="-7,48 7,48 0,58" fill="#27AE60"/>
  <text x="0" y="72" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">L</text>
</g>
<!-- R pointer (moves right, offset +96) -->
<g class="sr" transform="translate(309,425)">
  <polygon points="-7,48 7,48 0,58" fill="#E74C3C"/>
  <text x="0" y="72" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">R</text>
</g>
<!-- Step labels -->
<text class="swl0" x="450" y="510" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">Init: window[0..2], sum=2+1+5=8, maxSum=8</text>
<text class="swl1" x="450" y="510" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">Slide: sum = 8 + arr[3] – arr[0] = 8+1–2 = 7, maxSum=8</text>
<text class="swl2" x="450" y="510" font-family="Arial" font-size="12" fill="#27AE60" font-weight="bold" text-anchor="middle">Slide: sum = 7 + arr[4] – arr[1] = 7+3–1 = 9, maxSum=9 ✓</text>
<text class="swl3" x="450" y="510" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">Slide: sum = 9 + arr[5] – arr[2] = 9+2–5 = 6, maxSum=9</text>
<text class="swmx" x="450" y="533" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">Answer: maxSum = 9 ✓</text>
<text x="450" y="557" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Each element added/removed exactly once → O(n). One pass!</text>
<text x="450" y="573" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Pattern: fixed-size window. Variable-size → use while(sum &gt; target) shrink.</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Brute Force</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n·k)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Sliding Window ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
