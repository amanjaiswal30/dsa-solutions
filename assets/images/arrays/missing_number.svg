<svg width="900" height="900" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Bool array - marking animation */
@keyframes mark0{0%,5%{fill:#EBF5FB;stroke:#3498DB}6%,100%{fill:#FDEBD0;stroke:#E67E22}}
@keyframes mark1{0%,18%{fill:#EBF5FB;stroke:#3498DB}19%,100%{fill:#FDEBD0;stroke:#E67E22}}
@keyframes mark3{0%,32%{fill:#EBF5FB;stroke:#3498DB}33%,100%{fill:#FDEBD0;stroke:#E67E22}}
@keyframes mark4{0%,46%{fill:#EBF5FB;stroke:#3498DB}47%,100%{fill:#FDEBD0;stroke:#E67E22}}
@keyframes unmk2{0%,90%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}91%,100%{fill:#FDF2F8;stroke:#E74C3C;stroke-width:3}}
.bm0{animation:mark0 6s ease-in-out infinite}
.bm1{animation:mark1 6s ease-in-out infinite}
.bm3{animation:mark3 6s ease-in-out infinite}
.bm4{animation:mark4 6s ease-in-out infinite}
.bm2{animation:unmk2 6s ease-in-out infinite}
@keyframes ba_scan{0%,4%{transform:translateX(0)}16%,20%{transform:translateX(48px)}28%,32%{transform:translateX(96px)}44%,48%{transform:translateX(144px)}60%,64%{transform:translateX(192px)}80%,100%{transform:translateX(0)}}
.bas{animation:ba_scan 6s ease-in-out infinite}
/* Approach 2: Sum formula scan */
@keyframes sum_scan{0%,5%{transform:translateX(0)}18%,22%{transform:translateX(48px)}34%,38%{transform:translateX(96px)}50%,54%{transform:translateX(144px)}66%,70%{transform:translateX(192px)}85%,100%{transform:translateX(0)}}
.ss{animation:sum_scan 7s ease-in-out infinite}
@keyframes sum_l0{0%,5%{opacity:1}18%,100%{opacity:0}}
@keyframes sum_l1{0%,17%{opacity:0}18%,34%{opacity:1}35%,100%{opacity:0}}
@keyframes sum_l2{0%,33%{opacity:0}34%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes sum_l3{0%,49%{opacity:0}50%,66%{opacity:1}67%,100%{opacity:0}}
@keyframes sum_l4{0%,65%{opacity:0}66%,85%{opacity:1}86%,100%{opacity:0}}
.sl0{animation:sum_l0 7s ease-in-out infinite}
.sl1{animation:sum_l1 7s ease-in-out infinite}
.sl2{animation:sum_l2 7s ease-in-out infinite}
.sl3{animation:sum_l3 7s ease-in-out infinite}
.sl4{animation:sum_l4 7s ease-in-out infinite}
/* Approach 3: XOR animation */
@keyframes xor_scan{0%,5%{transform:translateX(0)}18%,22%{transform:translateX(48px)}34%,38%{transform:translateX(96px)}50%,54%{transform:translateX(144px)}66%,70%{transform:translateX(192px)}85%,100%{transform:translateX(0)}}
.xs{animation:xor_scan 7s ease-in-out infinite}
@keyframes xl0{0%,5%{opacity:1}18%,100%{opacity:0}}
@keyframes xl1{0%,17%{opacity:0}18%,34%{opacity:1}35%,100%{opacity:0}}
@keyframes xl2{0%,33%{opacity:0}34%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes xl3{0%,49%{opacity:0}50%,66%{opacity:1}67%,100%{opacity:0}}
@keyframes xl4{0%,65%{opacity:0}66%,85%{opacity:1}86%,100%{opacity:0}}
.xl0{animation:xl0 7s ease-in-out infinite}
.xl1{animation:xl1 7s ease-in-out infinite}
.xl2{animation:xl2 7s ease-in-out infinite}
.xl3{animation:xl3 7s ease-in-out infinite}
.xl4{animation:xl4 7s ease-in-out infinite}
</style>
<rect width="900" height="900" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Missing Number</text>
<rect x="820" y="12" width="62" height="28" fill="#27AE60" rx="14"/>
<text x="851" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Easy</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">arr=[0,1,3,4], n=4 → Missing = 2</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Array contains n distinct numbers from [0..n]. Find the one missing number.</text>

<!-- APPROACH 1: Bool Array -->
<rect x="15" y="115" width="870" height="185" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Bool Array — O(n) time, O(n) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Mark present indices → find unmarked index</text>
<!-- Bool array boxes (size n+1=5), start_x=333, 5 elements -->
<text x="170" y="198" font-family="Arial" font-size="10" fill="#555">bool[n+1]:</text>
<rect x="333" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="bm0"/>
<text x="354" y="204" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">idx:0</text>
<rect x="381" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="bm1"/>
<text x="402" y="204" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">idx:1</text>
<rect x="429" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="bm2"/>
<text x="450" y="204" font-family="Arial" font-size="12" font-weight="bold" fill="#E74C3C" text-anchor="middle">idx:2</text>
<rect x="477" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="bm3"/>
<text x="498" y="204" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">idx:3</text>
<rect x="525" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="bm4"/>
<text x="546" y="204" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">idx:4</text>
<g class="bas" transform="translate(354,178)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#E74C3C"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">mark</text>
</g>
<text x="450" y="250" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Mark arr[i] as visited. Index 2 stays unvisited → missing = 2 ✓</text>
<text x="450" y="267" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Simple but uses O(n) extra space for the bool array.</text>
<text x="450" y="284" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Can we solve it in O(1) space using a formula?</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="300" x2="450" y2="337" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,337 450,345 456,337" fill="#7F8C8D"/>
<rect x="290" y="304" width="320" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="319" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Gauss formula: expected sum - actual sum = missing!</text>

<!-- APPROACH 2: Sum Formula -->
<rect x="15" y="345" width="870" height="185" fill="#FFFFFF" stroke="#F39C12" stroke-width="2" rx="7"/>
<rect x="15" y="345" width="870" height="40" fill="#F39C12" rx="7"/>
<rect x="15" y="370" width="870" height="15" fill="#F39C12"/>
<text x="450" y="370" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Sum Formula — O(n) time, O(1) space</text>
<text x="450" y="383" font-family="Arial" font-size="10" fill="#FEF9E7" text-anchor="middle">expected = n*(n+1)/2, actual = sum of array, missing = expected - actual</text>
<!-- Array [0,1,3,4] scanning for sum -->
<rect x="333" y="403" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="429" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">0</text>
<rect x="381" y="403" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="429" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="429" y="403" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="429" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="477" y="403" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="498" y="429" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<g class="ss" transform="translate(354,403)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#F39C12"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#F39C12" text-anchor="middle">sum</text>
</g>
<!-- Running sum labels -->
<text class="sl0" x="672" y="429" font-family="Arial" font-size="11" fill="#555">sum=0</text>
<text class="sl1" x="672" y="429" font-family="Arial" font-size="11" fill="#555">sum=1</text>
<text class="sl2" x="672" y="429" font-family="Arial" font-size="11" fill="#555">sum=4</text>
<text class="sl3" x="672" y="429" font-family="Arial" font-size="11" fill="#555">sum=8</text>
<text class="sl4" x="672" y="429" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">sum=8 ✓</text>
<text x="450" y="468" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">expected = 4×5/2 = 10, actual = 8, missing = 10-8 = 2 ✓</text>
<text x="450" y="485" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">O(1) extra space! One linear scan.</text>
<text x="450" y="502" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">⚠ Watch out: can overflow for very large n (use long or XOR instead)</text>

<!-- Arrow 2→3 -->
<line x1="450" y1="530" x2="450" y2="567" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,567 450,575 456,567" fill="#7F8C8D"/>
<rect x="260" y="534" width="380" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="549" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 XOR approach: avoids overflow, elegant cancellation!</text>

<!-- APPROACH 3: XOR -->
<rect x="15" y="575" width="870" height="185" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="575" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="600" width="870" height="15" fill="#27AE60"/>
<text x="450" y="600" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 3: XOR — O(n) time, O(1) space ⭐</text>
<text x="450" y="613" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">XOR indices 0..n with all array values — pairs cancel out, missing remains</text>
<!-- Array [0,1,3,4] XOR scanning -->
<rect x="333" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">0</text>
<rect x="381" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="429" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="477" y="628" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="498" y="654" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<g class="xs" transform="translate(354,628)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#27AE60"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">xor</text>
</g>
<!-- XOR state labels -->
<text class="xl0" x="655" y="650" font-family="Arial" font-size="11" fill="#555">xor = 0^0=0^1=1^2=3^3=0^4=4^arr...</text>
<text class="xl1" x="655" y="650" font-family="Arial" font-size="11" fill="#555">idx XOR: 0^1^2^3^4 = 4</text>
<text class="xl2" x="655" y="650" font-family="Arial" font-size="11" fill="#555">arr XOR: 0^1^3^4 = 6</text>
<text class="xl3" x="655" y="650" font-family="Arial" font-size="11" fill="#555">4 ^ 6 = 2</text>
<text class="xl4" x="655" y="650" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">missing = 2 ✓</text>
<text x="450" y="690" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">xor = 0..n XOR all arr values. Each present number cancels itself. Missing remains!</text>
<text x="450" y="707" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">XOR property: a^a=0, a^0=a. All pairs [0..n] and arr cancel except missing.</text>
<text x="450" y="722" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">No overflow risk, O(1) space, elegant! Can also loop once: xor i and arr[i].</text>
<text x="450" y="737" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">int xor=0; for(i=0..n): xor^=i; for(x in arr): xor^=x; return xor;</text>

<!-- Complexity Table -->
<rect x="15" y="772" width="870" height="123" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="772" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="787" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="792" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="802" x2="885" y2="802" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="802" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="818" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="818" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="818" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="825" x2="885" y2="825" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="825" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="840" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Bool Array</text>
<text x="500" y="840" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n)</text>
<text x="750" y="840" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n)</text>
<line x1="15" y1="847" x2="885" y2="847" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="847" width="870" height="22" fill="#FEF9E7"/>
<text x="200" y="862" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Sum Formula</text>
<text x="500" y="862" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
<text x="750" y="862" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)</text>
<line x1="15" y1="869" x2="885" y2="869" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="869" width="870" height="26" fill="#EAFAF1"/>
<text x="200" y="886" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">XOR ⭐</text>
<text x="500" y="886" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<text x="750" y="886" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1) no overflow</text>
<line x1="370" y1="802" x2="370" y2="895" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="802" x2="620" y2="895" stroke="#DEE2E6" stroke-width="1"/>
</svg>
