<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Brute - permutation labels cycle */
@keyframes pm0{0%,12%{opacity:1}13%,100%{opacity:0}}
@keyframes pm1{0%,12%{opacity:0}13%,28%{opacity:1}29%,100%{opacity:0}}
@keyframes pm2{0%,28%{opacity:0}29%,44%{opacity:1}45%,100%{opacity:0}}
@keyframes pm3{0%,44%{opacity:0}45%,60%{opacity:1}61%,100%{opacity:0}}
@keyframes pm4{0%,60%{opacity:0}61%,80%{opacity:1}81%,100%{opacity:0}}
.pm0{animation:pm0 7s ease-in-out infinite}.pm1{animation:pm1 7s ease-in-out infinite}
.pm2{animation:pm2 7s ease-in-out infinite}.pm3{animation:pm3 7s ease-in-out infinite}
.pm4{animation:pm4 7s ease-in-out infinite}
/* Approach 2: Custom sort - comparison animation */
@keyframes cmp0{0%,15%{opacity:1}16%,100%{opacity:0}}
@keyframes cmp1{0%,15%{opacity:0}16%,35%{opacity:1}36%,100%{opacity:0}}
@keyframes cmp2{0%,35%{opacity:0}36%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes cmp3{0%,55%{opacity:0}56%,75%{opacity:1}76%,100%{opacity:0}}
@keyframes cmp4{0%,75%{opacity:0}76%,88%{opacity:1}89%,100%{opacity:0}}
.cmp0{animation:cmp0 7s ease-in-out infinite}.cmp1{animation:cmp1 7s ease-in-out infinite}
.cmp2{animation:cmp2 7s ease-in-out infinite}.cmp3{animation:cmp3 7s ease-in-out infinite}
.cmp4{animation:cmp4 7s ease-in-out infinite}
@keyframes sort_ptr{0%,10%{transform:translateX(0)}28%,36%{transform:translateX(48px)}53%,61%{transform:translateX(96px)}78%,86%{transform:translateX(144px)}100%{transform:translateX(0)}}
.sp{animation:sort_ptr 7s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Largest Number from Array</text>
<rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
<text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">nums=[3,30,34,5,9] → "9534330" (arrange digits for largest number)</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Key insight: compare "ab" vs "ba" as strings. Sort with custom comparator in O(n log n).</text>

<!-- APPROACH 1: Brute Force -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Brute Force (All Permutations) — O(n!·n) time</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Generate all n! permutations, concatenate each, keep the largest string.</text>
<!-- Input array: 5 elements [3,30,34,5,9] at x: 333,381,429,477,525 -->
<rect x="333" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="354" y="201" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="381" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="402" y="201" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">30</text>
<rect x="429" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="450" y="201" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">34</text>
<rect x="477" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="498" y="201" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="525" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="546" y="201" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9</text>
<!-- Permutation examples cycling -->
<text x="160" y="244" font-family="Arial" font-size="11" font-weight="bold" fill="#555">Permutations tried:</text>
<text class="pm0" x="160" y="262" font-family="Arial" font-size="11" fill="#555">[3,30,34,5,9] → "3303459"</text>
<text class="pm1" x="160" y="262" font-family="Arial" font-size="11" fill="#555">[9,5,34,3,30] → "9534330" ← candidate!</text>
<text class="pm2" x="160" y="262" font-family="Arial" font-size="11" fill="#555">[9,5,34,30,3] → "9534303"</text>
<text class="pm3" x="160" y="262" font-family="Arial" font-size="11" fill="#555">[34,9,5,3,30] → "3495330" &lt; max</text>
<text class="pm4" x="160" y="262" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Total: 5!=120 permutations! → "9534330"</text>
<rect x="510" y="235" width="340" height="52" fill="#FDF2F8" stroke="#E74C3C" stroke-width="1.5" rx="5"/>
<text x="680" y="256" font-family="Arial" font-size="11" font-weight="bold" fill="#E74C3C" text-anchor="middle">Why so slow?</text>
<text x="680" y="274" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">n! permutations × n digits = O(n!·n)</text>
<text x="680" y="290" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">For n=10: 10! = 3,628,800 checks!</text>
<text x="450" y="310" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">n=5 → 5!=120 permutations. n=13 → 13!=6B. Completely infeasible for large inputs!</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="200" y="329" width="500" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Custom comparator: a before b if "ab" &gt; "ba" as strings → O(n log n)</text>

<!-- APPROACH 2: Custom Sort -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Custom Sort Comparator — O(n log n) time, O(n) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Sort with: compare(a,b) = (str(a)+str(b) &gt; str(b)+str(a)). Join sorted array.</text>
<!-- Sorted array: [9,5,34,3,30] -->
<rect x="333" y="425" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="354" y="451" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9</text>
<rect x="381" y="425" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="402" y="451" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="429" y="425" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="450" y="451" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">34</text>
<rect x="477" y="425" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="498" y="451" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="525" y="425" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="546" y="451" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">30</text>
<!-- Comparator pointer -->
<g class="sp" transform="translate(354,425)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#27AE60"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">cmp</text>
</g>
<!-- Comparison examples cycling -->
<text class="cmp0" x="160" y="498" font-family="Arial" font-size="11" fill="#555">"3"+"30"="330" vs "30"+"3"="303" → 3 before 30 ✓</text>
<text class="cmp1" x="160" y="498" font-family="Arial" font-size="11" fill="#555">"34"+"3"="343" vs "3"+"34"="334" → 34 before 3 ✓</text>
<text class="cmp2" x="160" y="498" font-family="Arial" font-size="11" fill="#555">"9"+"5"="95" vs "5"+"9"="59" → 9 before 5 ✓</text>
<text class="cmp3" x="160" y="498" font-family="Arial" font-size="11" fill="#555">Sorted: [9, 5, 34, 3, 30] → join → "9534330"</text>
<text class="cmp4" x="160" y="498" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Answer: "9534330" ✓  (Edge: [0,0]→"0")</text>
<!-- Result box -->
<rect x="155" y="508" width="570" height="30" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="4"/>
<text x="440" y="528" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">Result: "9534330" ✓</text>
<text x="450" y="560" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Custom comparator determines order. sort(nums, (a,b) → (b+""+a).compareTo(a+""+b))</text>
<text x="450" y="575" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Edge case: all zeros → return "0". Edge case: comparator must be transitive!</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Brute Force (Permutations)</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n!·n)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n)</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Custom Sort Comparator ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n log n)</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
