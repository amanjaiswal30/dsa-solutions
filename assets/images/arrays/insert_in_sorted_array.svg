<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Linear scan+shift */
@keyframes lin_ptr{0%,10%{transform:translateX(0)}22%,32%{transform:translateX(48px)}44%,54%{transform:translateX(96px)}66%,76%{transform:translateX(144px)}88%,100%{transform:translateX(0)}}
.lp{animation:lin_ptr 7s ease-in-out infinite}
@keyframes ll0{0%,10%{opacity:1}22%,100%{opacity:0}}
@keyframes ll1{0%,21%{opacity:0}22%,44%{opacity:1}45%,100%{opacity:0}}
@keyframes ll2{0%,43%{opacity:0}44%,66%{opacity:1}67%,100%{opacity:0}}
@keyframes ll3{0%,65%{opacity:0}66%,76%{opacity:1}77%,100%{opacity:0}}
@keyframes ll4{0%,87%{opacity:0}88%,100%{opacity:1}}
.ll0{animation:ll0 7s ease-in-out infinite}.ll1{animation:ll1 7s ease-in-out infinite}
.ll2{animation:ll2 7s ease-in-out infinite}.ll3{animation:ll3 7s ease-in-out infinite}
.ll4{animation:ll4 7s ease-in-out infinite}
/* Approach 2: Binary Search */
@keyframes bs_ptr{0%,8%{transform:translateX(96px)}28%,36%{transform:translateX(0)}55%,65%{transform:translateX(48px)}82%,92%{transform:translateX(48px)}100%{transform:translateX(96px)}}
.bp{animation:bs_ptr 7s ease-in-out infinite}
@keyframes bl0{0%,8%{opacity:1}28%,100%{opacity:0}}
@keyframes bl1{0%,27%{opacity:0}28%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes bl2{0%,54%{opacity:0}55%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes bl3{0%,81%{opacity:0}82%,92%{opacity:1}93%,100%{opacity:0}}
@keyframes bl4{0%,92%{opacity:0}93%,100%{opacity:1}}
.bsl0{animation:bl0 7s ease-in-out infinite}.bsl1{animation:bl1 7s ease-in-out infinite}
.bsl2{animation:bl2 7s ease-in-out infinite}.bsl3{animation:bl3 7s ease-in-out infinite}
.bsl4{animation:bl4 7s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Insert Element in Sorted Array</text>
<rect x="800" y="12" width="82" height="28" fill="#2ECC71" rx="14"/>
<text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Easy</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">arr=[1,3,5,7], key=4 → [1,3,4,5,7] (insert maintaining sorted order)</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Find correct position, shift elements right, insert. Binary search finds position in O(log n), shift is O(n).</text>

<!-- APPROACH 1: Linear Scan + Shift -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Linear Scan — O(n) time, O(1) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Scan from right, shift elements right until correct position found, then insert.</text>
<!-- 5 boxes: [1,3,5,7,_] at x: 333,381,429,477,525 (42px, 48pitch). key=4 -->
<rect x="333" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="381" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="429" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="477" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="498" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">7</text>
<rect x="525" y="175" width="42" height="42" fill="#F2F3F4" stroke="#95A5A6" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>
<text x="546" y="201" font-family="Arial" font-size="14" fill="#AAA" text-anchor="middle">_</text>
<!-- Index labels -->
<text x="354" y="228" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[0]</text>
<text x="402" y="228" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[1]</text>
<text x="450" y="228" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[2]</text>
<text x="498" y="228" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[3]</text>
<text x="546" y="228" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[4]</text>
<!-- Scan pointer (starts at index 0, moves right to find pos) -->
<g class="lp" transform="translate(354,175)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#E74C3C"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">scan</text>
</g>
<!-- key=4 label -->
<rect x="160" y="175" width="90" height="42" fill="#FEF9E7" stroke="#F39C12" stroke-width="2" rx="4"/>
<text x="205" y="196" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22" text-anchor="middle">key = 4</text>
<text x="205" y="212" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">to insert</text>
<!-- Step labels -->
<text class="ll0" x="450" y="258" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">arr[0]=1 &lt; 4, continue scanning →</text>
<text class="ll1" x="450" y="258" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">arr[1]=3 &lt; 4, continue scanning →</text>
<text class="ll2" x="450" y="258" font-family="Arial" font-size="11" fill="#E74C3C" font-weight="bold" text-anchor="middle">arr[2]=5 &gt; 4! Found position=2. Shift 5,7 right.</text>
<text class="ll3" x="450" y="258" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">After shift: [1,3,_,5,7]. Insert 4 at index 2.</text>
<text class="ll4" x="450" y="258" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">Result: [1,3,4,5,7] ✓</text>
<text x="450" y="285" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Worst case: insert at beginning → shift n elements → O(n). Scan is also O(n).</text>
<text x="450" y="302" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Total: O(n). Can we find position faster?</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="210" y="329" width="480" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Array is sorted → use Binary Search to find position in O(log n)!</text>

<!-- APPROACH 2: Binary Search + Shift -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Binary Search + Shift — O(log n) find + O(n) shift</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Use lower_bound binary search to find insert position, then shift elements right.</text>
<!-- Same 5 boxes for BS -->
<rect x="333" y="425" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="451" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="381" y="425" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="451" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="429" y="425" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="451" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="477" y="425" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="498" y="451" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">7</text>
<rect x="525" y="425" width="42" height="42" fill="#F2F3F4" stroke="#95A5A6" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/>
<text x="546" y="451" font-family="Arial" font-size="14" fill="#AAA" text-anchor="middle">_</text>
<!-- L, R, mid boundary indicators -->
<text x="354" y="478" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">lo=0</text>
<text x="498" y="478" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">hi=3</text>
<!-- mid pointer -->
<g class="bp" transform="translate(354,425)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#27AE60"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">mid</text>
</g>
<!-- key=4 label -->
<rect x="160" y="425" width="90" height="42" fill="#FEF9E7" stroke="#F39C12" stroke-width="2" rx="4"/>
<text x="205" y="446" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22" text-anchor="middle">key = 4</text>
<text x="205" y="462" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">to insert</text>
<!-- Step labels -->
<text class="bsl0" x="450" y="510" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">lo=0,hi=3,mid=1: arr[1]=3 &lt; 4 → lo=mid+1=2</text>
<text class="bsl1" x="450" y="510" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">lo=2,hi=3,mid=2: arr[2]=5 &gt; 4 → hi=mid-1=1</text>
<text class="bsl2" x="450" y="510" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">lo(2) &gt; hi(1): insert position = lo = 2</text>
<text class="bsl3" x="450" y="510" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Shift arr[2..3] right: [1,3,_,5,7]. Insert 4 → [1,3,4,5,7] ✓</text>
<text x="450" y="545" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Binary search finds position in O(log n) but shift is still O(n). Overall O(n).</text>
<text x="450" y="560" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Useful when position is needed for other purposes or comparisons are expensive.</text>
<text x="450" y="575" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">For truly O(log n) insertion with arbitrary access → use balanced BST or skip list.</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time (find + shift)</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Linear Scan</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n) + O(n) = O(n)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Binary Search + Shift ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(log n) + O(n) = O(n)</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
