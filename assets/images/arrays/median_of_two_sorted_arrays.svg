<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Merge - i/j pointers advance, merged array fills */
@keyframes mi_ptr{0%,8%{transform:translateX(0)}22%,30%{transform:translateX(48px)}44%,52%{transform:translateX(0)}65%,75%{transform:translateX(48px)}88%,100%{transform:translateX(0)}}
@keyframes mj_ptr{0%,8%{transform:translateX(0)}22%,30%{transform:translateX(0)}44%,52%{transform:translateX(48px)}65%,75%{transform:translateX(48px)}88%,100%{transform:translateX(0)}}
.mi{animation:mi_ptr 7s ease-in-out infinite}
.mj{animation:mj_ptr 7s ease-in-out infinite}
@keyframes ml0{0%,8%{opacity:1}22%,100%{opacity:0}}
@keyframes ml1{0%,21%{opacity:0}22%,44%{opacity:1}45%,100%{opacity:0}}
@keyframes ml2{0%,43%{opacity:0}44%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes ml3{0%,64%{opacity:0}65%,75%{opacity:1}76%,100%{opacity:0}}
@keyframes ml4{0%,87%{opacity:0}88%,100%{opacity:1}}
.ml0{animation:ml0 7s ease-in-out infinite}.ml1{animation:ml1 7s ease-in-out infinite}
.ml2{animation:ml2 7s ease-in-out infinite}.ml3{animation:ml3 7s ease-in-out infinite}
.ml4{animation:ml4 7s ease-in-out infinite}
@keyframes med_hl{0%,87%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}88%,100%{fill:#D5F5E3;stroke:#27AE60;stroke-width:3}}
.medh{animation:med_hl 7s ease-in-out infinite}
/* Approach 2: Binary Search partition */
@keyframes prt0{0%,15%{opacity:1}16%,100%{opacity:0}}
@keyframes prt1{0%,15%{opacity:0}16%,40%{opacity:1}41%,100%{opacity:0}}
@keyframes prt2{0%,40%{opacity:0}41%,65%{opacity:1}66%,100%{opacity:0}}
@keyframes prt3{0%,65%{opacity:0}66%,80%{opacity:1}81%,100%{opacity:0}}
@keyframes prt4{0%,80%{opacity:0}81%,93%{opacity:1}94%,100%{opacity:0}}
.prt0{animation:prt0 7s ease-in-out infinite}.prt1{animation:prt1 7s ease-in-out infinite}
.prt2{animation:prt2 7s ease-in-out infinite}.prt3{animation:prt3 7s ease-in-out infinite}
.prt4{animation:prt4 7s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Median of Two Sorted Arrays</text>
<rect x="800" y="12" width="82" height="28" fill="#E74C3C" rx="14"/>
<text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Hard</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">nums1=[1,3], nums2=[2,4] → merged=[1,2,3,4] → median=(2+3)/2=2.5</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Find median without full merge. Binary search on partition of smaller array → O(log min(m,n)).</text>

<!-- APPROACH 1: Merge Arrays -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Merge Then Find Median — O(m+n) time, O(m+n) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Merge both sorted arrays (like merge sort), then return middle element(s).</text>
<!-- nums1=[1,3]: 2 boxes at x: 150,198 -->
<text x="174" y="173" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">nums1</text>
<rect x="150" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="171" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="198" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="219" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<!-- i pointer -->
<g class="mi" transform="translate(171,178)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#E74C3C"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">i</text>
</g>
<!-- nums2=[2,4]: 2 boxes at x: 270,318 -->
<text x="294" y="173" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">nums2</text>
<rect x="270" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="291" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="318" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="339" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<!-- j pointer -->
<g class="mj" transform="translate(291,178)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#3498DB"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">j</text>
</g>
<!-- Arrow -->
<text x="400" y="204" font-family="Arial" font-size="20" fill="#555">→</text>
<!-- Merged array: [1,2,3,4] at x: 430,478,526,574 -->
<text x="502" y="173" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">merged</text>
<rect x="430" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="451" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="478" y="178" width="42" height="42" class="medh" rx="3"/>
<text x="499" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="526" y="178" width="42" height="42" class="medh" rx="3"/>
<text x="547" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="574" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="595" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<!-- Index labels -->
<text x="451" y="232" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[0]</text>
<text x="499" y="232" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">[1]↓</text>
<text x="547" y="232" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">[2]↓</text>
<text x="595" y="232" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[3]</text>
<!-- Step labels -->
<text class="ml0" x="450" y="258" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">Compare nums1[i=0]=1 vs nums2[j=0]=2: 1&lt;2, add 1. i→1</text>
<text class="ml1" x="450" y="258" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">Compare nums1[i=1]=3 vs nums2[j=0]=2: 3&gt;2, add 2. j→1</text>
<text class="ml2" x="450" y="258" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">Compare nums1[i=1]=3 vs nums2[j=1]=4: 3&lt;4, add 3. i→2</text>
<text class="ml3" x="450" y="258" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">nums1 exhausted, add remaining: 4. Merged: [1,2,3,4]</text>
<text class="ml4" x="450" y="258" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">len=4 (even): median=(merged[1]+merged[2])/2=(2+3)/2=2.5 ✓</text>
<text x="450" y="285" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">O(m+n) extra space for merged array. Can we avoid it?</text>
<text x="450" y="302" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Odd total: take middle element. Even total: average of two middle elements.</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="170" y="329" width="560" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Binary search on partition: find correct split without merging → O(log min(m,n))</text>

<!-- APPROACH 2: Binary Search Partition -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Binary Search Partition — O(log min(m,n)) time, O(1) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Partition smaller array at midpoint. Adjust until max(left1,left2) ≤ min(right1,right2).</text>
<!-- nums1=[1,3] partitioned: left1=[1] | right1=[3] -->
<text x="174" y="423" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">nums1</text>
<rect x="150" y="428" width="42" height="42" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="3"/>
<text x="171" y="454" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<text x="200" y="454" font-family="Arial" font-size="14" fill="#E74C3C" font-weight="bold">|</text>
<rect x="210" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="231" y="454" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<!-- nums2=[2,4] partitioned: left2=[2] | right2=[4] -->
<text x="294" y="423" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">nums2</text>
<rect x="270" y="428" width="42" height="42" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="3"/>
<text x="291" y="454" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<text x="320" y="454" font-family="Arial" font-size="14" fill="#E74C3C" font-weight="bold">|</text>
<rect x="330" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="351" y="454" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<!-- Labels -->
<text x="174" y="484" font-family="Arial" font-size="9" fill="#E67E22" text-anchor="middle">left1=[1]</text>
<text x="231" y="484" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">right1=[3]</text>
<text x="291" y="484" font-family="Arial" font-size="9" fill="#E67E22" text-anchor="middle">left2=[2]</text>
<text x="351" y="484" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">right2=[4]</text>
<!-- Step labels -->
<text class="prt0" x="580" y="435" font-family="Arial" font-size="11" fill="#555">Partition nums1 at mid=1</text>
<text class="prt1" x="580" y="435" font-family="Arial" font-size="11" fill="#555">left1=[1], right1=[3]</text>
<text class="prt2" x="580" y="435" font-family="Arial" font-size="11" fill="#555">left2=[2], right2=[4]</text>
<text class="prt3" x="580" y="435" font-family="Arial" font-size="11" fill="#27AE60">Check: max(1,2)=2 ≤ min(3,4)=3 ✓</text>
<text class="prt4" x="580" y="435" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">median=(2+3)/2=2.5 ✓</text>
<!-- Condition check display -->
<rect x="450" y="495" width="420" height="55" fill="#D5F5E3" stroke="#27AE60" stroke-width="1.5" rx="5"/>
<text x="660" y="515" font-family="Arial" font-size="11" font-weight="bold" fill="#27AE60" text-anchor="middle">Partition condition met:</text>
<text x="660" y="533" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">max(left1,left2) ≤ min(right1,right2)</text>
<text x="660" y="548" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">max(1,2)=2 ≤ min(3,4)=3 → correct!</text>
<text x="450" y="560" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Binary search on partition index: if left1&gt;right2 → move left; if left2&gt;right1 → move right.</text>
<text x="450" y="575" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Always partition smaller array first. O(log min(m,n)) — optimal for this problem!</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Merge + Find Median</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(m+n)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(m+n)</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Binary Search Partition ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(log min(m,n))</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
