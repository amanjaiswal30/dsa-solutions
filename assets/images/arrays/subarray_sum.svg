<svg width="900" height="665" xmlns="http://www.w3.org/2000/svg">
<style>
  /* Approach 1: brute — i fixed, j expands right */
  @keyframes j_exp {
    0%,5%  {transform:translateX(0)}
    15%,20%{transform:translateX(48px)}
    30%,35%{transform:translateX(96px)}
    50%,55%{transform:translateX(144px)}
    70%,75%{transform:translateX(0)} /* i moves to 1 */
    85%,90%{transform:translateX(0)}
    95%,100%{transform:translateX(0)}
  }
  .jex{animation:j_exp 6s ease-in-out infinite}

  @keyframes sum_brute {
    0%,5%  {opacity:1} 8%,100%{opacity:0}
  }
  @keyframes sb2 {13%,20%{opacity:1} 0%,12%,21%,100%{opacity:0}}
  @keyframes sb3 {27%,35%{opacity:1} 0%,26%,36%,100%{opacity:0}}
  @keyframes sb4 {45%,60%{opacity:1} 0%,44%,61%,100%{opacity:0}}
  @keyframes sb5 {65%,100%{opacity:1} 0%,64%{opacity:0}}
  .sb1{animation:sum_brute 6s ease-in-out infinite}
  .sb2{animation:sb2 6s ease-in-out infinite}
  .sb3{animation:sb3 6s ease-in-out infinite}
  .sb4{animation:sb4 6s ease-in-out infinite}
  .sb5{animation:sb5 6s ease-in-out infinite;fill:#27AE60;font-weight:bold}

  /* Approach 2: sliding window */
  /* Window rect animates: x and width change */
  @keyframes win_x {
    0%,8%   {x:80px}
    20%,25% {x:80px}
    35%,40% {x:80px}
    50%,55% {x:80px}   /* sum > target, shrink left */
    65%,70% {x:128px}  /* after shrink */
    80%,90% {x:128px}
    95%,100%{x:80px}
  }
  @keyframes win_w {
    0%,8%   {width:48px}   /* [1] */
    20%,25% {width:96px}   /* [1,2] */
    35%,40% {width:144px}  /* [1,2,3] */
    50%,55% {width:192px}  /* [1,2,3,7] sum=13>12 shrink */
    65%,70% {width:144px}  /* [2,3,7] sum=12 = target */
    80%,90% {width:144px}
    95%,100%{width:48px}
  }
  .wbox{animation:win_x 7s ease-in-out infinite,win_w 7s ease-in-out infinite}

  @keyframes L_slide {
    0%,64%  {transform:translateX(0)}
    70%,100%{transform:translateX(48px)}
  }
  @keyframes R_slide {
    0%,8%   {transform:translateX(0)}
    20%,25% {transform:translateX(48px)}
    35%,40% {transform:translateX(96px)}
    50%,55% {transform:translateX(144px)}
    65%,100%{transform:translateX(144px)}
  }
  .Lp{animation:L_slide 7s ease-in-out infinite}
  .Rp{animation:R_slide 7s ease-in-out infinite}

  @keyframes ws1 {0%,9%{opacity:1}  12%,100%{opacity:0}}
  @keyframes ws2 {18%,26%{opacity:1} 0%,17%,27%,100%{opacity:0}}
  @keyframes ws3 {33%,41%{opacity:1} 0%,32%,42%,100%{opacity:0}}
  @keyframes ws4 {48%,58%{opacity:1} 0%,47%,59%,100%{opacity:0}}
  @keyframes ws5 {63%,85%{opacity:1} 0%,62%,86%,100%{opacity:0}}
  @keyframes ws6 {86%,100%{opacity:1} 0%,85%{opacity:0}}
  .ws1{animation:ws1 7s ease-in-out infinite}
  .ws2{animation:ws2 7s ease-in-out infinite}
  .ws3{animation:ws3 7s ease-in-out infinite}
  .ws4{animation:ws4 7s ease-in-out infinite}
  .ws5{animation:ws5 7s ease-in-out infinite}
  .ws6{animation:ws6 7s ease-in-out infinite;fill:#27AE60;font-weight:bold}
</style>

<rect width="900" height="665" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Subarray with Given Sum</text>
<rect x="800" y="12" width="82" height="28" fill="#27AE60" rx="14"/>
<text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Easy</text>

<rect x="15" y="63" width="870" height="44" fill="white" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Problem:</text>
<text x="108" y="81" font-family="Arial" font-size="12" fill="#555">Find a contiguous subarray that sums to a given target (non-negative numbers).</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Example: arr=[1,2,3,7,5], target=12 → [2,3,7] (indices 1 to 3, sum=12)</text>

<!-- ═══ APPROACH 1: BRUTE FORCE ═══ -->
<rect x="15" y="115" width="870" height="215" fill="white" stroke="#E74C3C" stroke-width="2" rx="8"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="8"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="30" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white">① Brute Force — All Subarrays</text>
<text x="875" y="140" font-family="Arial" font-size="11" fill="#FADBD8" text-anchor="end">O(n²) time  ·  O(1) space</text>

<rect x="16" y="155" width="868" height="118" fill="#FEF8F8" rx="0"/>
<text x="45" y="173" font-family="Arial" font-size="10" fill="#888" font-weight="bold">LIVE: i=0 fixed, j expands right summing elements  [1,2,3,7,5] target=12</text>
<!-- Array boxes -->
<rect x="80"  y="180" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="6"/>
<text x="101" y="206" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">1</text>
<rect x="128" y="180" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="6"/>
<text x="149" y="206" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">2</text>
<rect x="176" y="180" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="6"/>
<text x="197" y="206" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">3</text>
<rect x="224" y="180" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="6"/>
<text x="245" y="206" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">7</text>
<rect x="272" y="180" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="6"/>
<text x="293" y="206" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">5</text>
<!-- i pointer -->
<polygon points="101,176 95,168 107,168" fill="#E74C3C"/>
<text x="101" y="166" font-family="Arial" font-size="9" fill="#E74C3C" font-weight="bold" text-anchor="middle">i=0</text>
<!-- j pointer sweeping -->
<g class="jex">
  <polygon points="101,235 95,243 107,243" fill="#3498DB"/>
  <text x="101" y="252" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle" font-weight="bold">j</text>
</g>
<!-- Sum labels -->
<text class="sb1" x="350" y="205" font-family="Arial" font-size="11" fill="#555">sum=1 ≠ 12</text>
<text class="sb2" x="350" y="205" font-family="Arial" font-size="11" fill="#555">sum=1+2=3 ≠ 12</text>
<text class="sb3" x="350" y="205" font-family="Arial" font-size="11" fill="#555">sum=1+2+3=6 ≠ 12</text>
<text class="sb4" x="350" y="205" font-family="Arial" font-size="11" fill="#555">sum=1+2+3+7=13 &gt; 12, try i=1...</text>
<text class="sb5" x="350" y="205" font-family="Arial" font-size="11">i=1: sum=2+3+7=12 ✓ found [1..3]!</text>
<!-- Pseudocode -->
<rect x="350" y="216" width="520" height="48" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1" rx="5"/>
<text x="365" y="233" font-family="monospace" font-size="10" fill="#333">for i in range(n):  cur = 0</text>
<text x="365" y="248" font-family="monospace" font-size="10" fill="#333">  for j in range(i, n): cur += nums[j]</text>
<text x="365" y="263" font-family="monospace" font-size="10" fill="#27AE60">    if cur == target: return (i, j)</text>

<rect x="16" y="273" width="868" height="57" fill="#FFF0F0" rx="0"/>
<text x="30" y="291" font-family="Arial" font-size="11" fill="#E74C3C" font-weight="bold">⚠  O(n²) pairs!</text>
<text x="120" y="291" font-family="Arial" font-size="11" fill="#555">Every possible starting point tries to extend rightward, recomputing sums from scratch.</text>
<text x="30" y="310" font-family="Arial" font-size="11" fill="#888">💡 Insight: for non-negative numbers, a window sum only grows when we add elements and shrinks when we remove from left.</text>
<text x="30" y="326" font-family="Arial" font-size="11" fill="#888">→ Sliding window: if sum &gt; target, shrink from left; if sum &lt; target, expand right. No nested loops needed!</text>

<line x1="450" y1="333" x2="450" y2="363" stroke="#95A5A6" stroke-width="2" stroke-dasharray="5,3"/>
<polygon points="444,361 450,372 456,361" fill="#95A5A6"/>
<rect x="290" y="339" width="320" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="354" font-family="Arial" font-size="10" font-weight="bold" fill="#555" text-anchor="middle">💡 Sliding window — expand right, shrink left!</text>

<!-- ═══ APPROACH 2: SLIDING WINDOW ═══ -->
<rect x="15" y="372" width="870" height="215" fill="white" stroke="#27AE60" stroke-width="2.5" rx="8"/>
<rect x="15" y="372" width="870" height="40" fill="#27AE60" rx="8"/>
<rect x="15" y="397" width="870" height="15" fill="#27AE60"/>
<text x="30" y="397" font-family="Arial" font-size="13" font-weight="bold" fill="white">② Sliding Window — Two Pointers ⭐</text>
<text x="875" y="397" font-family="Arial" font-size="11" fill="#D5F5E3" text-anchor="end">O(n) time  ·  O(1) space</text>

<rect x="16" y="412" width="868" height="118" fill="#F4FEF7" rx="0"/>
<text x="45" y="430" font-family="Arial" font-size="10" fill="#888" font-weight="bold">LIVE: window [L..R] expands right, shrinks left on overflow  [1,2,3,7,5] target=12</text>
<!-- Array boxes (static) -->
<rect x="80"  y="437" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="6"/>
<text x="101" y="463" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">1</text>
<rect x="128" y="437" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="6"/>
<text x="149" y="463" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">2</text>
<rect x="176" y="437" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="6"/>
<text x="197" y="463" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">3</text>
<rect x="224" y="437" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="6"/>
<text x="245" y="463" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">7</text>
<rect x="272" y="437" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="6"/>
<text x="293" y="463" font-family="Arial" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">5</text>

<!-- Sliding window highlight rect (animated x and width) -->
<rect class="wbox" y="436" height="44" fill="rgba(39,174,96,0.18)" stroke="#27AE60" stroke-width="2.5" rx="5"/>

<!-- L pointer (animates right when shrinking) -->
<g class="Lp">
  <polygon points="101,487 95,495 107,495" fill="#E74C3C"/>
  <text x="101" y="504" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle" font-weight="bold">L</text>
</g>
<!-- R pointer (animates right as window expands) -->
<g class="Rp">
  <polygon points="101,433 95,425 107,425" fill="#27AE60"/>
  <text x="101" y="423" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle" font-weight="bold">R</text>
</g>
<!-- Step labels -->
<text class="ws1" x="360" y="460" font-family="Arial" font-size="11" fill="#555">R→1: sum=1 &lt; 12, expand R</text>
<text class="ws2" x="360" y="460" font-family="Arial" font-size="11" fill="#555">R→2: sum=1+2=3 &lt; 12, expand R</text>
<text class="ws3" x="360" y="460" font-family="Arial" font-size="11" fill="#555">R→3: sum=1+2+3=6 &lt; 12, expand R</text>
<text class="ws4" x="360" y="460" font-family="Arial" font-size="11" fill="#555">R→7: sum=1+2+3+7=13 &gt; 12, shrink L!</text>
<text class="ws5" x="360" y="460" font-family="Arial" font-size="11" fill="#555">L shrinks: sum=2+3+7=12 = target!</text>
<text class="ws6" x="360" y="460" font-family="Arial" font-size="11">Window [1..3] = [2,3,7] ✓ Found!</text>
<!-- Pseudocode -->
<rect x="360" y="472" width="510" height="48" fill="#EAFAF1" stroke="#27AE60" stroke-width="1" rx="5"/>
<text x="375" y="489" font-family="monospace" font-size="10" fill="#333">L=0, cur=0</text>
<text x="375" y="504" font-family="monospace" font-size="10" fill="#333">for R in range(n):  cur += nums[R]</text>
<text x="375" y="519" font-family="monospace" font-size="10" fill="#333">  while cur &gt; target: cur -= nums[L]; L++</text>
<text x="375" y="534" font-family="monospace" font-size="10" fill="#27AE60">  if cur == target: return (L, R)</text>

<rect x="16" y="530" width="868" height="57" fill="#F0FEF5" rx="0"/>
<text x="30" y="548" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">✓ Each element enters and exits the window at most once → O(n) total!</text>
<text x="30" y="567" font-family="Arial" font-size="11" fill="#888">Window sum increases only when R moves right (positive numbers), decreases when L moves right.</text>
<text x="30" y="583" font-family="Arial" font-size="11" fill="#888">⚠  Only works for non-negative numbers! For negative numbers or exact-k-subarrays → use prefix sum + HashMap.</text>

<!-- Complexity Table -->
<rect x="15" y="595" width="870" height="60" fill="white" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="595" width="870" height="22" fill="#2C3E50" rx="7"/>
<rect x="15" y="606" width="870" height="11" fill="#2C3E50"/>
<text x="450" y="611" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Complexity Summary</text>
<line x1="15" y1="617" x2="885" y2="617" stroke="#DEE2E6"/>
<rect x="15" y="617" width="870" height="17" fill="#FDEDEC"/>
<text x="200" y="629" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Brute Force (nested)</text>
<text x="500" y="629" font-family="Arial" font-size="10" fill="#E74C3C" text-anchor="middle">O(n²)</text>
<text x="700" y="629" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">O(1)</text>
<text x="810" y="629" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Works for any values</text>
<line x1="15" y1="634" x2="885" y2="634" stroke="#DEE2E6"/>
<rect x="15" y="634" width="870" height="17" fill="#EAFAF1"/>
<text x="200" y="646" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Sliding Window ⭐</text>
<text x="500" y="646" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<text x="700" y="646" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
<text x="810" y="646" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Non-negative only!</text>
<line x1="370" y1="617" x2="370" y2="651" stroke="#DEE2E6"/>
<line x1="600" y1="617" x2="600" y2="651" stroke="#DEE2E6"/>
<line x1="760" y1="617" x2="760" y2="651" stroke="#DEE2E6"/>
</svg>
