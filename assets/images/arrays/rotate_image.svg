  <text x="434" y="423" font-family="Arial" font-size="11" font-weight="bold" fill="#E74C3C" text-anchor="middle">Original</text>
  <rect x="398" y="427" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="414" y="448" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
  <rect x="434" y="427" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="450" y="448" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
  <rect x="470" y="427" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="486" y="448" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
  <rect x="398" y="463" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="414" y="484" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
  <rect x="434" y="463" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="450" y="484" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
  <rect x="470" y="463" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="486" y="484" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">6</text>
  <rect x="398" y="499" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="414" y="520" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">7</text>
  <rect x="434" y="499" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="450" y="520" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">8</text>
  <rect x="470" y="499" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="486" y="520" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9</text>
</g>
<!-- State 1: Transposed -->
<g class="ms1">
  <text x="434" y="423" font-family="Arial" font-size="11" font-weight="bold" fill="#F39C12" text-anchor="middle">After Transpose (swap[i][j]↔[j][i])</text>
  <rect x="398" y="427" width="32" height="32" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="2"/><text x="414" y="448" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
  <rect x="434" y="427" width="32" height="32" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="2"/><text x="450" y="448" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
  <rect x="470" y="427" width="32" height="32" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="2"/><text x="486" y="448" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">7</text>
  <rect x="398" y="463" width="32" height="32" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="2"/><text x="414" y="484" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
  <rect x="434" y="463" width="32" height="32" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="2"/><text x="450" y="484" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
  <rect x="470" y="463" width="32" height="32" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="2"/><text x="486" y="484" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">8</text>
  <rect x="398" y="499" width="32" height="32" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="2"/><text x="414" y="520" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
  <rect x="434" y="499" width="32" height="32" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="2"/><text x="450" y="520" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">6</text>
  <rect x="470" y="499" width="32" height="32" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="2"/><text x="486" y="520" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9</text>
</g>
<!-- State 2: Reversed rows -->
<g class="ms2">
  <text x="434" y="423" font-family="Arial" font-size="11" font-weight="bold" fill="#27AE60" text-anchor="middle">After Reverse Each Row → Done! ✓</text>
  <rect x="398" y="427" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="414" y="448" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">7</text>
