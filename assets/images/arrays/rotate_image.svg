  <rect x="470" y="427" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="486" y="448" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
  <rect x="398" y="463" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="414" y="484" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">8</text>
  <rect x="434" y="463" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="450" y="484" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
  <rect x="470" y="463" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="486" y="484" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
  <rect x="398" y="499" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="414" y="520" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9</text>
  <rect x="434" y="499" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="450" y="520" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">6</text>
  <rect x="470" y="499" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="486" y="520" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
</g>
<!-- Step labels for approach 2 -->
<text class="lb1" x="680" y="470" font-family="Arial" font-size="11" fill="#555">Step 1: Transpose</text>
<text class="lb1" x="680" y="487" font-family="Arial" font-size="11" fill="#555">swap[i][j] ↔ [j][i]</text>
<text class="lb1" x="680" y="504" font-family="Arial" font-size="11" fill="#555">for i &lt; j only</text>
<text class="lb2" x="680" y="470" font-family="Arial" font-size="11" fill="#E67E22">1→[0][0] 4→[0][1]</text>
<text class="lb2" x="680" y="487" font-family="Arial" font-size="11" fill="#E67E22">7→[0][2] etc.</text>
<text class="lb2" x="680" y="504" font-family="Arial" font-size="11" fill="#E67E22">Transposed ✓</text>
<text class="lb3" x="680" y="470" font-family="Arial" font-size="11" fill="#27AE60">Step 2: Reverse</text>
<text class="lb3" x="680" y="487" font-family="Arial" font-size="11" fill="#27AE60">[1,4,7]→[7,4,1]</text>
<text class="lb3" x="680" y="504" font-family="Arial" font-size="11" fill="#27AE60">Rotated 90°CW ✓</text>
<text x="450" y="560" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Works because rotation = transpose + reverse. Mathematical identity!</text>
<text x="450" y="575" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Anti-clockwise: reverse rows first, then transpose.</text>

