<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Extra matrix - copy highlight sweeps */
@keyframes copy_hl{0%,15%{opacity:0}16%,85%{opacity:1}86%,100%{opacity:0}}
.chl{animation:copy_hl 5s ease-in-out infinite}
/* Approach 2: matrix state transitions */
@keyframes ms0{0%,28%{opacity:1}29%,100%{opacity:0}}
@keyframes ms1{0%,28%{opacity:0}29%,62%{opacity:1}63%,100%{opacity:0}}
@keyframes ms2{0%,62%{opacity:0}63%,88%{opacity:1}89%,100%{opacity:0}}
.ms0{animation:ms0 6s ease-in-out infinite}
.ms1{animation:ms1 6s ease-in-out infinite}
.ms2{animation:ms2 6s ease-in-out infinite}
@keyframes lbl1{0%,28%{opacity:1}29%,100%{opacity:0}}
@keyframes lbl2{0%,28%{opacity:0}29%,62%{opacity:1}63%,100%{opacity:0}}
@keyframes lbl3{0%,62%{opacity:0}63%,88%{opacity:1}89%,100%{opacity:0}}
.lb1{animation:lbl1 6s ease-in-out infinite}
.lb2{animation:lbl2 6s ease-in-out infinite}
.lb3{animation:lbl3 6s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Rotate Image (90° Clockwise)</text>
<rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
<text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">[[1,2,3],[4,5,6],[7,8,9]] → [[7,4,1],[8,5,2],[9,6,3]] (90° clockwise)</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">In-place rotation: transpose matrix (swap along diagonal), then reverse each row → O(1) space.</text>

<!-- APPROACH 1: Extra Matrix -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Extra Matrix — O(n²) time, O(n²) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">new[j][n-1-i] = original[i][j]. Copy each element to its rotated position in a new matrix.</text>
<!-- Left matrix (original): cells 32×32, gap=4, pitch=36 -->
<!-- start_x=155, start_y=170 -->
<!-- row0: y=170, row1: y=206, row2: y=242. col0: x=155, col1: x=191, col2: x=227 -->
<text x="191" y="168" font-family="Arial" font-size="11" font-weight="bold" fill="#555" text-anchor="middle">Original</text>
<rect x="155" y="172" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="171" y="193" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="191" y="172" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="207" y="193" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="227" y="172" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="243" y="193" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="155" y="208" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="171" y="229" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="191" y="208" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="207" y="229" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="227" y="208" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="243" y="229" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">6</text>
<rect x="155" y="244" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="171" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">7</text>
<rect x="191" y="244" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="207" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">8</text>
<rect x="227" y="244" width="32" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="2"/><text x="243" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9</text>
<!-- Formula box -->
<rect x="290" y="185" width="250" height="60" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5" rx="5"/>
<text x="415" y="207" font-family="Arial" font-size="12" font-weight="bold" fill="#E67E22" text-anchor="middle">Rotation formula:</text>
<text x="415" y="227" font-family="Arial" font-size="12" fill="#555" text-anchor="middle">new[j][n-1-i] = src[i][j]</text>
<text x="415" y="244" font-family="Arial" font-size="11" fill="#888" text-anchor="middle">e.g. src[0][2]=3 → new[2][2]=3</text>
<!-- Arrow -->
<line x1="560" y1="210" x2="595" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arr1)"/>
<defs><marker id="arr1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#555"/></marker></defs>
<!-- Right matrix (result) -->
<!-- start_x=605, start_y=170 -->
<text x="641" y="168" font-family="Arial" font-size="11" font-weight="bold" fill="#27AE60" text-anchor="middle">Rotated 90°CW</text>
<rect x="605" y="172" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="621" y="193" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">7</text>
<rect x="641" y="172" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="657" y="193" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="677" y="172" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="693" y="193" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="605" y="208" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="621" y="229" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">8</text>
<rect x="641" y="208" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="657" y="229" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="677" y="208" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="693" y="229" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<rect x="605" y="244" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="621" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">9</text>
<rect x="641" y="244" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="657" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">6</text>
<rect x="677" y="244" width="32" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="2"/><text x="693" y="265" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<text x="450" y="302" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Requires O(n²) extra space. Fine for most interviews, but not optimal.</text>
<text x="450" y="318" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Copies each element to new[col][n-1-row]. Then copy new matrix back.</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="210" y="329" width="480" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Transpose (swap [i][j]↔[j][i]) then reverse each row → in-place O(1) space!</text>

<!-- APPROACH 2: Transpose + Reverse -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Transpose + Reverse Rows — O(n²) time, O(1) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Step 1: Transpose (swap matrix[i][j] with matrix[j][i])  Step 2: Reverse each row</text>
