<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Linear scan */
@keyframes lin_ptr{0%,8%{transform:translateX(0)}20%,27%{transform:translateX(48px)}39%,46%{transform:translateX(96px)}58%,65%{transform:translateX(144px)}77%,84%{transform:translateX(192px)}95%,100%{transform:translateX(0)}}
.lp{animation:lin_ptr 5s ease-in-out infinite}
@keyframes min_hl{0%,65%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}66%,90%{fill:#D5F5E3;stroke:#27AE60;stroke-width:3}91%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
.mhl{animation:min_hl 5s ease-in-out infinite}
/* Approach 2: Binary Search */
@keyframes bs_mid{0%,10%{transform:translateX(96px)}28%,38%{transform:translateX(144px)}55%,65%{transform:translateX(144px)}80%,90%{transform:translateX(144px)}95%,100%{transform:translateX(96px)}}
.bm{animation:bs_mid 6s ease-in-out infinite}
@keyframes bl0{0%,10%{opacity:1}28%,100%{opacity:0}}
@keyframes bl1{0%,27%{opacity:0}28%,55%{opacity:1}56%,100%{opacity:0}}
@keyframes bl2{0%,54%{opacity:0}55%,80%{opacity:1}81%,100%{opacity:0}}
@keyframes bl3{0%,79%{opacity:0}80%,95%{opacity:1}96%,100%{opacity:0}}
.bl0{animation:bl0 6s ease-in-out infinite}
.bl1{animation:bl1 6s ease-in-out infinite}
.bl2{animation:bl2 6s ease-in-out infinite}
.bl3{animation:bl3 6s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Minimum in Rotated Sorted Array</text>
<rect x="820" y="12" width="62" height="28" fill="#F39C12" rx="14"/>
<text x="851" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">arr=[3,4,5,1,2] → minimum = 1 (original sorted: [1,2,3,4,5], rotated 3 steps)</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Find minimum of a rotated sorted array. Binary Search: min is at rotation point. Compare mid with hi.</text>

<!-- APPROACH 1: Linear -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Linear Scan — O(n) time, O(1) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Scan the array tracking the minimum value seen so far</text>
<!-- Array [3,4,5,1,2], 5 elements, start_x=333 -->
<rect x="333" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="381" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="429" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="477" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="mhl"/>
<text x="498" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="525" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="546" y="204" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<!-- Rotation pivot marker -->
<line x1="477" y1="173" x2="477" y2="225" stroke="#E74C3C" stroke-width="2" stroke-dasharray="3,3"/>
<text x="477" y="170" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">pivot</text>
<g class="lp" transform="translate(354,178)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#E74C3C"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">i</text>
</g>
<text x="450" y="260" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Scan: min=3→3→3→1→1. Minimum = 1 at index 3 ✓</text>
<text x="450" y="277" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Simple O(n) — but we're ignoring the sorted structure. Binary search gives O(log n).</text>
<text x="450" y="294" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Key insight: minimum is always where the "break" occurs — where arr[mid] &gt; arr[hi].</text>
<text x="450" y="308" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">If arr[mid] &lt; arr[hi]: min is in left half (including mid). Else min is in right half.</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="230" y="329" width="440" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Compare arr[mid] with arr[hi]: min is always in the "taller" half!</text>

<!-- APPROACH 2: Binary Search -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Binary Search — O(log n) time, O(1) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">if arr[mid]&gt;arr[hi]: min in right half. Else min in left half. lo==hi → minimum found.</text>
<!-- Same array for binary search -->
<rect x="333" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="454" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="381" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="454" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="429" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="454" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="477" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="mhl"/>
<text x="498" y="454" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="525" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="546" y="454" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<!-- lo/hi markers -->
<text x="354" y="483" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">lo=0</text>
<text x="546" y="483" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">hi=4</text>
<!-- mid pointer animated -->
<g class="bm" transform="translate(333,428)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#27AE60"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">mid</text>
</g>
<!-- Step labels -->
<text class="bl0" x="650" y="450" font-family="Arial" font-size="10" fill="#555">mid=2(5): 5&gt;arr[4]=2 → lo=3</text>
<text class="bl1" x="650" y="450" font-family="Arial" font-size="10" fill="#555">mid=3(1): 1≤arr[4]=2 → hi=3</text>
<text class="bl2" x="650" y="450" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">lo=hi=3: min=arr[3]=1 ✓</text>
<text class="bl3" x="650" y="450" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">Done in 2 steps!</text>
<text x="450" y="510" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Binary search finds minimum in O(log n) — just 2 iterations! ✓</text>
<text x="450" y="527" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">If arr[mid] &gt; arr[hi]: rotation is in right half, min is there → lo = mid+1</text>
<text x="450" y="544" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">If arr[mid] ≤ arr[hi]: min is in left half (could be mid itself) → hi = mid</text>
<text x="450" y="561" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">When lo==hi: arr[lo] is the minimum. No duplicates assumption needed here.</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Linear Scan</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Binary Search ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(log n)</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
