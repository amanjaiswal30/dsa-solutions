<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Brute - i fixed, j and k sweep */
@keyframes brute_j{0%,8%{transform:translateX(0)}20%,28%{transform:translateX(48px)}40%,48%{transform:translateX(96px)}60%,68%{transform:translateX(144px)}80%,100%{transform:translateX(0)}}
.bj{animation:brute_j 6s ease-in-out infinite}
@keyframes brute_k{0%,8%{transform:translateX(96px)}20%,28%{transform:translateX(144px)}40%,48%{transform:translateX(192px)}60%,68%{transform:translateX(240px)}80%,100%{transform:translateX(96px)}}
.bk{animation:brute_k 6s ease-in-out infinite}
/* Approach 2: Sort+TwoPtr */
@keyframes fix_i{0%,40%{transform:translateX(0)}45%,100%{transform:translateX(48px)}}
.fi{animation:fix_i 7s ease-in-out infinite}
@keyframes tptr_L{0%,10%{transform:translateX(48px)}25%,35%{transform:translateX(96px)}50%,60%{transform:translateX(144px)}75%,85%{transform:translateX(192px)}95%,100%{transform:translateX(48px)}}
.tL{animation:tptr_L 7s ease-in-out infinite}
@keyframes tptr_R{0%,10%{transform:translateX(240px)}25%,35%{transform:translateX(192px)}50%,60%{transform:translateX(144px)}75%,85%{transform:translateX(96px)}95%,100%{transform:translateX(240px)}}
.tR{animation:tptr_R 7s ease-in-out infinite}
@keyframes tp_l0{0%,10%{opacity:1}25%,100%{opacity:0}}
@keyframes tp_l1{0%,24%{opacity:0}25%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes tp_l2{0%,49%{opacity:0}50%,75%{opacity:1}76%,100%{opacity:0}}
@keyframes tp_l3{0%,74%{opacity:0}75%,95%{opacity:1}96%,100%{opacity:0}}
.tl0{animation:tp_l0 7s ease-in-out infinite}
.tl1{animation:tp_l1 7s ease-in-out infinite}
.tl2{animation:tp_l2 7s ease-in-out infinite}
.tl3{animation:tp_l3 7s ease-in-out infinite}
@keyframes found_flash{0%,50%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}51%,75%{fill:#D5F5E3;stroke:#27AE60;stroke-width:3}76%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
.ff1{animation:found_flash 7s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">3-Sum (Three Sum)</text>
<rect x="820" y="12" width="62" height="28" fill="#F39C12" rx="14"/>
<text x="851" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">arr=[-1,-1,0,1,2,-4] → [[-1,-1,2],[-1,0,1]] (all unique triplets summing to 0)</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Find all unique triplets that sum to zero. Sort+TwoPointer avoids duplicates cleanly.</text>

<!-- APPROACH 1: Brute -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Brute Force — O(n³) time, O(1) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Three nested loops: check all (i,j,k) combinations. Deduplicate using Set.</text>
<!-- Array [-4,-1,-1,0,1,2], 6 elements, start_x=309 -->
<text x="170" y="200" font-family="Arial" font-size="11" fill="#555">Array:</text>
<rect x="309" y="178" width="42" height="42" fill="#FDEBD0" stroke="#E67E22" stroke-width="3" rx="3"/>
<text x="330" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">-4</text>
<rect x="357" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="378" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">-1</text>
<rect x="405" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="426" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">-1</text>
<rect x="453" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="474" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">0</text>
<rect x="501" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="522" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="549" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="570" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<!-- i pointer (fixed at 0/-4) -->
<text x="330" y="168" font-family="Arial" font-size="9" fill="#E67E22" text-anchor="middle">i(fixed)</text>
<!-- j pointer animated -->
<g class="bj" transform="translate(357,178)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#3498DB"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">j</text>
</g>
<!-- k pointer animated (starts 2 ahead of j) -->
<g class="bk" transform="translate(309,178)">
  <polygon points="-7,55 7,55 0,46" fill="#9B59B6"/>
  <text x="0" y="70" font-family="Arial" font-size="9" fill="#9B59B6" text-anchor="middle">k</text>
</g>
<text x="450" y="270" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">For each i: j from i+1..n, k from j+1..n → check if arr[i]+arr[j]+arr[k]==0</text>
<text x="450" y="287" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">O(n³) — too slow! Use a Set to avoid duplicate triplets.</text>
<text x="450" y="304" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">With sorting: skip duplicates for i and j → still O(n³) but finds unique triplets.</text>
<text x="450" y="318" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Can we reduce to O(n²) using two pointers?</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="240" y="329" width="420" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Sort once, fix i, use two-pointer for j and k → O(n²)!</text>

<!-- APPROACH 2: Sort + Two Pointer -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Sort + Two Pointer — O(n²) time, O(1) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Sort → fix i, L=i+1, R=n-1; move L/R based on sum. Skip duplicates!</text>
<!-- Sorted array [-4,-1,-1,0,1,2] -->
<text x="170" y="450" font-family="Arial" font-size="11" fill="#555">Sorted:</text>
<rect x="309" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="330" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">-4</text>
<rect x="357" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="ff1"/>
<text x="378" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">-1</text>
<rect x="405" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="ff1"/>
<text x="426" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">-1</text>
<rect x="453" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="474" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">0</text>
<rect x="501" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="522" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="549" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="ff1"/>
<text x="570" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<!-- Fixed i pointer -->
<g class="fi" transform="translate(309,428)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#E74C3C"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">i</text>
</g>
<!-- L pointer (animated) -->
<g class="tL" transform="translate(309,428)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#3498DB"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">L</text>
</g>
<!-- R pointer (animated, below) -->
<g class="tR" transform="translate(309,428)">
  <polygon points="-7,55 7,55 0,46" fill="#9B59B6"/>
  <text x="0" y="70" font-family="Arial" font-size="9" fill="#9B59B6" text-anchor="middle">R</text>
</g>
<!-- Step labels -->
<text class="tl0" x="650" y="450" font-family="Arial" font-size="10" fill="#555">i=-4: L=-1,R=2 sum=-3&lt;0 L++</text>
<text class="tl1" x="650" y="450" font-family="Arial" font-size="10" fill="#555">i=-4: L=-1,R=2 sum=-3 L++</text>
<text class="tl2" x="650" y="450" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">i=-1: L=-1,R=2 sum=0 ✓ found!</text>
<text class="tl3" x="650" y="450" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">i=-1: L=0,R=1 sum=0 ✓ found!</text>
<text x="450" y="510" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Triplets: [-1,-1,2] and [-1,0,1] found ✓</text>
<text x="450" y="527" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">sum&lt;0: L++ (need bigger). sum&gt;0: R-- (need smaller). sum=0: record &amp; skip dups.</text>
<text x="450" y="544" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Skip dups: while arr[i]==arr[i-1] skip. while arr[L]==arr[L-1] skip after recording.</text>
<text x="450" y="561" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Sort: O(n log n). Two-pointer per i: O(n). Total: O(n²). No extra space needed!</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Brute Force (3 loops)</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n³)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)*</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Sort + Two Pointer ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n²)</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)*</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
