<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Brute - i fixed, j sweeps */
@keyframes brute_i{0%,40%{transform:translateX(0)}45%,100%{transform:translateX(48px)}}
.bi{animation:brute_i 7s ease-in-out infinite}
@keyframes brute_j{0%,8%{transform:translateX(0)}20%,27%{transform:translateX(48px)}39%,46%{transform:translateX(96px)}58%,65%{transform:translateX(144px)}77%,84%{transform:translateX(192px)}95%,100%{transform:translateX(0)}}
.bj{animation:brute_j 7s ease-in-out infinite}
@keyframes bl0{0%,8%{opacity:1}20%,100%{opacity:0}}
@keyframes bl1{0%,19%{opacity:0}20%,39%{opacity:1}40%,100%{opacity:0}}
@keyframes bl2{0%,38%{opacity:0}39%,58%{opacity:1}59%,100%{opacity:0}}
@keyframes bl3{0%,57%{opacity:0}58%,77%{opacity:1}78%,100%{opacity:0}}
@keyframes bl4{0%,76%{opacity:0}77%,95%{opacity:1}96%,100%{opacity:0}}
.bl0{animation:bl0 7s ease-in-out infinite}
.bl1{animation:bl1 7s ease-in-out infinite}
.bl2{animation:bl2 7s ease-in-out infinite}
.bl3{animation:bl3 7s ease-in-out infinite}
.bl4{animation:bl4 7s ease-in-out infinite}
/* Approach 2: Prefix sum + HashMap */
@keyframes ps_scan{0%,5%{transform:translateX(0)}18%,22%{transform:translateX(48px)}34%,38%{transform:translateX(96px)}50%,54%{transform:translateX(144px)}66%,70%{transform:translateX(192px)}85%,100%{transform:translateX(0)}}
.ps{animation:ps_scan 7s ease-in-out infinite}
@keyframes pl0{0%,5%{opacity:1}18%,100%{opacity:0}}
@keyframes pl1{0%,17%{opacity:0}18%,34%{opacity:1}35%,100%{opacity:0}}
@keyframes pl2{0%,33%{opacity:0}34%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes pl3{0%,49%{opacity:0}50%,66%{opacity:1}67%,100%{opacity:0}}
@keyframes pl4{0%,65%{opacity:0}66%,85%{opacity:1}86%,100%{opacity:0}}
.pl0{animation:pl0 7s ease-in-out infinite}
.pl1{animation:pl1 7s ease-in-out infinite}
.pl2{animation:pl2 7s ease-in-out infinite}
.pl3{animation:pl3 7s ease-in-out infinite}
.pl4{animation:pl4 7s ease-in-out infinite}
@keyframes match_hl{0%,34%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}35%,50%{fill:#D5F5E3;stroke:#27AE60;stroke-width:3}51%,66%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}67%,82%{fill:#D5F5E3;stroke:#27AE60;stroke-width:3}83%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
.mhl{animation:match_hl 7s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Subarray Sum Equals K</text>
<rect x="820" y="12" width="62" height="28" fill="#F39C12" rx="14"/>
<text x="851" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">arr=[1,1,1], k=2 → count=2 (subarrays: [1,1] at [0,1] and [1,1] at [1,2])</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Count subarrays with sum exactly k. Can have negatives. Prefix sum + HashMap for O(n).</text>

<!-- APPROACH 1: Brute Force -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Brute Force — O(n²) time, O(1) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Fix i, expand j rightward summing; count when sum==k</text>
<!-- Array [1,1,1], 5 elements for visual: extend to [1,1,1,2,0] start_x=333 -->
<!-- Simpler: use [1,2,3,4] k=3 for 2 approaches -->
<!-- Actually keep [1,1,1] k=2 but add padding: use 5-element view [0,1,1,1,0] or just 3 big boxes -->
<!-- Use 3 boxes with bigger gap for clarity -->
<text x="150" y="200" font-family="Arial" font-size="11" fill="#555">arr=[1,1,1], k=2:</text>
<!-- 3 large boxes at x=333,381,429 for [1,1,1] -->
<rect x="333" y="178" width="60" height="50" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="363" y="210" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="405" y="178" width="60" height="50" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="mhl"/>
<text x="435" y="210" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="477" y="178" width="60" height="50" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="mhl"/>
<text x="507" y="210" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<!-- Index labels -->
<text x="363" y="240" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[0]</text>
<text x="435" y="240" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[1]</text>
<text x="507" y="240" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[2]</text>
<!-- i pointer (fixed then moves) -->
<g class="bi" transform="translate(333,178)">
  <polygon points="-14,-14 14,-14 0,-4" fill="#E74C3C"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">i</text>
</g>
<!-- j pointer sweeps -->
<g class="bj" transform="translate(333,178)">
  <polygon points="-14,63 14,63 0,54" fill="#F39C12"/>
  <text x="0" y="78" font-family="Arial" font-size="9" fill="#F39C12" text-anchor="middle">j</text>
</g>
<!-- Sum labels -->
<text class="bl0" x="640" y="210" font-family="Arial" font-size="11" fill="#555">i=0,j=0: sum=1</text>
<text class="bl1" x="640" y="210" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">i=0,j=1: sum=2==k! cnt=1</text>
<text class="bl2" x="640" y="210" font-family="Arial" font-size="11" fill="#555">i=0,j=2: sum=3&gt;k</text>
<text class="bl3" x="640" y="210" font-family="Arial" font-size="11" fill="#555">i=1,j=1: sum=1</text>
<text class="bl4" x="640" y="210" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">i=1,j=2: sum=2==k! cnt=2 ✓</text>
<text x="450" y="271" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">2 subarrays found with sum=2 ✓</text>
<text x="450" y="288" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">O(n²) — try all pairs (i,j). Can't use sliding window (negatives allowed).</text>
<text x="450" y="305" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Prefix sum: prefixSum[j]-prefixSum[i-1]=k → prefixSum[i-1]=prefixSum[j]-k</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="200" y="329" width="500" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 HashMap stores prefix sum frequencies → look up prefixSum-k in O(1)!</text>

<!-- APPROACH 2: Prefix Sum + HashMap -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Prefix Sum + HashMap — O(n) time, O(n) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">map[0]=1. For each i: prefixSum+=arr[i]; if map has (prefixSum-k): count+=map[prefixSum-k]; map[prefixSum]++</text>
<!-- Same [1,1,1] array -->
<rect x="333" y="428" width="60" height="50" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="363" y="460" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="405" y="428" width="60" height="50" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="435" y="460" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="477" y="428" width="60" height="50" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="507" y="460" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<!-- Scanner pointer -->
<g class="ps" transform="translate(333,428)">
  <polygon points="-14,-14 14,-14 0,-4" fill="#27AE60"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">i</text>
</g>
<!-- Prefix sum labels -->
<text class="pl0" x="620" y="450" font-family="Arial" font-size="11" fill="#555">init: map={0:1}, sum=0, cnt=0</text>
<text class="pl1" x="620" y="450" font-family="Arial" font-size="11" fill="#555">i=0: sum=1. map[1-2]? No. map={0:1,1:1}</text>
<text class="pl2" x="620" y="450" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">i=1: sum=2. map[2-2]=map[0]=1! cnt=1</text>
<text class="pl3" x="620" y="450" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">i=2: sum=3. map[3-2]=map[1]=1! cnt=2</text>
<text class="pl4" x="620" y="450" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Final count = 2 ✓</text>
<text x="450" y="498" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n) one-pass with HashMap — handles negatives! count=2 ✓</text>
<text x="450" y="515" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Key: map[prefixSum-k] counts subarrays ending at i with sum=k.</text>
<text x="450" y="532" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">prefixSum[j]-prefixSum[i]=k means subarray [i+1..j] has sum k. So we look for prefixSum-k.</text>
<text x="450" y="549" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Init map with {0:1} handles subarrays starting from index 0 (prefix sum itself == k).</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Brute Force</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n²)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Prefix Sum + HashMap ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
