<svg width="900" height="900" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Brute - overlap check labels */
@keyframes brl0{0%,12%{opacity:1}13%,100%{opacity:0}}
@keyframes brl1{0%,12%{opacity:0}13%,30%{opacity:1}31%,100%{opacity:0}}
@keyframes brl2{0%,30%{opacity:0}31%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes brl3{0%,50%{opacity:0}51%,68%{opacity:1}69%,100%{opacity:0}}
@keyframes brl4{0%,68%{opacity:0}69%,80%{opacity:1}81%,100%{opacity:0}}
@keyframes ovr_hl{0%,30%{opacity:0;fill:#EBF5FB}31%,65%{opacity:1;fill:#FDF2F8}66%,100%{opacity:0;fill:#EBF5FB}}
.brl0{animation:brl0 8s ease-in-out infinite}.brl1{animation:brl1 8s ease-in-out infinite}
.brl2{animation:brl2 8s ease-in-out infinite}.brl3{animation:brl3 8s ease-in-out infinite}
.brl4{animation:brl4 8s ease-in-out infinite}
.ovr{animation:ovr_hl 8s ease-in-out infinite}
/* Approach 2: MinHeap - heap state labels */
@keyframes hpl0{0%,12%{opacity:1}13%,100%{opacity:0}}
@keyframes hpl1{0%,12%{opacity:0}13%,30%{opacity:1}31%,100%{opacity:0}}
@keyframes hpl2{0%,30%{opacity:0}31%,52%{opacity:1}53%,100%{opacity:0}}
@keyframes hpl3{0%,52%{opacity:0}53%,70%{opacity:1}71%,100%{opacity:0}}
@keyframes hpl4{0%,70%{opacity:0}71%,82%{opacity:1}83%,100%{opacity:0}}
.hpl0{animation:hpl0 8s ease-in-out infinite}.hpl1{animation:hpl1 8s ease-in-out infinite}
.hpl2{animation:hpl2 8s ease-in-out infinite}.hpl3{animation:hpl3 8s ease-in-out infinite}
.hpl4{animation:hpl4 8s ease-in-out infinite}
/* Approach 3: Two pointers - i/j pointer advances */
@keyframes ip_ptr{0%,10%{transform:translateX(0)}27%,35%{transform:translateX(48px)}52%,60%{transform:translateX(96px)}77%,85%{transform:translateX(0)}}
@keyframes jp_ptr{0%,35%{transform:translateX(0)}52%,60%{transform:translateX(48px)}77%,85%{transform:translateX(48px)}100%{transform:translateX(0)}}
.ip{animation:ip_ptr 8s ease-in-out infinite}
.jp{animation:jp_ptr 8s ease-in-out infinite}
@keyframes tpl0{0%,10%{opacity:1}27%,100%{opacity:0}}
@keyframes tpl1{0%,26%{opacity:0}27%,52%{opacity:1}53%,100%{opacity:0}}
@keyframes tpl2{0%,51%{opacity:0}52%,60%{opacity:1}61%,100%{opacity:0}}
@keyframes tpl3{0%,76%{opacity:0}77%,85%{opacity:1}86%,100%{opacity:0}}
@keyframes tpl4{0%,84%{opacity:0}85%,95%{opacity:1}96%,100%{opacity:0}}
.tpl0{animation:tpl0 8s ease-in-out infinite}.tpl1{animation:tpl1 8s ease-in-out infinite}
.tpl2{animation:tpl2 8s ease-in-out infinite}.tpl3{animation:tpl3 8s ease-in-out infinite}
.tpl4{animation:tpl4 8s ease-in-out infinite}
</style>
<rect width="900" height="900" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Minimum Number of Meeting Rooms</text>
<rect x="800" y="12" width="82" height="28" fill="#F39C12" rx="14"/>
<text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">meetings=[[0,30],[5,10],[15,20]] → 2 rooms needed (meetings overlap!)</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Min rooms = max concurrent meetings. Sort by start + min-heap of end times. Two-pointer is O(n log n).</text>

<!-- APPROACH 1: Brute Force -->
<rect x="15" y="115" width="870" height="185" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Brute Force — O(n²) time, O(1) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">For each meeting, count all other meetings that overlap with it. Max overlap = min rooms.</text>
<!-- Timeline visualization. Scale: 0..35, x_start=100, x_end=820, px_per_unit=(820-100)/35=20.57≈20 -->
<!-- x(t) = 100 + t*20 -->
<!-- Meeting bars -->
<!-- [0,30]: x=100, width=600, y=175 -->
<text x="90" y="189" font-family="Arial" font-size="10" fill="#555" text-anchor="end">M1</text>
<rect x="100" y="175" width="600" height="22" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="3"/>
<text x="400" y="191" font-family="Arial" font-size="11" font-weight="bold" fill="#E67E22" text-anchor="middle">[0, 30]</text>
<!-- [5,10]: x=200, width=100, y=200 -->
<text x="90" y="214" font-family="Arial" font-size="10" fill="#555" text-anchor="end">M2</text>
<rect x="200" y="200" width="100" height="22" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="250" y="216" font-family="Arial" font-size="11" font-weight="bold" fill="#3498DB" text-anchor="middle">[5,10]</text>
<!-- [15,20]: x=400, width=100, y=225 -->
<text x="90" y="239" font-family="Arial" font-size="10" fill="#555" text-anchor="end">M3</text>
<rect x="400" y="225" width="100" height="22" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/>
<text x="450" y="241" font-family="Arial" font-size="11" font-weight="bold" fill="#27AE60" text-anchor="middle">[15,20]</text>
<!-- Timeline axis -->
<line x1="100" y1="255" x2="820" y2="255" stroke="#BDC3C7" stroke-width="1"/>
<text x="100" y="268" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">0</text>
<text x="200" y="268" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">5</text>
<text x="400" y="268" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">15</text>
<text x="500" y="268" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">20</text>
<text x="700" y="268" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">30</text>
<!-- Overlap annotation -->
<rect x="200" y="173" width="100" height="72" class="ovr" rx="2"/>
<!-- Step labels -->
<text class="brl0" x="450" y="288" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">Check M1 vs M2: [0,30]∩[5,10] → overlap (5&lt;30 and 10&gt;0) → 2 concurrent!</text>
<text class="brl1" x="450" y="288" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">Check M1 vs M3: [0,30]∩[15,20] → overlap (15&lt;30 and 20&gt;0) → 2 concurrent!</text>
<text class="brl2" x="450" y="288" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">Check M2 vs M3: [5,10]∩[15,20] → NO overlap (15≥10) → 1 concurrent</text>
<text class="brl3" x="450" y="288" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">Max concurrent at any time = 2 (e.g., at t=7: M1+M2 both active)</text>
<text class="brl4" x="450" y="288" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">Minimum rooms needed = 2 ✓</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="300" x2="450" y2="335" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,335 450,343 456,335" fill="#7F8C8D"/>
<rect x="210" y="304" width="480" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="319" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Sort by start time + min-heap of earliest endings → O(n log n)</text>

<!-- APPROACH 2: Min-Heap -->
<rect x="15" y="343" width="870" height="185" fill="#FFFFFF" stroke="#F39C12" stroke-width="2" rx="7"/>
<rect x="15" y="343" width="870" height="40" fill="#F39C12" rx="7"/>
<rect x="15" y="368" width="870" height="15" fill="#F39C12"/>
<text x="450" y="368" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Sort + Min-Heap — O(n log n) time, O(n) space</text>
<text x="450" y="381" font-family="Arial" font-size="10" fill="#FEF9E7" text-anchor="middle">Sort by start. For each meeting: if earliest-ending room is free, reuse it. Else add new room.</text>
<!-- Sorted meetings as boxes -->
<text x="200" y="402" font-family="Arial" font-size="11" font-weight="bold" fill="#555" text-anchor="middle">Sorted meetings (by start):</text>
<rect x="310" y="408" width="80" height="32" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="3"/>
<text x="350" y="429" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">[0,30]</text>
<rect x="400" y="408" width="80" height="32" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="440" y="429" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">[5,10]</text>
<rect x="490" y="408" width="80" height="32" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/>
<text x="530" y="429" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">[15,20]</text>
<!-- Heap state labels -->
<text class="hpl0" x="450" y="465" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">Process [0,30]: heap empty, add room. heap={30}, rooms=1</text>
<text class="hpl1" x="450" y="465" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">Process [5,10]: start=5 &lt; heap.min=30. No free room → new room! heap={10,30}, rooms=2</text>
<text class="hpl2" x="450" y="465" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">Process [15,20]: start=15 &gt; heap.min=10 → room free! Remove 10, add 20. heap={20,30}</text>
<text class="hpl3" x="450" y="465" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">Done. Max heap size was 2 → 2 rooms needed ✓</text>
<text class="hpl4" x="450" y="465" font-family="Arial" font-size="11" fill="#888" text-anchor="middle">Heap tracks earliest available room. If start ≥ min-end → reuse that room.</text>
<!-- Heap visualization -->
<rect x="650" y="408" width="210" height="72" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5" rx="5"/>
<text x="755" y="426" font-family="Arial" font-size="10" font-weight="bold" fill="#E67E22" text-anchor="middle">Min-Heap (end times)</text>
<text class="hpl0" x="755" y="446" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">heap = {30}  rooms=1</text>
<text class="hpl1" x="755" y="446" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">heap = {10, 30}  rooms=2</text>
<text class="hpl2" x="755" y="446" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">heap = {20, 30}  rooms=2</text>
<text class="hpl3" x="755" y="446" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">heap = {20, 30}  ans=2 ✓</text>
<text x="450" y="498" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Heap.min = earliest a meeting ends = earliest a room becomes free.</text>
<text x="450" y="515" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">If next meeting starts before heap.min, we need a new room.</text>

<!-- Arrow 2→3 -->
<line x1="450" y1="528" x2="450" y2="563" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,563 450,571 456,563" fill="#7F8C8D"/>
<rect x="200" y="532" width="500" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="547" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Two sorted arrays (starts, ends) + two pointers → O(n log n), same complexity, no heap</text>

<!-- APPROACH 3: Two Pointers (Sorted Start + End arrays) -->
<rect x="15" y="571" width="870" height="185" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="571" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="596" width="870" height="15" fill="#27AE60"/>
<text x="450" y="596" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 3: Two Sorted Arrays + Two Pointers — O(n log n) time, O(n) space ⭐</text>
<text x="450" y="609" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Sort starts and ends separately. If starts[i] &lt; ends[j]: need room (rooms++, i++). Else: free room (rooms--, j++).</text>
<!-- starts=[0,5,15]: 3 boxes -->
<text x="230" y="632" font-family="Arial" font-size="11" font-weight="bold" fill="#555" text-anchor="middle">starts (sorted):</text>
<rect x="310" y="622" width="44" height="36" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/>
<text x="332" y="645" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">0</text>
<rect x="360" y="622" width="44" height="36" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/>
<text x="382" y="645" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="410" y="622" width="44" height="36" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/>
<text x="432" y="645" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">15</text>
<!-- i pointer -->
<g class="ip" transform="translate(332,622)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#27AE60"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">i</text>
</g>
<!-- ends=[10,20,30]: 3 boxes -->
<text x="230" y="680" font-family="Arial" font-size="11" font-weight="bold" fill="#555" text-anchor="middle">ends (sorted):</text>
<rect x="310" y="664" width="44" height="36" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="332" y="687" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">10</text>
<rect x="360" y="664" width="44" height="36" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="382" y="687" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">20</text>
<rect x="410" y="664" width="44" height="36" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="432" y="687" font-family="Arial" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">30</text>
<!-- j pointer -->
<g class="jp" transform="translate(332,664)">
  <polygon points="-7,42 7,42 0,52" fill="#3498DB"/>
  <text x="0" y="66" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">j</text>
</g>
<!-- Step labels -->
<text class="tpl0" x="620" y="645" font-family="Arial" font-size="11" fill="#555">starts[i=0]=0 &lt; ends[j=0]=10 → rooms=1, i++</text>
<text class="tpl1" x="620" y="645" font-family="Arial" font-size="11" fill="#555">starts[i=1]=5 &lt; ends[j=0]=10 → rooms=2, i++</text>
<text class="tpl2" x="620" y="645" font-family="Arial" font-size="11" fill="#555">starts[i=2]=15 &gt;= ends[j=0]=10 → rooms=1, j++</text>
<text class="tpl3" x="620" y="645" font-family="Arial" font-size="11" fill="#555">starts[i=2]=15 &lt; ends[j=1]=20 → rooms=2, i++</text>
<text class="tpl4" x="620" y="645" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">maxRooms = 2 ✓</text>
<!-- rooms tracker -->
<rect x="490" y="622" width="120" height="78" fill="#FEF9E7" stroke="#27AE60" stroke-width="1.5" rx="5"/>
<text x="550" y="640" font-family="Arial" font-size="10" font-weight="bold" fill="#27AE60" text-anchor="middle">rooms / max</text>
<text class="tpl0" x="550" y="660" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">1 / 1</text>
<text class="tpl1" x="550" y="660" font-family="Arial" font-size="13" font-weight="bold" fill="#E74C3C" text-anchor="middle">2 / 2</text>
<text class="tpl2" x="550" y="660" font-family="Arial" font-size="13" font-weight="bold" fill="#555" text-anchor="middle">1 / 2</text>
<text class="tpl3" x="550" y="660" font-family="Arial" font-size="13" font-weight="bold" fill="#E74C3C" text-anchor="middle">2 / 2</text>
<text class="tpl4" x="550" y="660" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">ans = 2 ✓</text>
<text x="450" y="718" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Intuition: when a meeting starts before the earliest end, we need a new room.</text>
<text x="450" y="735" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">No heap needed — just two sorted arrays and two pointers. Elegant!</text>

<!-- Complexity Table -->
<rect x="15" y="762" width="870" height="130" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="762" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="777" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="782" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="792" x2="885" y2="792" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="792" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="808" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="808" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="808" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="815" x2="885" y2="815" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="815" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="830" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Brute Force</text>
<text x="500" y="830" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n²)</text>
<text x="750" y="830" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)</text>
<line x1="15" y1="837" x2="885" y2="837" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="837" width="870" height="22" fill="#FEF9E7"/>
<text x="200" y="852" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Sort + Min-Heap</text>
<text x="500" y="852" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle">O(n log n)</text>
<text x="750" y="852" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle">O(n)</text>
<line x1="15" y1="859" x2="885" y2="859" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="859" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="875" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Two Sorted Arrays + Pointers ⭐</text>
<text x="500" y="875" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n log n)</text>
<text x="750" y="875" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<line x1="370" y1="792" x2="370" y2="882" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="792" x2="620" y2="882" stroke="#DEE2E6" stroke-width="1"/>
</svg>
