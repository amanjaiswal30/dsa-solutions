<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Brute - interval boxes appear/merge */
@keyframes ivl_scan{0%,10%{transform:translateX(0)}25%,35%{transform:translateX(0)}40%,100%{transform:translateX(0)}}
.isc{animation:ivl_scan 5s ease-in-out infinite}
@keyframes merge_flash{0%,50%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}51%,90%{fill:#D5F5E3;stroke:#27AE60;stroke-width:3}91%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
.mf{animation:merge_flash 4s ease-in-out infinite}
/* Approach 2: Sort+Merge - pointer scans sorted intervals */
@keyframes sort_scan{0%,8%{transform:translateX(0)}22%,30%{transform:translateX(120px)}44%,52%{transform:translateX(240px)}66%,74%{transform:translateX(360px)}88%,100%{transform:translateX(0)}}
.ss{animation:sort_scan 6s ease-in-out infinite}
@keyframes sl0{0%,8%{opacity:1}22%,100%{opacity:0}}
@keyframes sl1{0%,21%{opacity:0}22%,44%{opacity:1}45%,100%{opacity:0}}
@keyframes sl2{0%,43%{opacity:0}44%,66%{opacity:1}67%,100%{opacity:0}}
@keyframes sl3{0%,65%{opacity:0}66%,88%{opacity:1}89%,100%{opacity:0}}
.sl0{animation:sl0 6s ease-in-out infinite}
.sl1{animation:sl1 6s ease-in-out infinite}
.sl2{animation:sl2 6s ease-in-out infinite}
.sl3{animation:sl3 6s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Merge Intervals</text>
<rect x="820" y="12" width="62" height="28" fill="#F39C12" rx="14"/>
<text x="851" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">[[1,3],[2,6],[8,10],[15,18]] → [[1,6],[8,10],[15,18]]</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Merge all overlapping intervals. Sort by start time, then greedily merge while overlap exists.</text>

<!-- APPROACH 1: Brute -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Brute Force — O(n²) time, O(n) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Repeatedly scan for overlapping pairs, merge them until no overlap remains</text>
<!-- Visual intervals as colored bars -->
<!-- Timeline from x=100 to x=780, scale: 1 unit = 38px, offset at x=100 -->
<!-- [1,3]: x=138, w=76 -->
<!-- [2,6]: x=176, w=152 -->
<!-- [8,10]: x=404, w=76 -->
<!-- [15,18]: x=670, w=114 -->
<text x="70" y="200" font-family="Arial" font-size="10" fill="#555">Intervals:</text>
<rect x="150" y="182" width="76" height="30" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="4"/>
<text x="188" y="202" font-family="Arial" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">[1,3]</text>
<rect x="188" y="182" width="152" height="30" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="4" class="mf"/>
<text x="264" y="202" font-family="Arial" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">[2,6] overlaps!</text>
<rect x="454" y="182" width="76" height="30" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="4"/>
<text x="492" y="202" font-family="Arial" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">[8,10]</text>
<rect x="682" y="182" width="114" height="30" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="4"/>
<text x="739" y="202" font-family="Arial" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">[15,18]</text>
<!-- After merge: [1,6] -->
<text x="70" y="240" font-family="Arial" font-size="10" fill="#555">Merged:</text>
<rect x="150" y="222" width="190" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="2.5" rx="4"/>
<text x="245" y="241" font-family="Arial" font-size="11" font-weight="bold" fill="#27AE60" text-anchor="middle">[1,6] ← merged</text>
<rect x="454" y="222" width="76" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="2.5" rx="4"/>
<text x="492" y="241" font-family="Arial" font-size="11" font-weight="bold" fill="#27AE60" text-anchor="middle">[8,10]</text>
<rect x="682" y="222" width="114" height="28" fill="#D5F5E3" stroke="#27AE60" stroke-width="2.5" rx="4"/>
<text x="739" y="241" font-family="Arial" font-size="11" font-weight="bold" fill="#27AE60" text-anchor="middle">[15,18]</text>
<text x="450" y="280" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">Two intervals overlap if: a.start ≤ b.end AND b.start ≤ a.end</text>
<text x="450" y="297" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Repeatedly merge until no changes → O(n²) iterations, O(n) space.</text>
<text x="450" y="311" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Can we do it in one pass by sorting first?</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="220" y="329" width="460" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Sort by start time → overlapping intervals are always adjacent!</text>

<!-- APPROACH 2: Sort + Merge -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Sort + Greedy Merge — O(n log n) time, O(n) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Sort by start. Add first interval to result. For each next: if overlap, extend; else add new.</text>
<!-- 4 intervals as boxes, sorted already: [1,3],[2,6],[8,10],[15,18] -->
<!-- Each interval is 100px wide box -->
<text x="70" y="450" font-family="Arial" font-size="10" fill="#555">Sorted:</text>
<rect x="150" y="428" width="100" height="40" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="4"/>
<text x="200" y="453" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">[1,3]</text>
<rect x="270" y="428" width="100" height="40" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="4"/>
<text x="320" y="453" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">[2,6]</text>
<rect x="390" y="428" width="100" height="40" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="4"/>
<text x="440" y="453" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">[8,10]</text>
<rect x="510" y="428" width="100" height="40" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="4"/>
<text x="560" y="453" font-family="Arial" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">[15,18]</text>
<!-- Scan pointer -->
<g class="ss" transform="translate(150,428)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#27AE60"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">curr</text>
</g>
<!-- Step labels -->
<text class="sl0" x="660" y="452" font-family="Arial" font-size="10" fill="#555">result=[[1,3]]</text>
<text class="sl1" x="660" y="452" font-family="Arial" font-size="10" fill="#555">2≤3: extend to [1,6]</text>
<text class="sl2" x="660" y="452" font-family="Arial" font-size="10" fill="#555">8&gt;6: add [8,10]</text>
<text class="sl3" x="660" y="452" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">15&gt;10: add [15,18] ✓</text>
<text x="450" y="498" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Result: [[1,6],[8,10],[15,18]] ✓</text>
<text x="450" y="515" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">If curr.start ≤ last.end → overlap: last.end = max(last.end, curr.end)</text>
<text x="450" y="532" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Else: add curr to result list. Single pass after O(n log n) sort.</text>
<text x="450" y="549" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Sort guarantees: overlapping intervals are always adjacent. One linear scan suffices!</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Brute (repeat scan)</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n²)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Sort + Greedy Merge ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n log n)</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
