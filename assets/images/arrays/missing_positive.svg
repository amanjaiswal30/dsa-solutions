<svg width="900" height="900" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: HashSet - scanner + state labels */
@keyframes hs_scan{0%,8%{transform:translateX(0)}20%,26%{transform:translateX(48px)}38%,44%{transform:translateX(96px)}56%,62%{transform:translateX(144px)}74%,80%{transform:translateX(0)}}
.hsp{animation:hs_scan 8s ease-in-out infinite}
@keyframes hsl0{0%,8%{opacity:1}20%,100%{opacity:0}}
@keyframes hsl1{0%,19%{opacity:0}20%,38%{opacity:1}39%,100%{opacity:0}}
@keyframes hsl2{0%,37%{opacity:0}38%,56%{opacity:1}57%,100%{opacity:0}}
@keyframes hsl3{0%,55%{opacity:0}56%,74%{opacity:1}75%,100%{opacity:0}}
@keyframes hsl4{0%,73%{opacity:0}74%,80%{opacity:1}81%,100%{opacity:0}}
@keyframes hsl5{0%,87%{opacity:0}88%,100%{opacity:1}}
.hsl0{animation:hsl0 8s ease-in-out infinite}.hsl1{animation:hsl1 8s ease-in-out infinite}
.hsl2{animation:hsl2 8s ease-in-out infinite}.hsl3{animation:hsl3 8s ease-in-out infinite}
.hsl4{animation:hsl4 8s ease-in-out infinite}.hsl5{animation:hsl5 8s ease-in-out infinite}
/* Approach 2: Sort - pointer on sorted array */
@keyframes srt_ptr{0%,10%{transform:translateX(0)}26%,34%{transform:translateX(48px)}50%,58%{transform:translateX(96px)}74%,82%{transform:translateX(144px)}96%,100%{transform:translateX(0)}}
.stp{animation:srt_ptr 8s ease-in-out infinite}
@keyframes stl0{0%,10%{opacity:1}26%,100%{opacity:0}}
@keyframes stl1{0%,25%{opacity:0}26%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes stl2{0%,49%{opacity:0}50%,58%{opacity:1}59%,100%{opacity:0}}
@keyframes stl3{0%,74%{opacity:0}75%,82%{opacity:1}83%,100%{opacity:0}}
@keyframes stl4{0%,95%{opacity:0}96%,100%{opacity:1}}
.stl0{animation:stl0 8s ease-in-out infinite}.stl1{animation:stl1 8s ease-in-out infinite}
.stl2{animation:stl2 8s ease-in-out infinite}.stl3{animation:stl3 8s ease-in-out infinite}
.stl4{animation:stl4 8s ease-in-out infinite}
/* Approach 3: InPlace - 4 array states */
@keyframes as0{0%,20%{opacity:1}21%,100%{opacity:0}}
@keyframes as1{0%,20%{opacity:0}21%,45%{opacity:1}46%,100%{opacity:0}}
@keyframes as2{0%,45%{opacity:0}46%,68%{opacity:1}69%,100%{opacity:0}}
@keyframes as3{0%,68%{opacity:0}69%,85%{opacity:1}86%,100%{opacity:0}}
@keyframes as4{0%,85%{opacity:0}86%,100%{opacity:1}}
.as0{animation:as0 8s ease-in-out infinite}.as1{animation:as1 8s ease-in-out infinite}
.as2{animation:as2 8s ease-in-out infinite}.as3{animation:as3 8s ease-in-out infinite}
.as4{animation:as4 8s ease-in-out infinite}
</style>
<rect width="900" height="900" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">First Missing Positive</text>
<rect x="800" y="12" width="82" height="28" fill="#E74C3C" rx="14"/>
<text x="841" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Hard</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">nums=[3,4,-1,1] → first missing positive = 2</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Answer is always in range [1, n+1]. Key: use array as hash map — place i at index i-1 → O(1) space!</text>

<!-- APPROACH 1: HashSet -->
<rect x="15" y="115" width="870" height="185" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: HashSet — O(n) time, O(n) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Add all positive numbers to a set. Check 1, 2, 3... until not found.</text>
<!-- Array: [3,4,-1,1] at x: 357,405,453,501 -->
<rect x="357" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="378" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="405" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="426" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="453" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="474" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">-1</text>
<rect x="501" y="175" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="522" y="201" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<!-- Scanner pointer -->
<g class="hsp" transform="translate(378,175)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#E74C3C"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">scan</text>
</g>
<!-- Step labels -->
<text class="hsl0" x="630" y="192" font-family="Arial" font-size="11" fill="#555">3 is positive → add to set</text>
<text class="hsl1" x="630" y="192" font-family="Arial" font-size="11" fill="#555">4 is positive → add to set</text>
<text class="hsl2" x="630" y="192" font-family="Arial" font-size="11" fill="#555">-1 is negative → skip!</text>
<text class="hsl3" x="630" y="192" font-family="Arial" font-size="11" fill="#555">1 is positive → add to set</text>
<text class="hsl4" x="630" y="192" font-family="Arial" font-size="11" fill="#555">set = {1, 3, 4}</text>
<text class="hsl5" x="630" y="192" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">check 1✓, check 2 → NOT in set! ans=2 ✓</text>
<text x="450" y="242" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Scan 1,2,3... first not in set is answer. Answer ≤ n+1 (pigeonhole), so at most n+1 checks.</text>
<text x="450" y="260" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">O(n) extra space for HashSet. Can we use the input array itself as storage?</text>
<text x="450" y="278" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Disadvantage: requires extra O(n) memory.</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="300" x2="450" y2="335" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,335 450,343 456,335" fill="#7F8C8D"/>
<rect x="230" y="304" width="440" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="319" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Sort first → find gap directly. O(n log n) but O(1) extra space.</text>

<!-- APPROACH 2: Sort + Linear Scan -->
<rect x="15" y="343" width="870" height="185" fill="#FFFFFF" stroke="#F39C12" stroke-width="2" rx="7"/>
<rect x="15" y="343" width="870" height="40" fill="#F39C12" rx="7"/>
<rect x="15" y="368" width="870" height="15" fill="#F39C12"/>
<text x="450" y="368" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Sort + Linear Scan — O(n log n) time, O(1) space</text>
<text x="450" y="381" font-family="Arial" font-size="10" fill="#FEF9E7" text-anchor="middle">Sort array. Skip ≤0, then find first gap where arr[i] ≠ expected.</text>
<!-- Sorted array: [-1,1,3,4] -->
<rect x="357" y="400" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="378" y="426" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">-1</text>
<rect x="405" y="400" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="426" y="426" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="453" y="400" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="474" y="426" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">3</text>
<rect x="501" y="400" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="522" y="426" font-family="Arial" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<!-- Pointer scanning sorted array -->
<g class="stp" transform="translate(378,400)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#F39C12"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#F39C12" text-anchor="middle">ptr</text>
</g>
<!-- expected tracker -->
<rect x="160" y="400" width="120" height="42" fill="#FEF9E7" stroke="#F39C12" stroke-width="2" rx="4"/>
<text x="220" y="418" font-family="Arial" font-size="10" font-weight="bold" fill="#E67E22" text-anchor="middle">expected = 1</text>
<text x="220" y="434" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">(tracks next positive)</text>
<!-- Step labels -->
<text class="stl0" x="450" y="470" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">arr[0]=-1 ≤ 0 → skip (negative/zero)</text>
<text class="stl1" x="450" y="470" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">arr[1]=1 == expected=1 ✓ → expected becomes 2</text>
<text class="stl2" x="450" y="470" font-family="Arial" font-size="11" fill="#E74C3C" font-weight="bold" text-anchor="middle">arr[2]=3 ≠ expected=2 → MISSING = 2!</text>
<text class="stl3" x="450" y="470" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">(arr[3]=4 would match expected=4, but we already found 2)</text>
<text class="stl4" x="450" y="470" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">Answer: 2 ✓</text>
<text x="450" y="498" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Sort takes O(n log n). After sorting, single pass O(n). Total: O(n log n), O(1) extra space.</text>
<text x="450" y="515" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Handles duplicates: if arr[i] == arr[i-1], skip. Handle arr[i] &gt; expected+1 as well.</text>

<!-- Arrow 2→3 -->
<line x1="450" y1="528" x2="450" y2="563" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,563 450,571 456,563" fill="#7F8C8D"/>
<rect x="200" y="532" width="500" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="547" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 Use array as hash: place value v at index v-1 → O(n) time, O(1) extra space!</text>

<!-- APPROACH 3: In-Place Cyclic Sort / Index Marking -->
<rect x="15" y="571" width="870" height="185" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="571" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="596" width="870" height="15" fill="#27AE60"/>
<text x="450" y="596" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 3: In-Place Cyclic Sort — O(n) time, O(1) space ⭐</text>
<text x="450" y="609" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Place arr[i] at index arr[i]-1 (if 1≤arr[i]≤n). Then scan for arr[i]≠i+1.</text>
<!-- 4 array state groups, each shown for ~20% of animation -->
<g class="as0">
  <text x="450" y="627" font-family="Arial" font-size="10" font-weight="bold" fill="#E74C3C" text-anchor="middle">Initial: [3, 4, -1, 1]</text>
  <rect x="357" y="633" width="42" height="42" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="3"/><text x="378" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
  <rect x="405" y="633" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="426" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
  <rect x="453" y="633" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="474" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">-1</text>
  <rect x="501" y="633" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="522" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
  <text x="450" y="693" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">arr[0]=3, belongs at index 2. Swap arr[0]↔arr[2]</text>
</g>
<g class="as1">
  <text x="450" y="627" font-family="Arial" font-size="10" font-weight="bold" fill="#E67E22" text-anchor="middle">After swap(0,2): [-1, 4, 3, 1]</text>
  <rect x="357" y="633" width="42" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="2" rx="3"/><text x="378" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">-1</text>
  <rect x="405" y="633" width="42" height="42" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="3"/><text x="426" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
  <rect x="453" y="633" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="474" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
  <rect x="501" y="633" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/><text x="522" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
  <text x="450" y="693" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">arr[0]=-1 (skip, ≤0). arr[1]=4, belongs at index 3. Swap arr[1]↔arr[3]</text>
</g>
<g class="as2">
  <text x="450" y="627" font-family="Arial" font-size="10" font-weight="bold" fill="#E67E22" text-anchor="middle">After swap(1,3): [-1, 1, 3, 4]</text>
  <rect x="357" y="633" width="42" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="2" rx="3"/><text x="378" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">-1</text>
  <rect x="405" y="633" width="42" height="42" fill="#FDEBD0" stroke="#E67E22" stroke-width="2" rx="3"/><text x="426" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
  <rect x="453" y="633" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="474" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
  <rect x="501" y="633" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="522" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
  <text x="450" y="693" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">arr[1]=1, belongs at index 0. Swap arr[1]↔arr[0]. (arr[2] and arr[3] already correct)</text>
</g>
<g class="as3">
  <text x="450" y="627" font-family="Arial" font-size="10" font-weight="bold" fill="#E67E22" text-anchor="middle">After swap(1,0): [1, -1, 3, 4]</text>
  <rect x="357" y="633" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="378" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
  <rect x="405" y="633" width="42" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="2" rx="3"/><text x="426" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">-1</text>
  <rect x="453" y="633" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="474" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
  <rect x="501" y="633" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="522" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
  <text x="450" y="693" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">Scan: arr[0]=1✓(=0+1). arr[1]=-1≠2 → MISSING=2! ✓</text>
</g>
<g class="as4">
  <text x="450" y="627" font-family="Arial" font-size="10" font-weight="bold" fill="#27AE60" text-anchor="middle">Final: [1, -1, 3, 4] — scan finds mismatch at index 1</text>
  <rect x="357" y="633" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="378" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
  <rect x="405" y="633" width="42" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="3" rx="3"/><text x="426" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#E74C3C" text-anchor="middle">-1</text>
  <rect x="453" y="633" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="474" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">3</text>
  <rect x="501" y="633" width="42" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/><text x="522" y="659" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
  <text x="450" y="693" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">arr[1]=-1 ≠ 2 → First Missing Positive = 2 ✓</text>
</g>

<!-- Complexity Table -->
<rect x="15" y="762" width="870" height="130" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="762" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="777" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="782" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="792" x2="885" y2="792" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="792" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="808" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
