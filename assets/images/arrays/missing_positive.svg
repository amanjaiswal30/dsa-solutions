<text x="750" y="852" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)</text>
<line x1="15" y1="859" x2="885" y2="859" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="859" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="875" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">In-Place Cyclic Sort ⭐</text>
<text x="500" y="875" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<text x="750" y="875" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
<line x1="370" y1="792" x2="370" y2="882" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="792" x2="620" y2="882" stroke="#DEE2E6" stroke-width="1"/>
</svg>
