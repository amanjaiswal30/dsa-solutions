<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Brute - try each start */
@keyframes start_ptr{0%,12%{transform:translateX(0)}25%,37%{transform:translateX(50px)}50%,62%{transform:translateX(100px)}75%,87%{transform:translateX(150px)}95%,100%{transform:translateX(0)}}
.sp{animation:start_ptr 6s ease-in-out infinite}
@keyframes bl0{0%,12%{opacity:1}25%,100%{opacity:0}}
@keyframes bl1{0%,24%{opacity:0}25%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes bl2{0%,49%{opacity:0}50%,75%{opacity:1}76%,100%{opacity:0}}
@keyframes bl3{0%,74%{opacity:0}75%,95%{opacity:1}96%,100%{opacity:0}}
.bl0{animation:bl0 6s ease-in-out infinite}
.bl1{animation:bl1 6s ease-in-out infinite}
.bl2{animation:bl2 6s ease-in-out infinite}
.bl3{animation:bl3 6s ease-in-out infinite}
/* Approach 2: Greedy one-pass */
@keyframes greedy_scan{0%,5%{transform:translateX(0)}18%,22%{transform:translateX(50px)}34%,38%{transform:translateX(100px)}50%,54%{transform:translateX(150px)}66%,70%{transform:translateX(200px)}85%,100%{transform:translateX(0)}}
.gs{animation:greedy_scan 7s ease-in-out infinite}
@keyframes gl0{0%,5%{opacity:1}18%,100%{opacity:0}}
@keyframes gl1{0%,17%{opacity:0}18%,34%{opacity:1}35%,100%{opacity:0}}
@keyframes gl2{0%,33%{opacity:0}34%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes gl3{0%,49%{opacity:0}50%,66%{opacity:1}67%,100%{opacity:0}}
@keyframes gl4{0%,65%{opacity:0}66%,85%{opacity:1}86%,100%{opacity:0}}
.gl0{animation:gl0 7s ease-in-out infinite}
.gl1{animation:gl1 7s ease-in-out infinite}
.gl2{animation:gl2 7s ease-in-out infinite}
.gl3{animation:gl3 7s ease-in-out infinite}
.gl4{animation:gl4 7s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Gas Station</text>
<rect x="820" y="12" width="62" height="28" fill="#F39C12" rx="14"/>
<text x="851" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">gas=[1,2,3,4,5], cost=[3,4,5,1,2] → start at index 3 (net=[−2,−2,−2,3,3])</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Can complete circuit starting at some index? If total gas≥total cost, exactly one solution exists.</text>

<!-- APPROACH 1: Brute -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Brute Force — O(n²) time, O(1) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Try each station as start; simulate full circuit. If tank never goes negative, return start.</text>
<!-- 5 station boxes showing net[i]=gas[i]-cost[i]: [-2,-2,-2,3,3] -->
<!-- start_x=283, width=50px each (net values displayed) -->
<text x="140" y="200" font-family="Arial" font-size="10" fill="#555">net[i]=gas-cost:</text>
<rect x="283" y="178" width="46" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="2" rx="3"/>
<text x="306" y="204" font-family="Arial" font-size="13" font-weight="bold" fill="#E74C3C" text-anchor="middle">-2</text>
<rect x="333" y="178" width="46" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="2" rx="3"/>
<text x="356" y="204" font-family="Arial" font-size="13" font-weight="bold" fill="#E74C3C" text-anchor="middle">-2</text>
<rect x="383" y="178" width="46" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="2" rx="3"/>
<text x="406" y="204" font-family="Arial" font-size="13" font-weight="bold" fill="#E74C3C" text-anchor="middle">-2</text>
<rect x="433" y="178" width="46" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/>
<text x="456" y="204" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">+3</text>
<rect x="483" y="178" width="46" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/>
<text x="506" y="204" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">+3</text>
<!-- Index labels -->
<text x="306" y="232" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[0]</text>
<text x="356" y="232" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[1]</text>
<text x="406" y="232" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[2]</text>
<text x="456" y="232" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">[3]✓</text>
<text x="506" y="232" font-family="Arial" font-size="9" fill="#999" text-anchor="middle">[4]</text>
<!-- Start pointer sweeping -->
<g class="sp" transform="translate(283,178)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#E74C3C"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">try</text>
</g>
<!-- Step labels -->
<text class="bl0" x="630" y="200" font-family="Arial" font-size="10" fill="#555">start=0: fails at idx 0 (tank=-2)</text>
<text class="bl1" x="630" y="200" font-family="Arial" font-size="10" fill="#555">start=1: fails at idx 1 (tank=-2)</text>
<text class="bl2" x="630" y="200" font-family="Arial" font-size="10" fill="#555">start=2: fails at idx 2 (tank=-2)</text>
<text class="bl3" x="630" y="200" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">start=3: tank≥0 always ✓</text>
<text x="450" y="270" font-family="Arial" font-size="11" fill="#555" text-anchor="middle">For each start: simulate n steps, check tank≥0 throughout circuit.</text>
<text x="450" y="287" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">O(n²) — slow! But guarantee: if any solution exists, it's unique.</text>
<text x="450" y="304" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Key insight: if total gas ≥ total cost, solution MUST exist. Use greedy to find it!</text>
<text x="450" y="318" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Greedy: when tank goes negative, the current start is wrong — move start forward!</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="220" y="329" width="460" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 When tank&lt;0, all stations before current can't be start → skip ahead!</text>

<!-- APPROACH 2: Greedy -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Greedy One-Pass — O(n) time, O(1) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">Track tank and totalNet. When tank&lt;0, set start=i+1, reset tank=0.</text>
<!-- Same station boxes -->
<rect x="283" y="428" width="46" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="2" rx="3"/>
<text x="306" y="454" font-family="Arial" font-size="13" font-weight="bold" fill="#E74C3C" text-anchor="middle">-2</text>
<rect x="333" y="428" width="46" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="2" rx="3"/>
<text x="356" y="454" font-family="Arial" font-size="13" font-weight="bold" fill="#E74C3C" text-anchor="middle">-2</text>
<rect x="383" y="428" width="46" height="42" fill="#FDF2F8" stroke="#E74C3C" stroke-width="2" rx="3"/>
<text x="406" y="454" font-family="Arial" font-size="13" font-weight="bold" fill="#E74C3C" text-anchor="middle">-2</text>
<rect x="433" y="428" width="46" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/>
<text x="456" y="454" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">+3</text>
<rect x="483" y="428" width="46" height="42" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/>
<text x="506" y="454" font-family="Arial" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle">+3</text>
<!-- Greedy scan pointer -->
<g class="gs" transform="translate(283,428)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#27AE60"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">i</text>
</g>
<!-- State labels -->
<text class="gl0" x="620" y="450" font-family="Arial" font-size="10" fill="#555">tank=-2&lt;0 → start=1, tank=0</text>
<text class="gl1" x="620" y="450" font-family="Arial" font-size="10" fill="#555">tank=-2&lt;0 → start=2, tank=0</text>
<text class="gl2" x="620" y="450" font-family="Arial" font-size="10" fill="#555">tank=-2&lt;0 → start=3, tank=0</text>
<text class="gl3" x="620" y="450" font-family="Arial" font-size="10" fill="#555">tank=3 ≥ 0, keep start=3</text>
<text class="gl4" x="620" y="450" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">tank=6, total≥0 → ans=3 ✓</text>
<text x="450" y="510" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">One scan! When tank&lt;0: start=i+1. At end: if totalNet≥0, return start; else -1 ✓</text>
<text x="450" y="527" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">If total_gas &lt; total_cost → impossible (return -1). Otherwise unique answer exists.</text>
<text x="450" y="544" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Why correct? If start fails at i, none of {start..i} can be solution (accumulated deficit).</text>
<text x="450" y="561" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">totalNet tracks overall feasibility. tank tracks local feasibility from current start.</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Brute Force</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n²)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Greedy One-Pass ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
