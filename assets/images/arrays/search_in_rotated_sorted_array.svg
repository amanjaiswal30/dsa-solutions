<svg width="900" height="690" xmlns="http://www.w3.org/2000/svg">
<style>
/* Approach 1: Linear scan */
@keyframes lin_scan{0%,5%{transform:translateX(0)}14%,17%{transform:translateX(48px)}26%,29%{transform:translateX(96px)}38%,41%{transform:translateX(144px)}50%,53%{transform:translateX(192px)}68%,72%{fill:#D5F5E3;stroke:#27AE60;stroke-width:3}80%,100%{transform:translateX(0)}}
.ls{animation:lin_scan 6s ease-in-out infinite}
@keyframes found_hl{0%,50%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}51%,80%{fill:#D5F5E3;stroke:#27AE60;stroke-width:3}81%,100%{fill:#EBF5FB;stroke:#3498DB;stroke-width:2}}
.fhl{animation:found_hl 6s ease-in-out infinite}
/* Approach 2: Modified Binary Search */
@keyframes mid1{0%,10%{transform:translateX(144px)}30%,40%{transform:translateX(0px)}60%,70%{transform:translateX(192px)}88%,100%{transform:translateX(144px)}}
.mid1{animation:mid1 7s ease-in-out infinite}
@keyframes bs_l0{0%,10%{opacity:1}30%,100%{opacity:0}}
@keyframes bs_l1{0%,29%{opacity:0}30%,60%{opacity:1}61%,100%{opacity:0}}
@keyframes bs_l2{0%,59%{opacity:0}60%,85%{opacity:1}86%,100%{opacity:0}}
.bl0{animation:bs_l0 7s ease-in-out infinite}
.bl1{animation:bs_l1 7s ease-in-out infinite}
.bl2{animation:bs_l2 7s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#F8F9FA" rx="10"/>
<rect width="900" height="55" fill="#2C3E50" rx="10"/>
<rect y="45" width="900" height="10" fill="#2C3E50"/>
<text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Search in Rotated Sorted Array</text>
<rect x="820" y="12" width="62" height="28" fill="#F39C12" rx="14"/>
<text x="851" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>
<rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
<text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
<text x="105" y="81" font-family="Arial" font-size="12" fill="#555">arr=[4,5,6,7,0,1,2], target=0 → index 4</text>
<text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Sorted array rotated at pivot. Modified binary search: one half is always fully sorted. Check which side, then narrow.</text>

<!-- APPROACH 1: Linear -->
<rect x="15" y="115" width="870" height="210" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
<rect x="15" y="115" width="870" height="40" fill="#E74C3C" rx="7"/>
<rect x="15" y="140" width="870" height="15" fill="#E74C3C"/>
<text x="450" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Linear Search — O(n) time, O(1) space</text>
<text x="450" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">Simply scan for target — works but ignores sorted structure</text>
<!-- Array [4,5,6,7,0,1,2], 7 elements, start_x=285 -->
<rect x="285" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="306" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="333" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="381" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">6</text>
<rect x="429" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">7</text>
<rect x="477" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="fhl"/>
<text x="498" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">0</text>
<rect x="525" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="546" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="573" y="178" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="594" y="204" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<!-- Rotation pivot marker -->
<line x1="477" y1="173" x2="477" y2="225" stroke="#E74C3C" stroke-width="2" stroke-dasharray="3,3"/>
<text x="477" y="170" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">pivot</text>
<!-- Linear scan pointer -->
<g class="ls" transform="translate(306,178)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#E74C3C"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">i</text>
</g>
<text x="450" y="257" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Scan until arr[i]=0 at index 4 ✓ — simple but O(n), wasteful.</text>
<text x="450" y="274" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Doesn't exploit sorted structure. Modified binary search achieves O(log n).</text>
<text x="450" y="291" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Key insight: at any mid, one half is always fully sorted. Determine which, then check if target is there.</text>
<text x="450" y="305" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">If left sorted: arr[lo]≤target&lt;arr[mid] → go left. Else go right. Mirror for right sorted half.</text>

<!-- Arrow 1→2 -->
<line x1="450" y1="325" x2="450" y2="362" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4,3"/>
<polygon points="444,362 450,370 456,362" fill="#7F8C8D"/>
<rect x="210" y="329" width="480" height="22" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
<text x="450" y="344" font-family="Arial" font-size="10" fill="#555" text-anchor="middle">💡 One half is always sorted! Check if target falls there → halve search space!</text>

<!-- APPROACH 2: Modified Binary Search -->
<rect x="15" y="370" width="870" height="210" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
<rect x="15" y="370" width="870" height="40" fill="#27AE60" rx="7"/>
<rect x="15" y="395" width="870" height="15" fill="#27AE60"/>
<text x="450" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Modified Binary Search — O(log n) time, O(1) space ⭐</text>
<text x="450" y="408" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">arr[lo]≤arr[mid] → left sorted. Check if target in left range, else go right. Vice versa.</text>
<!-- Same array for binary search -->
<rect x="285" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="306" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">4</text>
<rect x="333" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="354" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">5</text>
<rect x="381" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="402" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">6</text>
<rect x="429" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="450" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">7</text>
<rect x="477" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3" class="fhl"/>
<text x="498" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">0</text>
<rect x="525" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="546" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">1</text>
<rect x="573" y="428" width="42" height="42" fill="#EBF5FB" stroke="#3498DB" stroke-width="2" rx="3"/>
<text x="594" y="454" font-family="Arial" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">2</text>
<!-- lo=0, hi=6 markers -->
<text x="306" y="482" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">lo=0</text>
<text x="594" y="482" font-family="Arial" font-size="9" fill="#3498DB" text-anchor="middle">hi=6</text>
<!-- mid pointer (animated) -->
<g class="mid1" transform="translate(285,428)">
  <polygon points="-7,-14 7,-14 0,-4" fill="#27AE60"/>
  <text x="0" y="-16" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">mid</text>
</g>
<!-- Step labels -->
<text class="bl0" x="660" y="450" font-family="Arial" font-size="10" fill="#555">mid=3(7): 4≤7, left sorted. 0∉[4,7) → right</text>
<text class="bl1" x="660" y="450" font-family="Arial" font-size="10" fill="#555">mid=4(0): 7&gt;0, right sorted. 0∈[0,2] → left</text>
<text class="bl2" x="660" y="450" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">lo=hi=4: found 0 at index 4 ✓</text>
<text x="450" y="510" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Binary search on rotated array: O(log n) — only 3 steps! ✓</text>
<text x="450" y="527" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">If arr[lo]≤arr[mid]: left [lo,mid] is sorted. Check if target∈[arr[lo],arr[mid]) → lo..mid, else mid+1..hi.</text>
<text x="450" y="544" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Else: right [mid,hi] is sorted. Check if target∈(arr[mid],arr[hi]] → mid+1..hi, else lo..mid.</text>
<text x="450" y="561" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">Return -1 if lo&gt;hi. Works for arrays with no duplicates. Duplicates case: O(n) worst case.</text>

<!-- Complexity Table -->
<rect x="15" y="592" width="870" height="93" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
<rect x="15" y="592" width="870" height="30" fill="#2C3E50" rx="7"/>
<rect x="15" y="607" width="870" height="15" fill="#2C3E50"/>
<text x="450" y="612" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>
<line x1="15" y1="622" x2="885" y2="622" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="622" width="870" height="23" fill="#ECF0F1"/>
<text x="200" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
<text x="500" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
<text x="750" y="638" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>
<line x1="15" y1="645" x2="885" y2="645" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="645" width="870" height="22" fill="#FDEDEC"/>
<text x="200" y="660" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Linear Scan</text>
<text x="500" y="660" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n)</text>
<text x="750" y="660" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(1)</text>
<line x1="15" y1="667" x2="885" y2="667" stroke="#DEE2E6" stroke-width="1"/>
<rect x="15" y="667" width="870" height="23" fill="#EAFAF1"/>
<text x="200" y="683" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Modified Binary Search ⭐</text>
<text x="500" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(log n)</text>
<text x="750" y="683" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(1)</text>
<line x1="370" y1="622" x2="370" y2="690" stroke="#DEE2E6" stroke-width="1"/>
<line x1="620" y1="622" x2="620" y2="690" stroke="#DEE2E6" stroke-width="1"/>
</svg>
