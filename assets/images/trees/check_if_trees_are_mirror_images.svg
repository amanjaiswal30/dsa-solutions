<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .ndR{fill:#ffeeee;stroke:#E74C3C;stroke-width:2}
  .lbl{font:12px monospace;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:11px sans-serif;fill:#333}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .edge{stroke:#999;stroke-width:1.5;fill:none}

  @keyframes ndVisit{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ffd700;stroke:#F39C12}}
  @keyframes ndGreen{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ccffcc;stroke:#27AE60}}
  @keyframes sl0{0%,19%{opacity:1}20%,100%{opacity:0}}
  @keyframes sl1{0%,19%{opacity:0}20%,39%{opacity:1}40%,100%{opacity:0}}
  @keyframes sl2{0%,39%{opacity:0}40%,59%{opacity:1}60%,100%{opacity:0}}
  @keyframes sl3{0%,59%{opacity:0}60%,79%{opacity:1}80%,100%{opacity:0}}
  @keyframes sl4{0%,79%{opacity:0}80%,100%{opacity:1}}
  .sl0{animation:sl0 9s ease-in-out infinite}
  .sl1{animation:sl1 9s ease-in-out infinite}
  .sl2{animation:sl2 9s ease-in-out infinite}
  .sl3{animation:sl3 9s ease-in-out infinite}
  .sl4{animation:sl4 9s ease-in-out infinite}
  .np0{animation:ndVisit 7s 0s ease-in-out infinite}
  .np1{animation:ndVisit 7s 0.6s ease-in-out infinite}
  .np2{animation:ndVisit 7s 1.2s ease-in-out infinite}
  .ng0{animation:ndGreen 7s 0s ease-in-out infinite}
  .ng1{animation:ndGreen 7s 0.6s ease-in-out infinite}
  .ng2{animation:ndGreen 7s 1.2s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Check if Two Trees are Mirror Images</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">Two trees T1 and T2 are mirrors if T1.left mirrors T2.right and T1.right mirrors T2.left</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Recursive — isMirror(t1, t2) compares t1.left↔t2.right, t1.right↔t2.left  O(n) time, O(h) space</text>

<!-- Tree 1 -->
<text x="165" y="122" text-anchor="middle" class="cmp" font-weight="bold" fill="#E74C3C">Tree 1</text>
<g transform="translate(165,142)">
  <line x1="0" y1="22" x2="-70" y2="68" class="edge"/>
  <line x1="0" y1="22" x2="70" y2="68" class="edge"/>
  <line x1="-70" y1="90" x2="-100" y2="144" class="edge"/>
  <line x1="-70" y1="90" x2="-40" y2="144" class="edge"/>
  <line x1="70" y1="90" x2="40" y2="144" class="edge"/>
  <line x1="70" y1="90" x2="100" y2="144" class="edge"/>
  <circle class="np2 nd" cx="0" cy="0" r="20"/><text x="0" y="0" class="lbl">1</text>
  <circle class="np1 nd" cx="-70" cy="68" r="20"/><text x="-70" y="68" class="lbl">2</text>
  <circle class="np1 nd" cx="70" cy="68" r="20"/><text x="70" y="68" class="lbl">3</text>
  <circle class="np0 nd" cx="-100" cy="144" r="20"/><text x="-100" y="144" class="lbl">4</text>
  <circle class="np0 nd" cx="-40" cy="144" r="20"/><text x="-40" y="144" class="lbl">5</text>
  <circle class="np0 nd" cx="40" cy="144" r="20"/><text x="40" y="144" class="lbl">6</text>
  <circle class="np0 nd" cx="100" cy="144" r="20"/><text x="100" y="144" class="lbl">7</text>
</g>

<!-- Mirror arrows -->
<text x="350" y="200" text-anchor="middle" class="cmp" fill="#9b59b6" font-size="20">⟺</text>
<text x="350" y="218" text-anchor="middle" class="cmp" fill="#9b59b6" font-size="9">mirror</text>

<!-- Tree 2 (mirrored) -->
<text x="540" y="122" text-anchor="middle" class="cmp" font-weight="bold" fill="#27AE60">Tree 2 (mirror)</text>
<g transform="translate(540,142)">
  <line x1="0" y1="22" x2="-70" y2="68" class="edge"/>
  <line x1="0" y1="22" x2="70" y2="68" class="edge"/>
  <line x1="-70" y1="90" x2="-100" y2="144" class="edge"/>
  <line x1="-70" y1="90" x2="-40" y2="144" class="edge"/>
  <line x1="70" y1="90" x2="40" y2="144" class="edge"/>
  <line x1="70" y1="90" x2="100" y2="144" class="edge"/>
  <circle class="ng2 nd" cx="0" cy="0" r="20"/><text x="0" y="0" class="lbl">1</text>
  <circle class="ng1 nd" cx="-70" cy="68" r="20"/><text x="-70" y="68" class="lbl">3</text>
  <circle class="ng1 nd" cx="70" cy="68" r="20"/><text x="70" y="68" class="lbl">2</text>
  <circle class="ng0 nd" cx="-100" cy="144" r="20"/><text x="-100" y="144" class="lbl">7</text>
  <circle class="ng0 nd" cx="-40" cy="144" r="20"/><text x="-40" y="144" class="lbl">6</text>
  <circle class="ng0 nd" cx="40" cy="144" r="20"/><text x="40" y="144" class="lbl">5</text>
  <circle class="ng0 nd" cx="100" cy="144" r="20"/><text x="100" y="144" class="lbl">4</text>
</g>

<text x="24" y="258" class="cmp" font-weight="bold">isMirror(t1, t2):</text>
<text x="24" y="275" class="cmp">  if not t1 and not t2: return True</text>
<text x="24" y="292" class="cmp">  if not t1 or not t2 or t1.val!=t2.val: return False</text>
<text x="24" y="309" class="cmp">  return isMirror(t1.left, t2.right) and isMirror(t1.right, t2.left)</text>

<text x="420" y="258" class="cmp sl0">① Check roots: t1.val=1 == t2.val=1 ✓</text>
<text x="420" y="258" class="cmp sl1">② t1.left(2) vs t2.right(2) → 2==2 ✓</text>
<text x="420" y="258" class="cmp sl2">③ t1.right(3) vs t2.left(3) → 3==3 ✓</text>
<text x="420" y="258" class="cmp sl3">④ Leaves: t1(4)↔t2(4), t1(5)↔t2(5), etc.</text>
<text x="420" y="258" class="cmp sl4" fill="#E74C3C">⑤ All pairs match → Trees ARE mirror images!</text>

<!-- Arrow -->
<line x1="450" y1="312" x2="450" y2="330" class="evol"/>
<polygon points="450,332 444,320 456,320" fill="#888"/>
<rect x="260" y="315" width="380" height="24" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">Iterative: use explicit stack of corresponding node pairs</text>

<!-- APPROACH 2 -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: Iterative with Stack — push corresponding mirror pairs, compare values  O(n) time, O(h) space</text>

<text x="24" y="398" class="cmp" font-weight="bold">areMirrors_iter(t1, t2):</text>
<text x="24" y="415" class="cmp">  stack = [(t1, t2)]</text>
<text x="24" y="432" class="cmp">  while stack:</text>
<text x="24" y="449" class="cmp">    n1, n2 = stack.pop()</text>
<text x="24" y="466" class="cmp">    if not n1 and not n2: continue</text>
<text x="24" y="483" class="cmp">    if not n1 or not n2 or n1.val != n2.val: return False</text>
<text x="24" y="500" class="cmp">    stack.append((n1.left,  n2.right))  # outer pair</text>
<text x="24" y="517" class="cmp">    stack.append((n1.right, n2.left))   # inner pair</text>
<text x="24" y="534" class="cmp">  return True</text>

<!-- Stack states -->
<text x="450" y="398" class="cmp" font-weight="bold" fill="#27AE60">Stack trace:</text>
<rect x="448" y="405" width="430" height="22" fill="#e8f5e9" stroke="#27AE60" rx="3"/>
<text x="454" y="420" class="cmp sl0">Init: [(1,1)]</text>
<text x="454" y="420" class="cmp sl1">Pop (1,1): match. Push (2,2),(3,3)</text>
<text x="454" y="420" class="cmp sl2">Pop (3,3): match. Push (3.L=7,3.R=7),(3.R=6,3.L=6)</text>
<text x="454" y="420" class="cmp sl3">Pop (6,6): match; pop (7,7): match; leaves done</text>
<text x="454" y="420" class="cmp sl4" fill="#27AE60">Pop (2,2): match; process its children → all match!</text>

<rect x="448" y="440" width="430" height="22" fill="#e8f5e9" stroke="#27AE60" rx="3"/>
<text x="454" y="455" class="cmp sl0">Compare: t1.left↔t2.right (outer mirror)</text>
<text x="454" y="455" class="cmp sl1">Compare: t1.right↔t2.left (inner mirror)</text>
<text x="454" y="455" class="cmp sl2">If both null: continue (symmetric null)</text>
<text x="454" y="455" class="cmp sl3">If one null or values differ: return False</text>
<text x="454" y="455" class="cmp sl4" fill="#27AE60">Stack empty with no False → return True</text>

<text x="24" y="558" class="cmp" fill="#555">Note: push order (left,right) or (outer,inner) — both work as long as consistent</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" rx="6"/>
<text x="180" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="400" y="595" class="tbl" font-weight="bold">Time</text>
<text x="570" y="595" class="tbl" font-weight="bold">Space</text>
<text x="760" y="595" class="tbl" font-weight="bold">Notes</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="180" y="620" class="tbl">Recursive isMirror</text>
<text x="400" y="620" class="tbl">O(n)</text>
<text x="570" y="620" class="tbl">O(h)</text>
<text x="760" y="620" class="tbl">Clean code; recursion depth = h</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="180" y="644" class="tbl">Iterative with explicit stack</text>
<text x="400" y="644" class="tbl">O(n)</text>
<text x="570" y="644" class="tbl">O(h)</text>
<text x="760" y="644" class="tbl">Same complexity; avoids call stack</text>
<rect x="16" y="652" width="868" height="24" fill="#fff"/>
<text x="180" y="668" class="tbl" fill="#555">n = total nodes in one tree, h = height</text>
<text x="600" y="668" class="tbl" fill="#555">Key: always compare t1.L↔t2.R and t1.R↔t2.L</text>
</svg>
