<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .lbl{font:12px monospace;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:11px sans-serif;fill:#333}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .edge{stroke:#999;stroke-width:1.5;fill:none}
  .next{stroke:#E74C3C;stroke-width:2;fill:none;marker-end:url(#narr)}

  @keyframes ndVisit{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ffd700;stroke:#F39C12}}
  @keyframes ndGreen{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ccffcc;stroke:#27AE60}}
  @keyframes sl0{0%,19%{opacity:1}20%,100%{opacity:0}}
  @keyframes sl1{0%,19%{opacity:0}20%,39%{opacity:1}40%,100%{opacity:0}}
  @keyframes sl2{0%,39%{opacity:0}40%,59%{opacity:1}60%,100%{opacity:0}}
  @keyframes sl3{0%,59%{opacity:0}60%,79%{opacity:1}80%,100%{opacity:0}}
  @keyframes sl4{0%,79%{opacity:0}80%,100%{opacity:1}}
  .sl0{animation:sl0 9s ease-in-out infinite}
  .sl1{animation:sl1 9s ease-in-out infinite}
  .sl2{animation:sl2 9s ease-in-out infinite}
  .sl3{animation:sl3 9s ease-in-out infinite}
  .sl4{animation:sl4 9s ease-in-out infinite}
  .np0{animation:ndVisit 7s 0s ease-in-out infinite}
  .np1{animation:ndVisit 7s 0.5s ease-in-out infinite}
  .np2{animation:ndVisit 7s 1.0s ease-in-out infinite}
  .np3{animation:ndVisit 7s 1.5s ease-in-out infinite}
  .ng0{animation:ndGreen 7s 0s ease-in-out infinite}
  .ng1{animation:ndGreen 7s 0.5s ease-in-out infinite}
  .ng2{animation:ndGreen 7s 1.0s ease-in-out infinite}
  .ng3{animation:ndGreen 7s 1.5s ease-in-out infinite}
</style>

<defs>
  <marker id="narr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6" fill="none" stroke="#E74C3C" stroke-width="1.5"/>
  </marker>
  <marker id="garr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6" fill="none" stroke="#27AE60" stroke-width="1.5"/>
  </marker>
</defs>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Populating Next Right Pointer in Each Node</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">Connect each node to its next right node at the same level using a 'next' pointer (NULL if rightmost)</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: BFS Level Order — connect nodes within each level using queue  O(n) time, O(w) space</text>

<!-- BFS tree with next pointers -->
<g transform="translate(260,126)">
  <line x1="0" y1="22" x2="-100" y2="72" class="edge"/>
  <line x1="0" y1="22" x2="100" y2="72" class="edge"/>
  <line x1="-100" y1="94" x2="-140" y2="152" class="edge"/>
  <line x1="-100" y1="94" x2="-60" y2="152" class="edge"/>
  <line x1="100" y1="94" x2="60" y2="152" class="edge"/>
  <line x1="100" y1="94" x2="140" y2="152" class="edge"/>
  <!-- next pointers (level 1) -->
  <line x1="22" y1="0" x2="78" y2="0" style="stroke:#E74C3C;stroke-width:2;fill:none;marker-end:url(#narr)"/>
  <!-- wait, only one node at level 0 so no next -->
  <!-- next pointers (level 1) -->
  <line x1="-78" y1="72" x2="78" y2="72" style="stroke:#E74C3C;stroke-width:2;fill:none;marker-end:url(#narr)"/>
  <!-- next pointers (level 2) -->
  <line x1="-118" y1="152" x2="-82" y2="152" style="stroke:#E74C3C;stroke-width:2;fill:none;marker-end:url(#narr)"/>
  <line x1="-38" y1="152" x2="38" y2="152" style="stroke:#E74C3C;stroke-width:2;fill:none;marker-end:url(#narr)"/>
  <line x1="62" y1="152" x2="118" y2="152" style="stroke:#E74C3C;stroke-width:2;fill:none;marker-end:url(#narr)"/>
  <!-- nodes -->
  <circle class="np3 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">1</text>
  <circle class="np2 nd" cx="-100" cy="72" r="22"/><text x="-100" y="72" class="lbl">2</text>
  <circle class="np2 nd" cx="100" cy="72" r="22"/><text x="100" y="72" class="lbl">3</text>
  <circle class="np0 nd" cx="-140" cy="152" r="22"/><text x="-140" y="152" class="lbl">4</text>
  <circle class="np0 nd" cx="-60" cy="152" r="22"/><text x="-60" y="152" class="lbl">5</text>
  <circle class="np1 nd" cx="60" cy="152" r="22"/><text x="60" y="152" class="lbl">6</text>
  <circle class="np1 nd" cx="140" cy="152" r="22"/><text x="140" y="152" class="lbl">7</text>
  <!-- NULL labels -->
  <text x="25" y="4" class="cmp" fill="#999" font-size="9">→NULL</text>
  <text x="122" y="76" class="cmp" fill="#999" font-size="9">→NULL</text>
  <text x="162" y="156" class="cmp" fill="#999" font-size="9">→NULL</text>
</g>

<text x="540" y="138" class="cmp" font-weight="bold">connect_bfs(root):</text>
<text x="540" y="155" class="cmp">  if not root: return root</text>
<text x="540" y="172" class="cmp">  queue = deque([root])</text>
<text x="540" y="189" class="cmp">  while queue:</text>
<text x="540" y="206" class="cmp">    size = len(queue)  # current level size</text>
<text x="540" y="223" class="cmp">    for i in range(size):</text>
<text x="540" y="240" class="cmp">      node = queue.popleft()</text>
<text x="540" y="257" class="cmp">      if i &lt; size-1: node.next = queue[0]</text>
<text x="540" y="274" class="cmp">      else:          node.next = None</text>
<text x="540" y="291" class="cmp">      if node.left:  queue.append(node.left)</text>
<text x="540" y="303" class="cmp">      if node.right: queue.append(node.right)</text>

<text x="24" y="303" class="cmp sl0">① Level 0: [1] → 1.next=None</text>
<text x="24" y="303" class="cmp sl1">② Level 1: [2,3] → 2.next=3, 3.next=None</text>
<text x="24" y="303" class="cmp sl2">③ Level 2: [4,5,6,7] → 4→5→6→7→None</text>
<text x="24" y="303" class="cmp sl3">④ Queue used O(w) space (max level width)</text>
<text x="24" y="303" class="cmp sl4" fill="#E74C3C">⑤ All next pointers set correctly per level</text>

<!-- Arrow -->
<line x1="450" y1="312" x2="450" y2="330" class="evol"/>
<polygon points="450,332 444,320 456,320" fill="#888"/>
<rect x="250" y="315" width="400" height="24" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">O(1) space: use already-connected prev level's next pointers</text>

<!-- APPROACH 2 -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: O(1) Space — traverse prev level's next chain to connect current level  O(n) time, O(1) space</text>

<text x="24" y="398" class="cmp" font-weight="bold">connect_o1(root):</text>
<text x="24" y="415" class="cmp">  leftmost = root   # start of each level</text>
<text x="24" y="432" class="cmp">  while leftmost and leftmost.left:</text>
<text x="24" y="449" class="cmp">    curr = leftmost</text>
<text x="24" y="466" class="cmp">    while curr:          # walk via .next</text>
<text x="24" y="483" class="cmp">      curr.left.next = curr.right  # connect siblings</text>
<text x="24" y="500" class="cmp">      if curr.next:                # connect across parent</text>
<text x="24" y="517" class="cmp">        curr.right.next = curr.next.left</text>
<text x="24" y="534" class="cmp">      curr = curr.next</text>
<text x="24" y="551" class="cmp">    leftmost = leftmost.left  # go to next level</text>

<!-- O(1) diagram -->
<g transform="translate(660,382)">
  <line x1="0" y1="22" x2="-80" y2="70" class="edge"/>
  <line x1="0" y1="22" x2="80" y2="70" class="edge"/>
  <line x1="-80" y1="92" x2="-110" y2="148" class="edge"/>
  <line x1="-80" y1="92" x2="-50" y2="148" class="edge"/>
  <line x1="80" y1="92" x2="50" y2="148" class="edge"/>
  <line x1="80" y1="92" x2="110" y2="148" class="edge"/>
  <!-- next pointers green -->
  <line x1="-58" y1="70" x2="58" y2="70" style="stroke:#27AE60;stroke-width:2;fill:none;marker-end:url(#garr)"/>
  <line x1="-88" y1="148" x2="-72" y2="148" style="stroke:#27AE60;stroke-width:2;fill:none;marker-end:url(#garr)"/>
  <line x1="-28" y1="148" x2="28" y2="148" style="stroke:#27AE60;stroke-width:2;fill:none;marker-end:url(#garr)"/>
  <line x1="72" y1="148" x2="88" y2="148" style="stroke:#27AE60;stroke-width:2;fill:none;marker-end:url(#garr)"/>
  <circle class="ng3 nd" cx="0" cy="0" r="20"/><text x="0" y="0" class="lbl">1</text>
  <circle class="ng2 nd" cx="-80" cy="70" r="20"/><text x="-80" y="70" class="lbl">2</text>
  <circle class="ng2 nd" cx="80" cy="70" r="20"/><text x="80" y="70" class="lbl">3</text>
  <circle class="ng0 nd" cx="-110" cy="148" r="20"/><text x="-110" y="148" class="lbl">4</text>
  <circle class="ng0 nd" cx="-50" cy="148" r="20"/><text x="-50" y="148" class="lbl">5</text>
  <circle class="ng1 nd" cx="50" cy="148" r="20"/><text x="50" y="148" class="lbl">6</text>
  <circle class="ng1 nd" cx="110" cy="148" r="20"/><text x="110" y="148" class="lbl">7</text>
  <text x="0" y="-30" text-anchor="middle" class="cmp" fill="#27AE60" font-size="9">O(1) extra space!</text>
</g>

<text x="24" y="562" class="cmp sl0">① Leftmost=1; curr=1: connect 1.left(2).next=1.right(3)</text>
<text x="24" y="562" class="cmp sl1">② curr.next=None → stop; leftmost=leftmost.left=2</text>
<text x="24" y="562" class="cmp sl2">③ curr=2: 2.left(4).next=2.right(5); 2.right(5).next=2.next(3).left(6)</text>
<text x="24" y="562" class="cmp sl3">④ curr=3: 3.left(6).next=3.right(7); 3.next=None → stop</text>
<text x="24" y="562" class="cmp sl4" fill="#27AE60">⑤ All levels connected using only prev-level next ptrs!</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" rx="6"/>
<text x="180" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="400" y="595" class="tbl" font-weight="bold">Time</text>
<text x="570" y="595" class="tbl" font-weight="bold">Space</text>
<text x="760" y="595" class="tbl" font-weight="bold">Notes</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="180" y="620" class="tbl">BFS with queue</text>
<text x="400" y="620" class="tbl">O(n)</text>
<text x="570" y="620" class="tbl">O(w)</text>
<text x="760" y="620" class="tbl">Simple; w up to n/2 for complete tree</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="180" y="644" class="tbl">O(1) space using next pointers</text>
<text x="400" y="644" class="tbl">O(n)</text>
<text x="570" y="644" class="tbl">O(1)</text>
<text x="760" y="644" class="tbl">Optimal; works only for perfect binary tree</text>
<rect x="16" y="652" width="868" height="24" fill="#fff"/>
<text x="180" y="668" class="tbl" fill="#555">n = nodes, w = max width of tree</text>
<text x="600" y="668" class="tbl" fill="#555">O(1) solution uses existing .next connections</text>
</svg>
