<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .lbl{font:12px monospace;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:11px sans-serif;fill:#333}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .edge{stroke:#999;stroke-width:1.5;fill:none}
  .pathEdge{stroke:#E74C3C;stroke-width:2.5;fill:none}
  .pathEdgeG{stroke:#27AE60;stroke-width:2.5;fill:none}

  @keyframes ndVisit{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ffd700;stroke:#F39C12}}
  @keyframes ndGreen{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ccffcc;stroke:#27AE60}}
  @keyframes sl0{0%,19%{opacity:1}20%,100%{opacity:0}}
  @keyframes sl1{0%,19%{opacity:0}20%,39%{opacity:1}40%,100%{opacity:0}}
  @keyframes sl2{0%,39%{opacity:0}40%,59%{opacity:1}60%,100%{opacity:0}}
  @keyframes sl3{0%,59%{opacity:0}60%,79%{opacity:1}80%,100%{opacity:0}}
  @keyframes sl4{0%,79%{opacity:0}80%,100%{opacity:1}}
  .sl0{animation:sl0 9s ease-in-out infinite}
  .sl1{animation:sl1 9s ease-in-out infinite}
  .sl2{animation:sl2 9s ease-in-out infinite}
  .sl3{animation:sl3 9s ease-in-out infinite}
  .sl4{animation:sl4 9s ease-in-out infinite}
  .np0{animation:ndVisit 7s 0s ease-in-out infinite}
  .np1{animation:ndVisit 7s 0.5s ease-in-out infinite}
  .np2{animation:ndVisit 7s 1.0s ease-in-out infinite}
  .np3{animation:ndVisit 7s 1.5s ease-in-out infinite}
  .ng0{animation:ndGreen 7s 0s ease-in-out infinite}
  .ng1{animation:ndGreen 7s 0.5s ease-in-out infinite}
  .ng2{animation:ndGreen 7s 1.0s ease-in-out infinite}
  .ng3{animation:ndGreen 7s 1.5s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Check if Root-to-Leaf Path with Target Sum Exists</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">Does any root-to-leaf path exist with node values summing to target? (target = 22 in example)</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: DFS Recursive — subtract node value, check if remaining sum reaches 0 at leaf  O(n) time</text>

<!-- Tree for approach 1 -->
<g transform="translate(255,126)">
  <line x1="0" y1="22" x2="-100" y2="72" class="edge"/>
  <line x1="0" y1="22" x2="100" y2="72" class="edge"/>
  <line x1="-100" y1="94" x2="-130" y2="152" class="edge"/>
  <line x1="-100" y1="94" x2="-70" y2="152" class="edge"/>
  <line x1="100" y1="94" x2="70" y2="152" class="edge"/>
  <line x1="100" y1="94" x2="130" y2="152" class="edge"/>
  <!-- highlighted path: 5→4→13 = 22 -->
  <line x1="0" y1="22" x2="-100" y2="72" class="pathEdge"/>
  <line x1="-100" y1="94" x2="-70" y2="152" class="pathEdge"/>
  <circle class="np3 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">5</text>
  <circle class="np2 nd" cx="-100" cy="72" r="22"/><text x="-100" y="72" class="lbl">4</text>
  <circle class="np1 nd" cx="100" cy="72" r="22"/><text x="100" y="72" class="lbl">8</text>
  <circle class="np0 nd" cx="-130" cy="152" r="22"/><text x="-130" y="152" class="lbl">11</text>
  <circle class="np0 nd" cx="-70" cy="152" r="22" style="fill:#ffcccc;stroke:#E74C3C;stroke-width:2.5"/><text x="-70" y="152" class="lbl">13</text>
  <circle class="np0 nd" cx="70" cy="152" r="22"/><text x="70" y="152" class="lbl">4</text>
  <circle class="np0 nd" cx="130" cy="152" r="22"/><text x="130" y="152" class="lbl">1</text>
  <!-- remaining sum labels -->
  <text x="28" y="4" class="cmp" fill="#E74C3C" font-size="9">rem=22</text>
  <text x="-72" y="76" class="cmp" fill="#E74C3C" font-size="9">rem=17</text>
  <text x="-42" y="156" class="cmp" fill="#E74C3C" font-size="9">rem=4→0✓</text>
  <text x="122" y="76" class="cmp" fill="#999" font-size="9">rem=14</text>
</g>

<text x="510" y="140" class="cmp" font-weight="bold">hasPathSum(node, target):</text>
<text x="510" y="157" class="cmp">  if not node: return False</text>
<text x="510" y="174" class="cmp">  remaining = target - node.val</text>
<text x="510" y="191" class="cmp">  # check if leaf and remaining = 0</text>
<text x="510" y="208" class="cmp">  if not node.left and not node.right:</text>
<text x="510" y="225" class="cmp">    return remaining == 0</text>
<text x="510" y="242" class="cmp">  return (hasPathSum(node.left,  remaining) or</text>
<text x="510" y="259" class="cmp">          hasPathSum(node.right, remaining))</text>

<text x="510" y="285" class="cmp sl0">① At root(5): remaining = 22-5 = 17</text>
<text x="510" y="285" class="cmp sl1">② At node 4: remaining = 17-4 = 13</text>
<text x="510" y="285" class="cmp sl2">③ At leaf 13: remaining = 13-13 = 0 → return True!</text>
<text x="510" y="285" class="cmp sl3">④ Short-circuit OR: right branch never explored</text>
<text x="510" y="285" class="cmp sl4" fill="#E74C3C">⑤ Path 5→4→13=22 found! Return True.</text>

<!-- Arrow -->
<line x1="450" y1="312" x2="450" y2="330" class="evol"/>
<polygon points="450,332 444,320 456,320" fill="#888"/>
<rect x="250" y="315" width="400" height="24" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">BFS: store (node, remaining_sum) in queue — iterative solution</text>

<!-- APPROACH 2 -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: BFS with running sum — queue stores (node, remaining_sum) pairs  O(n) time, O(w) space</text>

<text x="24" y="398" class="cmp" font-weight="bold">hasPathSum_bfs(root, target):</text>
<text x="24" y="415" class="cmp">  if not root: return False</text>
<text x="24" y="432" class="cmp">  q = deque([(root, target - root.val)])</text>
<text x="24" y="449" class="cmp">  while q:</text>
<text x="24" y="466" class="cmp">    node, rem = q.popleft()</text>
<text x="24" y="483" class="cmp">    if not node.left and not node.right:</text>
<text x="24" y="500" class="cmp">      if rem == 0: return True  # found!</text>
<text x="24" y="517" class="cmp">    if node.left:  q.append((node.left,  rem - node.left.val))</text>
<text x="24" y="534" class="cmp">    if node.right: q.append((node.right, rem - node.right.val))</text>
<text x="24" y="551" class="cmp">  return False</text>

<!-- BFS queue visualization -->
<text x="480" y="398" class="cmp" font-weight="bold" fill="#27AE60">BFS queue states:</text>
<rect x="478" y="405" width="400" height="22" fill="#e8f5e9" stroke="#27AE60" rx="3"/>
<text x="484" y="420" class="cmp sl0">Init: [(root=5, rem=17)]</text>
<text x="484" y="420" class="cmp sl1">Deq(5,17): not leaf. Push (4, 13), (8, 9)</text>
<text x="484" y="420" class="cmp sl2">Deq(4,13): not leaf. Push (11, 2), (13, 0)</text>
<text x="484" y="420" class="cmp sl3">Deq(8,9): not leaf. Push (4,5),(1,8)</text>
<text x="484" y="420" class="cmp sl4" fill="#27AE60">Deq(11,2): leaf, rem=2≠0; Deq(13,0): leaf, rem=0 → True!</text>

<rect x="478" y="432" width="400" height="120" fill="#e8f5e9" stroke="#27AE60" rx="3"/>
<text x="484" y="448" class="cmp">Queue path tracking:</text>
<text x="484" y="465" class="cmp">  Each queue entry: (node, remaining_sum)</text>
<text x="484" y="482" class="cmp">  rem = target - sum_of_path_so_far</text>
<text x="484" y="499" class="cmp">  At leaf: rem==0 means path sum == target</text>
<text x="484" y="516" class="cmp">  BFS explores all paths level by level</text>
<text x="484" y="533" class="cmp" fill="#27AE60" font-weight="bold">  Path found: 5 → 4 → 13 = 22 ✓</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" rx="6"/>
<text x="180" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="400" y="595" class="tbl" font-weight="bold">Time</text>
<text x="570" y="595" class="tbl" font-weight="bold">Space</text>
<text x="760" y="595" class="tbl" font-weight="bold">Notes</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="180" y="620" class="tbl">DFS recursive subtract</text>
<text x="400" y="620" class="tbl">O(n)</text>
<text x="570" y="620" class="tbl">O(h)</text>
<text x="760" y="620" class="tbl">Short-circuits on first found path</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="180" y="644" class="tbl">BFS with (node, rem) queue</text>
<text x="400" y="644" class="tbl">O(n)</text>
<text x="570" y="644" class="tbl">O(w)</text>
<text x="760" y="644" class="tbl">Level-order; stops on first leaf with rem=0</text>
<rect x="16" y="652" width="868" height="24" fill="#fff"/>
<text x="180" y="668" class="tbl" fill="#555">n = nodes, h = height, w = max width</text>
<text x="600" y="668" class="tbl" fill="#555">DFS preferred: h ≤ w for balanced trees</text>
</svg>
