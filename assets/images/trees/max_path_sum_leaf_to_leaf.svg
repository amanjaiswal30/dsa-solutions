<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#fff}
  .prob{font:13px sans-serif;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .sec{font:bold 13px sans-serif;fill:#333}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .ndHL{fill:#ffd700;stroke:#cc8800;stroke-width:2.5}
  .edge{stroke:#999;stroke-width:2;fill:none}
  .lbl{font:12px monospace;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:12px sans-serif;fill:#555}
  .evol{fill:#fffde7;stroke:#f0c040;stroke-width:1.5;rx:6}
  .ins{font:12px sans-serif;fill:#666;font-style:italic}
  .tbl{font:12px sans-serif;fill:#333}
  @keyframes ndVisit0{0%,10%{fill:#ddeeff}20%,40%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit1{0%,20%{fill:#ddeeff}30%,50%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit2{0%,30%{fill:#ddeeff}40%,60%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit3{0%,40%{fill:#ddeeff}50%,70%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit4{0%,50%{fill:#ddeeff}60%,80%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit5{0%,60%{fill:#ddeeff}70%,85%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit6{0%,70%{fill:#ddeeff}80%,90%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes sl0{0%,15%{opacity:0}20%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl1{0%,25%{opacity:0}30%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl2{0%,35%{opacity:0}40%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl3{0%,45%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl4{0%,55%{opacity:0}60%,90%{opacity:1}100%{opacity:0}}
  @keyframes ar0{0%,10%{fill:#fff5f5}20%,100%{fill:#ccffcc}}
  @keyframes ar1{0%,25%{fill:#fff5f5}35%,100%{fill:#ccffcc}}
  @keyframes ar2{0%,40%{fill:#fff5f5}50%,100%{fill:#ccffcc}}
  .n0{animation:ndVisit0 4s infinite}
  .n1{animation:ndVisit1 4s infinite}
  .n2{animation:ndVisit2 4s infinite}
  .n3{animation:ndVisit3 4s infinite}
  .n4{animation:ndVisit4 4s infinite}
  .n5{animation:ndVisit5 4s infinite}
  .n6{animation:ndVisit6 4s infinite}
</style>
<rect width="900" height="690" fill="#f8f9fa"/>
<!-- Title bar -->
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="30" class="title" text-anchor="middle" dominant-baseline="middle">Max Path Sum: Leaf to Leaf</text>
<!-- Problem strip -->
<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="68" class="prob">Tree: 1→{2→{4,5},3→{6,7}} | Max leaf-to-leaf path sum = 18 (path: 5→2→1→3→7 = 5+2+1+3+7 = 18)</text>

<!-- Approach 1 block -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="30" y="110" class="sec" fill="#fff">Approach 1: O(n²) — Find All Leaf Pairs, Compute Path Sums</text>
<rect x="30" y="128" width="400" height="14" fill="#ffdddd" rx="3"/>
<text x="38" y="138" class="cmp" fill="#c0392b">• Enumerate all leaf pairs → for each pair find path → track maximum</text>
<rect x="30" y="148" width="380" height="14" fill="#ffdddd" rx="3"/>
<text x="38" y="158" class="cmp" fill="#c0392b">• Path between two nodes passes through their LCA</text>

<!-- Tree for Approach 1 - centered -->
<!-- Edges first -->
<line x1="450" y1="185" x2="340" y2="240" class="edge"/>
<line x1="450" y1="185" x2="560" y2="240" class="edge"/>
<line x1="340" y1="240" x2="285" y2="285" class="edge"/>
<line x1="340" y1="240" x2="395" y2="285" class="edge"/>
<line x1="560" y1="240" x2="505" y2="285" class="edge"/>
<line x1="560" y1="240" x2="615" y2="285" class="edge"/>
<!-- Nodes -->
<circle cx="450" cy="185" r="22" class="nd n1"/>
<text x="450" y="185" class="lbl">1</text>
<circle cx="340" cy="240" r="22" class="nd n2"/>
<text x="340" y="240" class="lbl">2</text>
<circle cx="560" cy="240" r="22" class="nd n3"/>
<text x="560" y="240" class="lbl">3</text>
<circle cx="285" cy="285" r="22" class="nd n4"/>
<text x="285" y="285" class="lbl">4</text>
<circle cx="395" cy="285" r="22" class="nd n5"/>
<text x="395" y="285" class="lbl">5</text>
<circle cx="505" cy="285" r="22" class="nd n6"/>
<text x="505" y="285" class="lbl">6</text>
<circle cx="615" cy="285" r="22" class="nd n6"/>
<text x="615" y="285" class="lbl">7</text>

<!-- Max path highlight label -->
<text x="700" y="195" class="cmp" fill="#c0392b" style="animation:sl2 4s infinite">leaf pairs tried: 4C2=6</text>
<text x="700" y="215" class="cmp" fill="#cc6600" style="animation:sl3 4s infinite">best: 5+2+1+3+7=18</text>

<!-- Evolution arrow -->
<line x1="450" y1="316" x2="450" y2="340" stroke="#f0c040" stroke-width="2"/>
<polygon points="450,348 444,336 456,336" fill="#f0c040"/>
<rect x="80" y="310" width="740" height="32" fill="#fffde7" stroke="#f0c040" stroke-width="1.5" rx="6"/>
<text x="450" y="328" class="ins" text-anchor="middle" dominant-baseline="middle">Key Insight: At each internal node, max path through it = maxLeafPath(left) + node.val + maxLeafPath(right) → single DFS pass!</text>

<!-- Approach 2 block -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="30" y="366" class="sec" fill="#fff">Approach 2: O(n) — DFS returning max leaf-path from node, track global max</text>

<!-- Tree for Approach 2 with animations -->
<!-- path highlight -->
<line x1="395" y1="285" x2="340" y2="240" stroke="#27AE60" stroke-width="3" stroke-dasharray="5,3"/>
<line x1="340" y1="240" x2="450" y2="395" stroke="#27AE60" stroke-width="3" stroke-dasharray="5,3"/>
<line x1="450" y1="395" x2="560" y2="450" stroke="#27AE60" stroke-width="3" stroke-dasharray="5,3"/>
<line x1="560" y1="450" x2="615" y2="495" stroke="#27AE60" stroke-width="3" stroke-dasharray="5,3"/>

<!-- Edges -->
<line x1="450" y1="395" x2="340" y2="450" class="edge"/>
<line x1="450" y1="395" x2="560" y2="450" class="edge"/>
<line x1="340" y1="450" x2="285" y2="495" class="edge"/>
<line x1="340" y1="450" x2="395" y2="495" class="edge"/>
<line x1="560" y1="450" x2="505" y2="495" class="edge"/>
<line x1="560" y1="450" x2="615" y2="495" class="edge"/>
<!-- Nodes -->
<circle cx="450" cy="395" r="22" class="nd n1"/>
<text x="450" y="395" class="lbl">1</text>
<circle cx="340" cy="450" r="22" class="nd n2"/>
<text x="340" y="450" class="lbl">2</text>
<circle cx="560" cy="450" r="22" class="nd n3"/>
<text x="560" y="450" class="lbl">3</text>
<circle cx="285" cy="495" r="22" class="nd n4"/>
<text x="285" y="495" class="lbl">4</text>
<circle cx="395" cy="495" r="22" class="nd n5"/>
<text x="395" y="495" class="lbl">5</text>
<circle cx="505" cy="495" r="22" class="nd n6"/>
<text x="505" y="495" class="lbl">6</text>
<circle cx="615" cy="495" r="22" class="nd n6"/>
<text x="615" y="495" class="lbl">7</text>

<!-- Annotations -->
<text x="220" y="495" class="cmp" fill="#27AE60" style="animation:sl0 4s infinite">L=4</text>
<text x="415" y="510" class="cmp" fill="#27AE60" style="animation:sl1 4s infinite">L=5</text>
<text x="310" y="445" class="cmp" fill="#27AE60" style="animation:sl2 4s infinite">L=max(4,5)+2=7</text>
<text x="590" y="445" class="cmp" fill="#27AE60" style="animation:sl3 4s infinite">R=max(6,7)+3=10</text>
<text x="650" y="395" class="cmp" fill="#c0392b" font-weight="bold" style="animation:sl4 4s infinite">max=7+1+10=18✓</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="4"/>
<rect x="16" y="578" width="868" height="24" fill="#f0f0f0" rx="4"/>
<rect x="16" y="590" width="868" height="12" fill="#f0f0f0"/>
<text x="200" y="592" class="tbl" text-anchor="middle" font-weight="bold">Approach</text>
<text x="500" y="592" class="tbl" text-anchor="middle" font-weight="bold">Time</text>
<text x="720" y="592" class="tbl" text-anchor="middle" font-weight="bold">Space</text>
<rect x="16" y="602" width="868" height="24" fill="#fff5f5"/>
<text x="200" y="616" class="tbl" text-anchor="middle">O(n²) - All Leaf Pairs</text>
<text x="500" y="616" class="tbl" text-anchor="middle">O(n²)</text>
<text x="720" y="616" class="tbl" text-anchor="middle">O(n) stack</text>
<rect x="16" y="626" width="868" height="24" fill="#f0fff0"/>
<text x="200" y="640" class="tbl" text-anchor="middle">O(n) - DFS with global max</text>
<text x="500" y="640" class="tbl" text-anchor="middle">O(n)</text>
<text x="720" y="640" class="tbl" text-anchor="middle">O(h) stack</text>
<rect x="16" y="650" width="868" height="26" fill="#fff8e1"/>
<text x="450" y="664" class="tbl" text-anchor="middle" fill="#e65100">Key: DFS returns max single-branch sum to parent; global_max updated with left+node+right at each step</text>
</svg>
