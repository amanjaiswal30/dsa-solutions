<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .ndA{fill:#ffcccc;stroke:#E74C3C;stroke-width:2}
  .ndB{fill:#ccffcc;stroke:#27AE60;stroke-width:2}
  .ndHL{fill:#ffd700;stroke:#F39C12;stroke-width:2.5}
  .edge{stroke:#999;stroke-width:1.5;fill:none}
  .lbl{font:12px monospace;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:11px sans-serif;fill:#333}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}

  @keyframes nd_pulse{0%,100%{fill:#ddeeff}40%{fill:#E74C3C;fill-opacity:0.6}}
  @keyframes nd_green{0%,100%{fill:#ddeeff}40%{fill:#27AE60;fill-opacity:0.6}}
  .np0{animation:nd_pulse 6s 0s ease-in-out infinite}
  .np1{animation:nd_pulse 6s 0.5s ease-in-out infinite}
  .np2{animation:nd_pulse 6s 1.0s ease-in-out infinite}
  .np3{animation:nd_pulse 6s 1.5s ease-in-out infinite}
  .np4{animation:nd_pulse 6s 2.0s ease-in-out infinite}
  .np5{animation:nd_pulse 6s 2.5s ease-in-out infinite}
  .np6{animation:nd_pulse 6s 3.0s ease-in-out infinite}

  .ng0{animation:nd_green 6s 0s ease-in-out infinite}
  .ng1{animation:nd_green 6s 0.4s ease-in-out infinite}
  .ng2{animation:nd_green 6s 0.8s ease-in-out infinite}
  .ng3{animation:nd_green 6s 1.2s ease-in-out infinite}
  .ng4{animation:nd_green 6s 1.6s ease-in-out infinite}
  .ng5{animation:nd_green 6s 2.0s ease-in-out infinite}
  .ng6{animation:nd_green 6s 2.4s ease-in-out infinite}

  @keyframes sl0{0%,18%{opacity:1}19%,100%{opacity:0}}
  @keyframes sl1{0%,18%{opacity:0}19%,36%{opacity:1}37%,100%{opacity:0}}
  @keyframes sl2{0%,36%{opacity:0}37%,54%{opacity:1}55%,100%{opacity:0}}
  @keyframes sl3{0%,54%{opacity:0}55%,72%{opacity:1}73%,100%{opacity:0}}
  @keyframes sl4{0%,72%{opacity:0}73%,100%{opacity:1}}
  .sl0{animation:sl0 8s ease-in-out infinite}
  .sl1{animation:sl1 8s ease-in-out infinite}
  .sl2{animation:sl2 8s ease-in-out infinite}
  .sl3{animation:sl3 8s ease-in-out infinite}
  .sl4{animation:sl4 8s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Height of Binary Tree</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">Tree: 1→{2→{4,5}, 3→{null,6}}  →  height = 3</text>

<!-- APPROACH 1: Recursive DFS -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Recursive DFS — O(n) time, O(h) space</text>

<!-- Tree nodes (approach 1 — red pulse) -->
<g transform="translate(160,128)">
  <!-- Edges -->
  <line x1="0" y1="20" x2="-80" y2="76" class="edge"/>
  <line x1="0" y1="20" x2="80" y2="76" class="edge"/>
  <line x1="-80" y1="96" x2="-130" y2="152" class="edge"/>
  <line x1="-80" y1="96" x2="-30" y2="152" class="edge"/>
  <line x1="80" y1="96" x2="130" y2="152" class="edge"/>
  <!-- Nodes -->
  <circle class="np2 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">1</text>
  <circle class="np1 nd" cx="-80" cy="76" r="22"/><text x="-80" y="76" class="lbl">2</text>
  <circle class="np2 nd" cx="80" cy="76" r="22"/><text x="80" y="76" class="lbl">3</text>
  <circle class="np0 nd" cx="-130" cy="152" r="22"/><text x="-130" y="152" class="lbl">4</text>
  <circle class="np0 nd" cx="-30" cy="152" r="22"/><text x="-30" y="152" class="lbl">5</text>
  <circle class="np0 nd" cx="130" cy="152" r="22"/><text x="130" y="152" class="lbl">6</text>
  <!-- Return value labels -->
  <text x="-160" y="158" class="cmp" fill="#E74C3C" font-size="10">h=1</text>
  <text x="-58" y="158" class="cmp" fill="#E74C3C" font-size="10">h=1</text>
  <text x="102" y="158" class="cmp" fill="#E74C3C" font-size="10">h=1</text>
  <text x="-108" y="82" class="cmp" fill="#E74C3C" font-size="10">h=2</text>
  <text x="52" y="82" class="cmp" fill="#E74C3C" font-size="10">h=2</text>
  <text x="-28" y="6" class="cmp" fill="#E74C3C" font-size="10">h=3</text>
</g>

<text x="460" y="140" class="cmp">height(node):</text>
<text x="460" y="158" class="cmp">  if node is None: return 0</text>
<text x="460" y="176" class="cmp">  left  = height(node.left)</text>
<text x="460" y="194" class="cmp">  right = height(node.right)</text>
<text x="460" y="212" class="cmp">  return 1 + max(left, right)</text>

<text x="460" y="240" class="cmp sl0">① Post-order: compute leaves first</text>
<text x="460" y="255" class="cmp sl0">   Leaf nodes return height=1</text>
<text x="460" y="240" class="cmp sl1">② h(4)=1, h(5)=1 → h(2)=1+max(1,1)=2</text>
<text x="460" y="240" class="cmp sl2">③ h(6)=1, h(3.left)=0 → h(3)=1+max(0,1)=2</text>
<text x="460" y="240" class="cmp sl3">④ h(1)=1+max(h(2),h(3))=1+max(2,2)=3</text>
<text x="460" y="240" class="cmp sl4" fill="#E74C3C">⑤ Answer = 3; stack depth = O(h)</text>

<!-- Evolution arrow -->
<line x1="450" y1="312" x2="450" y2="330" class="evol"/>
<polygon points="450,331 444,319 456,319" fill="#888"/>
<rect x="290" y="315" width="320" height="28" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="333" text-anchor="middle" class="ins">BFS approach: count levels instead of recursion</text>

<!-- APPROACH 2: BFS (Level Order) -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: BFS (Level Order) — O(n) time, O(w) space (w=max width)</text>

<!-- BFS tree (green) -->
<g transform="translate(160,384)">
  <line x1="0" y1="20" x2="-80" y2="76" class="edge"/>
  <line x1="0" y1="20" x2="80" y2="76" class="edge"/>
  <line x1="-80" y1="96" x2="-130" y2="152" class="edge"/>
  <line x1="-80" y1="96" x2="-30" y2="152" class="edge"/>
  <line x1="80" y1="96" x2="130" y2="152" class="edge"/>
  <circle class="ng2 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">1</text>
  <circle class="ng1 nd" cx="-80" cy="76" r="22"/><text x="-80" y="76" class="lbl">2</text>
  <circle class="ng1 nd" cx="80" cy="76" r="22"/><text x="80" y="76" class="lbl">3</text>
  <circle class="ng0 nd" cx="-130" cy="152" r="22"/><text x="-130" y="152" class="lbl">4</text>
  <circle class="ng0 nd" cx="-30" cy="152" r="22"/><text x="-30" y="152" class="lbl">5</text>
  <circle class="ng0 nd" cx="130" cy="152" r="22"/><text x="130" y="152" class="lbl">6</text>
  <!-- Level labels -->
  <text x="-185" y="6" class="cmp" fill="#27AE60">Level 1</text>
  <text x="-185" y="82" class="cmp" fill="#27AE60">Level 2</text>
  <text x="-185" y="158" class="cmp" fill="#27AE60">Level 3</text>
</g>

<text x="460" y="400" class="cmp">BFS: queue = deque([root]); height=0</text>
<text x="460" y="416" class="cmp">while queue:</text>
<text x="460" y="432" class="cmp">  height += 1</text>
<text x="460" y="448" class="cmp">  for _ in range(len(queue)):  # process level</text>
<text x="460" y="464" class="cmp">    node = queue.popleft()</text>
<text x="460" y="480" class="cmp">    if node.left:  queue.append(node.left)</text>
<text x="460" y="496" class="cmp">    if node.right: queue.append(node.right)</text>
<text x="460" y="516" class="cmp sl0">① Start: queue=[1], height=0</text>
<text x="460" y="516" class="cmp sl1">② Process level 1: [1] → add 2,3; height=1</text>
<text x="460" y="516" class="cmp sl2">③ Process level 2: [2,3] → add 4,5,6; height=2</text>
<text x="460" y="516" class="cmp sl3">④ Process level 3: [4,5,6] → no children; height=3</text>
<text x="460" y="516" class="cmp sl4" fill="#27AE60">⑤ Return height = 3 ✓</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" stroke="#ddd" rx="6"/>
<text x="182" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="430" y="595" class="tbl" font-weight="bold">Time</text>
<text x="610" y="595" class="tbl" font-weight="bold">Space</text>
<text x="790" y="595" class="tbl" font-weight="bold">Notes</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="182" y="620" class="tbl">Recursive DFS</text>
<text x="430" y="620" class="tbl">O(n)</text>
<text x="610" y="620" class="tbl">O(h)</text>
<text x="790" y="620" class="tbl">Stack overflow risk for skewed tree</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="182" y="644" class="tbl">BFS Level Order</text>
<text x="430" y="644" class="tbl">O(n)</text>
<text x="610" y="644" class="tbl">O(w)</text>
<text x="790" y="644" class="tbl">✓ Better for wide trees</text>
<line x1="16" y1="652" x2="884" y2="652" stroke="#ddd" stroke-width="1"/>
<text x="182" y="668" class="tbl" fill="#27AE60" font-weight="bold">▶ return 1+max(height(left), height(right))</text>
</svg>
