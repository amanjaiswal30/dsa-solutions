<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#fff}
  .prob{font:13px sans-serif;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .sec{font:bold 13px sans-serif;fill:#333}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .ndHL{fill:#ffd700;stroke:#cc8800;stroke-width:2.5}
  .edge{stroke:#999;stroke-width:2;fill:none}
  .lbl{font:12px monospace;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:12px sans-serif;fill:#555}
  .ins{font:12px sans-serif;fill:#666;font-style:italic}
  .tbl{font:12px sans-serif;fill:#333}
  @keyframes ndVisit0{0%,10%{fill:#ddeeff}20%,40%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit1{0%,20%{fill:#ddeeff}30%,50%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit2{0%,30%{fill:#ddeeff}40%,60%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit3{0%,40%{fill:#ddeeff}50%,70%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit4{0%,50%{fill:#ddeeff}60%,80%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes sl0{0%,15%{opacity:0}20%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl1{0%,25%{opacity:0}30%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl2{0%,35%{opacity:0}40%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl3{0%,45%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl4{0%,55%{opacity:0}60%,90%{opacity:1}100%{opacity:0}}
  @keyframes lcaGlow{0%,100%{fill:#ddeeff}50%{fill:#ffd700;stroke-width:4}}
  @keyframes pathHL{0%,100%{stroke:#999;stroke-width:2}50%{stroke:#e74c3c;stroke-width:4}}
  .n0{animation:ndVisit0 4s infinite}
  .n1{animation:ndVisit1 4s infinite}
  .n2{animation:ndVisit2 4s infinite}
  .n3{animation:ndVisit3 4s infinite}
  .n4{animation:ndVisit4 4s infinite}
  .lcaNode{animation:lcaGlow 2s infinite}
  .pHL{animation:pathHL 2s infinite}
</style>
<rect width="900" height="690" fill="#f8f9fa"/>
<!-- Title bar -->
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="30" class="title" text-anchor="middle" dominant-baseline="middle">Lowest Common Ancestor (LCA) of Binary Tree</text>
<!-- Problem strip -->
<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="68" class="prob">Tree: 3→{5→{6,2→{7,4}},1→{0,8}} | LCA(5,1)=3, LCA(5,4)=5, LCA(0,8)=1</text>

<!-- Approach 1 block -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="30" y="110" class="sec" fill="#fff">Approach 1: O(n) — Find Root-to-Node Paths, Compare Last Common Node</text>
<text x="38" y="138" class="cmp" fill="#c0392b">• Find path from root→p and root→q (two DFS traversals)</text>
<text x="38" y="156" class="cmp" fill="#c0392b">• Compare paths from start until they diverge → last common node = LCA</text>
<text x="38" y="174" class="cmp" fill="#c0392b">• Space: O(n) to store both paths</text>

<!-- Tree for Approach 1 -->
<!-- Edges -->
<line x1="430" y1="200" x2="290" y2="250" class="edge pHL"/>
<line x1="430" y1="200" x2="570" y2="250" class="edge pHL"/>
<line x1="290" y1="250" x2="220" y2="295" class="edge"/>
<line x1="290" y1="250" x2="360" y2="295" class="edge"/>
<line x1="360" y1="295" x2="330" y2="295" class="edge"/>
<line x1="360" y1="295" x2="390" y2="295" class="edge"/>
<line x1="570" y1="250" x2="530" y2="295" class="edge"/>
<line x1="570" y1="250" x2="610" y2="295" class="edge"/>
<!-- Nodes -->
<circle cx="430" cy="200" r="22" class="nd lcaNode"/>
<text x="430" y="200" class="lbl">3</text>
<circle cx="290" cy="250" r="22" class="nd n1"/>
<text x="290" y="250" class="lbl">5</text>
<circle cx="570" cy="250" r="22" class="nd n2"/>
<text x="570" y="250" class="lbl">1</text>
<circle cx="220" cy="295" r="22" class="nd n3"/>
<text x="220" y="295" class="lbl">6</text>
<circle cx="360" cy="295" r="22" class="nd n4"/>
<text x="360" y="295" class="lbl">2</text>
<circle cx="530" cy="295" r="22" class="nd"/>
<text x="530" y="295" class="lbl">0</text>
<circle cx="610" cy="295" r="22" class="nd"/>
<text x="610" y="295" class="lbl">8</text>

<!-- Path annotations -->
<text x="690" y="210" class="cmp" fill="#c0392b" style="animation:sl0 4s infinite">path(5): 3→5</text>
<text x="690" y="228" class="cmp" fill="#c0392b" style="animation:sl1 4s infinite">path(1): 3→1</text>
<text x="690" y="248" class="cmp" fill="#27AE60" font-weight="bold" style="animation:sl2 4s infinite">LCA(5,1) = 3 ✓</text>

<!-- Evolution arrow -->
<line x1="450" y1="316" x2="450" y2="340" stroke="#f0c040" stroke-width="2"/>
<polygon points="450,348 444,336 456,336" fill="#f0c040"/>
<rect x="80" y="310" width="740" height="32" fill="#fffde7" stroke="#f0c040" stroke-width="1.5" rx="6"/>
<text x="450" y="328" class="ins" text-anchor="middle" dominant-baseline="middle">Key Insight: Single DFS — if node==p||node==q return it; if BOTH subtrees return non-null → current node IS the LCA!</text>

<!-- Approach 2 block -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="30" y="366" class="sec" fill="#fff">Approach 2: O(n) — Single DFS; if both subtrees return non-null → current = LCA</text>

<!-- Tree for Approach 2 - showing LCA(5,4) = 5 -->
<line x1="430" y1="410" x2="290" y2="460" class="edge"/>
<line x1="430" y1="410" x2="570" y2="460" class="edge"/>
<line x1="290" y1="460" x2="220" y2="505" class="edge"/>
<line x1="290" y1="460" x2="360" y2="505" class="edge"/>
<line x1="360" y1="505" x2="335" y2="545" class="edge"/>
<line x1="360" y1="505" x2="385" y2="545" class="edge"/>
<line x1="570" y1="460" x2="540" y2="505" class="edge"/>
<line x1="570" y1="460" x2="600" y2="505" class="edge"/>
<!-- Nodes -->
<circle cx="430" cy="410" r="22" class="nd n0"/>
<text x="430" y="410" class="lbl">3</text>
<circle cx="290" cy="460" r="22" class="nd lcaNode"/>
<text x="290" y="460" class="lbl">5</text>
<circle cx="570" cy="460" r="22" class="nd n2"/>
<text x="570" y="460" class="lbl">1</text>
<circle cx="220" cy="505" r="22" class="nd n3"/>
<text x="220" y="505" class="lbl">6</text>
<circle cx="360" cy="505" r="22" class="nd n3"/>
<text x="360" y="505" class="lbl">2</text>
<circle cx="335" cy="545" r="22" class="nd n4"/>
<text x="335" cy="545" class="lbl">7</text>
<circle cx="385" cy="545" r="22" class="nd n4"/>
<text x="385" cy="545" class="lbl">4</text>
<circle cx="540" cy="505" r="22" class="nd"/>
<text x="540" y="505" class="lbl">0</text>
<circle cx="600" cy="505" r="22" class="nd"/>
<text x="600" y="505" class="lbl">8</text>

<!-- DFS annotations -->
<text x="140" y="508" class="cmp" fill="#888" style="animation:sl0 4s infinite">→null</text>
<text x="310" y="462" class="cmp" fill="#ffd700" font-weight="bold" style="animation:sl2 4s infinite">p=5 found!</text>
<text x="395" y="548" class="cmp" fill="#ffd700" font-weight="bold" style="animation:sl3 4s infinite">q=4!</text>
<text x="380" y="500" class="cmp" fill="#27AE60" style="animation:sl4 4s infinite">both found→LCA=5✓</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="4"/>
<rect x="16" y="578" width="868" height="24" fill="#f0f0f0" rx="4"/>
<rect x="16" y="590" width="868" height="12" fill="#f0f0f0"/>
<text x="200" y="592" class="tbl" text-anchor="middle" font-weight="bold">Approach</text>
<text x="500" y="592" class="tbl" text-anchor="middle" font-weight="bold">Time</text>
<text x="720" y="592" class="tbl" text-anchor="middle" font-weight="bold">Space</text>
<rect x="16" y="602" width="868" height="24" fill="#fff5f5"/>
<text x="200" y="616" class="tbl" text-anchor="middle">Path-based (two DFS)</text>
<text x="500" y="616" class="tbl" text-anchor="middle">O(n)</text>
<text x="720" y="616" class="tbl" text-anchor="middle">O(n) for paths</text>
<rect x="16" y="626" width="868" height="24" fill="#f0fff0"/>
<text x="200" y="640" class="tbl" text-anchor="middle">Single DFS (optimal)</text>
<text x="500" y="640" class="tbl" text-anchor="middle">O(n)</text>
<text x="720" y="640" class="tbl" text-anchor="middle">O(h) stack only</text>
<rect x="16" y="650" width="868" height="26" fill="#fff8e1"/>
<text x="450" y="664" class="tbl" text-anchor="middle" fill="#e65100">if(root==p || root==q) return root; left=lca(left,p,q); right=lca(right,p,q); if(left&amp;&amp;right) return root; return left??right</text>
</svg>
