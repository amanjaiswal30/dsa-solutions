<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .edge{stroke:#999;stroke-width:1.5;fill:none}
  .lbl{font:12px monospace;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:11px sans-serif;fill:#333}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}

  @keyframes lv1{0%,8%{fill:#ffd700;stroke:#F39C12}8.1%,100%{fill:#ddeeff;stroke:#6699cc}}
  @keyframes lv2{0%,25%{fill:#ddeeff}26%,38%{fill:#ffd700;stroke:#F39C12}38.1%,100%{fill:#ddeeff;stroke:#6699cc}}
  @keyframes lv3{0%,45%{fill:#ddeeff}46%,58%{fill:#ffd700;stroke:#F39C12}58.1%,100%{fill:#ddeeff;stroke:#6699cc}}
  @keyframes lv4{0%,62%{fill:#ddeeff}63%,75%{fill:#ffd700;stroke:#F39C12}75.1%,100%{fill:#ddeeff;stroke:#6699cc}}
  .vl1{animation:lv1 8s ease-in-out infinite}
  .vl2{animation:lv2 8s ease-in-out infinite}
  .vl3{animation:lv3 8s ease-in-out infinite}
  .vl4{animation:lv4 8s ease-in-out infinite}

  @keyframes ar0{0%,8%{fill:#ddeeff}8.1%,100%{fill:#ccffcc}}
  @keyframes ar1{0%,38%{fill:#ddeeff}38.1%,100%{fill:#ccffcc}}
  @keyframes ar2{0%,58%{fill:#ddeeff}58.1%,100%{fill:#ccffcc}}
  @keyframes ar3{0%,75%{fill:#ddeeff}75.1%,100%{fill:#ccffcc}}
  .ar0{animation:ar0 8s ease-in-out infinite}
  .ar1{animation:ar1 8s ease-in-out infinite}
  .ar2{animation:ar2 8s ease-in-out infinite}
  .ar3{animation:ar3 8s ease-in-out infinite}

  @keyframes sl0{0%,18%{opacity:1}19%,100%{opacity:0}}
  @keyframes sl1{0%,18%{opacity:0}19%,36%{opacity:1}37%,100%{opacity:0}}
  @keyframes sl2{0%,36%{opacity:0}37%,54%{opacity:1}55%,100%{opacity:0}}
  @keyframes sl3{0%,54%{opacity:0}55%,72%{opacity:1}73%,100%{opacity:0}}
  @keyframes sl4{0%,72%{opacity:0}73%,100%{opacity:1}}
  .sl0{animation:sl0 8s ease-in-out infinite}
  .sl1{animation:sl1 8s ease-in-out infinite}
  .sl2{animation:sl2 8s ease-in-out infinite}
  .sl3{animation:sl3 8s ease-in-out infinite}
  .sl4{animation:sl4 8s ease-in-out infinite}
</style>
<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Right View of Binary Tree</text>
<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">Tree: 1→{2→{4,5}, 3→{null,6→{null,7}}}  →  Right View: [1,3,6,7]</text>

<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: BFS — last node of each level — O(n)</text>

<g transform="translate(210,120)">
  <line x1="0" y1="22" x2="-100" y2="72" class="edge"/>
  <line x1="0" y1="22" x2="100" y2="72" class="edge"/>
  <line x1="-100" y1="92" x2="-140" y2="142" class="edge"/>
  <line x1="-100" y1="92" x2="-60" y2="142" class="edge"/>
  <line x1="100" y1="92" x2="140" y2="142" class="edge"/>
  <line x1="140" y1="162" x2="170" y2="212" class="edge"/>
  <circle class="vl1 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">1</text>
  <circle class="nd" cx="-100" cy="70" r="22"/><text x="-100" y="70" class="lbl">2</text>
  <circle class="vl2 nd" cx="100" cy="70" r="22"/><text x="100" y="70" class="lbl">3</text>
  <circle class="nd" cx="-140" cy="140" r="22"/><text x="-140" y="140" class="lbl">4</text>
  <circle class="nd" cx="-60" cy="140" r="22"/><text x="-60" y="140" class="lbl">5</text>
  <circle class="vl3 nd" cx="140" cy="140" r="22"/><text x="140" y="140" class="lbl">6</text>
  <circle class="vl4 nd" cx="170" cy="210" r="22"/><text x="170" y="210" class="lbl">7</text>
  <!-- Right view arrow -->
  <line x1="210" y1="0" x2="210" y2="220" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="225" y="110" class="cmp" fill="#E74C3C" font-size="9">RIGHT VIEW</text>
</g>

<text x="540" y="140" class="cmp">Right view result:</text>
<g transform="translate(540,148)">
  <rect class="ar0" x="0" y="0" width="40" height="40" stroke="#E74C3C" stroke-width="1.5" rx="4"/><text x="20" y="24" class="lbl">1</text>
  <rect class="ar1" x="50" y="0" width="40" height="40" stroke="#E74C3C" stroke-width="1.5" rx="4"/><text x="70" y="24" class="lbl">3</text>
  <rect class="ar2" x="100" y="0" width="40" height="40" stroke="#E74C3C" stroke-width="1.5" rx="4"/><text x="120" y="24" class="lbl">6</text>
  <rect class="ar3" x="150" y="0" width="40" height="40" stroke="#E74C3C" stroke-width="1.5" rx="4"/><text x="170" y="24" class="lbl">7</text>
</g>
<text x="540" y="215" class="cmp sl0">① BFS: process each level left-to-right</text>
<text x="540" y="215" class="cmp sl1">② LAST node dequeued per level → right view</text>
<text x="540" y="215" class="cmp sl2">③ Level 1→1, Level 2→3, Level 3→6, Level 4→7</text>
<text x="540" y="215" class="cmp sl3">④ 2,4,5 not visible from right side</text>
<text x="540" y="215" class="cmp sl4" fill="#E74C3C">⑤ Right view = [1,3,6,7] ✓</text>

<line x1="450" y1="312" x2="450" y2="330" class="evol"/>
<polygon points="450,331 444,319 456,319" fill="#888"/>
<rect x="280" y="315" width="340" height="28" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="333" text-anchor="middle" class="ins">DFS: visit RIGHT child first, track max depth seen</text>

<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: DFS (Right-first) — O(n) time, O(h) space</text>
<text x="32" y="398" class="cmp">result = []; maxDepth = 0</text>
<text x="32" y="414" class="cmp">def dfs(node, depth):</text>
<text x="32" y="430" class="cmp">  if not node: return</text>
<text x="32" y="446" class="cmp">  if depth > maxDepth:       # first time at this depth</text>
<text x="32" y="462" class="cmp">    result.append(node.val)  # rightmost node seen so far</text>
<text x="32" y="478" class="cmp">    maxDepth = depth</text>
<text x="32" y="494" class="cmp">  dfs(node.right, depth+1)   # RIGHT first!</text>
<text x="32" y="510" class="cmp">  dfs(node.left,  depth+1)</text>
<rect x="330" y="385" width="538" height="150" fill="#e8f5e9" stroke="#27AE60" stroke-width="1" rx="4"/>
<text x="346" y="402" class="cmp" font-weight="bold" fill="#27AE60">DFS trace (visiting right first):</text>
<text x="346" y="418" class="cmp">dfs(1,1): depth&gt;0→record 1; maxDepth=1</text>
<text x="346" y="434" class="cmp">dfs(3,2): depth&gt;1→record 3; maxDepth=2</text>
<text x="346" y="450" class="cmp">dfs(6,3): depth&gt;2→record 6; maxDepth=3</text>
<text x="346" y="466" class="cmp">dfs(7,4): depth&gt;3→record 7; maxDepth=4</text>
<text x="346" y="482" class="cmp">dfs(2,2),dfs(4,3),dfs(5,3): depth≤maxDepth → skip</text>
<text x="346" y="518" class="cmp" fill="#27AE60" font-weight="bold">Result = [1,3,6,7] ✓</text>

<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" stroke="#ddd" rx="6"/>
<text x="182" y="595" class="tbl" font-weight="bold">Approach</text><text x="430" y="595" class="tbl" font-weight="bold">Time</text><text x="610" y="595" class="tbl" font-weight="bold">Space</text><text x="790" y="595" class="tbl" font-weight="bold">Notes</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="182" y="620" class="tbl">BFS (last per level)</text><text x="430" y="620" class="tbl">O(n)</text><text x="610" y="620" class="tbl">O(w)</text><text x="790" y="620" class="tbl">Take last node each level</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="182" y="644" class="tbl">DFS (right-first)</text><text x="430" y="644" class="tbl">O(n)</text><text x="610" y="644" class="tbl">O(h)</text><text x="790" y="644" class="tbl">✓ Mirror of left view</text>
<line x1="16" y1="652" x2="884" y2="652" stroke="#ddd" stroke-width="1"/>
<text x="182" y="668" class="tbl" fill="#27AE60" font-weight="bold">▶ Right view = last node at each level (BFS) or DFS right-first</text>
</svg>
