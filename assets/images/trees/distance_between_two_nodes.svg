<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#fff}
  .prob{font:13px sans-serif;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .sec{font:bold 13px sans-serif;fill:#333}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .edge{stroke:#999;stroke-width:2;fill:none}
  .lbl{font:12px monospace;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:12px sans-serif;fill:#555}
  .ins{font:12px sans-serif;fill:#666;font-style:italic}
  .tbl{font:12px sans-serif;fill:#333}
  @keyframes ndVisit0{0%,10%{fill:#ddeeff}20%,40%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit1{0%,20%{fill:#ddeeff}30%,50%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit2{0%,30%{fill:#ddeeff}40%,60%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit3{0%,40%{fill:#ddeeff}50%,70%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit4{0%,50%{fill:#ddeeff}60%,80%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes sl0{0%,15%{opacity:0}20%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl1{0%,25%{opacity:0}30%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl2{0%,35%{opacity:0}40%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl3{0%,45%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl4{0%,55%{opacity:0}60%,90%{opacity:1}100%{opacity:0}}
  @keyframes pathAnim{0%,100%{stroke:#999;stroke-width:2}50%{stroke:#e74c3c;stroke-width:4}}
  .n0{animation:ndVisit0 4s infinite}
  .n1{animation:ndVisit1 4s infinite}
  .n2{animation:ndVisit2 4s infinite}
  .n3{animation:ndVisit3 4s infinite}
  .n4{animation:ndVisit4 4s infinite}
  .pth{animation:pathAnim 2s infinite}
</style>
<rect width="900" height="690" fill="#f8f9fa"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="30" class="title" text-anchor="middle" dominant-baseline="middle">Distance Between Two Nodes in Binary Tree</text>
<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="68" class="prob">Tree: 1→{2→{4,5},3→{6,7}} | distance(4,7) = 4 (4→2→1→3→7)</text>

<!-- Approach 1 block -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="30" y="110" class="sec" fill="#fff">Approach 1: O(n) — LCA-based: dist(n1,n2) = depth(n1) + depth(n2) - 2*depth(LCA)</text>
<text x="38" y="138" class="cmp" fill="#c0392b">• Step 1: Find LCA(4,7) = 1 (root)</text>
<text x="38" y="156" class="cmp" fill="#c0392b">• Step 2: depth(4)=2, depth(7)=2, depth(LCA=1)=0</text>
<text x="38" y="174" class="cmp" fill="#c0392b">• dist = 2 + 2 - 2*0 = 4</text>

<!-- Tree Approach 1 - path highlighted -->
<line x1="430" y1="200" x2="290" y2="250" class="edge pth"/>
<line x1="430" y1="200" x2="570" y2="250" class="edge pth"/>
<line x1="290" y1="250" x2="230" y2="295" class="edge pth"/>
<line x1="290" y1="250" x2="350" y2="295" class="edge"/>
<line x1="570" y1="250" x2="510" y2="295" class="edge"/>
<line x1="570" y1="250" x2="630" y2="295" class="edge pth"/>
<circle cx="430" cy="200" r="22" class="nd n1"/>
<text x="430" y="200" class="lbl">1</text>
<circle cx="290" cy="250" r="22" class="nd n2"/>
<text x="290" y="250" class="lbl">2</text>
<circle cx="570" cy="250" r="22" class="nd n3"/>
<text x="570" y="250" class="lbl">3</text>
<circle cx="230" cy="295" r="22" class="nd n4"/>
<text x="230" y="295" class="lbl">4</text>
<circle cx="350" cy="295" r="22" class="nd"/>
<text x="350" y="295" class="lbl">5</text>
<circle cx="510" cy="295" r="22" class="nd"/>
<text x="510" y="295" class="lbl">6</text>
<circle cx="630" cy="295" r="22" class="nd n4"/>
<text x="630" y="295" class="lbl">7</text>

<text x="700" y="220" class="cmp" fill="#c0392b" style="animation:sl0 4s infinite">LCA(4,7)=1</text>
<text x="700" y="240" class="cmp" fill="#c0392b" style="animation:sl1 4s infinite">depth(4)=2</text>
<text x="700" y="258" class="cmp" fill="#c0392b" style="animation:sl2 4s infinite">depth(7)=2</text>
<text x="700" y="278" class="cmp" fill="#27AE60" font-weight="bold" style="animation:sl3 4s infinite">dist=2+2-0=4 ✓</text>

<!-- Evolution arrow -->
<line x1="450" y1="316" x2="450" y2="340" stroke="#f0c040" stroke-width="2"/>
<polygon points="450,348 444,336 456,336" fill="#f0c040"/>
<rect x="80" y="310" width="740" height="32" fill="#fffde7" stroke="#f0c040" stroke-width="1.5" rx="6"/>
<text x="450" y="328" class="ins" text-anchor="middle" dominant-baseline="middle">Key Insight: Both approaches O(n); DFS approach can find LCA + distances in single pass without storing paths</text>

<!-- Approach 2 block -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="30" y="366" class="sec" fill="#fff">Approach 2: O(n) — Single DFS tracking distance to each target node</text>

<!-- Tree Approach 2 - showing single pass -->
<line x1="430" y1="410" x2="290" y2="460" class="edge"/>
<line x1="430" y1="410" x2="570" y2="460" class="edge"/>
<line x1="290" y1="460" x2="230" y2="505" class="edge" stroke="#27AE60" stroke-width="3"/>
<line x1="290" y1="460" x2="350" y2="505" class="edge"/>
<line x1="570" y1="460" x2="510" y2="505" class="edge"/>
<line x1="570" y1="460" x2="630" y2="505" class="edge" stroke="#27AE60" stroke-width="3"/>

<circle cx="430" cy="410" r="22" class="nd n1"/>
<text x="430" y="410" class="lbl">1</text>
<circle cx="290" cy="460" r="22" class="nd n2"/>
<text x="290" y="460" class="lbl">2</text>
<circle cx="570" cy="460" r="22" class="nd n3"/>
<text x="570" y="460" class="lbl">3</text>
<circle cx="230" cy="505" r="22" class="nd n4"/>
<text x="230" y="505" class="lbl">4</text>
<circle cx="350" cy="505" r="22" class="nd"/>
<text x="350" y="505" class="lbl">5</text>
<circle cx="510" cy="505" r="22" class="nd"/>
<text x="510" y="505" class="lbl">6</text>
<circle cx="630" cy="505" r="22" class="nd n4"/>
<text x="630" y="505" class="lbl">7</text>

<!-- Annotations -->
<text x="160" y="505" class="cmp" fill="#27AE60" font-weight="bold" style="animation:sl0 4s infinite">n1=4 found! d=0</text>
<text x="680" y="505" class="cmp" fill="#27AE60" font-weight="bold" style="animation:sl1 4s infinite">n2=7 found! d=0</text>
<text x="100" y="458" class="cmp" fill="#27AE60" style="animation:sl2 4s infinite">d(4 from 2)=1</text>
<text x="640" y="458" class="cmp" fill="#27AE60" style="animation:sl3 4s infinite">d(7 from 3)=1</text>
<text x="430" y="390" class="cmp" fill="#c0392b" font-weight="bold" style="animation:sl4 4s infinite" text-anchor="middle">LCA=1: dist=2+2=4 ✓</text>

<!-- path label -->
<rect x="400" y="530" width="200" height="30" fill="#e8ffe8" stroke="#27AE60" rx="4"/>
<text x="500" y="548" class="cmp" text-anchor="middle" fill="#27AE60" font-weight="bold">4 → 2 → 1 → 3 → 7</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="4"/>
<rect x="16" y="578" width="868" height="24" fill="#f0f0f0" rx="4"/>
<rect x="16" y="590" width="868" height="12" fill="#f0f0f0"/>
<text x="200" y="592" class="tbl" text-anchor="middle" font-weight="bold">Approach</text>
<text x="500" y="592" class="tbl" text-anchor="middle" font-weight="bold">Time</text>
<text x="720" y="592" class="tbl" text-anchor="middle" font-weight="bold">Space</text>
<rect x="16" y="602" width="868" height="24" fill="#fff5f5"/>
<text x="200" y="616" class="tbl" text-anchor="middle">LCA + Depth calculation</text>
<text x="500" y="616" class="tbl" text-anchor="middle">O(n)</text>
<text x="720" y="616" class="tbl" text-anchor="middle">O(h) stack</text>
<rect x="16" y="626" width="868" height="24" fill="#f0fff0"/>
<text x="200" y="640" class="tbl" text-anchor="middle">Single DFS tracking dist</text>
<text x="500" y="640" class="tbl" text-anchor="middle">O(n)</text>
<text x="720" y="640" class="tbl" text-anchor="middle">O(h) stack</text>
<rect x="16" y="650" width="868" height="26" fill="#fff8e1"/>
<text x="450" y="664" class="tbl" text-anchor="middle" fill="#e65100">Formula: dist(n1,n2) = depth(n1) + depth(n2) - 2*depth(LCA(n1,n2))</text>
</svg>
