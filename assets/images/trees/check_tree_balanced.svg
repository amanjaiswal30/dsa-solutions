<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .lbl{font:12px monospace;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:11px sans-serif;fill:#333}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .edge{stroke:#999;stroke-width:1.5;fill:none}

  @keyframes ndVisit{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ffd700;stroke:#F39C12}}
  @keyframes ndGreen{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ccffcc;stroke:#27AE60}}
  @keyframes sl0{0%,19%{opacity:1}20%,100%{opacity:0}}
  @keyframes sl1{0%,19%{opacity:0}20%,39%{opacity:1}40%,100%{opacity:0}}
  @keyframes sl2{0%,39%{opacity:0}40%,59%{opacity:1}60%,100%{opacity:0}}
  @keyframes sl3{0%,59%{opacity:0}60%,79%{opacity:1}80%,100%{opacity:0}}
  @keyframes sl4{0%,79%{opacity:0}80%,100%{opacity:1}}
  .sl0{animation:sl0 9s ease-in-out infinite}
  .sl1{animation:sl1 9s ease-in-out infinite}
  .sl2{animation:sl2 9s ease-in-out infinite}
  .sl3{animation:sl3 9s ease-in-out infinite}
  .sl4{animation:sl4 9s ease-in-out infinite}
  .np0{animation:ndVisit 7s 0s ease-in-out infinite}
  .np1{animation:ndVisit 7s 0.6s ease-in-out infinite}
  .np2{animation:ndVisit 7s 1.2s ease-in-out infinite}
  .np3{animation:ndVisit 7s 1.8s ease-in-out infinite}
  .ng0{animation:ndGreen 7s 0s ease-in-out infinite}
  .ng1{animation:ndGreen 7s 0.6s ease-in-out infinite}
  .ng2{animation:ndGreen 7s 1.2s ease-in-out infinite}
  .ng3{animation:ndGreen 7s 1.8s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Check if Binary Tree is Height-Balanced</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">Balanced: |height(left) - height(right)| ≤ 1 for every node in the tree</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Naive Recursive — call height() separately at each node  O(n²) time, O(h) space</text>

<g transform="translate(165,126)">
  <line x1="0" y1="22" x2="-90" y2="72" class="edge"/>
  <line x1="0" y1="22" x2="80" y2="72" class="edge"/>
  <line x1="-90" y1="94" x2="-130" y2="148" class="edge"/>
  <line x1="-90" y1="94" x2="-50" y2="148" class="edge"/>
  <circle class="np2 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">1</text>
  <circle class="np1 nd" cx="-90" cy="72" r="22"/><text x="-90" y="72" class="lbl">2</text>
  <circle class="np1 nd" cx="80" cy="72" r="22"/><text x="80" y="72" class="lbl">3</text>
  <circle class="np0 nd" cx="-130" cy="148" r="22"/><text x="-130" y="148" class="lbl">4</text>
  <circle class="np0 nd" cx="-50" cy="148" r="22"/><text x="-50" y="148" class="lbl">5</text>
  <!-- height labels -->
  <text x="-158" y="152" class="cmp" fill="#E74C3C" font-size="10">h=1</text>
  <text x="-72" y="152" class="cmp" fill="#E74C3C" font-size="10">h=1</text>
  <text x="-120" y="76" class="cmp" fill="#E74C3C" font-size="10">h=2</text>
  <text x="50" y="76" class="cmp" fill="#E74C3C" font-size="10">h=1</text>
  <text x="-26" y="4" class="cmp" fill="#E74C3C" font-size="10">|2-1|=1✓</text>
</g>

<text x="440" y="138" class="cmp" font-weight="bold">isBalanced(node):</text>
<text x="440" y="155" class="cmp">  if not node: return True</text>
<text x="440" y="172" class="cmp">  lh = height(node.left)   # O(n) call</text>
<text x="440" y="189" class="cmp">  rh = height(node.right)  # O(n) call</text>
<text x="440" y="206" class="cmp">  if abs(lh - rh) > 1: return False</text>
<text x="440" y="223" class="cmp">  return isBalanced(left) and isBalanced(right)</text>

<text x="440" y="250" class="cmp sl0">① At node 1: call height(left)=2, height(right)=1</text>
<text x="440" y="250" class="cmp sl1">② |2-1|=1 ≤ 1 → node 1 is locally balanced</text>
<text x="440" y="250" class="cmp sl2">③ Recurse to node 2: height(4)=1, height(5)=1 → OK</text>
<text x="440" y="250" class="cmp sl3">④ Recurse to node 3: height(None)=0, height(None)=0 → OK</text>
<text x="440" y="250" class="cmp sl4" fill="#E74C3C">⑤ All balanced → True  (but height() called O(n) times each!)</text>

<!-- Arrow -->
<line x1="450" y1="312" x2="450" y2="330" class="evol"/>
<polygon points="450,332 444,320 456,320" fill="#888"/>
<rect x="270" y="315" width="360" height="24" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">Key insight: compute height and check balance in single DFS pass</text>

<!-- APPROACH 2 -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: Single-pass DFS — return -1 for unbalanced, height otherwise  O(n) time, O(h) space</text>

<g transform="translate(165,382)">
  <line x1="0" y1="22" x2="-90" y2="72" class="edge"/>
  <line x1="0" y1="22" x2="80" y2="72" class="edge"/>
  <line x1="-90" y1="94" x2="-130" y2="148" class="edge"/>
  <line x1="-90" y1="94" x2="-50" y2="148" class="edge"/>
  <circle class="ng2 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">1</text>
  <circle class="ng1 nd" cx="-90" cy="72" r="22"/><text x="-90" y="72" class="lbl">2</text>
  <circle class="ng1 nd" cx="80" cy="72" r="22"/><text x="80" y="72" class="lbl">3</text>
  <circle class="ng0 nd" cx="-130" cy="148" r="22"/><text x="-130" y="148" class="lbl">4</text>
  <circle class="ng0 nd" cx="-50" cy="148" r="22"/><text x="-50" y="148" class="lbl">5</text>
  <text x="-155" y="152" class="cmp" fill="#27AE60" font-size="10">ret:1</text>
  <text x="-70" y="152" class="cmp" fill="#27AE60" font-size="10">ret:1</text>
  <text x="-118" y="76" class="cmp" fill="#27AE60" font-size="10">ret:2</text>
  <text x="52" y="76" class="cmp" fill="#27AE60" font-size="10">ret:1</text>
  <text x="-28" y="4" class="cmp" fill="#27AE60" font-size="10">ret:3</text>
</g>

<text x="440" y="398" class="cmp" font-weight="bold">checkHeight(node) → int:</text>
<text x="440" y="415" class="cmp">  if not node: return 0</text>
<text x="440" y="432" class="cmp">  lh = checkHeight(node.left)</text>
<text x="440" y="449" class="cmp">  if lh == -1: return -1  # short circuit</text>
<text x="440" y="466" class="cmp">  rh = checkHeight(node.right)</text>
<text x="440" y="483" class="cmp">  if rh == -1: return -1  # short circuit</text>
<text x="440" y="500" class="cmp">  if abs(lh-rh) > 1: return -1</text>
<text x="440" y="517" class="cmp">  return 1 + max(lh, rh)</text>

<text x="440" y="540" class="cmp sl0">① Leaves 4,5 return 1 (balanced, height=1)</text>
<text x="440" y="540" class="cmp sl1">② Node 2: lh=1, rh=1, |1-1|=0 → return 2</text>
<text x="440" y="540" class="cmp sl2">③ Node 3: lh=0, rh=0 → return 1</text>
<text x="440" y="540" class="cmp sl3">④ Node 1: lh=2, rh=1, |2-1|=1 ≤ 1 → return 3</text>
<text x="440" y="540" class="cmp sl4" fill="#27AE60">⑤ checkHeight(root) != -1 → Balanced = True</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" rx="6"/>
<text x="180" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="400" y="595" class="tbl" font-weight="bold">Time</text>
<text x="570" y="595" class="tbl" font-weight="bold">Space</text>
<text x="760" y="595" class="tbl" font-weight="bold">Notes</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="180" y="620" class="tbl">Naive: separate height() calls</text>
<text x="400" y="620" class="tbl">O(n²)</text>
<text x="570" y="620" class="tbl">O(h)</text>
<text x="760" y="620" class="tbl">Redundant height computations</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="180" y="644" class="tbl">Single-pass DFS (-1 sentinel)</text>
<text x="400" y="644" class="tbl">O(n)</text>
<text x="570" y="644" class="tbl">O(h)</text>
<text x="760" y="644" class="tbl">Early exit on unbalanced subtree</text>
<rect x="16" y="652" width="868" height="24" fill="#fff"/>
<text x="180" y="668" class="tbl" fill="#555">n = node count, h = height</text>
<text x="600" y="668" class="tbl" fill="#555">-1 sentinel avoids extra boolean param</text>
</svg>
