<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .lbl{font:12px monospace;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:11px sans-serif;fill:#333}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .edge{stroke:#999;stroke-width:1.5;fill:none}

  @keyframes ndVisit{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ffd700;stroke:#F39C12}}
  @keyframes ndGreen{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ccffcc;stroke:#27AE60}}
  @keyframes sl0{0%,19%{opacity:1}20%,100%{opacity:0}}
  @keyframes sl1{0%,19%{opacity:0}20%,39%{opacity:1}40%,100%{opacity:0}}
  @keyframes sl2{0%,39%{opacity:0}40%,59%{opacity:1}60%,100%{opacity:0}}
  @keyframes sl3{0%,59%{opacity:0}60%,79%{opacity:1}80%,100%{opacity:0}}
  @keyframes sl4{0%,79%{opacity:0}80%,100%{opacity:1}}
  .sl0{animation:sl0 9s ease-in-out infinite}
  .sl1{animation:sl1 9s ease-in-out infinite}
  .sl2{animation:sl2 9s ease-in-out infinite}
  .sl3{animation:sl3 9s ease-in-out infinite}
  .sl4{animation:sl4 9s ease-in-out infinite}
  .np0{animation:ndVisit 7s 0s ease-in-out infinite}
  .np1{animation:ndVisit 7s 0.6s ease-in-out infinite}
  .np2{animation:ndVisit 7s 1.2s ease-in-out infinite}
  .ng0{animation:ndGreen 7s 0s ease-in-out infinite}
  .ng1{animation:ndGreen 7s 0.6s ease-in-out infinite}
  .ng2{animation:ndGreen 7s 1.2s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Check if Binary Tree is a Sum Tree</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">Sum Tree: every internal node value = sum of all values in its subtree. Leaf nodes satisfy trivially.</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Naive O(n²) — for each node, compute subtree sum separately and compare</text>

<!-- Sum tree example -->
<g transform="translate(180,126)">
  <line x1="0" y1="22" x2="-90" y2="72" class="edge"/>
  <line x1="0" y1="22" x2="90" y2="72" class="edge"/>
  <line x1="-90" y1="94" x2="-130" y2="148" class="edge"/>
  <line x1="-90" y1="94" x2="-50" y2="148" class="edge"/>
  <circle class="np2 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">26</text>
  <circle class="np1 nd" cx="-90" cy="72" r="22"/><text x="-90" y="72" class="lbl">10</text>
  <circle class="np1 nd" cx="90" cy="72" r="22"/><text x="90" y="72" class="lbl">3</text>
  <circle class="np0 nd" cx="-130" cy="148" r="22"/><text x="-130" y="148" class="lbl">4</text>
  <circle class="np0 nd" cx="-50" cy="148" r="22"/><text x="-50" y="148" class="lbl">6</text>
  <!-- check labels -->
  <text x="-158" y="152" class="cmp" fill="#27AE60" font-size="10">leaf✓</text>
  <text x="-72" y="152" class="cmp" fill="#27AE60" font-size="10">leaf✓</text>
  <text x="-120" y="76" class="cmp" fill="#27AE60" font-size="9">4+6=10✓</text>
  <text x="62" y="76" class="cmp" fill="#27AE60" font-size="9">leaf✓</text>
  <text x="-22" y="4" class="cmp" fill="#27AE60" font-size="9">10+3+...=26?</text>
</g>

<text x="430" y="138" class="cmp" font-weight="bold">isSumTree(node):</text>
<text x="430" y="155" class="cmp">  if not node or is_leaf(node): return True</text>
<text x="430" y="172" class="cmp">  ls = subtreeSum(node.left)   # O(n)</text>
<text x="430" y="189" class="cmp">  rs = subtreeSum(node.right)  # O(n)</text>
<text x="430" y="206" class="cmp">  if node.val != ls + rs: return False</text>
<text x="430" y="223" class="cmp">  return isSumTree(left) and isSumTree(right)</text>

<text x="430" y="250" class="cmp sl0">① Node 26: call subtreeSum(left)=10, subtreeSum(right)=3+3=13?</text>
<text x="430" y="250" class="cmp sl1">② Actually: sum(left subtree)=4+6+10=20, sum(right)=3+3=6</text>
<text x="430" y="250" class="cmp sl2">③ Node 26: 26 == 20+6? No... Let me recalc: subtreeSum=4+6=10, right=3</text>
<text x="430" y="250" class="cmp sl3">④ Each node calls subtreeSum() → O(n) work → total O(n²)</text>
<text x="430" y="250" class="cmp sl4" fill="#E74C3C">⑤ Valid but slow: redundant sum computations at each node</text>

<!-- Arrow -->
<line x1="450" y1="312" x2="450" y2="330" class="evol"/>
<polygon points="450,332 444,320 456,320" fill="#888"/>
<rect x="270" y="315" width="360" height="24" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">Key: return subtree sum from DFS — reuse computation bottom-up</text>

<!-- APPROACH 2 -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: Single DFS O(n) — return subtree sum, validate at each node during traversal</text>

<g transform="translate(180,382)">
  <line x1="0" y1="22" x2="-90" y2="72" class="edge"/>
  <line x1="0" y1="22" x2="90" y2="72" class="edge"/>
  <line x1="-90" y1="94" x2="-130" y2="148" class="edge"/>
  <line x1="-90" y1="94" x2="-50" y2="148" class="edge"/>
  <circle class="ng2 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">26</text>
  <circle class="ng1 nd" cx="-90" cy="72" r="22"/><text x="-90" y="72" class="lbl">10</text>
  <circle class="ng1 nd" cx="90" cy="72" r="22"/><text x="90" y="72" class="lbl">3</text>
  <circle class="ng0 nd" cx="-130" cy="148" r="22"/><text x="-130" y="148" class="lbl">4</text>
  <circle class="ng0 nd" cx="-50" cy="148" r="22"/><text x="-50" y="148" class="lbl">6</text>
  <!-- return value labels -->
  <text x="-165" y="152" class="cmp" fill="#27AE60" font-size="10">→4</text>
  <text x="-72" y="152" class="cmp" fill="#27AE60" font-size="10">→6</text>
  <text x="-128" y="76" class="cmp" fill="#27AE60" font-size="10">→20</text>
  <text x="62" y="76" class="cmp" fill="#27AE60" font-size="10">→6</text>
  <text x="-22" y="4" class="cmp" fill="#27AE60" font-size="10">→52</text>
</g>

<text x="430" y="398" class="cmp" font-weight="bold">dfs(node) → int (subtree sum, or -1 if invalid):</text>
<text x="430" y="415" class="cmp">  if not node: return 0</text>
<text x="430" y="432" class="cmp">  if is_leaf(node): return node.val</text>
<text x="430" y="449" class="cmp">  ls = dfs(node.left)</text>
<text x="430" y="466" class="cmp">  if ls == -1: return -1</text>
<text x="430" y="483" class="cmp">  rs = dfs(node.right)</text>
<text x="430" y="500" class="cmp">  if rs == -1: return -1</text>
<text x="430" y="517" class="cmp">  if node.val != ls + rs: return -1</text>
<text x="430" y="534" class="cmp">  return node.val + ls + rs</text>

<text x="430" y="556" class="cmp sl0">① Leaf 4: return 4; Leaf 6: return 6</text>
<text x="430" y="556" class="cmp sl1">② Node 10: ls=4, rs=6, 10==4+6 ✓ → return 4+6+10=20</text>
<text x="430" y="556" class="cmp sl2">③ Node 3: leaf → return 3 (wait, 3 is leaf here) → return 3</text>
<text x="430" y="556" class="cmp sl3">④ Node 26: ls=20, rs=3+3=6? Actually ls=10+4+6=20, rs=3</text>
<text x="430" y="556" class="cmp sl4" fill="#27AE60">⑤ 26==20+... wait: example: 26==10+3+... dfs returns -1 if invalid</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" rx="6"/>
<text x="180" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="400" y="595" class="tbl" font-weight="bold">Time</text>
<text x="570" y="595" class="tbl" font-weight="bold">Space</text>
<text x="760" y="595" class="tbl" font-weight="bold">Notes</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="180" y="620" class="tbl">Naive: separate subtreeSum()</text>
<text x="400" y="620" class="tbl">O(n²)</text>
<text x="570" y="620" class="tbl">O(h)</text>
<text x="760" y="620" class="tbl">Recomputes sums redundantly</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="180" y="644" class="tbl">Single DFS with sum return</text>
<text x="400" y="644" class="tbl">O(n)</text>
<text x="570" y="644" class="tbl">O(h)</text>
<text x="760" y="644" class="tbl">Each node visited once; early exit on -1</text>
<rect x="16" y="652" width="868" height="24" fill="#fff"/>
<text x="180" y="668" class="tbl" fill="#555">n = nodes, h = height</text>
<text x="600" y="668" class="tbl" fill="#555">-1 sentinel propagates invalidity upward</text>
</svg>
