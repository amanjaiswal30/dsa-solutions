<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .lbl{font:12px monospace;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:11px sans-serif;fill:#333}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .edge{stroke:#999;stroke-width:1.5;fill:none}

  @keyframes ndVisit{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ffd700;stroke:#F39C12}}
  @keyframes ndGreen{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ccffcc;stroke:#27AE60}}
  @keyframes sl0{0%,19%{opacity:1}20%,100%{opacity:0}}
  @keyframes sl1{0%,19%{opacity:0}20%,39%{opacity:1}40%,100%{opacity:0}}
  @keyframes sl2{0%,39%{opacity:0}40%,59%{opacity:1}60%,100%{opacity:0}}
  @keyframes sl3{0%,59%{opacity:0}60%,79%{opacity:1}80%,100%{opacity:0}}
  @keyframes sl4{0%,79%{opacity:0}80%,100%{opacity:1}}
  .sl0{animation:sl0 9s ease-in-out infinite}
  .sl1{animation:sl1 9s ease-in-out infinite}
  .sl2{animation:sl2 9s ease-in-out infinite}
  .sl3{animation:sl3 9s ease-in-out infinite}
  .sl4{animation:sl4 9s ease-in-out infinite}
  .np0{animation:ndVisit 7s 0s ease-in-out infinite}
  .np1{animation:ndVisit 7s 0.5s ease-in-out infinite}
  .np2{animation:ndVisit 7s 1.0s ease-in-out infinite}
  .np3{animation:ndVisit 7s 1.5s ease-in-out infinite}
  .ng0{animation:ndGreen 7s 0s ease-in-out infinite}
  .ng1{animation:ndGreen 7s 0.5s ease-in-out infinite}
  .ng2{animation:ndGreen 7s 1.0s ease-in-out infinite}
  .ng3{animation:ndGreen 7s 1.5s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Check if Binary Tree is a Valid BST</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">Valid BST: left subtree &lt; node &lt; right subtree for all nodes. Invalid if violated at any level.</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Inorder Traversal — collect nodes, check if sorted  O(n) time, O(n) space</text>

<!-- BST tree -->
<g transform="translate(170,126)">
  <line x1="0" y1="22" x2="-80" y2="72" class="edge"/>
  <line x1="0" y1="22" x2="80" y2="72" class="edge"/>
  <line x1="-80" y1="94" x2="-110" y2="148" class="edge"/>
  <line x1="-80" y1="94" x2="-50" y2="148" class="edge"/>
  <line x1="80" y1="94" x2="50" y2="148" class="edge"/>
  <line x1="80" y1="94" x2="110" y2="148" class="edge"/>
  <circle class="np2 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">5</text>
  <circle class="np1 nd" cx="-80" cy="72" r="22"/><text x="-80" y="72" class="lbl">3</text>
  <circle class="np2 nd" cx="80" cy="72" r="22"/><text x="80" y="72" class="lbl">7</text>
  <circle class="np0 nd" cx="-110" cy="148" r="22"/><text x="-110" y="148" class="lbl">1</text>
  <circle class="np0 nd" cx="-50" cy="148" r="22"/><text x="-50" y="148" class="lbl">4</text>
  <circle class="np0 nd" cx="50" cy="148" r="22"/><text x="50" y="148" class="lbl">6</text>
  <circle class="np0 nd" cx="110" cy="148" r="22"/><text x="110" y="148" class="lbl">9</text>
  <!-- inorder sequence -->
  <text x="0" y="188" text-anchor="middle" class="cmp" fill="#E74C3C" font-size="10">Inorder: [1,3,4,5,6,7,9] → sorted ✓</text>
</g>

<!-- sorted array boxes -->
<g transform="translate(360,240)">
  <text x="0" y="-8" class="cmp" fill="#E74C3C">Inorder result:</text>
  <rect x="0" y="0" width="32" height="24" fill="#ccffcc" stroke="#27AE60"/>
  <rect x="32" y="0" width="32" height="24" fill="#ccffcc" stroke="#27AE60"/>
  <rect x="64" y="0" width="32" height="24" fill="#ccffcc" stroke="#27AE60"/>
  <rect x="96" y="0" width="32" height="24" fill="#ccffcc" stroke="#27AE60"/>
  <rect x="128" y="0" width="32" height="24" fill="#ccffcc" stroke="#27AE60"/>
  <rect x="160" y="0" width="32" height="24" fill="#ccffcc" stroke="#27AE60"/>
  <rect x="192" y="0" width="32" height="24" fill="#ccffcc" stroke="#27AE60"/>
  <text x="16" y="16" text-anchor="middle" class="lbl">1</text>
  <text x="48" y="16" text-anchor="middle" class="lbl">3</text>
  <text x="80" y="16" text-anchor="middle" class="lbl">4</text>
  <text x="112" y="16" text-anchor="middle" class="lbl">5</text>
  <text x="144" y="16" text-anchor="middle" class="lbl">6</text>
  <text x="176" y="16" text-anchor="middle" class="lbl">7</text>
  <text x="208" y="16" text-anchor="middle" class="lbl">9</text>
  <text x="224" y="16" class="cmp" fill="#27AE60"> ✓ sorted</text>
</g>

<text x="510" y="138" class="cmp" font-weight="bold">inorder_check(root):</text>
<text x="510" y="155" class="cmp">  result = []</text>
<text x="510" y="172" class="cmp">  def inorder(node):</text>
<text x="510" y="189" class="cmp">    if not node: return</text>
<text x="510" y="206" class="cmp">    inorder(node.left)</text>
<text x="510" y="223" class="cmp">    result.append(node.val)</text>
<text x="510" y="240" class="cmp">    inorder(node.right)</text>
<text x="510" y="257" class="cmp">  inorder(root)</text>
<text x="510" y="274" class="cmp">  return all(r[i]&lt;r[i+1] for i in range(len(r)-1))</text>

<text x="24" y="285" class="cmp sl0">① Traverse: left-most first (1), then up</text>
<text x="24" y="285" class="cmp sl1">② Inorder sequence: 1 → 3 → 4 → 5 → 6 → 7 → 9</text>
<text x="24" y="285" class="cmp sl2">③ Check: each element greater than previous?</text>
<text x="24" y="285" class="cmp sl3">④ 1&lt;3&lt;4&lt;5&lt;6&lt;7&lt;9 — all True</text>
<text x="24" y="285" class="cmp sl4" fill="#E74C3C">⑤ Return True (valid BST). Extra O(n) space for array.</text>

<!-- Arrow -->
<line x1="450" y1="312" x2="450" y2="330" class="evol"/>
<polygon points="450,332 444,320 456,320" fill="#888"/>
<rect x="270" y="315" width="360" height="24" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">Better: pass min/max bounds — no extra array needed</text>

<!-- APPROACH 2 -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: Range Validation — pass (min, max) bounds recursively  O(n) time, O(h) space</text>

<g transform="translate(170,382)">
  <line x1="0" y1="22" x2="-80" y2="72" class="edge"/>
  <line x1="0" y1="22" x2="80" y2="72" class="edge"/>
  <line x1="-80" y1="94" x2="-110" y2="148" class="edge"/>
  <line x1="-80" y1="94" x2="-50" y2="148" class="edge"/>
  <line x1="80" y1="94" x2="50" y2="148" class="edge"/>
  <line x1="80" y1="94" x2="110" y2="148" class="edge"/>
  <circle class="ng2 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">5</text>
  <circle class="ng1 nd" cx="-80" cy="72" r="22"/><text x="-80" y="72" class="lbl">3</text>
  <circle class="ng2 nd" cx="80" cy="72" r="22"/><text x="80" y="72" class="lbl">7</text>
  <circle class="ng0 nd" cx="-110" cy="148" r="22"/><text x="-110" y="148" class="lbl">1</text>
  <circle class="ng0 nd" cx="-50" cy="148" r="22"/><text x="-50" y="148" class="lbl">4</text>
  <circle class="ng0 nd" cx="50" cy="148" r="22"/><text x="50" y="148" class="lbl">6</text>
  <circle class="ng0 nd" cx="110" cy="148" r="22"/><text x="110" y="148" class="lbl">9</text>
  <!-- range labels -->
  <text x="-2" y="-30" text-anchor="middle" class="cmp" fill="#27AE60" font-size="9">(-∞,+∞)</text>
  <text x="-80" y="48" text-anchor="middle" class="cmp" fill="#27AE60" font-size="9">(-∞,5)</text>
  <text x="80" y="48" text-anchor="middle" class="cmp" fill="#27AE60" font-size="9">(5,+∞)</text>
  <text x="-110" y="122" text-anchor="middle" class="cmp" fill="#27AE60" font-size="9">(-∞,3)</text>
  <text x="-50" y="122" text-anchor="middle" class="cmp" fill="#27AE60" font-size="9">(3,5)</text>
  <text x="50" y="122" text-anchor="middle" class="cmp" fill="#27AE60" font-size="9">(5,7)</text>
  <text x="110" y="122" text-anchor="middle" class="cmp" fill="#27AE60" font-size="9">(7,+∞)</text>
</g>

<text x="430" y="400" class="cmp" font-weight="bold">isValidBST(node, lo=-inf, hi=+inf):</text>
<text x="430" y="417" class="cmp">  if not node: return True</text>
<text x="430" y="434" class="cmp">  if not (lo &lt; node.val &lt; hi):</text>
<text x="430" y="451" class="cmp">    return False</text>
<text x="430" y="468" class="cmp">  return (</text>
<text x="430" y="485" class="cmp">    isValidBST(node.left,  lo, node.val) and</text>
<text x="430" y="502" class="cmp">    isValidBST(node.right, node.val, hi)</text>
<text x="430" y="519" class="cmp">  )</text>

<text x="430" y="545" class="cmp sl0">① Root 5: range (-∞,+∞) → valid</text>
<text x="430" y="545" class="cmp sl1">② Node 3: range (-∞,5) → 3 in range ✓</text>
<text x="430" y="545" class="cmp sl2">③ Node 4: range (3,5) → 4 in range ✓</text>
<text x="430" y="545" class="cmp sl3">④ Node 7: range (5,+∞) → 7 in range ✓</text>
<text x="430" y="545" class="cmp sl4" fill="#27AE60">⑤ All nodes valid → return True. O(h) space only!</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" rx="6"/>
<text x="180" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="400" y="595" class="tbl" font-weight="bold">Time</text>
<text x="570" y="595" class="tbl" font-weight="bold">Space</text>
<text x="760" y="595" class="tbl" font-weight="bold">Notes</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="180" y="620" class="tbl">Inorder + sorted check</text>
<text x="400" y="620" class="tbl">O(n)</text>
<text x="570" y="620" class="tbl">O(n)</text>
<text x="760" y="620" class="tbl">Extra array; can optimize with prev pointer</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="180" y="644" class="tbl">Range validation (lo, hi)</text>
<text x="400" y="644" class="tbl">O(n)</text>
<text x="570" y="644" class="tbl">O(h)</text>
<text x="760" y="644" class="tbl">Elegant; catches cross-level violations</text>
<rect x="16" y="652" width="868" height="24" fill="#fff"/>
<text x="180" y="668" class="tbl" fill="#555">n = nodes, h = tree height</text>
<text x="600" y="668" class="tbl" fill="#555">Range method handles duplicates easily</text>
</svg>
