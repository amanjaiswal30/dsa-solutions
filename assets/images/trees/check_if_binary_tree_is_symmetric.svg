<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .lbl{font:12px monospace;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:11px sans-serif;fill:#333}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .edge{stroke:#999;stroke-width:1.5;fill:none}
  .mirror{stroke:#9b59b6;stroke-width:1.5;stroke-dasharray:5,3;fill:none}

  @keyframes ndVisit{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ffd700;stroke:#F39C12}}
  @keyframes ndGreen{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ccffcc;stroke:#27AE60}}
  @keyframes sl0{0%,19%{opacity:1}20%,100%{opacity:0}}
  @keyframes sl1{0%,19%{opacity:0}20%,39%{opacity:1}40%,100%{opacity:0}}
  @keyframes sl2{0%,39%{opacity:0}40%,59%{opacity:1}60%,100%{opacity:0}}
  @keyframes sl3{0%,59%{opacity:0}60%,79%{opacity:1}80%,100%{opacity:0}}
  @keyframes sl4{0%,79%{opacity:0}80%,100%{opacity:1}}
  .sl0{animation:sl0 9s ease-in-out infinite}
  .sl1{animation:sl1 9s ease-in-out infinite}
  .sl2{animation:sl2 9s ease-in-out infinite}
  .sl3{animation:sl3 9s ease-in-out infinite}
  .sl4{animation:sl4 9s ease-in-out infinite}
  .np0{animation:ndVisit 7s 0s ease-in-out infinite}
  .np1{animation:ndVisit 7s 0.6s ease-in-out infinite}
  .np2{animation:ndVisit 7s 1.2s ease-in-out infinite}
  .ng0{animation:ndGreen 7s 0s ease-in-out infinite}
  .ng1{animation:ndGreen 7s 0.6s ease-in-out infinite}
  .ng2{animation:ndGreen 7s 1.2s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Check if Binary Tree is Symmetric</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">Symmetric: tree is a mirror of itself around the root. Left subtree mirrors right subtree.</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Recursive — isMirror(left, right) checks outer+inner pairs  O(n) time, O(h) space</text>

<!-- Symmetric tree with mirror lines -->
<g transform="translate(250,126)">
  <!-- mirror axis -->
  <line x1="0" y1="-10" x2="0" y2="185" class="mirror"/>
  <line x1="0" y1="22" x2="-100" y2="72" class="edge"/>
  <line x1="0" y1="22" x2="100" y2="72" class="edge"/>
  <line x1="-100" y1="94" x2="-140" y2="148" class="edge"/>
  <line x1="-100" y1="94" x2="-60" y2="148" class="edge"/>
  <line x1="100" y1="94" x2="60" y2="148" class="edge"/>
  <line x1="100" y1="94" x2="140" y2="148" class="edge"/>
  <!-- mirror pair arrows -->
  <path d="M-100,72 Q0,50 100,72" class="mirror" marker-end="url(#marr)"/>
  <path d="M-140,148 Q0,120 140,148" class="mirror"/>
  <path d="M-60,148 Q0,130 60,148" class="mirror"/>
  <circle class="np2 nd" cx="0" cy="0" r="22"/><text x="0" y="0" class="lbl">1</text>
  <circle class="np1 nd" cx="-100" cy="72" r="22"/><text x="-100" y="72" class="lbl">2</text>
  <circle class="np1 nd" cx="100" cy="72" r="22"/><text x="100" y="72" class="lbl">2</text>
  <circle class="np0 nd" cx="-140" cy="148" r="22"/><text x="-140" y="148" class="lbl">3</text>
  <circle class="np0 nd" cx="-60" cy="148" r="22"/><text x="-60" y="148" class="lbl">4</text>
  <circle class="np0 nd" cx="60" cy="148" r="22"/><text x="60" y="148" class="lbl">4</text>
  <circle class="np0 nd" cx="140" cy="148" r="22"/><text x="140" y="148" class="lbl">3</text>
</g>

<defs><marker id="marr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6" fill="none" stroke="#9b59b6" stroke-width="1"/></marker></defs>

<text x="540" y="138" class="cmp" font-weight="bold">isSymmetric(root):</text>
<text x="540" y="155" class="cmp">  return isMirror(root.left, root.right)</text>
<text x="540" y="175" class="cmp" font-weight="bold">isMirror(left, right):</text>
<text x="540" y="192" class="cmp">  if not left and not right: return True</text>
<text x="540" y="209" class="cmp">  if not left or not right:  return False</text>
<text x="540" y="226" class="cmp">  return (left.val == right.val and</text>
<text x="540" y="243" class="cmp">    isMirror(left.left,  right.right) and</text>
<text x="540" y="260" class="cmp">    isMirror(left.right, right.left))</text>

<text x="26" y="288" class="cmp sl0">① Compare root.left(2) with root.right(2) → 2==2 ✓</text>
<text x="26" y="288" class="cmp sl1">② Outer: isMirror(left.left=3, right.right=3) → 3==3 ✓</text>
<text x="26" y="288" class="cmp sl2">③ Inner: isMirror(left.right=4, right.left=4) → 4==4 ✓</text>
<text x="26" y="288" class="cmp sl3">④ All leaf pairs match → return True recursively</text>
<text x="26" y="288" class="cmp sl4" fill="#E74C3C">⑤ isSymmetric = True  Checks outer then inner pairs</text>

<!-- Arrow -->
<line x1="450" y1="312" x2="450" y2="330" class="evol"/>
<polygon points="450,332 444,320 456,320" fill="#888"/>
<rect x="280" y="315" width="340" height="24" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">Iterative: use queue with node pairs — no recursion stack</text>

<!-- APPROACH 2 -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: Iterative BFS with queue of node pairs — compare mirror positions  O(n) time, O(w) space</text>

<!-- Queue visualization -->
<text x="24" y="400" class="cmp" font-weight="bold" fill="#27AE60">Queue (pairs to compare):</text>

<g transform="translate(24,410)">
  <rect x="0" y="0" width="420" height="22" fill="#e8f5e9" stroke="#27AE60" rx="3"/>
  <text x="6" y="15" class="cmp sl0">Initial: [(root.left=2, root.right=2)]</text>
  <text x="6" y="15" class="cmp sl1">Pop (2,2): match ✓. Push (2.L=3,2.R=3),(2.R=4,2.L=4)</text>
  <text x="6" y="15" class="cmp sl2">Pop (3,3): match ✓. Push (null,null),(null,null)</text>
  <text x="6" y="15" class="cmp sl3">Pop (4,4): match ✓. Push (null,null),(null,null)</text>
  <text x="6" y="15" class="cmp sl4" fill="#27AE60">All pairs matched → return True</text>
</g>

<text x="24" y="455" class="cmp" font-weight="bold">isSymmetric_bfs(root):</text>
<text x="24" y="472" class="cmp">  q = deque([(root.left, root.right)])</text>
<text x="24" y="489" class="cmp">  while q:</text>
<text x="24" y="506" class="cmp">    L, R = q.popleft()</text>
<text x="24" y="523" class="cmp">    if not L and not R: continue</text>
<text x="24" y="540" class="cmp">    if not L or not R or L.val != R.val: return False</text>
<text x="24" y="557" class="cmp">    q.append((L.left, R.right)); q.append((L.right, R.left))</text>

<!-- tree diagram for approach 2 -->
<g transform="translate(700,395)">
  <line x1="0" y1="22" x2="-70" y2="68" class="edge"/>
  <line x1="0" y1="22" x2="70" y2="68" class="edge"/>
  <line x1="-70" y1="90" x2="-100" y2="140" class="edge"/>
  <line x1="-70" y1="90" x2="-40" y2="140" class="edge"/>
  <line x1="70" y1="90" x2="40" y2="140" class="edge"/>
  <line x1="70" y1="90" x2="100" y2="140" class="edge"/>
  <circle class="ng2 nd" cx="0" cy="0" r="20"/><text x="0" y="0" class="lbl">1</text>
  <circle class="ng1 nd" cx="-70" cy="68" r="20"/><text x="-70" y="68" class="lbl">2</text>
  <circle class="ng1 nd" cx="70" cy="68" r="20"/><text x="70" y="68" class="lbl">2</text>
  <circle class="ng0 nd" cx="-100" cy="140" r="20"/><text x="-100" y="140" class="lbl">3</text>
  <circle class="ng0 nd" cx="-40" cy="140" r="20"/><text x="-40" y="140" class="lbl">4</text>
  <circle class="ng0 nd" cx="40" cy="140" r="20"/><text x="40" y="140" class="lbl">4</text>
  <circle class="ng0 nd" cx="100" cy="140" r="20"/><text x="100" y="140" class="lbl">3</text>
</g>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" rx="6"/>
<text x="180" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="400" y="595" class="tbl" font-weight="bold">Time</text>
<text x="570" y="595" class="tbl" font-weight="bold">Space</text>
<text x="760" y="595" class="tbl" font-weight="bold">Notes</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="180" y="620" class="tbl">Recursive isMirror</text>
<text x="400" y="620" class="tbl">O(n)</text>
<text x="570" y="620" class="tbl">O(h)</text>
<text x="760" y="620" class="tbl">Elegant; recursion stack = O(h)</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="180" y="644" class="tbl">Iterative BFS with pairs</text>
<text x="400" y="644" class="tbl">O(n)</text>
<text x="570" y="644" class="tbl">O(w)</text>
<text x="760" y="644" class="tbl">No stack overflow risk; pairs in queue</text>
<rect x="16" y="652" width="868" height="24" fill="#fff"/>
<text x="180" y="668" class="tbl" fill="#555">n = nodes, h = height, w = max level width</text>
<text x="600" y="668" class="tbl" fill="#555">Key: compare outer & inner pairs simultaneously</text>
</svg>
