<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .lbl{font:12px monospace;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:11px sans-serif;fill:#333}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .edge{stroke:#999;stroke-width:1.5;fill:none}
  .edgeI{stroke:#27AE60;stroke-width:2;fill:none;stroke-dasharray:4,3}

  @keyframes ndVisit{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ffd700;stroke:#F39C12}}
  @keyframes ndGreen{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ccffcc;stroke:#27AE60}}
  @keyframes sl0{0%,19%{opacity:1}20%,100%{opacity:0}}
  @keyframes sl1{0%,19%{opacity:0}20%,39%{opacity:1}40%,100%{opacity:0}}
  @keyframes sl2{0%,39%{opacity:0}40%,59%{opacity:1}60%,100%{opacity:0}}
  @keyframes sl3{0%,59%{opacity:0}60%,79%{opacity:1}80%,100%{opacity:0}}
  @keyframes sl4{0%,79%{opacity:0}80%,100%{opacity:1}}
  .sl0{animation:sl0 9s ease-in-out infinite}
  .sl1{animation:sl1 9s ease-in-out infinite}
  .sl2{animation:sl2 9s ease-in-out infinite}
  .sl3{animation:sl3 9s ease-in-out infinite}
  .sl4{animation:sl4 9s ease-in-out infinite}
  .np0{animation:ndVisit 7s 0s ease-in-out infinite}
  .np1{animation:ndVisit 7s 0.6s ease-in-out infinite}
  .np2{animation:ndVisit 7s 1.2s ease-in-out infinite}
  .ng0{animation:ndGreen 7s 0s ease-in-out infinite}
  .ng1{animation:ndGreen 7s 0.6s ease-in-out infinite}
  .ng2{animation:ndGreen 7s 1.2s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Invert Binary Tree</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">Tree: 4→{2→{1,3}, 7→{6,9}}  →  Inverted: 4→{7→{9,6}, 2→{3,1}}</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Recursive — swap left/right children at each node (post-order)  O(n) time, O(h) space</text>

<!-- Original tree -->
<text x="115" y="128" text-anchor="middle" class="cmp" font-weight="bold" fill="#E74C3C">Original</text>
<g transform="translate(115,148)">
  <line x1="0" y1="22" x2="-60" y2="68" class="edge"/>
  <line x1="0" y1="22" x2="60" y2="68" class="edge"/>
  <line x1="-60" y1="90" x2="-90" y2="140" class="edge"/>
  <line x1="-60" y1="90" x2="-30" y2="140" class="edge"/>
  <line x1="60" y1="90" x2="30" y2="140" class="edge"/>
  <line x1="60" y1="90" x2="90" y2="140" class="edge"/>
  <circle class="np2 nd" cx="0" cy="0" r="20"/><text x="0" y="0" class="lbl">4</text>
  <circle class="np1 nd" cx="-60" cy="68" r="20"/><text x="-60" y="68" class="lbl">2</text>
  <circle class="np1 nd" cx="60" cy="68" r="20"/><text x="60" y="68" class="lbl">7</text>
  <circle class="np0 nd" cx="-90" cy="140" r="20"/><text x="-90" y="140" class="lbl">1</text>
  <circle class="np0 nd" cx="-30" cy="140" r="20"/><text x="-30" y="140" class="lbl">3</text>
  <circle class="np0 nd" cx="30" cy="140" r="20"/><text x="30" y="140" class="lbl">6</text>
  <circle class="np0 nd" cx="90" cy="140" r="20"/><text x="90" y="140" class="lbl">9</text>
</g>

<!-- Arrow between trees -->
<line x1="235" y1="215" x2="275" y2="215" stroke="#E74C3C" stroke-width="2" marker-end="url(#arr)"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#E74C3C" stroke-width="1.5"/></marker></defs>
<text x="255" y="208" text-anchor="middle" class="cmp" fill="#E74C3C" font-size="10">swap</text>

<!-- Inverted tree -->
<text x="370" y="128" text-anchor="middle" class="cmp" font-weight="bold" fill="#27AE60">Inverted</text>
<g transform="translate(370,148)">
  <line x1="0" y1="22" x2="-60" y2="68" class="edge"/>
  <line x1="0" y1="22" x2="60" y2="68" class="edge"/>
  <line x1="-60" y1="90" x2="-90" y2="140" class="edge"/>
  <line x1="-60" y1="90" x2="-30" y2="140" class="edge"/>
  <line x1="60" y1="90" x2="30" y2="140" class="edge"/>
  <line x1="60" y1="90" x2="90" y2="140" class="edge"/>
  <circle class="ng2 nd" cx="0" cy="0" r="20"/><text x="0" y="0" class="lbl">4</text>
  <circle class="ng1 nd" cx="-60" cy="68" r="20"/><text x="-60" y="68" class="lbl">7</text>
  <circle class="ng1 nd" cx="60" cy="68" r="20"/><text x="60" y="68" class="lbl">2</text>
  <circle class="ng0 nd" cx="-90" cy="140" r="20"/><text x="-90" y="140" class="lbl">9</text>
  <circle class="ng0 nd" cx="-30" cy="140" r="20"/><text x="-30" y="140" class="lbl">6</text>
  <circle class="ng0 nd" cx="30" cy="140" r="20"/><text x="30" y="140" class="lbl">3</text>
  <circle class="ng0 nd" cx="90" cy="140" r="20"/><text x="90" y="140" class="lbl">1</text>
</g>

<text x="530" y="138" class="cmp" font-weight="bold">invert(node):</text>
<text x="530" y="155" class="cmp">  if not node: return None</text>
<text x="530" y="172" class="cmp">  invert(node.left)</text>
<text x="530" y="189" class="cmp">  invert(node.right)</text>
<text x="530" y="206" class="cmp">  node.left, node.right = \</text>
<text x="530" y="223" class="cmp">    node.right, node.left</text>
<text x="530" y="240" class="cmp">  return node</text>

<text x="530" y="265" class="cmp sl0">① Post-order: process leaves first</text>
<text x="530" y="265" class="cmp sl1">② Swap children of node 2: (1,3)→(3,1)</text>
<text x="530" y="265" class="cmp sl2">③ Swap children of node 7: (6,9)→(9,6)</text>
<text x="530" y="265" class="cmp sl3">④ Swap children of node 4: (2,7)→(7,2)</text>
<text x="530" y="265" class="cmp sl4" fill="#E74C3C">⑤ Tree fully inverted. Return root.</text>

<!-- Arrow -->
<line x1="450" y1="312" x2="450" y2="330" class="evol"/>
<polygon points="450,332 444,320 456,320" fill="#888"/>
<rect x="270" y="315" width="360" height="24" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">Alternative: BFS processes level by level — avoids recursion stack</text>

<!-- APPROACH 2 -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: Iterative BFS — swap children of each node level by level  O(n) time, O(w) space</text>

<!-- BFS queue visualization -->
<text x="60" y="395" class="cmp" font-weight="bold" fill="#27AE60">Queue states:</text>
<rect x="24" y="400" width="390" height="22" fill="#e8f5e9" stroke="#27AE60" rx="3"/>
<text x="30" y="415" class="cmp sl0">Step 1: queue=[4]</text>
<text x="30" y="415" class="cmp sl1">Step 2: dequeue 4, swap→(7,2), queue=[7,2]</text>
<text x="30" y="415" class="cmp sl2">Step 3: dequeue 7, swap→(9,6), queue=[2,9,6]</text>
<text x="30" y="415" class="cmp sl3">Step 4: dequeue 2, swap→(3,1), queue=[9,6,3,1]</text>
<text x="30" y="415" class="cmp sl4" fill="#27AE60">Step 5: dequeue leaves (no children to swap)</text>

<text x="24" y="455" class="cmp" font-weight="bold">invert_bfs(root):</text>
<text x="24" y="472" class="cmp">  if not root: return None</text>
<text x="24" y="489" class="cmp">  queue = deque([root])</text>
<text x="24" y="506" class="cmp">  while queue:</text>
<text x="24" y="523" class="cmp">    node = queue.popleft()</text>
<text x="24" y="540" class="cmp">    node.left, node.right = node.right, node.left</text>
<text x="24" y="557" class="cmp">    if node.left:  queue.append(node.left)</text>

<!-- BFS tree diagram -->
<g transform="translate(680,390)">
  <line x1="0" y1="22" x2="-60" y2="68" class="edge"/>
  <line x1="0" y1="22" x2="60" y2="68" class="edge"/>
  <line x1="-60" y1="90" x2="-90" y2="140" class="edge"/>
  <line x1="-60" y1="90" x2="-30" y2="140" class="edge"/>
  <line x1="60" y1="90" x2="30" y2="140" class="edge"/>
  <line x1="60" y1="90" x2="90" y2="140" class="edge"/>
  <circle class="ng2 nd" cx="0" cy="0" r="20"/><text x="0" y="0" class="lbl">4</text>
  <circle class="ng1 nd" cx="-60" cy="68" r="20"/><text x="-60" y="68" class="lbl">7</text>
  <circle class="ng1 nd" cx="60" cy="68" r="20"/><text x="60" y="68" class="lbl">2</text>
  <circle class="ng0 nd" cx="-90" cy="140" r="20"/><text x="-90" y="140" class="lbl">9</text>
  <circle class="ng0 nd" cx="-30" cy="140" r="20"/><text x="-30" y="140" class="lbl">6</text>
  <circle class="ng0 nd" cx="30" cy="140" r="20"/><text x="30" y="140" class="lbl">3</text>
  <circle class="ng0 nd" cx="90" cy="140" r="20"/><text x="90" y="140" class="lbl">1</text>
  <text x="0" y="-35" text-anchor="middle" class="cmp" fill="#27AE60" font-weight="bold">Result</text>
</g>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" rx="6"/>
<text x="180" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="400" y="595" class="tbl" font-weight="bold">Time</text>
<text x="570" y="595" class="tbl" font-weight="bold">Space</text>
<text x="760" y="595" class="tbl" font-weight="bold">Notes</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="180" y="620" class="tbl">Recursive (DFS)</text>
<text x="400" y="620" class="tbl">O(n)</text>
<text x="570" y="620" class="tbl">O(h)</text>
<text x="760" y="620" class="tbl">Clean; risk of stack overflow on deep trees</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="180" y="644" class="tbl">Iterative BFS</text>
<text x="400" y="644" class="tbl">O(n)</text>
<text x="570" y="644" class="tbl">O(w)</text>
<text x="760" y="644" class="tbl">Safe; w=max level width (up to n/2)</text>
<rect x="16" y="652" width="868" height="24" fill="#fff"/>
<text x="180" y="668" class="tbl" fill="#555">n = nodes, h = height, w = max width</text>
<text x="600" y="668" class="tbl" fill="#555">Both produce identical results</text>
</svg>
