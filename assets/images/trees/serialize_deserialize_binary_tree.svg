<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#fff}
  .prob{font:13px sans-serif;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .sec{font:bold 13px sans-serif;fill:#333}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .edge{stroke:#999;stroke-width:2;fill:none}
  .lbl{font:12px monospace;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:12px sans-serif;fill:#555}
  .ins{font:12px sans-serif;fill:#666;font-style:italic}
  .tbl{font:12px sans-serif;fill:#333}
  @keyframes ndVisit0{0%,10%{fill:#ddeeff}20%,40%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit1{0%,20%{fill:#ddeeff}30%,50%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit2{0%,30%{fill:#ddeeff}40%,60%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit3{0%,40%{fill:#ddeeff}50%,70%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes ndVisit4{0%,50%{fill:#ddeeff}60%,80%{fill:#ffd700}100%{fill:#ddeeff}}
  @keyframes sl0{0%,15%{opacity:0}20%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl1{0%,25%{opacity:0}30%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl2{0%,35%{opacity:0}40%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl3{0%,45%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @keyframes sl4{0%,55%{opacity:0}60%,90%{opacity:1}100%{opacity:0}}
  @keyframes strGrow{0%{width:0}20%{width:40px}40%{width:120px}60%{width:200px}80%,100%{width:380px}}
  .n0{animation:ndVisit0 5s infinite}
  .n1{animation:ndVisit1 5s infinite}
  .n2{animation:ndVisit2 5s infinite}
  .n3{animation:ndVisit3 5s infinite}
  .n4{animation:ndVisit4 5s infinite}
</style>
<rect width="900" height="690" fill="#f8f9fa"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="30" class="title" text-anchor="middle" dominant-baseline="middle">Serialize and Deserialize Binary Tree</text>
<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="68" class="prob">Tree: 1→{2,3→{4,5}} | serialize → "1,2,null,null,3,4,null,null,5,null,null" | deserialize → original tree</text>

<!-- Approach 1 block -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="30" y="110" class="sec" fill="#fff">Approach 1: BFS (Level-Order) Serialization with null markers</text>
<text x="38" y="138" class="cmp" fill="#c0392b">• Use queue; process each node, append value or "null"; enqueue non-null children</text>
<text x="38" y="156" class="cmp" fill="#c0392b">• Level-order: 1, 2, 3, null, null, 4, 5, null, null, null, null</text>

<!-- Tree for Approach 1 -->
<line x1="240" y1="185" x2="180" y2="235" class="edge"/>
<line x1="240" y1="185" x2="300" y2="235" class="edge"/>
<line x1="300" y1="235" x2="265" y2="280" class="edge"/>
<line x1="300" y1="235" x2="335" y2="280" class="edge"/>
<circle cx="240" cy="185" r="22" class="nd n0"/>
<text x="240" y="185" class="lbl">1</text>
<circle cx="180" cy="235" r="22" class="nd n1"/>
<text x="180" y="235" class="lbl">2</text>
<circle cx="300" cy="235" r="22" class="nd n2"/>
<text x="300" y="235" class="lbl">3</text>
<circle cx="265" cy="280" r="22" class="nd n3"/>
<text x="265" y="280" class="lbl">4</text>
<circle cx="335" cy="280" r="22" class="nd n4"/>
<text x="335" y="280" class="lbl">5</text>

<!-- BFS queue visualization -->
<text x="380" y="140" class="cmp" fill="#c0392b" font-weight="bold">BFS Queue → String:</text>
<text x="380" y="158" class="cmp" style="animation:sl0 5s infinite">Step 1: process 1 → "1,"</text>
<text x="380" y="176" class="cmp" style="animation:sl1 5s infinite">Step 2: process 2,3 → "1,2,3,"</text>
<text x="380" y="194" class="cmp" style="animation:sl2 5s infinite">Step 3: null,null,4,5 → add nulls for 2's children</text>
<text x="380" y="212" class="cmp" style="animation:sl3 5s infinite">Step 4: process 4,5 → "...4,null,null,5,null,null"</text>

<!-- String output -->
<rect x="38" y="288" width="840" height="14" fill="#ffe0e0" rx="3"/>
<text x="45" y="298" class="cmp" fill="#c0392b">BFS: "1,2,3,null,null,4,5,null,null,null,null"</text>

<!-- Evolution arrow -->
<line x1="450" y1="316" x2="450" y2="340" stroke="#f0c040" stroke-width="2"/>
<polygon points="450,348 444,336 456,336" fill="#f0c040"/>
<rect x="80" y="310" width="740" height="32" fill="#fffde7" stroke="#f0c040" stroke-width="1.5" rx="6"/>
<text x="450" y="328" class="ins" text-anchor="middle" dominant-baseline="middle">Key Insight: DFS preorder is simpler to implement recursively; null markers enable unambiguous reconstruction</text>

<!-- Approach 2 block -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="30" y="366" class="sec" fill="#fff">Approach 2: DFS Preorder Serialization (simpler recursive implementation)</text>

<!-- Tree for Approach 2 - with visit order numbers -->
<line x1="240" y1="410" x2="180" y2="460" class="edge"/>
<line x1="240" y1="410" x2="300" y2="460" class="edge"/>
<line x1="300" y1="460" x2="265" y2="505" class="edge"/>
<line x1="300" y1="460" x2="335" y2="505" class="edge"/>
<circle cx="240" cy="410" r="22" class="nd n0"/>
<text x="240" y="410" class="lbl">1</text>
<text x="255" y="395" class="cmp" fill="#27AE60" style="animation:sl0 5s infinite" font-size="10">①</text>
<circle cx="180" cy="460" r="22" class="nd n1"/>
<text x="180" y="460" class="lbl">2</text>
<text x="195" y="445" class="cmp" fill="#27AE60" style="animation:sl1 5s infinite" font-size="10">②</text>
<circle cx="300" cy="460" r="22" class="nd n2"/>
<text x="300" y="460" class="lbl">3</text>
<text x="315" y="445" class="cmp" fill="#27AE60" style="animation:sl3 5s infinite" font-size="10">⑤</text>
<circle cx="265" cy="505" r="22" class="nd n3"/>
<text x="265" y="505" class="lbl">4</text>
<text x="280" y="490" class="cmp" fill="#27AE60" style="animation:sl3 5s infinite" font-size="10">⑥</text>
<circle cx="335" cy="505" r="22" class="nd n4"/>
<text x="335" y="505" class="lbl">5</text>
<text x="350" y="490" class="cmp" fill="#27AE60" style="animation:sl4 5s infinite" font-size="10">⑧</text>

<!-- null markers -->
<text x="145" y="500" class="cmp" fill="#888" font-size="10" style="animation:sl2 5s infinite">null③</text>
<text x="145" y="515" class="cmp" fill="#888" font-size="10" style="animation:sl2 5s infinite">null④</text>
<text x="228" y="545" class="cmp" fill="#888" font-size="10" style="animation:sl3 5s infinite">null⑦</text>
<text x="295" y="548" class="cmp" fill="#888" font-size="10" style="animation:sl4 5s infinite">null⑨</text>
<text x="360" y="545" class="cmp" fill="#888" font-size="10" style="animation:sl4 5s infinite">null⑩</text>

<!-- Serialization string build -->
<rect x="380" y="388" width="480" height="60" fill="#e8ffe8" stroke="#27AE60" rx="4"/>
<text x="390" y="406" class="cmp" fill="#27AE60" font-weight="bold">DFS Preorder string builds:</text>
<text x="390" y="424" class="cmp" style="animation:sl0 5s infinite">"1,"</text>
<text x="430" y="424" class="cmp" style="animation:sl1 5s infinite">"1,2,"</text>
<text x="478" y="424" class="cmp" style="animation:sl2 5s infinite">"1,2,null,null,"</text>
<text x="390" y="442" class="cmp" style="animation:sl3 5s infinite">"1,2,null,null,3,4,null,null,5,null,null"</text>

<!-- Deserialize -->
<rect x="380" y="458" width="480" height="50" fill="#e8f5e9" stroke="#27AE60" rx="4"/>
<text x="390" y="476" class="cmp" fill="#27AE60" font-weight="bold">Deserialize (DFS):</text>
<text x="390" y="494" class="cmp">split by ','; use index pointer; if 'null' return null; else create node, recurse L then R</text>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="4"/>
<rect x="16" y="578" width="868" height="24" fill="#f0f0f0" rx="4"/>
<rect x="16" y="590" width="868" height="12" fill="#f0f0f0"/>
<text x="200" y="592" class="tbl" text-anchor="middle" font-weight="bold">Approach</text>
<text x="500" y="592" class="tbl" text-anchor="middle" font-weight="bold">Time</text>
<text x="720" y="592" class="tbl" text-anchor="middle" font-weight="bold">Space</text>
<rect x="16" y="602" width="868" height="24" fill="#fff5f5"/>
<text x="200" y="616" class="tbl" text-anchor="middle">BFS level-order</text>
<text x="500" y="616" class="tbl" text-anchor="middle">O(n)</text>
<text x="720" y="616" class="tbl" text-anchor="middle">O(n) queue</text>
<rect x="16" y="626" width="868" height="24" fill="#f0fff0"/>
<text x="200" y="640" class="tbl" text-anchor="middle">DFS preorder (recursive)</text>
<text x="500" y="640" class="tbl" text-anchor="middle">O(n)</text>
<text x="720" y="640" class="tbl" text-anchor="middle">O(h) stack</text>
<rect x="16" y="650" width="868" height="26" fill="#fff8e1"/>
<text x="450" y="664" class="tbl" text-anchor="middle" fill="#e65100">serialize: preorder DFS appending val or "null"; deserialize: split + index ptr, create node, recurse left then right</text>
</svg>
