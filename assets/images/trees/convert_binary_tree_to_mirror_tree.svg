<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="900" height="690">
<style>
  .title{font:bold 18px sans-serif;fill:#1a1a2e}
  .prob{font:13px sans-serif;fill:#444}
  .sec{font:bold 13px sans-serif}
  .nd{fill:#ddeeff;stroke:#6699cc;stroke-width:2}
  .lbl{font:12px monospace;fill:#333;text-anchor:middle;dominant-baseline:middle}
  .cmp{font:11px sans-serif;fill:#333}
  .evol{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:5,3}
  .ins{font:11px sans-serif;fill:#555;font-style:italic}
  .tbl{font:11px sans-serif;fill:#333;text-anchor:middle}
  .edge{stroke:#999;stroke-width:1.5;fill:none}

  @keyframes ndVisit{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ffd700;stroke:#F39C12}}
  @keyframes ndGreen{0%,100%{fill:#ddeeff;stroke:#6699cc}40%,60%{fill:#ccffcc;stroke:#27AE60}}
  @keyframes sl0{0%,19%{opacity:1}20%,100%{opacity:0}}
  @keyframes sl1{0%,19%{opacity:0}20%,39%{opacity:1}40%,100%{opacity:0}}
  @keyframes sl2{0%,39%{opacity:0}40%,59%{opacity:1}60%,100%{opacity:0}}
  @keyframes sl3{0%,59%{opacity:0}60%,79%{opacity:1}80%,100%{opacity:0}}
  @keyframes sl4{0%,79%{opacity:0}80%,100%{opacity:1}}
  .sl0{animation:sl0 9s ease-in-out infinite}
  .sl1{animation:sl1 9s ease-in-out infinite}
  .sl2{animation:sl2 9s ease-in-out infinite}
  .sl3{animation:sl3 9s ease-in-out infinite}
  .sl4{animation:sl4 9s ease-in-out infinite}
  .np0{animation:ndVisit 7s 0s ease-in-out infinite}
  .np1{animation:ndVisit 7s 0.6s ease-in-out infinite}
  .np2{animation:ndVisit 7s 1.2s ease-in-out infinite}
  .ng0{animation:ndGreen 7s 0s ease-in-out infinite}
  .ng1{animation:ndGreen 7s 0.6s ease-in-out infinite}
  .ng2{animation:ndGreen 7s 1.2s ease-in-out infinite}
</style>

<rect width="900" height="690" fill="#f8f9fa" rx="8"/>
<rect width="900" height="52" fill="#1a1a2e" rx="8"/>
<rect y="44" width="900" height="8" fill="#1a1a2e"/>
<text x="450" y="32" text-anchor="middle" class="title" fill="white">Convert Binary Tree to Mirror Tree</text>

<rect y="52" width="900" height="32" fill="#eef2ff"/>
<text x="450" y="72" text-anchor="middle" class="prob">Mirror tree: swap left and right children at every node in the tree (in-place transformation)</text>

<!-- APPROACH 1 -->
<rect x="16" y="92" width="868" height="218" fill="#fff5f5" stroke="#E74C3C" stroke-width="1.5" rx="6"/>
<rect x="16" y="92" width="868" height="28" fill="#E74C3C" rx="6"/>
<rect x="16" y="106" width="868" height="14" fill="#E74C3C"/>
<text x="32" y="111" class="sec" fill="white">Approach 1: Recursive Post-order — swap children after recursing into both subtrees  O(n) time, O(h) space</text>

<!-- Original tree -->
<text x="130" y="122" text-anchor="middle" class="cmp" font-weight="bold" fill="#555">Original</text>
<g transform="translate(130,140)">
  <line x1="0" y1="22" x2="-70" y2="70" class="edge"/>
  <line x1="0" y1="22" x2="70" y2="70" class="edge"/>
  <line x1="-70" y1="92" x2="-100" y2="148" class="edge"/>
  <line x1="-70" y1="92" x2="-40" y2="148" class="edge"/>
  <line x1="70" y1="92" x2="40" y2="148" class="edge"/>
  <line x1="70" y1="92" x2="100" y2="148" class="edge"/>
  <circle class="np2 nd" cx="0" cy="0" r="20"/><text x="0" y="0" class="lbl">4</text>
  <circle class="np1 nd" cx="-70" cy="70" r="20"/><text x="-70" y="70" class="lbl">2</text>
  <circle class="np1 nd" cx="70" cy="70" r="20"/><text x="70" y="70" class="lbl">7</text>
  <circle class="np0 nd" cx="-100" cy="148" r="20"/><text x="-100" y="148" class="lbl">1</text>
  <circle class="np0 nd" cx="-40" cy="148" r="20"/><text x="-40" y="148" class="lbl">3</text>
  <circle class="np0 nd" cx="40" cy="148" r="20"/><text x="40" y="148" class="lbl">6</text>
  <circle class="np0 nd" cx="100" cy="148" r="20"/><text x="100" y="148" class="lbl">9</text>
</g>

<!-- arrow -->
<text x="290" y="215" text-anchor="middle" font-size="24" fill="#E74C3C">→</text>
<text x="290" y="232" text-anchor="middle" class="cmp" fill="#E74C3C" font-size="9">mirror()</text>

<!-- Mirror tree result -->
<text x="440" y="122" text-anchor="middle" class="cmp" font-weight="bold" fill="#E74C3C">After mirror</text>
<g transform="translate(440,140)">
  <line x1="0" y1="22" x2="-70" y2="70" class="edge"/>
  <line x1="0" y1="22" x2="70" y2="70" class="edge"/>
  <line x1="-70" y1="92" x2="-100" y2="148" class="edge"/>
  <line x1="-70" y1="92" x2="-40" y2="148" class="edge"/>
  <line x1="70" y1="92" x2="40" y2="148" class="edge"/>
  <line x1="70" y1="92" x2="100" y2="148" class="edge"/>
  <circle class="np2 nd" cx="0" cy="0" r="20"/><text x="0" y="0" class="lbl">4</text>
  <circle class="np1 nd" cx="-70" cy="70" r="20"/><text x="-70" y="70" class="lbl">7</text>
  <circle class="np1 nd" cx="70" cy="70" r="20"/><text x="70" y="70" class="lbl">2</text>
  <circle class="np0 nd" cx="-100" cy="148" r="20"/><text x="-100" y="148" class="lbl">9</text>
  <circle class="np0 nd" cx="-40" cy="148" r="20"/><text x="-40" y="148" class="lbl">6</text>
  <circle class="np0 nd" cx="40" cy="148" r="20"/><text x="40" y="148" class="lbl">3</text>
  <circle class="np0 nd" cx="100" cy="148" r="20"/><text x="100" y="148" class="lbl">1</text>
</g>

<text x="640" y="138" class="cmp" font-weight="bold">mirror(node):</text>
<text x="640" y="155" class="cmp">  if not node: return</text>
<text x="640" y="172" class="cmp">  mirror(node.left)   # recurse left</text>
<text x="640" y="189" class="cmp">  mirror(node.right)  # recurse right</text>
<text x="640" y="206" class="cmp">  # POST-ORDER: swap after children done</text>
<text x="640" y="223" class="cmp">  node.left, node.right = \</text>
<text x="640" y="240" class="cmp">    node.right, node.left</text>

<text x="24" y="280" class="cmp sl0">① Visit leaves first (post-order): 1,3,6,9 have no children</text>
<text x="24" y="280" class="cmp sl1">② Node 2: swap(1,3)→children become (3,1)</text>
<text x="24" y="280" class="cmp sl2">③ Node 7: swap(6,9)→children become (9,6)</text>
<text x="24" y="280" class="cmp sl3">④ Node 4: swap(2,7)→children become (7,2)</text>
<text x="24" y="280" class="cmp sl4" fill="#E74C3C">⑤ Mirror complete: 4→{7→{9,6}, 2→{3,1}}</text>

<!-- Arrow -->
<line x1="450" y1="312" x2="450" y2="330" class="evol"/>
<polygon points="450,332 444,320 456,320" fill="#888"/>
<rect x="270" y="315" width="360" height="24" fill="#fffde7" stroke="#f0c040" stroke-width="1" rx="4"/>
<text x="450" y="331" text-anchor="middle" class="ins">BFS: process each node while traversing — no recursion needed</text>

<!-- APPROACH 2 -->
<rect x="16" y="348" width="868" height="214" fill="#f0fff0" stroke="#27AE60" stroke-width="1.5" rx="6"/>
<rect x="16" y="348" width="868" height="28" fill="#27AE60" rx="6"/>
<rect x="16" y="362" width="868" height="14" fill="#27AE60"/>
<text x="32" y="367" class="sec" fill="white">Approach 2: BFS Iterative — swap children of each node while doing level-order traversal  O(n) time, O(w) space</text>

<text x="24" y="400" class="cmp" font-weight="bold">mirror_bfs(root):</text>
<text x="24" y="417" class="cmp">  if not root: return</text>
<text x="24" y="434" class="cmp">  queue = deque([root])</text>
<text x="24" y="451" class="cmp">  while queue:</text>
<text x="24" y="468" class="cmp">    node = queue.popleft()</text>
<text x="24" y="485" class="cmp">    # swap children first</text>
<text x="24" y="502" class="cmp">    node.left, node.right = node.right, node.left</text>
<text x="24" y="519" class="cmp">    # then enqueue (already swapped)</text>
<text x="24" y="536" class="cmp">    if node.left:  queue.append(node.left)</text>
<text x="24" y="553" class="cmp">    if node.right: queue.append(node.right)</text>

<!-- BFS level visualization -->
<text x="450" y="400" class="cmp" font-weight="bold" fill="#27AE60">Level-by-level swap:</text>
<rect x="448" y="408" width="430" height="60" fill="#e8f5e9" stroke="#27AE60" rx="3"/>
<text x="454" y="423" class="cmp sl0">Level 0: deq(4) → swap(2,7) → q=[7,2]</text>
<text x="454" y="423" class="cmp sl1">Level 1: deq(7) → swap(6,9) → q=[2,9,6]</text>
<text x="454" y="423" class="cmp sl2">Level 1: deq(2) → swap(1,3) → q=[9,6,3,1]</text>
<text x="454" y="423" class="cmp sl3">Level 2: deq leaves 9,6,3,1 → no children to swap</text>
<text x="454" y="423" class="cmp sl4" fill="#27AE60">Done! Tree is now fully mirrored.</text>
<text x="454" y="445" class="cmp">Result: 4→{7→{9,6}, 2→{3,1}}</text>
<text x="454" y="461" class="cmp" fill="#555">Note: swap then enqueue = process top-down, left-to-right</text>

<g transform="translate(700,380)">
  <line x1="0" y1="22" x2="-60" y2="65" class="edge"/>
  <line x1="0" y1="22" x2="60" y2="65" class="edge"/>
  <line x1="-60" y1="85" x2="-90" y2="138" class="edge"/>
  <line x1="-60" y1="85" x2="-30" y2="138" class="edge"/>
  <line x1="60" y1="85" x2="30" y2="138" class="edge"/>
  <line x1="60" y1="85" x2="90" y2="138" class="edge"/>
  <circle class="ng2 nd" cx="0" cy="0" r="20"/><text x="0" y="0" class="lbl">4</text>
  <circle class="ng1 nd" cx="-60" cy="65" r="20"/><text x="-60" y="65" class="lbl">7</text>
  <circle class="ng1 nd" cx="60" cy="65" r="20"/><text x="60" y="65" class="lbl">2</text>
  <circle class="ng0 nd" cx="-90" cy="138" r="20"/><text x="-90" y="138" class="lbl">9</text>
  <circle class="ng0 nd" cx="-30" cy="138" r="20"/><text x="-30" y="138" class="lbl">6</text>
  <circle class="ng0 nd" cx="30" cy="138" r="20"/><text x="30" y="138" class="lbl">3</text>
  <circle class="ng0 nd" cx="90" cy="138" r="20"/><text x="90" y="138" class="lbl">1</text>
</g>

<!-- Complexity table -->
<rect x="16" y="578" width="868" height="98" fill="#fff" stroke="#ddd" stroke-width="1" rx="6"/>
<rect x="16" y="578" width="868" height="26" fill="#f0f0f0" rx="6"/>
<text x="180" y="595" class="tbl" font-weight="bold">Approach</text>
<text x="400" y="595" class="tbl" font-weight="bold">Time</text>
<text x="570" y="595" class="tbl" font-weight="bold">Space</text>
<text x="760" y="595" class="tbl" font-weight="bold">Notes</text>
<rect x="16" y="604" width="868" height="24" fill="#fff5f5"/>
<text x="180" y="620" class="tbl">Recursive Post-order</text>
<text x="400" y="620" class="tbl">O(n)</text>
<text x="570" y="620" class="tbl">O(h)</text>
<text x="760" y="620" class="tbl">Swap after subtrees; h call stack frames</text>
<rect x="16" y="628" width="868" height="24" fill="#f0fff0"/>
<text x="180" y="644" class="tbl">Iterative BFS</text>
<text x="400" y="644" class="tbl">O(n)</text>
<text x="570" y="644" class="tbl">O(w)</text>
<text x="760" y="644" class="tbl">Swap during traversal; w ≤ n/2 max</text>
<rect x="16" y="652" width="868" height="24" fill="#fff"/>
<text x="180" y="668" class="tbl" fill="#555">n = nodes, h = height, w = max level width</text>
<text x="600" y="668" class="tbl" fill="#555">Both modify tree in-place, O(n) total swaps</text>
</svg>
