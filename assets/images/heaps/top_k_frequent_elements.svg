<svg width="900" height="640" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="640" fill="#F8F9FA" rx="10"/>
  <!-- Title Bar -->
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="19" font-weight="bold" fill="white">Top K Frequent Elements</text>
  <!-- Difficulty Badge -->
  <rect x="790" y="12" width="92" height="28" fill="#F39C12" rx="14"/>
  <text x="836" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <!-- Example Row -->
  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">nums=[1,1,1,2,2,3], k=2</text>
  <text x="330" y="81" font-family="Arial" font-size="12" fill="#555">→</text>
  <text x="348" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">Output: [1,2]</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">1 appears 3 times, 2 appears 2 times, 3 appears 1 time → top 2: [1,2]</text>

  <!-- === APPROACH 1: HashMap + Sort === -->
  <rect x="15" y="115" width="258" height="360" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="258" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="258" height="15" fill="#E74C3C"/>
  <text x="144" y="140" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Approach 1: HashMap + Sort</text>
  <text x="144" y="153" font-family="Arial" font-size="9" fill="#FADBD8" text-anchor="middle">O(n log n) | O(n) space</text>

  <text x="30" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Count then sort by freq:</text>

  <rect x="30" y="186" width="230" height="22" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="145" y="201" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">freq: {1→3, 2→2, 3→1}</text>

  <rect x="30" y="212" width="230" height="22" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="145" y="227" font-family="Arial" font-size="10" fill="#E74C3C" text-anchor="middle">sort by freq desc: [1(3),2(2),3(1)]</text>

  <rect x="30" y="238" width="230" height="22" fill="#D5F5E3" stroke="#27AE60" rx="3"/>
  <text x="145" y="253" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">take first k=2: [1,2] ✓</text>

  <text x="30" y="283" font-family="Arial" font-size="11" fill="#E74C3C">⚠ Sorting all unique elements</text>
  <text x="30" y="301" font-family="Arial" font-size="11" fill="#888">O(n log n) dominates</text>
  <text x="30" y="319" font-family="Arial" font-size="11" fill="#888">Simple but not optimal</text>
  <text x="30" y="337" font-family="Arial" font-size="11" fill="#888">Overkill if k &lt;&lt; n</text>
  <text x="30" y="355" font-family="Arial" font-size="11" fill="#888">Map.entrySet().stream()</text>
  <text x="30" y="373" font-family="Arial" font-size="11" fill="#888">  .sorted by value desc</text>
  <text x="30" y="391" font-family="Arial" font-size="11" fill="#888">  .limit(k).keys()</text>

  <!-- Arrow 1→2 -->
  <line x1="278" y1="290" x2="316" y2="290" stroke="#7F8C8D" stroke-width="2"/>
  <polygon points="316,285 326,290 316,295" fill="#7F8C8D"/>
  <rect x="278" y="265" width="38" height="50" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
  <text x="297" y="279" font-family="Arial" font-size="8" fill="#555" text-anchor="middle" font-weight="bold">💡 Min</text>
  <text x="297" y="291" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">Heap</text>
  <text x="297" y="303" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">size k!</text>

  <!-- === APPROACH 2: Min-Heap === -->
  <rect x="326" y="115" width="258" height="360" fill="#FFFFFF" stroke="#E67E22" stroke-width="2" rx="7"/>
  <rect x="326" y="115" width="258" height="40" fill="#E67E22" rx="7"/>
  <rect x="326" y="140" width="258" height="15" fill="#E67E22"/>
  <text x="455" y="140" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Min-Heap Size k</text>
  <text x="455" y="153" font-family="Arial" font-size="9" fill="#FAD7A0" text-anchor="middle">O(n log k) | O(n) space</text>

  <text x="340" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Maintain min-heap of k elements:</text>
  <text x="340" y="196" font-family="Arial" font-size="11" fill="#555">freq: {1→3, 2→2, 3→1}</text>

  <rect x="340" y="204" width="230" height="22" fill="#FEF9E7" stroke="#F39C12" rx="3"/>
  <text x="455" y="219" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">add 3(freq=1) → heap=[3]</text>

  <rect x="340" y="230" width="230" height="22" fill="#FEF9E7" stroke="#F39C12" rx="3"/>
  <text x="455" y="245" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">add 2(freq=2) → heap=[3,2] (by freq min)</text>

  <rect x="340" y="256" width="230" height="28" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="455" y="269" font-family="Arial" font-size="10" fill="#E74C3C" text-anchor="middle">add 1(freq=3) → size=3 &gt; k=2</text>
  <text x="455" y="281" font-family="Arial" font-size="10" fill="#E74C3C" text-anchor="middle">pop 3(freq=1) → heap=[2,1] ✓</text>

  <text x="340" y="310" font-family="Arial" font-size="11" fill="#27AE60">heap=[2,1] → return [1,2] ✓</text>
  <text x="340" y="328" font-family="Arial" font-size="11" fill="#888">Heap by freq (min at top)</text>
  <text x="340" y="346" font-family="Arial" font-size="11" fill="#888">O(log k) per insertion</text>
  <text x="340" y="364" font-family="Arial" font-size="11" fill="#888">Better when k &lt;&lt; unique elements</text>
  <text x="340" y="382" font-family="Arial" font-size="11" fill="#888">Final heap = top k elements</text>

  <!-- Arrow 2→3 -->
  <line x1="589" y1="290" x2="627" y2="290" stroke="#7F8C8D" stroke-width="2"/>
  <polygon points="627,285 637,290 627,295" fill="#7F8C8D"/>
  <rect x="589" y="263" width="38" height="54" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
  <text x="608" y="277" font-family="Arial" font-size="8" fill="#555" text-anchor="middle" font-weight="bold">💡 Bucket</text>
  <text x="608" y="289" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">Sort</text>
  <text x="608" y="301" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">O(n)!</text>

  <!-- === APPROACH 3: Bucket Sort === -->
  <rect x="637" y="115" width="248" height="360" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="637" y="115" width="248" height="40" fill="#27AE60" rx="7"/>
  <rect x="637" y="140" width="248" height="15" fill="#27AE60"/>
  <text x="761" y="140" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Approach 3: Bucket Sort ⭐</text>
  <text x="761" y="153" font-family="Arial" font-size="9" fill="#D5F5E3" text-anchor="middle">O(n) time | O(n) space</text>

  <text x="650" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Bucket[freq] → collect from high freq:</text>

  <!-- Bucket visualization -->
  <text x="650" y="198" font-family="Arial" font-size="11" fill="#555">freq: {1→3, 2→2, 3→1}</text>
  <text x="650" y="216" font-family="Arial" font-size="11" fill="#555">buckets[i] = list of nums with freq=i</text>

  <!-- Bucket boxes -->
  <text x="650" y="238" font-family="Arial" font-size="10" fill="#888">buckets:</text>
  <rect x="650" y="244" width="50" height="30" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="675" y="257" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">[1]</text>
  <text x="675" y="268" font-family="Arial" font-size="8" fill="#888" text-anchor="middle">idx=1</text>
  <text x="675" y="284" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">3(f=1)</text>

  <rect x="710" y="244" width="50" height="30" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="735" y="257" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">[2]</text>
  <text x="735" y="268" font-family="Arial" font-size="8" fill="#888" text-anchor="middle">idx=2</text>
  <text x="735" y="284" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">2(f=2)</text>

  <rect x="770" y="244" width="50" height="30" fill="#82E0AA" stroke="#27AE60" rx="3"/>
  <text x="795" y="257" font-family="Arial" font-size="10" fill="#1E5631" text-anchor="middle">[1,2]</text>
  <text x="795" y="268" font-family="Arial" font-size="8" fill="#888" text-anchor="middle">idx=3</text>
  <text x="795" y="284" font-family="Arial" font-size="9" fill="#888" text-anchor="middle">1(f=3)</text>

  <!-- Arrow showing collection direction -->
  <line x1="820" y1="295" x2="660" y2="295" stroke="#27AE60" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="660,290 650,295 660,300" fill="#27AE60"/>
  <text x="735" y="313" font-family="Arial" font-size="9" fill="#27AE60" text-anchor="middle">← scan from high freq to low</text>

  <rect x="650" y="320" width="212" height="28" fill="#D5F5E3" stroke="#27AE60" rx="3"/>
  <text x="756" y="334" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">from idx=n: bucket[3]=[1], bucket[2]=[2]</text>
  <text x="756" y="344" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">collect k=2: [1,2] ✓</text>

  <text x="650" y="370" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">O(n) — no sorting at all!</text>
  <text x="650" y="388" font-family="Arial" font-size="11" fill="#888">buckets array size n (max freq=n)</text>
  <text x="650" y="406" font-family="Arial" font-size="11" fill="#888">Scan from highest bucket down</text>
  <text x="650" y="424" font-family="Arial" font-size="11" fill="#888">Stop once k elements collected</text>

  <!-- Complexity Table -->
  <rect x="15" y="487" width="870" height="142" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="487" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="502" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="507" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>

  <line x1="15" y1="517" x2="885" y2="517" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="517" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
  <text x="750" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>

  <line x1="15" y1="542" x2="885" y2="542" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="542" width="870" height="28" fill="#FDEDEC"/>
  <text x="200" y="561" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">HashMap + Sort</text>
  <text x="500" y="561" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n log n)</text>
  <text x="750" y="561" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(n)</text>

  <line x1="15" y1="570" x2="885" y2="570" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="570" width="870" height="28" fill="#FEF9E7"/>
  <text x="200" y="589" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Min-Heap of size k</text>
  <text x="500" y="589" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle">O(n log k)</text>
  <text x="750" y="589" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(n)</text>

  <line x1="15" y1="598" x2="885" y2="598" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="598" width="870" height="30" fill="#EAFAF1"/>
  <text x="200" y="618" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Bucket Sort ⭐</text>
  <text x="500" y="618" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
  <text x="750" y="618" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(n)</text>

  <line x1="370" y1="517" x2="370" y2="628" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="517" x2="620" y2="628" stroke="#DEE2E6" stroke-width="1"/>
</svg>
