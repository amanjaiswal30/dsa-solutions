<svg width="900" height="640" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="640" fill="#F8F9FA" rx="10"/>
  <!-- Title Bar -->
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="19" font-weight="bold" fill="white">Kth Largest Element in an Array</text>
  <!-- Difficulty Badge -->
  <rect x="790" y="12" width="92" height="28" fill="#F39C12" rx="14"/>
  <text x="836" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <!-- Example Row -->
  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">nums=[3,2,1,5,6,4], k=2</text>
  <text x="310" y="81" font-family="Arial" font-size="12" fill="#555">Output: 5 (2nd largest)</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Sorted=[1,2,3,4,5,6] → index n-k=4 → 5</text>

  <!-- === APPROACH 1: Sorting === -->
  <rect x="15" y="115" width="258" height="360" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="258" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="258" height="15" fill="#E74C3C"/>
  <text x="144" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Sorting</text>
  <text x="144" y="153" font-family="Arial" font-size="9" fill="#FADBD8" text-anchor="middle">O(n log n) time | O(1) space</text>

  <text x="30" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Sort, return index n-k:</text>
  <text x="30" y="196" font-family="Arial" font-size="11" fill="#555">nums=[3,2,1,5,6,4]</text>
  <text x="30" y="212" font-family="Arial" font-size="11" fill="#555">sort ascending:</text>

  <rect x="30" y="220" width="26" height="26" fill="#ECF0F1" stroke="#BDC3C7" rx="3"/>
  <text x="43" y="237" font-family="Arial" font-size="11" fill="#777" text-anchor="middle">1</text>
  <rect x="59" y="220" width="26" height="26" fill="#ECF0F1" stroke="#BDC3C7" rx="3"/>
  <text x="72" y="237" font-family="Arial" font-size="11" fill="#777" text-anchor="middle">2</text>
  <rect x="88" y="220" width="26" height="26" fill="#ECF0F1" stroke="#BDC3C7" rx="3"/>
  <text x="101" y="237" font-family="Arial" font-size="11" fill="#777" text-anchor="middle">3</text>
  <rect x="117" y="220" width="26" height="26" fill="#ECF0F1" stroke="#BDC3C7" rx="3"/>
  <text x="130" y="237" font-family="Arial" font-size="11" fill="#777" text-anchor="middle">4</text>
  <rect x="146" y="220" width="26" height="26" fill="#E74C3C" stroke="#C0392B" rx="3"/>
  <text x="159" y="237" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">5</text>
  <rect x="175" y="220" width="26" height="26" fill="#ECF0F1" stroke="#BDC3C7" rx="3"/>
  <text x="188" y="237" font-family="Arial" font-size="11" fill="#777" text-anchor="middle">6</text>

  <text x="159" y="256" font-family="Arial" font-size="9" fill="#E74C3C" text-anchor="middle">n-k=4</text>

  <text x="144" y="278" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">nums[4] = 5 ✓</text>

  <text x="30" y="305" font-family="Arial" font-size="11" fill="#E74C3C">⚠ Must sort entire array</text>
  <text x="30" y="323" font-family="Arial" font-size="11" fill="#888">Works but O(n log n)</text>
  <text x="30" y="341" font-family="Arial" font-size="11" fill="#888">Not efficient for large n</text>
  <text x="30" y="359" font-family="Arial" font-size="11" fill="#888">Modifies original array</text>
  <text x="30" y="377" font-family="Arial" font-size="11" fill="#888">Overkill for one answer</text>
  <text x="30" y="395" font-family="Arial" font-size="11" fill="#888">Bad for streaming data</text>
  <text x="30" y="460" font-family="Arial" font-size="10" fill="#888">Arrays.sort(nums)</text>
  <text x="30" y="478" font-family="Arial" font-size="10" fill="#888">return nums[n-k]</text>

  <!-- Arrow 1→2 -->
  <line x1="278" y1="295" x2="316" y2="295" stroke="#7F8C8D" stroke-width="2"/>
  <polygon points="316,290 326,295 316,300" fill="#7F8C8D"/>
  <rect x="278" y="270" width="38" height="50" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
  <text x="297" y="285" font-family="Arial" font-size="8" fill="#555" text-anchor="middle" font-weight="bold">💡 Min</text>
  <text x="297" y="297" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">Heap</text>
  <text x="297" y="309" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">size k!</text>

  <!-- === APPROACH 2: Min-Heap === -->
  <rect x="326" y="115" width="258" height="360" fill="#FFFFFF" stroke="#E67E22" stroke-width="2" rx="7"/>
  <rect x="326" y="115" width="258" height="40" fill="#E67E22" rx="7"/>
  <rect x="326" y="140" width="258" height="15" fill="#E67E22"/>
  <text x="455" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Min-Heap</text>
  <text x="455" y="153" font-family="Arial" font-size="9" fill="#FAD7A0" text-anchor="middle">O(n log k) time | O(k) space</text>

  <text x="340" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Min-heap of size k, poll when over:</text>
  <text x="340" y="196" font-family="Arial" font-size="11" fill="#555">k=2, process each element:</text>

  <rect x="340" y="204" width="230" height="22" fill="#FEF9E7" stroke="#F39C12" rx="3"/>
  <text x="455" y="219" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">add 3 → heap=[3]</text>

  <rect x="340" y="230" width="230" height="22" fill="#FEF9E7" stroke="#F39C12" rx="3"/>
  <text x="455" y="245" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">add 2 → heap=[2,3] (size=k=2)</text>

  <rect x="340" y="256" width="230" height="22" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="455" y="271" font-family="Arial" font-size="10" fill="#E74C3C" text-anchor="middle">add 1 → size>k → pop 1 → heap=[2,3]</text>

  <rect x="340" y="282" width="230" height="22" fill="#FEF9E7" stroke="#F39C12" rx="3"/>
  <text x="455" y="297" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">add 5 → pop 2 → heap=[3,5]</text>

  <rect x="340" y="308" width="230" height="22" fill="#FEF9E7" stroke="#F39C12" rx="3"/>
  <text x="455" y="323" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">add 6 → pop 3 → heap=[5,6]</text>

  <rect x="340" y="334" width="230" height="22" fill="#FEF9E7" stroke="#F39C12" rx="3"/>
  <text x="455" y="349" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">add 4 → pop 4 → heap=[5,6]</text>

  <text x="455" y="380" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">heap.peek() = 5 ✓</text>
  <text x="340" y="400" font-family="Arial" font-size="11" fill="#888">Top = kth largest always</text>
  <text x="340" y="418" font-family="Arial" font-size="11" fill="#888">O(log k) per element</text>
  <text x="340" y="436" font-family="Arial" font-size="11" fill="#888">Only stores k elements</text>
  <text x="340" y="454" font-family="Arial" font-size="11" fill="#888">Great for streaming!</text>

  <!-- Arrow 2→3 -->
  <line x1="589" y1="295" x2="627" y2="295" stroke="#7F8C8D" stroke-width="2"/>
  <polygon points="627,290 637,295 627,300" fill="#7F8C8D"/>
  <rect x="589" y="270" width="38" height="50" fill="#ECF0F1" stroke="#BDC3C7" rx="4"/>
  <text x="608" y="285" font-family="Arial" font-size="8" fill="#555" text-anchor="middle" font-weight="bold">💡 Quick</text>
  <text x="608" y="297" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">Select</text>
  <text x="608" y="309" font-family="Arial" font-size="8" fill="#555" text-anchor="middle">O(n)!</text>

  <!-- === APPROACH 3: QuickSelect === -->
  <rect x="637" y="115" width="248" height="360" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="637" y="115" width="248" height="40" fill="#27AE60" rx="7"/>
  <rect x="637" y="140" width="248" height="15" fill="#27AE60"/>
  <text x="761" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 3: QuickSelect ⭐</text>
  <text x="761" y="153" font-family="Arial" font-size="9" fill="#D5F5E3" text-anchor="middle">O(n) avg | O(1) space</text>

  <text x="650" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Partition until pivot=target:</text>
  <text x="650" y="196" font-family="Arial" font-size="11" fill="#555">Target pos = n-k = 4</text>

  <rect x="650" y="204" width="212" height="34" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="756" y="218" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">pivot=4: partition</text>
  <text x="756" y="230" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">[3,2,1] | 4 | [5,6] → pos=3</text>

  <rect x="650" y="242" width="212" height="22" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="756" y="257" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">pos=3 &lt; target=4 → search right</text>

  <rect x="650" y="268" width="212" height="34" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="756" y="283" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">pivot=5 in [5,6]</text>
  <text x="756" y="295" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">[] | 5 | [6] → pos=4</text>

  <rect x="650" y="306" width="212" height="22" fill="#D5F5E3" stroke="#27AE60" rx="3"/>
  <text x="756" y="321" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">pos=4 == target → return 5 ✓</text>

  <text x="650" y="348" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Answer: 5 ✓</text>
  <text x="650" y="366" font-family="Arial" font-size="11" fill="#888">No full sort needed</text>
  <text x="650" y="384" font-family="Arial" font-size="11" fill="#888">Avg O(n) partitioning</text>
  <text x="650" y="402" font-family="Arial" font-size="11" fill="#888">Worst O(n²) bad pivot</text>
  <text x="650" y="420" font-family="Arial" font-size="11" fill="#888">Modifies array in-place</text>
  <text x="650" y="438" font-family="Arial" font-size="11" fill="#888">Best for one-time query</text>

  <!-- Complexity Table -->
  <rect x="15" y="487" width="870" height="142" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="487" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="502" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="507" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>

  <line x1="15" y1="517" x2="885" y2="517" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="517" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time</text>
  <text x="750" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space</text>

  <line x1="15" y1="542" x2="885" y2="542" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="542" width="870" height="28" fill="#FDEDEC"/>
  <text x="200" y="561" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Sorting</text>
  <text x="500" y="561" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n log n)</text>
  <text x="750" y="561" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(1)</text>

  <line x1="15" y1="570" x2="885" y2="570" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="570" width="870" height="28" fill="#FEF9E7"/>
  <text x="200" y="589" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Min-Heap (streaming)</text>
  <text x="500" y="589" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle">O(n log k)</text>
  <text x="750" y="589" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(k)</text>

  <line x1="15" y1="598" x2="885" y2="598" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="598" width="870" height="30" fill="#EAFAF1"/>
  <text x="200" y="618" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">QuickSelect ⭐</text>
  <text x="500" y="618" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n) avg</text>
  <text x="750" y="618" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(1)</text>

  <line x1="370" y1="517" x2="370" y2="628" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="517" x2="620" y2="628" stroke="#DEE2E6" stroke-width="1"/>
</svg>
