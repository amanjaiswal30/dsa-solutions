<svg width="900" height="590" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="590" fill="#F8F9FA" rx="10"/>
  <!-- Title Bar -->
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="17" font-weight="bold" fill="white">First Non-Repeating Character in a Stream</text>
  <!-- Difficulty Badge -->
  <rect x="790" y="12" width="92" height="28" fill="#F39C12" rx="14"/>
  <text x="836" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <!-- Example Row -->
  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">stream = "aabc"</text>
  <text x="280" y="81" font-family="Arial" font-size="12" fill="#555">→</text>
  <text x="300" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">Output: ["a", "-1", "b", "b"]</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">After 'a'→"a", After 'a'(dup)→"-1", After 'b'→"b", After 'c'→"b"</text>

  <!-- === APPROACH 1: Brute Force === -->
  <rect x="15" y="115" width="390" height="330" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="390" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="390" height="15" fill="#E74C3C"/>
  <text x="210" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Brute Force</text>
  <text x="210" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">O(n²) time | O(1) space</text>

  <text x="30" y="178" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">For each char, scan all previous chars:</text>

  <!-- Stream processing trace -->
  <text x="30" y="200" font-family="Arial" font-size="11" font-weight="bold" fill="#666">Stream: a → a → b → c</text>

  <rect x="30" y="208" width="360" height="34" fill="#FDEDEC" stroke="#E74C3C" rx="4"/>
  <text x="210" y="224" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Read 'a': freq={a:1} → scan from start</text>
  <text x="210" y="238" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">→ first with freq=1: "a" ✓</text>

  <rect x="30" y="248" width="360" height="34" fill="#FDEDEC" stroke="#E74C3C" rx="4"/>
  <text x="210" y="264" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Read 'a': freq={a:2} → scan from start</text>
  <text x="210" y="278" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">→ no char with freq=1: "-1" ✗</text>

  <rect x="30" y="288" width="360" height="34" fill="#FDEDEC" stroke="#E74C3C" rx="4"/>
  <text x="210" y="304" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Read 'b': freq={a:2,b:1} → scan from start</text>
  <text x="210" y="318" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">→ a(freq=2 skip), b(freq=1): "b" ✓</text>

  <rect x="30" y="328" width="360" height="34" fill="#FDEDEC" stroke="#E74C3C" rx="4"/>
  <text x="210" y="344" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Read 'c': freq={a:2,b:1,c:1} → scan</text>
  <text x="210" y="358" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">→ first freq=1 in order: "b" ✓</text>

  <text x="30" y="390" font-family="Arial" font-size="11" fill="#E74C3C">⚠ Scan all chars at each step → O(n²) total</text>
  <text x="30" y="408" font-family="Arial" font-size="11" fill="#888">No ordering guarantee — must scan from start</text>
  <text x="30" y="426" font-family="Arial" font-size="11" fill="#888">Works but inefficient for large streams</text>

  <!-- Evolution Arrow -->
  <line x1="410" y1="280" x2="480" y2="280" stroke="#7F8C8D" stroke-width="2.5"/>
  <polygon points="480,275 492,280 480,285" fill="#7F8C8D"/>
  <rect x="410" y="250" width="72" height="60" fill="#ECF0F1" stroke="#BDC3C7" rx="5"/>
  <text x="446" y="266" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" font-weight="bold">💡 Use</text>
  <text x="446" y="278" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">Queue to</text>
  <text x="446" y="290" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">track order!</text>

  <!-- === APPROACH 2: Queue + Freq Map === -->
  <rect x="492" y="115" width="393" height="330" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="492" y="115" width="393" height="40" fill="#27AE60" rx="7"/>
  <rect x="492" y="140" width="393" height="15" fill="#27AE60"/>
  <text x="688" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Queue + Freq Map ⭐</text>
  <text x="688" y="153" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">O(n) time | O(n) space</text>

  <text x="505" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Queue holds order, Freq tracks duplicates:</text>

  <!-- Queue states -->
  <text x="505" y="200" font-family="Arial" font-size="11" font-weight="bold" fill="#666">Stream: a → a → b → c</text>

  <rect x="505" y="208" width="362" height="34" fill="#EAFAF1" stroke="#27AE60" rx="4"/>
  <text x="686" y="223" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Read 'a': freq[a]=1, Q=[a]</text>
  <text x="686" y="237" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">Front=a (freq=1) → output "a" ✓</text>

  <rect x="505" y="248" width="362" height="34" fill="#EAFAF1" stroke="#27AE60" rx="4"/>
  <text x="686" y="263" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Read 'a': freq[a]=2, Q=[a,a] → poll 'a'(dup)</text>
  <text x="686" y="277" font-family="Arial" font-size="10" fill="#E74C3C" text-anchor="middle">Q=[] → output "-1" ✓</text>

  <rect x="505" y="288" width="362" height="34" fill="#EAFAF1" stroke="#27AE60" rx="4"/>
  <text x="686" y="303" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Read 'b': freq[b]=1, Q=[b]</text>
  <text x="686" y="317" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">Front=b (freq=1) → output "b" ✓</text>

  <rect x="505" y="328" width="362" height="34" fill="#EAFAF1" stroke="#27AE60" rx="4"/>
  <text x="686" y="343" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Read 'c': freq[c]=1, Q=[b,c]</text>
  <text x="686" y="357" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">Front=b (freq=1) → output "b" ✓</text>

  <text x="505" y="390" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Queue front = always 1st non-repeating!</text>
  <text x="505" y="408" font-family="Arial" font-size="11" fill="#888">freq[26] array tracks counts → O(1) lookup</text>
  <text x="505" y="426" font-family="Arial" font-size="11" fill="#888">Each char enqueued/dequeued at most once → O(n)</text>

  <!-- Complexity Table -->
  <rect x="15" y="455" width="870" height="120" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="455" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="470" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="475" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>

  <line x1="15" y1="485" x2="885" y2="485" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="485" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="502" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="502" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time Complexity</text>
  <text x="750" y="502" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space Complexity</text>

  <line x1="15" y1="510" x2="885" y2="510" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="510" width="870" height="30" fill="#FDEDEC"/>
  <text x="200" y="530" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Brute Force (scan each time)</text>
  <text x="500" y="530" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n²)</text>
  <text x="750" y="530" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(1)</text>

  <line x1="15" y1="540" x2="885" y2="540" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="540" width="870" height="30" fill="#EAFAF1"/>
  <text x="200" y="560" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Queue + Frequency Map ⭐</text>
  <text x="500" y="560" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
  <text x="750" y="560" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(n)</text>

  <line x1="370" y1="485" x2="370" y2="570" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="485" x2="620" y2="570" stroke="#DEE2E6" stroke-width="1"/>
</svg>
