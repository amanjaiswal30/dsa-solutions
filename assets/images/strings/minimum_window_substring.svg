<svg width="900" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="630" fill="#F8F9FA" rx="10"/>
  <!-- Title Bar -->
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="19" font-weight="bold" fill="white">Minimum Window Substring</text>
  <!-- Difficulty Badge -->
  <rect x="790" y="12" width="92" height="28" fill="#E74C3C" rx="14"/>
  <text x="836" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Hard</text>

  <!-- Example Row -->
  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">s="ADOBECODEBANC", t="ABC"</text>
  <text x="370" y="81" font-family="Arial" font-size="12" fill="#555">→</text>
  <text x="390" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">Output: "BANC"</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Smallest substring containing all of A, B, C is "BANC" (length 4)</text>

  <!-- === APPROACH 1: Brute Force === -->
  <rect x="15" y="115" width="390" height="375" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="390" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="390" height="15" fill="#E74C3C"/>
  <text x="210" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Brute Force</text>
  <text x="210" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">O(n² · m) time | O(1) space</text>

  <text x="30" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Try every substring of s, check if it contains t:</text>
  <text x="30" y="196" font-family="Arial" font-size="11" fill="#666">s = "ADOBECODEBANC", t = "ABC"</text>

  <!-- Brute force attempt table -->
  <rect x="30" y="204" width="360" height="22" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="219" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">"A" → has A,B?C? → No ✗</text>

  <rect x="30" y="230" width="360" height="22" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="245" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">"AD" → has A,B?,C? → No ✗</text>

  <rect x="30" y="256" width="360" height="22" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="271" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">"ADO","ADOB","ADOBE" → still missing C ✗</text>

  <rect x="30" y="282" width="360" height="22" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="297" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">"ADOBEC" → has A,B,C → valid! len=6</text>

  <rect x="30" y="308" width="360" height="22" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="323" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">... check all substrings of all lengths ...</text>

  <rect x="30" y="334" width="360" height="22" fill="#D5F5E3" stroke="#27AE60" rx="3"/>
  <text x="210" y="349" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">"BANC" found → len=4 (minimum!) ✓</text>

  <text x="30" y="380" font-family="Arial" font-size="11" fill="#E74C3C">⚠ O(n²) substrings × O(m) each = O(n²·m)</text>
  <text x="30" y="398" font-family="Arial" font-size="11" fill="#888">Must check all n(n+1)/2 substrings</text>
  <text x="30" y="416" font-family="Arial" font-size="11" fill="#888">For s=13 chars, t=3: ~91 substrings × 3</text>
  <text x="30" y="434" font-family="Arial" font-size="11" fill="#888">No way to skip redundant comparisons</text>
  <text x="30" y="464" font-family="Arial" font-size="11" fill="#888">TLE for large n — need smarter expansion</text>

  <!-- Evolution Arrow -->
  <line x1="410" y1="300" x2="480" y2="300" stroke="#7F8C8D" stroke-width="2.5"/>
  <polygon points="480,295 492,300 480,305" fill="#7F8C8D"/>
  <rect x="410" y="267" width="72" height="66" fill="#ECF0F1" stroke="#BDC3C7" rx="5"/>
  <text x="446" y="281" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" font-weight="bold">💡 Expand</text>
  <text x="446" y="293" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">right until</text>
  <text x="446" y="305" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">valid, then</text>
  <text x="446" y="317" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">shrink left!</text>

  <!-- === APPROACH 2: Sliding Window === -->
  <rect x="492" y="115" width="393" height="375" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="492" y="115" width="393" height="40" fill="#27AE60" rx="7"/>
  <rect x="492" y="140" width="393" height="15" fill="#27AE60"/>
  <text x="688" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Sliding Window + HashMap ⭐</text>
  <text x="688" y="153" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">O(n + m) time | O(|S| + |T|) space</text>

  <text x="505" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Two-phase: Expand right → Shrink left</text>
  <text x="505" y="196" font-family="Arial" font-size="11" fill="#666">t="ABC" → need={A:1,B:1,C:1}, formed=0, required=3</text>

  <!-- Phase 1: Expand -->
  <text x="505" y="215" font-family="Arial" font-size="11" font-weight="bold" fill="#27AE60">Phase 1: Expand right until formed==required</text>

  <rect x="505" y="221" width="362" height="20" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="235" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">R→A: win={A:1} → A satisfied! formed=1</text>

  <rect x="505" y="245" width="362" height="20" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="259" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">R→D,O: win={A:1,D:1,O:1} formed=1</text>

  <rect x="505" y="269" width="362" height="20" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="283" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">R→B: win={...B:1} → B satisfied! formed=2</text>

  <rect x="505" y="293" width="362" height="20" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="307" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">R→E,C: win={...C:1} → C satisfied! formed=3 ✓</text>

  <!-- Phase 2: Shrink -->
  <text x="505" y="330" font-family="Arial" font-size="11" font-weight="bold" fill="#E67E22">Phase 2: Shrink left while formed==required</text>

  <rect x="505" y="336" width="362" height="20" fill="#FEF9E7" stroke="#F39C12" rx="3"/>
  <text x="686" y="350" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">window="ADOBEC" len=6, record min</text>

  <rect x="505" y="360" width="362" height="20" fill="#FEF9E7" stroke="#F39C12" rx="3"/>
  <text x="686" y="374" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">remove L='A', formed drops → expand right again</text>

  <rect x="505" y="384" width="362" height="20" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="398" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">Eventually: "BANC" (len=4) → new minimum! ✓</text>

  <text x="505" y="422" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Result: "BANC" (min window containing A,B,C)</text>
  <text x="505" y="440" font-family="Arial" font-size="11" fill="#888">Each char processed at most twice: O(n+m)</text>
  <text x="505" y="458" font-family="Arial" font-size="11" fill="#888">HashMap tracks required counts efficiently</text>
  <text x="505" y="476" font-family="Arial" font-size="11" fill="#888">'formed' counter avoids recount each step</text>

  <!-- Complexity Table -->
  <rect x="15" y="500" width="870" height="120" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="500" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="515" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="520" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>

  <line x1="15" y1="530" x2="885" y2="530" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="530" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="547" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="547" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time Complexity</text>
  <text x="750" y="547" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space Complexity</text>

  <line x1="15" y1="555" x2="885" y2="555" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="555" width="870" height="28" fill="#FDEDEC"/>
  <text x="200" y="574" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Brute Force</text>
  <text x="500" y="574" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n² · m)</text>
  <text x="750" y="574" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(1)</text>

  <line x1="15" y1="583" x2="885" y2="583" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="583" width="870" height="30" fill="#EAFAF1"/>
  <text x="200" y="603" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Sliding Window + HashMap ⭐</text>
  <text x="500" y="603" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n + m)</text>
  <text x="750" y="603" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(|S| + |T|)</text>

  <line x1="370" y1="530" x2="370" y2="613" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="530" x2="620" y2="613" stroke="#DEE2E6" stroke-width="1"/>
</svg>
