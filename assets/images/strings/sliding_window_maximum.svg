<svg width="900" height="620" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="620" fill="#F8F9FA" rx="10"/>
  <!-- Title Bar -->
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="19" font-weight="bold" fill="white">Sliding Window Maximum</text>
  <!-- Difficulty Badge -->
  <rect x="790" y="12" width="92" height="28" fill="#E74C3C" rx="14"/>
  <text x="836" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Hard</text>

  <!-- Example Row -->
  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">nums=[1,3,-1,-3,5,3,6,7], k=3</text>
  <text x="380" y="81" font-family="Arial" font-size="12" fill="#555">→</text>
  <text x="400" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">Output: [3,3,5,5,6,7]</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Max of each window of size 3: [1,3,-1]→3, [3,-1,-3]→3, [-1,-3,5]→5...</text>

  <!-- === APPROACH 1: Brute Force === -->
  <rect x="15" y="115" width="390" height="365" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="390" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="390" height="15" fill="#E74C3C"/>
  <text x="210" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Brute Force</text>
  <text x="210" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">O(n·k) time | O(1) space</text>

  <text x="30" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">For each window, scan k elements for max:</text>
  <text x="30" y="196" font-family="Arial" font-size="11" fill="#666">nums=[1,3,-1,-3,5,3,6,7], k=3</text>

  <!-- Windows visualized -->
  <!-- Window 1 -->
  <rect x="30" y="204" width="26" height="26" fill="#E74C3C" stroke="#C0392B" rx="3"/>
  <text x="43" y="221" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">1</text>
  <rect x="60" y="204" width="26" height="26" fill="#E74C3C" stroke="#C0392B" rx="3"/>
  <text x="73" y="221" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">3</text>
  <rect x="90" y="204" width="26" height="26" fill="#E74C3C" stroke="#C0392B" rx="3"/>
  <text x="103" y="221" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">-1</text>
  <text x="210" y="221" font-family="Arial" font-size="11" fill="#555">max(1,3,-1) = 3 →</text>
  <rect x="330" y="207" width="28" height="22" fill="#D5F5E3" stroke="#27AE60" rx="3"/>
  <text x="344" y="222" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">3</text>

  <!-- Window 2 -->
  <rect x="30" y="238" width="26" height="26" fill="#95A5A6" stroke="#7F8C8D" rx="3"/>
  <text x="43" y="255" font-family="Arial" font-size="11" fill="white" text-anchor="middle">1</text>
  <rect x="60" y="238" width="26" height="26" fill="#E74C3C" stroke="#C0392B" rx="3"/>
  <text x="73" y="255" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">3</text>
  <rect x="90" y="238" width="26" height="26" fill="#E74C3C" stroke="#C0392B" rx="3"/>
  <text x="103" y="255" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">-1</text>
  <rect x="120" y="238" width="26" height="26" fill="#E74C3C" stroke="#C0392B" rx="3"/>
  <text x="133" y="255" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">-3</text>
  <text x="210" y="255" font-family="Arial" font-size="11" fill="#555">max(3,-1,-3) = 3 →</text>
  <rect x="330" y="241" width="28" height="22" fill="#D5F5E3" stroke="#27AE60" rx="3"/>
  <text x="344" y="256" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">3</text>

  <!-- Window 3 -->
  <rect x="60" y="272" width="26" height="26" fill="#95A5A6" stroke="#7F8C8D" rx="3"/>
  <text x="73" y="289" font-family="Arial" font-size="11" fill="white" text-anchor="middle">3</text>
  <rect x="90" y="272" width="26" height="26" fill="#E74C3C" stroke="#C0392B" rx="3"/>
  <text x="103" y="289" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">-1</text>
  <rect x="120" y="272" width="26" height="26" fill="#E74C3C" stroke="#C0392B" rx="3"/>
  <text x="133" y="289" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">-3</text>
  <rect x="150" y="272" width="26" height="26" fill="#E74C3C" stroke="#C0392B" rx="3"/>
  <text x="163" y="289" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">5</text>
  <text x="210" y="289" font-family="Arial" font-size="11" fill="#555">max(-1,-3,5) = 5 →</text>
  <rect x="330" y="275" width="28" height="22" fill="#D5F5E3" stroke="#27AE60" rx="3"/>
  <text x="344" y="290" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">5</text>

  <text x="30" y="320" font-family="Arial" font-size="11" fill="#888">... continue for remaining windows ...</text>
  <text x="30" y="340" font-family="Arial" font-size="11" fill="#555">Result: [3, 3, 5, 5, 6, 7]</text>

  <text x="30" y="365" font-family="Arial" font-size="11" fill="#E74C3C">⚠ Each window scans k elements → O(n·k)</text>
  <text x="30" y="383" font-family="Arial" font-size="11" fill="#888">For n=8, k=3: ~18 comparisons (ok)</text>
  <text x="30" y="401" font-family="Arial" font-size="11" fill="#888">For n=100000, k=50000: 5 billion comparisons!</text>
  <text x="30" y="419" font-family="Arial" font-size="11" fill="#888">No memory of previous max when window slides</text>
  <text x="30" y="455" font-family="Arial" font-size="11" fill="#888">Recalculates max from scratch each window</text>

  <!-- Evolution Arrow -->
  <line x1="410" y1="295" x2="480" y2="295" stroke="#7F8C8D" stroke-width="2.5"/>
  <polygon points="480,290 492,295 480,300" fill="#7F8C8D"/>
  <rect x="410" y="262" width="72" height="66" fill="#ECF0F1" stroke="#BDC3C7" rx="5"/>
  <text x="446" y="276" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" font-weight="bold">💡 Deque</text>
  <text x="446" y="288" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">stores</text>
  <text x="446" y="300" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">decreasing</text>
  <text x="446" y="312" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">indices!</text>

  <!-- === APPROACH 2: Monotonic Deque === -->
  <rect x="492" y="115" width="393" height="365" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="492" y="115" width="393" height="40" fill="#27AE60" rx="7"/>
  <rect x="492" y="140" width="393" height="15" fill="#27AE60"/>
  <text x="688" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Monotonic Deque ⭐</text>
  <text x="688" y="153" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">O(n) time | O(k) space</text>

  <text x="505" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Deque stores indices, values decreasing front→back:</text>
  <text x="505" y="196" font-family="Arial" font-size="11" fill="#666">nums=[1,3,-1,-3,5,3,6,7], k=3</text>

  <!-- Deque steps -->
  <rect x="505" y="203" width="362" height="32" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="216" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">i=0: deque=[0]. i=1: 3>1, pop 0, push 1</text>
  <text x="686" y="229" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">deque=[1] (val=3 dominates)</text>

  <rect x="505" y="239" width="362" height="32" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="252" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">i=2: -1&lt;3, just push 2 → deque=[1,2]</text>
  <text x="686" y="265" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">window full! result[0]=nums[deque[0]]=nums[1]=3 ✓</text>

  <rect x="505" y="275" width="362" height="32" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="288" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">i=3: -3&lt;-1, push 3 → deque=[1,2,3]</text>
  <text x="686" y="301" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">Check front: 1 in window [1..3]? Yes. result[1]=3 ✓</text>

  <rect x="505" y="311" width="362" height="32" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="324" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">i=4: 5&gt;all. Pop 3,2,1 from back → deque=[4]</text>
  <text x="686" y="337" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">result[2]=nums[4]=5 ✓</text>

  <rect x="505" y="347" width="362" height="32" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="360" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">i=5: 3&lt;5, push 5 → deque=[4,5]</text>
  <text x="686" y="373" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">result[3]=nums[4]=5 ✓</text>

  <rect x="505" y="383" width="362" height="32" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="396" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">i=6: 6&gt;3,5. Pop back. deque=[6] → result[4]=6 ✓</text>
  <text x="686" y="409" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">i=7: 7&gt;6. deque=[7] → result[5]=7 ✓</text>

  <text x="505" y="438" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Result: [3,3,5,5,6,7] ✓</text>
  <text x="505" y="456" font-family="Arial" font-size="11" fill="#888">Each element pushed/popped at most once → O(n)</text>
  <text x="505" y="474" font-family="Arial" font-size="11" fill="#888">Front always = max of current window</text>

  <!-- Complexity Table -->
  <rect x="15" y="492" width="870" height="118" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="492" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="507" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="512" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>

  <line x1="15" y1="522" x2="885" y2="522" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="522" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="539" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="539" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time Complexity</text>
  <text x="750" y="539" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space Complexity</text>

  <line x1="15" y1="547" x2="885" y2="547" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="547" width="870" height="28" fill="#FDEDEC"/>
  <text x="200" y="566" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Brute Force (scan each window)</text>
  <text x="500" y="566" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n · k)</text>
  <text x="750" y="566" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(1)</text>

  <line x1="15" y1="575" x2="885" y2="575" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="575" width="870" height="30" fill="#EAFAF1"/>
  <text x="200" y="595" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Monotonic Deque ⭐</text>
  <text x="500" y="595" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
  <text x="750" y="595" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(k)</text>

  <line x1="370" y1="522" x2="370" y2="605" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="522" x2="620" y2="605" stroke="#DEE2E6" stroke-width="1"/>
</svg>
