<svg width="900" height="580" xmlns="http://www.w3.org/2000/svg">
<style>
  /* Step boxes sequential highlight */
  @keyframes step_hl {0%,14%,26%,100%{fill:#FDEDEC;stroke:#E74C3C;stroke-width:2} 15%,25%{fill:#D5F5E3;stroke:#27AE60;stroke-width:2.5}}
  .s1{animation:step_hl 8s 0s ease-in-out infinite}
  .s2{animation:step_hl 8s 1.2s ease-in-out infinite}
  .s3{animation:step_hl 8s 2.4s ease-in-out infinite}
  .s4{animation:step_hl 8s 3.6s ease-in-out infinite}
  .s5{animation:step_hl 8s 4.8s ease-in-out infinite}

  @keyframes tree_pulse {0%,100%{fill:#27AE60;fill-opacity:1} 50%{fill:#82E0AA;fill-opacity:0.9}}
  .t0{animation:tree_pulse 8s 0s ease-in-out infinite}
  .t1{animation:tree_pulse 8s 0.8s ease-in-out infinite}
  .t2{animation:tree_pulse 8s 1.6s ease-in-out infinite}

  @keyframes arrow_pulse {0%,100%{opacity:1} 50%{opacity:0.7}}
  .arrow_box{animation:arrow_pulse 8s ease-in-out infinite}
</style>
  <!-- Background -->
  <rect width="900" height="580" fill="#F8F9FA" rx="10"/>
  <!-- Title Bar -->
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">Generate Binary Numbers from 1 to N</text>
  <!-- Difficulty Badge -->
  <rect x="790" y="12" width="92" height="28" fill="#27AE60" rx="14"/>
  <text x="836" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Easy</text>

  <!-- Example Row -->
  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">Input: n = 5</text>
  <text x="280" y="81" font-family="Arial" font-size="12" fill="#555">→</text>
  <text x="300" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">Output: ["1", "10", "11", "100", "101"]</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Binary representations of 1→5: 1=1, 2=10, 3=11, 4=100, 5=101</text>

  <!-- === APPROACH 1: Direct Conversion === -->
  <rect x="15" y="115" width="390" height="320" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="390" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="390" height="15" fill="#E74C3C"/>
  <text x="210" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Direct Conversion</text>
  <text x="210" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">O(n log n) time | O(n) space</text>

  <text x="30" y="180" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Algorithm:</text>
  <text x="30" y="198" font-family="Arial" font-size="11" fill="#555">For i = 1 to n: convert to binary string</text>

  <!-- Step boxes -->
  <rect class="s1" x="30" y="208" width="360" height="28" fill="#FDEDEC" stroke="#E74C3C" stroke-width="2" rx="4"/>
  <text x="210" y="227" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">i=1: Integer.toBinaryString(1) → "1"</text>

  <rect class="s2" x="30" y="242" width="360" height="28" fill="#FDEDEC" stroke="#E74C3C" stroke-width="2" rx="4"/>
  <text x="210" y="261" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">i=2: Integer.toBinaryString(2) → "10"</text>

  <rect class="s3" x="30" y="276" width="360" height="28" fill="#FDEDEC" stroke="#E74C3C" stroke-width="2" rx="4"/>
  <text x="210" y="295" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">i=3: Integer.toBinaryString(3) → "11"</text>

  <rect class="s4" x="30" y="310" width="360" height="28" fill="#FDEDEC" stroke="#E74C3C" stroke-width="2" rx="4"/>
  <text x="210" y="329" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">i=4: Integer.toBinaryString(4) → "100"</text>

  <rect class="s5" x="30" y="344" width="360" height="28" fill="#FDEDEC" stroke="#E74C3C" stroke-width="2" rx="4"/>
  <text x="210" y="363" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">i=5: Integer.toBinaryString(5) → "101"</text>

  <text x="30" y="398" font-family="Arial" font-size="11" fill="#888">Each conversion is O(log i) → total O(n log n)</text>
  <text x="30" y="416" font-family="Arial" font-size="11" fill="#888">Simple but involves repeated division</text>

  <!-- Evolution Arrow -->
  <line x1="410" y1="275" x2="480" y2="275" stroke="#7F8C8D" stroke-width="2.5"/>
  <polygon points="480,270 492,275 480,280" fill="#7F8C8D"/>
  <rect class="arrow_box" x="410" y="248" width="72" height="54" fill="#ECF0F1" stroke="#BDC3C7" rx="5"/>
  <text x="446" y="263" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" font-weight="bold">💡 Think</text>
  <text x="446" y="275" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">BFS tree</text>
  <text x="446" y="287" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">expansion!</text>

  <!-- === APPROACH 2: Queue BFS === -->
  <rect x="492" y="115" width="393" height="320" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="492" y="115" width="393" height="40" fill="#27AE60" rx="7"/>
  <rect x="492" y="140" width="393" height="15" fill="#27AE60"/>
  <text x="688" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Queue BFS ⭐</text>
  <text x="688" y="153" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">O(n) time | O(n) space</text>

  <text x="505" y="180" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">BFS Tree Expansion:</text>
  <text x="505" y="196" font-family="Arial" font-size="11" fill="#555">Start with "1", generate children "x0" and "x1"</text>

  <!-- BFS Tree visualization -->
  <!-- Level 0 -->
  <rect class="t0" x="660" y="204" width="56" height="24" fill="#27AE60" stroke="#1E8449" rx="4"/>
  <text x="688" y="220" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">"1"</text>

  <!-- Level 1 branches -->
  <line x1="660" y1="228" x2="600" y2="250" stroke="#27AE60" stroke-width="1.5"/>
  <line x1="716" y1="228" x2="776" y2="250" stroke="#27AE60" stroke-width="1.5"/>

  <rect class="t1" x="568" y="250" width="56" height="24" fill="#2ECC71" stroke="#27AE60" rx="4"/>
  <text x="596" y="266" font-family="Arial" font-size="11" fill="white" text-anchor="middle">"10"</text>

  <rect class="t1" x="748" y="250" width="56" height="24" fill="#2ECC71" stroke="#27AE60" rx="4"/>
  <text x="776" y="266" font-family="Arial" font-size="11" fill="white" text-anchor="middle">"11"</text>

  <!-- Level 2 branches -->
  <line x1="568" y1="274" x2="525" y2="296" stroke="#27AE60" stroke-width="1.5"/>
  <line x1="624" y1="274" x2="667" y2="296" stroke="#27AE60" stroke-width="1.5"/>

  <rect class="t2" x="503" y="296" width="44" height="22" fill="#82E0AA" stroke="#27AE60" rx="4"/>
  <text x="525" y="311" font-family="Arial" font-size="10" fill="#1E5631" text-anchor="middle">"100"</text>

  <rect class="t2" x="647" y="296" width="44" height="22" fill="#82E0AA" stroke="#27AE60" rx="4"/>
  <text x="669" y="311" font-family="Arial" font-size="10" fill="#1E5631" text-anchor="middle">"101"</text>

  <!-- Queue state visualization -->
  <text x="505" y="338" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Queue States:</text>

  <rect x="505" y="346" width="362" height="20" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="514" y="360" font-family="Arial" font-size="10" fill="#333">Start: ["1"]  →  Pop "1", add ["10","11"]  →  Pop "10", add [...,"100","101"]</text>

  <text x="505" y="384" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Result: ["1", "10", "11", "100", "101"] ✓</text>
  <text x="505" y="400" font-family="Arial" font-size="11" fill="#888">Each element enqueued/dequeued once → O(n)</text>
  <text x="505" y="416" font-family="Arial" font-size="11" fill="#888">No division needed — pure string concatenation</text>

  <!-- Complexity Table -->
  <rect x="15" y="445" width="870" height="120" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="445" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="460" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="465" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>

  <!-- Table Header -->
  <line x1="15" y1="475" x2="885" y2="475" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="475" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="492" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="492" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time Complexity</text>
  <text x="750" y="492" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space Complexity</text>

  <line x1="15" y1="500" x2="885" y2="500" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="500" width="870" height="30" fill="#FDEDEC"/>
  <text x="200" y="520" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Direct Conversion</text>
  <text x="500" y="520" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n log n)</text>
  <text x="750" y="520" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(n)</text>

  <line x1="15" y1="530" x2="885" y2="530" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="530" width="870" height="30" fill="#EAFAF1"/>
  <text x="200" y="550" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Queue BFS ⭐ Optimal</text>
  <text x="500" y="550" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
  <text x="750" y="550" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(n)</text>

  <!-- Column dividers in table -->
  <line x1="370" y1="475" x2="370" y2="560" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="475" x2="620" y2="560" stroke="#DEE2E6" stroke-width="1"/>
</svg>
