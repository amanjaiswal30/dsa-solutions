<svg width="900" height="620" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="900" height="620" fill="#F8F9FA" rx="10"/>
  <!-- Title Bar -->
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="17" font-weight="bold" fill="white">Longest Substring Without Repeating Characters</text>
  <!-- Difficulty Badge -->
  <rect x="790" y="12" width="92" height="28" fill="#F39C12" rx="14"/>
  <text x="836" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <!-- Example Row -->
  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">s = "abcabcbb"</text>
  <text x="280" y="81" font-family="Arial" font-size="12" fill="#555">→</text>
  <text x="300" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">Output: 3</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Longest window without duplicates: "abc" (length 3)</text>

  <!-- === APPROACH 1: Brute Force === -->
  <rect x="15" y="115" width="390" height="360" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="390" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="390" height="15" fill="#E74C3C"/>
  <text x="210" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Brute Force</text>
  <text x="210" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">O(n²) time | O(n) space</text>

  <text x="30" y="178" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Check all substrings for uniqueness:</text>

  <!-- String visualization -->
  <text x="30" y="198" font-family="Arial" font-size="11" fill="#666">s = "abcabcbb"</text>

  <!-- Char boxes -->
  <rect x="30" y="204" width="26" height="26" fill="#E8F8F5" stroke="#27AE60" rx="3"/>
  <text x="43" y="221" font-family="Arial" font-size="12" fill="#27AE60" text-anchor="middle">a</text>
  <text x="43" y="244" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">0</text>

  <rect x="58" y="204" width="26" height="26" fill="#E8F8F5" stroke="#27AE60" rx="3"/>
  <text x="71" y="221" font-family="Arial" font-size="12" fill="#27AE60" text-anchor="middle">b</text>
  <text x="71" y="244" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">1</text>

  <rect x="86" y="204" width="26" height="26" fill="#E8F8F5" stroke="#27AE60" rx="3"/>
  <text x="99" y="221" font-family="Arial" font-size="12" fill="#27AE60" text-anchor="middle">c</text>
  <text x="99" y="244" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">2</text>

  <rect x="114" y="204" width="26" height="26" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="127" y="221" font-family="Arial" font-size="12" fill="#E74C3C" text-anchor="middle">a</text>
  <text x="127" y="244" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">3</text>

  <rect x="142" y="204" width="26" height="26" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="155" y="221" font-family="Arial" font-size="12" fill="#E74C3C" text-anchor="middle">b</text>
  <text x="155" y="244" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">4</text>

  <rect x="170" y="204" width="26" height="26" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="183" y="221" font-family="Arial" font-size="12" fill="#E74C3C" text-anchor="middle">c</text>
  <text x="183" y="244" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">5</text>

  <rect x="198" y="204" width="26" height="26" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="211" y="221" font-family="Arial" font-size="12" fill="#E74C3C" text-anchor="middle">b</text>
  <text x="211" y="244" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">6</text>

  <rect x="226" y="204" width="26" height="26" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="239" y="221" font-family="Arial" font-size="12" fill="#E74C3C" text-anchor="middle">b</text>
  <text x="239" y="244" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">7</text>

  <!-- Substrings checked -->
  <text x="30" y="264" font-family="Arial" font-size="11" fill="#555">Substrings tried from index 0:</text>
  <rect x="30" y="272" width="360" height="20" fill="#D5F5E3" stroke="#27AE60" rx="3"/>
  <text x="210" y="286" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">"a" → unique (len=1), "ab" → unique (len=2)</text>
  <rect x="30" y="296" width="360" height="20" fill="#D5F5E3" stroke="#27AE60" rx="3"/>
  <text x="210" y="310" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">"abc" → unique (len=3) ← max so far!</text>
  <rect x="30" y="320" width="360" height="20" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="210" y="334" font-family="Arial" font-size="10" fill="#E74C3C" text-anchor="middle">"abca" → 'a' repeats! stop.</text>

  <text x="30" y="358" font-family="Arial" font-size="11" fill="#555">Repeat for each starting position...</text>
  <text x="30" y="376" font-family="Arial" font-size="11" fill="#E74C3C">⚠ O(n) starts × O(n) checks = O(n²)</text>
  <text x="30" y="394" font-family="Arial" font-size="11" fill="#888">HashSet for uniqueness check: O(n) space</text>
  <text x="30" y="412" font-family="Arial" font-size="11" fill="#888">Redundant work: restarts from each index</text>
  <text x="30" y="430" font-family="Arial" font-size="11" fill="#888">Answer: 3 (but slow)</text>
  <text x="30" y="460" font-family="Arial" font-size="11" fill="#888">Restarts = missed optimization: don't reset!</text>

  <!-- Evolution Arrow -->
  <line x1="410" y1="280" x2="480" y2="280" stroke="#7F8C8D" stroke-width="2.5"/>
  <polygon points="480,275 492,280 480,285" fill="#7F8C8D"/>
  <rect x="410" y="250" width="72" height="60" fill="#ECF0F1" stroke="#BDC3C7" rx="5"/>
  <text x="446" y="265" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" font-weight="bold">💡 Slide</text>
  <text x="446" y="277" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">window,</text>
  <text x="446" y="289" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">don't restart!</text>

  <!-- === APPROACH 2: Sliding Window === -->
  <rect x="492" y="115" width="393" height="360" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="492" y="115" width="393" height="40" fill="#27AE60" rx="7"/>
  <rect x="492" y="140" width="393" height="15" fill="#27AE60"/>
  <text x="688" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Sliding Window + HashSet ⭐</text>
  <text x="688" y="153" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">O(n) time | O(min(n,charset)) space</text>

  <text x="505" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Two pointers L,R expand/shrink window:</text>

  <!-- Sliding window step-by-step -->
  <text x="505" y="198" font-family="Arial" font-size="11" fill="#666">s = "abcabcbb"  (left=0, right slides right)</text>

  <rect x="505" y="206" width="362" height="28" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="218" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">R=0: add 'a' → set={a}, window="a", max=1</text>
  <text x="686" y="230" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">L=0, R=0 ✓</text>

  <rect x="505" y="238" width="362" height="28" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="250" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">R=1: add 'b' → set={a,b}, window="ab", max=2</text>
  <text x="686" y="262" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">L=0, R=1 ✓</text>

  <rect x="505" y="270" width="362" height="28" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="282" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">R=2: add 'c' → set={a,b,c}, window="abc", max=3</text>
  <text x="686" y="294" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">L=0, R=2 ✓</text>

  <rect x="505" y="302" width="362" height="36" fill="#FEF9E7" stroke="#F39C12" rx="3"/>
  <text x="686" y="316" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">R=3: 'a' already in set!</text>
  <text x="686" y="328" font-family="Arial" font-size="10" fill="#E67E22" text-anchor="middle">Remove s[L]='a', L++ → L=1, set={b,c,a}, max=3</text>

  <rect x="505" y="342" width="362" height="28" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="354" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">R=4: 'b' in set! → remove 'b'(L=1), L=2 → add 'b'</text>
  <text x="686" y="366" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">set={c,a,b}, window="cab", max=3 ✓</text>

  <rect x="505" y="374" width="362" height="28" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="686" y="386" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Continue... window shrinks on duplicates</text>
  <text x="686" y="398" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">max remains 3 throughout ✓</text>

  <text x="505" y="428" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Each char added/removed at most once → O(n)</text>
  <text x="505" y="444" font-family="Arial" font-size="11" fill="#888">HashSet: O(1) add/remove/contains</text>
  <text x="505" y="460" font-family="Arial" font-size="11" fill="#888">No wasted restarts — window slides forward always</text>

  <!-- Complexity Table -->
  <rect x="15" y="487" width="870" height="122" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="487" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="502" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="507" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>

  <line x1="15" y1="517" x2="885" y2="517" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="517" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time Complexity</text>
  <text x="750" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space Complexity</text>

  <line x1="15" y1="542" x2="885" y2="542" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="542" width="870" height="28" fill="#FDEDEC"/>
  <text x="200" y="561" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Brute Force (all substrings)</text>
  <text x="500" y="561" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n²)</text>
  <text x="750" y="561" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(n)</text>

  <line x1="15" y1="570" x2="885" y2="570" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="570" width="870" height="30" fill="#EAFAF1"/>
  <text x="200" y="590" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Sliding Window + HashSet ⭐</text>
  <text x="500" y="590" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
  <text x="750" y="590" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(min(n, charset))</text>

  <line x1="370" y1="517" x2="370" y2="600" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="517" x2="620" y2="600" stroke="#DEE2E6" stroke-width="1"/>
</svg>
