<svg width="900" height="620" xmlns="http://www.w3.org/2000/svg">
<style>
  /* Position grid chars pulse */
  @keyframes pos_hl {0%,100%{fill:#E74C3C;stroke:#C0392B} 50%{fill:#C0392B;fill-opacity:0.9}}
  .pa{animation:pos_hl 8s 0s ease-in-out infinite}
  .pa2{animation:pos_hl 8s 0.4s ease-in-out infinite}
  @keyframes pos_b {0%,100%{fill:#3498DB;stroke:#2980B9} 50%{fill:#2980B9;fill-opacity:0.9}}
  .pb{animation:pos_b 8s 0.8s ease-in-out infinite}

  /* Heap step boxes sequential (approach 2) */
  @keyframes heap_hl {0%,20%,35%,100%{fill:#EAFAF1;stroke:#27AE60;stroke-width:2} 22%,33%{fill:#D5F5E3;stroke:#1E8449;stroke-width:2.5}}
  .h1{animation:heap_hl 8s 0s ease-in-out infinite}
  .h2{animation:heap_hl 8s 1.6s ease-in-out infinite}
  .h3{animation:heap_hl 8s 3.2s ease-in-out infinite}
  .h4{animation:heap_hl 8s 4.8s ease-in-out infinite}

  @keyframes think_pulse {0%,100%{opacity:1} 50%{opacity:0.75}}
  .think_box{animation:think_pulse 8s ease-in-out infinite}
</style>
  <!-- Background -->
  <rect width="900" height="620" fill="#F8F9FA" rx="10"/>
  <!-- Title Bar -->
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="20" y="33" font-family="Arial" font-size="18" font-weight="bold" fill="white">No Adjacent Characters Together (Rearrange String)</text>
  <!-- Difficulty Badge -->
  <rect x="790" y="12" width="92" height="28" fill="#F39C12" rx="14"/>
  <text x="836" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Medium</text>

  <!-- Example Row -->
  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="30" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#2C3E50">Example:</text>
  <text x="100" y="81" font-family="Arial" font-size="12" fill="#555">s = "aab"</text>
  <text x="200" y="81" font-family="Arial" font-size="12" fill="#555">→</text>
  <text x="220" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#27AE60">"aba"</text>
  <text x="280" y="81" font-family="Arial" font-size="12" fill="#777">|</text>
  <text x="300" y="81" font-family="Arial" font-size="12" fill="#555">s = "aaab"</text>
  <text x="420" y="81" font-family="Arial" font-size="12" fill="#555">→</text>
  <text x="440" y="81" font-family="Arial" font-size="12" font-weight="bold" fill="#E74C3C">""</text>
  <text x="30" y="98" font-family="Arial" font-size="11" fill="#777">Key: if maxFreq > (n+1)/2, impossible. Otherwise, always solvable.</text>

  <!-- === APPROACH 1: Count + Sort === -->
  <rect x="15" y="115" width="390" height="360" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="390" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="390" height="15" fill="#E74C3C"/>
  <text x="210" y="140" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Approach 1: Count + Sort</text>
  <text x="210" y="153" font-family="Arial" font-size="10" fill="#FADBD8" text-anchor="middle">O(n log n) time | O(26) space</text>

  <text x="30" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Greedily place most frequent chars first:</text>
  <text x="30" y="196" font-family="Arial" font-size="11" fill="#666">s = "aab" → freq: a=2, b=1</text>

  <!-- Step-by-step process -->
  <text x="30" y="218" font-family="Arial" font-size="11" fill="#555">1. Count: a→2, b→1</text>
  <text x="30" y="236" font-family="Arial" font-size="11" fill="#555">2. Sort by freq descending: [a(2), b(1)]</text>

  <text x="30" y="258" font-family="Arial" font-size="11" font-weight="bold" fill="#555">3. Place in interleaved positions:</text>

  <rect x="30" y="265" width="360" height="100" fill="#FDEDEC" stroke="#E74C3C" rx="4"/>

  <!-- Position grid -->
  <text x="210" y="283" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Positions: 0, 1, 2 (n=3 chars)</text>

  <rect x="90" y="290" width="30" height="30" fill="#E74C3C" rx="3"/>
  <text x="105" y="310" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">a</text>
  <text x="105" y="330" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">pos 0</text>

  <rect x="160" y="290" width="30" height="30" fill="#E74C3C" rx="3"/>
  <text x="175" y="310" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">a</text>
  <text x="175" y="330" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">pos 2</text>

  <rect x="230" y="290" width="30" height="30" fill="#3498DB" rx="3"/>
  <text x="245" y="310" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">b</text>
  <text x="245" y="330" font-family="Arial" font-size="9" fill="#777" text-anchor="middle">pos 1</text>

  <text x="210" y="358" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Result: "aba" ✓ (a at 0,2 — not adjacent!)</text>

  <text x="30" y="388" font-family="Arial" font-size="11" fill="#888">Fill even positions first, then odd positions</text>
  <text x="30" y="406" font-family="Arial" font-size="11" fill="#888">Check feasibility: maxFreq ≤ (n+1)/2</text>
  <text x="30" y="424" font-family="Arial" font-size="11" fill="#E74C3C">⚠ Sorting: O(26 log 26) = O(1) but setup is O(n)</text>
  <text x="30" y="442" font-family="Arial" font-size="11" fill="#888">For "aaab": maxFreq=3 > 2=(4+1)/2 → return ""</text>
  <text x="30" y="460" font-family="Arial" font-size="11" fill="#888">Greedy approach but not dynamic — no re-ordering</text>

  <!-- Evolution Arrow -->
  <line x1="410" y1="295" x2="480" y2="295" stroke="#7F8C8D" stroke-width="2.5"/>
  <polygon points="480,290 492,295 480,300" fill="#7F8C8D"/>
  <rect class="think_box" x="410" y="262" width="72" height="66" fill="#ECF0F1" stroke="#BDC3C7" rx="5"/>
  <text x="446" y="276" font-family="Arial" font-size="9" fill="#555" text-anchor="middle" font-weight="bold">💡 Max</text>
  <text x="446" y="288" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">Heap for</text>
  <text x="446" y="300" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">dynamic</text>
  <text x="446" y="312" font-family="Arial" font-size="9" fill="#555" text-anchor="middle">ordering!</text>

  <!-- === APPROACH 2: Max Heap === -->
  <rect x="492" y="115" width="393" height="360" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="492" y="115" width="393" height="40" fill="#27AE60" rx="7"/>
  <rect x="492" y="140" width="393" height="15" fill="#27AE60"/>
  <text x="688" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Approach 2: Max Heap (Priority Queue) ⭐</text>
  <text x="688" y="153" font-family="Arial" font-size="10" fill="#D5F5E3" text-anchor="middle">O(n) time | O(26+n) space</text>

  <text x="505" y="178" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Always place highest-frequency char, hold back prev:</text>
  <text x="505" y="196" font-family="Arial" font-size="11" fill="#666">s = "aab" → heap: [(a,2),(b,1)]</text>

  <!-- Heap state steps -->
  <rect class="h1" x="505" y="204" width="362" height="36" fill="#EAFAF1" stroke="#27AE60" stroke-width="2" rx="3"/>
  <text x="686" y="218" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Step 1: pop (a,2), result="a", dec→(a,1)</text>
  <text x="686" y="232" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">heap=[(b,1)], prev=(a,1)</text>

  <rect class="h2" x="505" y="244" width="362" height="36" fill="#EAFAF1" stroke="#27AE60" stroke-width="2" rx="3"/>
  <text x="686" y="258" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Step 2: pop (b,1), result="ab", dec→(b,0)</text>
  <text x="686" y="272" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">push prev (a,1) back → heap=[(a,1)], prev=(b,0)</text>

  <rect class="h3" x="505" y="284" width="362" height="36" fill="#EAFAF1" stroke="#27AE60" stroke-width="2" rx="3"/>
  <text x="686" y="298" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">Step 3: pop (a,1), result="aba", dec→(a,0)</text>
  <text x="686" y="312" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">prev=(b,0) not pushed (freq=0). heap=[]</text>

  <rect class="h4" x="505" y="324" width="362" height="24" fill="#D5F5E3" stroke="#27AE60" stroke-width="2" rx="3"/>
  <text x="686" y="340" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">result.length==s.length → return "aba" ✓</text>

  <!-- Heap visualization -->
  <text x="505" y="365" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50">Heap (max by freq):</text>

  <!-- Heap for "aaab" impossible case -->
  <text x="505" y="383" font-family="Arial" font-size="11" fill="#666">For "aaab": heap=[(a,3),(b,1)]</text>
  <rect x="505" y="390" width="362" height="28" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="686" y="407" font-family="Arial" font-size="10" fill="#E74C3C" text-anchor="middle">After placement, result.length != 4 → return "" ✗</text>

  <text x="505" y="438" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold">Heap maintains optimal ordering at each step</text>
  <text x="505" y="456" font-family="Arial" font-size="11" fill="#888">Only 26 distinct chars → heap ops O(log 26)=O(1)</text>
  <text x="505" y="474" font-family="Arial" font-size="11" fill="#888">n iterations → effective O(n) total</text>

  <!-- Complexity Table -->
  <rect x="15" y="487" width="870" height="122" fill="#FFFFFF" stroke="#DEE2E6" rx="7"/>
  <rect x="15" y="487" width="870" height="30" fill="#2C3E50" rx="7"/>
  <rect x="15" y="502" width="870" height="15" fill="#2C3E50"/>
  <text x="450" y="507" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Complexity Comparison</text>

  <line x1="15" y1="517" x2="885" y2="517" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="517" width="870" height="25" fill="#ECF0F1"/>
  <text x="200" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Approach</text>
  <text x="500" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Time Complexity</text>
  <text x="750" y="534" font-family="Arial" font-size="11" font-weight="bold" fill="#2C3E50" text-anchor="middle">Space Complexity</text>

  <line x1="15" y1="542" x2="885" y2="542" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="542" width="870" height="28" fill="#FDEDEC"/>
  <text x="200" y="561" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Count + Sort</text>
  <text x="500" y="561" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n log n)</text>
  <text x="750" y="561" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(26)</text>

  <line x1="15" y1="570" x2="885" y2="570" stroke="#DEE2E6" stroke-width="1"/>
  <rect x="15" y="570" width="870" height="30" fill="#EAFAF1"/>
  <text x="200" y="590" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">Max Heap (Priority Queue) ⭐</text>
  <text x="500" y="590" font-family="Arial" font-size="11" fill="#27AE60" font-weight="bold" text-anchor="middle">O(n)</text>
  <text x="750" y="590" font-family="Arial" font-size="11" fill="#333" text-anchor="middle">O(26 + n)</text>

  <line x1="370" y1="517" x2="370" y2="600" stroke="#DEE2E6" stroke-width="1"/>
  <line x1="620" y1="517" x2="620" y2="600" stroke="#DEE2E6" stroke-width="1"/>
</svg>
