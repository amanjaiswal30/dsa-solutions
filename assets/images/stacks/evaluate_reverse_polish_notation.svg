<svg width="900" height="590" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="590" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect x="0" y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="430" y="35" font-family="Arial" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Evaluate Reverse Polish Notation (RPN)</text>
  <rect x="790" y="13" width="100" height="28" fill="#F39C12" rx="14"/>
  <text x="840" y="32" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Medium ⚡</text>

  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="25" y="80" font-family="Arial" font-size="12" fill="#7F8C8D">Input:</text>
  <text x="72" y="80" font-family="Arial" font-size="13" fill="#2C3E50" font-weight="bold">["2","1","+","3","*"]</text>
  <text x="290" y="80" font-family="Arial" font-size="13" fill="#7F8C8D">→</text>
  <text x="308" y="80" font-family="Arial" font-size="13" fill="#27AE60" font-weight="bold">9</text>
  <text x="360" y="80" font-family="Arial" font-size="11" fill="#7F8C8D">(2+1)×3=9</text>
  <text x="460" y="80" font-family="Arial" font-size="12" fill="#7F8C8D">|</text>
  <text x="475" y="80" font-family="Arial" font-size="13" fill="#2C3E50" font-weight="bold">["4","13","5","/","+"]</text>
  <text x="670" y="80" font-family="Arial" font-size="13" fill="#7F8C8D">→</text>
  <text x="688" y="80" font-family="Arial" font-size="13" fill="#27AE60" font-weight="bold">6</text>
  <text x="714" y="80" font-family="Arial" font-size="11" fill="#7F8C8D">4+(13/5)=6</text>
  <text x="25" y="99" font-family="Arial" font-size="11" fill="#7F8C8D">Operators: +  −  *  /  |  Operands come before operators (postfix notation)</text>

  <!-- ===== APPROACH 1: RECURSIVE (naive conceptual) ===== -->
  <rect x="15" y="115" width="350" height="360" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="350" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="350" height="15" fill="#E74C3C"/>
  <text x="190" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">① Naive Recursive (Conceptual)</text>
  <text x="190" y="167" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle" font-weight="bold">O(n) time · O(n) space (call stack)</text>

  <text x="25" y="187" font-family="Arial" font-size="11" fill="#555">Scan tokens right-to-left. When operator</text>
  <text x="25" y="201" font-family="Arial" font-size="11" fill="#555">found, recursively evaluate two sub-exprs.</text>

  <!-- Expression tree for ["2","1","+","3","*"] -->
  <text x="25" y="222" font-family="Arial" font-size="10" fill="#7F8C8D" font-weight="bold">Expression tree for ["2","1","+","3","*"]:</text>
  <g transform="translate(100, 235)">
    <!-- Root: * -->
    <circle cx="100" cy="20" r="20" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
    <text x="100" y="26" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">*</text>
    <!-- Left: + -->
    <line x1="82" y1="38" x2="45" y2="68"/>
    <circle cx="40" cy="80" r="20" fill="#E67E22" stroke="#CA6F1E" stroke-width="2"/>
    <text x="40" y="86" font-family="Arial" font-size="18" font-weight="bold" fill="white" text-anchor="middle">+</text>
    <!-- Right: 3 -->
    <line x1="118" y1="38" x2="155" y2="68"/>
    <circle cx="160" cy="80" r="20" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
    <text x="160" y="86" font-family="Arial" font-size="16" font-weight="bold" fill="white" text-anchor="middle">3</text>
    <!-- Left of +: 2 -->
    <line x1="22" y1="98" x2="5" y2="128"/>
    <circle cx="0" cy="140" r="18" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
    <text x="0" y="146" font-family="Arial" font-size="16" font-weight="bold" fill="white" text-anchor="middle">2</text>
    <!-- Right of +: 1 -->
    <line x1="58" y1="98" x2="75" y2="128"/>
    <circle cx="80" cy="140" r="18" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
    <text x="80" y="146" font-family="Arial" font-size="16" font-weight="bold" fill="white" text-anchor="middle">1</text>
    <!-- Annotations -->
    <text x="100" y="52" font-family="Arial" font-size="9" fill="#7F8C8D" text-anchor="middle">evaluate subtrees first</text>
    <text x="100" y="175" font-family="Arial" font-size="10" fill="#27AE60" text-anchor="middle">2+1=3  then  3*3=9</text>
  </g>

  <rect x="25" y="400" width="330" height="55" fill="#FDEDEC" stroke="#FFCCCC" rx="4"/>
  <text x="35" y="416" font-family="Arial" font-size="10" fill="#E74C3C" font-weight="bold">⚠ Recursive approach: implicit call stack O(n)</text>
  <text x="35" y="430" font-family="Arial" font-size="10" fill="#E74C3C">Must traverse tokens repeatedly to find boundaries</text>
  <text x="35" y="444" font-family="Arial" font-size="10" fill="#E74C3C">Harder to implement correctly — risk of index errors</text>
  <text x="35" y="458" font-family="Arial" font-size="10" fill="#E67E22">The stack structure naturally matches RPN evaluation!</text>

  <!-- Arrow -->
  <line x1="367" y1="295" x2="393" y2="295" stroke="#7F8C8D" stroke-width="2"/>
  <polygon points="393,290 403,295 393,300" fill="#7F8C8D"/>
  <rect x="362" y="268" width="50" height="24" fill="#FFF8E1" stroke="#F39C12" rx="3"/>
  <text x="387" y="281" font-family="Arial" font-size="9" fill="#D35400" text-anchor="middle">💡 Explicit</text>
  <text x="387" y="291" font-family="Arial" font-size="9" fill="#D35400" text-anchor="middle">stack = simple</text>

  <!-- ===== APPROACH 2: STACK ===== -->
  <rect x="403" y="115" width="482" height="360" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="403" y="115" width="482" height="40" fill="#27AE60" rx="7"/>
  <rect x="403" y="140" width="482" height="15" fill="#27AE60"/>
  <text x="644" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">② Stack-Based Evaluation ⭐ (Standard)</text>
  <text x="644" y="167" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle" font-weight="bold">O(n) time · O(n) space</text>

  <text x="413" y="187" font-family="Arial" font-size="11" fill="#555">Traverse tokens L→R. Number→push. Operator→pop</text>
  <text x="413" y="201" font-family="Arial" font-size="11" fill="#555">two, apply op, push result. Final stack top = answer.</text>

  <text x="413" y="220" font-family="Arial" font-size="10" fill="#7F8C8D" font-weight="bold">Trace ["2","1","+","3","*"]:</text>

  <rect x="413" y="226" width="462" height="18" fill="#F0F0F0" rx="2"/>
  <text x="425" y="238" font-family="Arial" font-size="9" font-weight="bold" fill="#555">Token    Action                        Stack (bottom → top)</text>

  <rect x="413" y="244" width="462" height="22" fill="#EBF5FB"/>
  <text x="425" y="252" font-family="Arial" font-size="9" fill="#2C3E50">"2"</text>
  <text x="465" y="252" font-family="Arial" font-size="9" fill="#2C3E50">push 2</text>
  <g transform="translate(570,241)">
    <rect x="0" y="0" width="28" height="18" fill="#AED6F1" stroke="#2980B9" rx="2"/>
    <text x="14" y="13" font-family="Arial" font-size="10" font-weight="bold" fill="#2980B9" text-anchor="middle">2</text>
  </g>
  <text x="425" y="261" font-family="Arial" font-size="9" fill="#7F8C8D">stack = [2]</text>

  <rect x="413" y="266" width="462" height="22" fill="#EBF5FB"/>
  <text x="425" y="274" font-family="Arial" font-size="9" fill="#2C3E50">"1"</text>
  <text x="465" y="274" font-family="Arial" font-size="9" fill="#2C3E50">push 1</text>
  <g transform="translate(570,263)">
    <rect x="0" y="0" width="28" height="18" fill="#AED6F1" stroke="#2980B9" rx="2"/>
    <text x="14" y="13" font-family="Arial" font-size="10" font-weight="bold" fill="#2980B9" text-anchor="middle">2</text>
    <rect x="30" y="0" width="28" height="18" fill="#AED6F1" stroke="#2980B9" rx="2"/>
    <text x="44" y="13" font-family="Arial" font-size="10" font-weight="bold" fill="#2980B9" text-anchor="middle">1</text>
  </g>
  <text x="425" y="283" font-family="Arial" font-size="9" fill="#7F8C8D">stack = [2, 1]</text>

  <rect x="413" y="288" width="462" height="24" fill="#D5E8D4"/>
  <text x="425" y="298" font-family="Arial" font-size="9" fill="#1E8449">"+"</text>
  <text x="465" y="298" font-family="Arial" font-size="9" fill="#1E8449" font-weight="bold">b=pop()=1, a=pop()=2. push(2+1=3)</text>
  <g transform="translate(570,284)">
    <rect x="0" y="0" width="28" height="18" fill="#D5E8D4" stroke="#27AE60" rx="2"/>
    <text x="14" y="13" font-family="Arial" font-size="10" font-weight="bold" fill="#1E8449" text-anchor="middle">3</text>
  </g>
  <text x="425" y="308" font-family="Arial" font-size="9" fill="#7F8C8D">stack = [3]</text>

  <rect x="413" y="312" width="462" height="22" fill="#EBF5FB"/>
  <text x="425" y="320" font-family="Arial" font-size="9" fill="#2C3E50">"3"</text>
  <text x="465" y="320" font-family="Arial" font-size="9" fill="#2C3E50">push 3</text>
  <g transform="translate(570,309)">
    <rect x="0" y="0" width="28" height="18" fill="#AED6F1" stroke="#2980B9" rx="2"/>
    <text x="14" y="13" font-family="Arial" font-size="10" font-weight="bold" fill="#2980B9" text-anchor="middle">3</text>
    <rect x="30" y="0" width="28" height="18" fill="#AED6F1" stroke="#2980B9" rx="2"/>
    <text x="44" y="13" font-family="Arial" font-size="10" font-weight="bold" fill="#2980B9" text-anchor="middle">3</text>
  </g>
  <text x="425" y="329" font-family="Arial" font-size="9" fill="#7F8C8D">stack = [3, 3]</text>

  <rect x="413" y="334" width="462" height="24" fill="#D5E8D4"/>
  <text x="425" y="344" font-family="Arial" font-size="9" fill="#1E8449">"*"</text>
  <text x="465" y="344" font-family="Arial" font-size="9" fill="#1E8449" font-weight="bold">b=pop()=3, a=pop()=3. push(3*3=9)</text>
  <g transform="translate(570,330)">
    <rect x="0" y="0" width="28" height="18" fill="#FFD700" stroke="#FFA500" rx="2"/>
    <text x="14" y="13" font-family="Arial" font-size="10" font-weight="bold" fill="#2C3E50" text-anchor="middle">9</text>
  </g>
  <text x="425" y="354" font-family="Arial" font-size="9" fill="#7F8C8D">stack = [9]</text>

  <rect x="413" y="364" width="462" height="26" fill="#D5E8D4" stroke="#27AE60" rx="3"/>
  <text x="644" y="381" font-family="Arial" font-size="13" fill="#1E8449" font-weight="bold" text-anchor="middle">stack.pop() = 9  →  Answer: 9 ✓</text>

  <!-- Key rules box -->
  <rect x="413" y="396" width="462" height="60" fill="#EAFAF1" stroke="#A9DFBF" rx="4"/>
  <text x="423" y="412" font-family="Arial" font-size="10" fill="#1E8449" font-weight="bold">Why stack works perfectly for RPN:</text>
  <text x="423" y="426" font-family="Arial" font-size="10" fill="#27AE60">• Number  → push onto stack (defer)</text>
  <text x="423" y="440" font-family="Arial" font-size="10" fill="#27AE60">• Operator → pop last 2 numbers, compute, push result</text>
  <text x="423" y="452" font-family="Arial" font-size="10" fill="#27AE60">• At end: exactly 1 element remains = the result</text>

  <!-- ===== COMPLEXITY TABLE ===== -->
  <rect x="15" y="483" width="870" height="98" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5" rx="7"/>
  <text x="450" y="502" font-family="Arial" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">Complexity Comparison</text>
  <rect x="25" y="508" width="850" height="24" fill="#2C3E50" rx="3"/>
  <text x="200" y="524" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Approach</text>
  <text x="450" y="524" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Time</text>
  <text x="580" y="524" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Space</text>
  <text x="740" y="524" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Notes</text>
  <rect x="25" y="532" width="850" height="22" fill="#FDEDEC"/>
  <text x="200" y="547" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">① Recursive (implicit stack)</text>
  <text x="450" y="547" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n)</text>
  <text x="580" y="547" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n)</text>
  <text x="740" y="547" font-family="Arial" font-size="11" fill="#7F8C8D" text-anchor="middle">Complex index tracking, error-prone</text>
  <rect x="25" y="554" width="850" height="22" fill="#EAFAF1"/>
  <text x="200" y="569" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle" font-weight="bold">② Explicit Stack ⭐ STANDARD</text>
  <text x="450" y="569" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
  <text x="580" y="569" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
  <text x="740" y="569" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Clean, natural fit for postfix evaluation</text>
  <text x="450" y="582" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">Note: The stack IS the call stack — making it explicit simplifies everything</text>
</svg>
