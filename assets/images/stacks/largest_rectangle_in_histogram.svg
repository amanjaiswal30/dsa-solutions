<svg width="900" height="620" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="620" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect x="0" y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="430" y="35" font-family="Arial" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Largest Rectangle in Histogram</text>
  <rect x="790" y="13" width="98" height="28" fill="#E74C3C" rx="14"/>
  <text x="839" y="32" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Hard 🔥</text>

  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="25" y="84" font-family="Arial" font-size="12" fill="#7F8C8D">Input:</text>
  <text x="70" y="84" font-family="Arial" font-size="13" fill="#2C3E50" font-weight="bold">heights = [2, 1, 5, 6, 2, 3]</text>
  <text x="320" y="84" font-family="Arial" font-size="13" fill="#7F8C8D">→</text>
  <text x="338" y="84" font-family="Arial" font-size="13" fill="#27AE60" font-weight="bold">Output: 10</text>
  <text x="470" y="84" font-family="Arial" font-size="11" fill="#7F8C8D">Largest rectangle area = 5×2 (bars at index 2 and 3, height=5)</text>

  <!-- ===== APPROACH 1: BRUTE FORCE ===== -->
  <rect x="15" y="115" width="415" height="380" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="415" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="415" height="15" fill="#E74C3C"/>
  <text x="223" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">① Brute Force — Check Every Pair (i, j)</text>
  <text x="223" y="167" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle" font-weight="bold">O(n²) time · O(1) space</text>

  <text x="25" y="187" font-family="Arial" font-size="11" fill="#555">For every pair (i, j), track min height in [i..j].</text>
  <text x="25" y="201" font-family="Arial" font-size="11" fill="#555">Area = minHeight × (j−i+1). Keep global max.</text>

  <!-- Draw histogram bars for [2,1,5,6,2,3] -->
  <text x="25" y="222" font-family="Arial" font-size="10" fill="#7F8C8D" font-weight="bold">heights = [2, 1, 5, 6, 2, 3]</text>
  <g transform="translate(25, 300)">
    <!-- Ground line -->
    <line x1="0" y1="0" x2="365" y2="0" stroke="#2C3E50" stroke-width="2"/>
    <!-- Bars: height units = 10px each -->
    <rect x="2"   y="-20"  width="50" height="20"  fill="#AED6F1" stroke="#2980B9" stroke-width="1"/>
    <rect x="2"   y="-20"  width="50" height="20"  fill="#AED6F1" stroke="#2980B9" stroke-width="1"/>
    <rect x="57"  y="-10"  width="50" height="10"  fill="#AED6F1" stroke="#2980B9" stroke-width="1"/>
    <rect x="112" y="-50"  width="50" height="50"  fill="#F1948A" stroke="#E74C3C" stroke-width="1.5"/>
    <rect x="167" y="-60"  width="50" height="60"  fill="#F1948A" stroke="#E74C3C" stroke-width="1.5"/>
    <rect x="222" y="-20"  width="50" height="20"  fill="#AED6F1" stroke="#2980B9" stroke-width="1"/>
    <rect x="277" y="-30"  width="50" height="30"  fill="#AED6F1" stroke="#2980B9" stroke-width="1"/>
    <!-- Best rectangle highlight (bars 2-3, h=5) -->
    <rect x="112" y="-50" width="105" height="50" fill="rgba(39,174,96,0.25)" stroke="#27AE60" stroke-width="2" stroke-dasharray="4"/>
    <!-- Index labels -->
    <text x="27"  y="14" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">0</text>
    <text x="82"  y="14" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">1</text>
    <text x="137" y="14" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">2</text>
    <text x="192" y="14" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">3</text>
    <text x="247" y="14" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">4</text>
    <text x="302" y="14" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">5</text>
    <!-- Height labels -->
    <text x="27"  y="-23" font-family="Arial" font-size="10" fill="#2C3E50" text-anchor="middle">2</text>
    <text x="82"  y="-13" font-family="Arial" font-size="10" fill="#2C3E50" text-anchor="middle">1</text>
    <text x="137" y="-53" font-family="Arial" font-size="10" fill="#2C3E50" text-anchor="middle">5</text>
    <text x="192" y="-63" font-family="Arial" font-size="10" fill="#2C3E50" text-anchor="middle">6</text>
    <text x="247" y="-23" font-family="Arial" font-size="10" fill="#2C3E50" text-anchor="middle">2</text>
    <text x="302" y="-33" font-family="Arial" font-size="10" fill="#2C3E50" text-anchor="middle">3</text>
    <!-- Best area label -->
    <text x="164" y="-55" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">area=5×2=10 ✓</text>
  </g>

  <!-- Sample pairs table -->
  <text x="25" y="330" font-family="Arial" font-size="10" fill="#7F8C8D" font-weight="bold">Sample pair evaluations:</text>
  <text x="25" y="344" font-family="Arial" font-size="10" fill="#2C3E50">i=0,j=0: min=2, area=2×1=2</text>
  <text x="25" y="357" font-family="Arial" font-size="10" fill="#2C3E50">i=2,j=2: min=5, area=5×1=5</text>
  <text x="25" y="370" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">i=2,j=3: min(5,6)=5, area=5×2=10 ← MAX</text>
  <text x="25" y="383" font-family="Arial" font-size="10" fill="#2C3E50">i=2,j=4: min(5,6,2)=2, area=2×3=6</text>

  <rect x="25" y="393" width="395" height="42" fill="#FDEDEC" stroke="#FFCCCC" rx="4"/>
  <text x="35" y="409" font-family="Arial" font-size="10" fill="#E74C3C" font-weight="bold">⚠ O(n²) pairs checked × O(1) each = O(n²) total</text>
  <text x="35" y="422" font-family="Arial" font-size="10" fill="#E74C3C">Idea: avoid rechecking — use stack to find</text>
  <text x="35" y="435" font-family="Arial" font-size="10" fill="#E67E22">left/right boundary for each bar in O(n)</text>

  <!-- Arrow -->
  <line x1="432" y1="305" x2="458" y2="305" stroke="#7F8C8D" stroke-width="2"/>
  <polygon points="458,300 468,305 458,310" fill="#7F8C8D"/>
  <rect x="430" y="278" width="48" height="24" fill="#FFF8E1" stroke="#F39C12" rx="3"/>
  <text x="454" y="293" font-family="Arial" font-size="9" fill="#D35400" text-anchor="middle">💡 Use</text>
  <text x="454" y="303" font-family="Arial" font-size="9" fill="#D35400" text-anchor="middle">Stack!</text>

  <!-- ===== APPROACH 2: MONOTONIC STACK ===== -->
  <rect x="468" y="115" width="417" height="380" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="468" y="115" width="417" height="40" fill="#27AE60" rx="7"/>
  <rect x="468" y="140" width="417" height="15" fill="#27AE60"/>
  <text x="677" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">② Monotonic Stack (Increasing) ⭐</text>
  <text x="677" y="167" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle" font-weight="bold">O(n) time · O(n) space</text>

  <text x="478" y="187" font-family="Arial" font-size="11" fill="#555">Maintain stack of increasing heights (by index).</text>
  <text x="478" y="201" font-family="Arial" font-size="11" fill="#555">When a shorter bar appears, pop and calculate area.</text>
  <text x="478" y="215" font-family="Arial" font-size="11" fill="#555">Width = distance between current and new stack top.</text>

  <text x="478" y="232" font-family="Arial" font-size="10" fill="#7F8C8D" font-weight="bold">Process heights=[2,1,5,6,2,3] (append 0 sentinel):</text>

  <!-- Step-by-step table -->
  <rect x="478" y="238" width="397" height="18" fill="#F0F0F0" rx="2"/>
  <text x="490" y="250" font-family="Arial" font-size="9" font-weight="bold" fill="#555">i   h[i]   Action                              Stack(idx)   maxArea</text>

  <rect x="478" y="256" width="397" height="18" fill="#EBF5FB"/>
  <text x="490" y="268" font-family="Arial" font-size="9" fill="#2C3E50">0    2     push 0                               [0]            0</text>

  <rect x="478" y="274" width="397" height="28" fill="#FADBD8"/>
  <text x="490" y="285" font-family="Arial" font-size="9" fill="#C0392B">1    1     h[1]=1 &lt; h[0]=2 → pop 0, h=2, w=1    []            2</text>
  <text x="490" y="295" font-family="Arial" font-size="9" fill="#7F8C8D">          push 1                               [1]            2</text>

  <rect x="478" y="302" width="397" height="18" fill="#EBF5FB"/>
  <text x="490" y="314" font-family="Arial" font-size="9" fill="#2C3E50">2    5     push 2                               [1,2]          2</text>

  <rect x="478" y="320" width="397" height="18" fill="#EBF5FB"/>
  <text x="490" y="332" font-family="Arial" font-size="9" fill="#2C3E50">3    6     push 3                               [1,2,3]        2</text>

  <rect x="478" y="338" width="397" height="37" fill="#D5E8D4"/>
  <text x="490" y="350" font-family="Arial" font-size="9" fill="#1E8449">4    2     h[4]=2 &lt; h[3]=6 → pop3, h=6, w=4-2-1=1 [1,2] area=6</text>
  <text x="490" y="362" font-family="Arial" font-size="9" fill="#1E8449">          h[4]=2 = h[2]=5? → pop2, h=5, w=4-1-1=2  [1]   area=10 ← MAX!</text>
  <text x="490" y="372" font-family="Arial" font-size="9" fill="#2C3E50">          push 4                               [1,4]         10</text>

  <rect x="478" y="375" width="397" height="18" fill="#EBF5FB"/>
  <text x="490" y="387" font-family="Arial" font-size="9" fill="#2C3E50">5    3     push 5                               [1,4,5]       10</text>

  <rect x="478" y="393" width="397" height="28" fill="#D5E8D4"/>
  <text x="490" y="405" font-family="Arial" font-size="9" fill="#1E8449">6    0     pop5:h=3,w=6-4-1=1→3; pop4:h=2,w=6-1-1=4→8</text>
  <text x="490" y="415" font-family="Arial" font-size="9" fill="#1E8449">          pop1:h=1,w=6-(-1)-1=6→6. maxArea=10</text>

  <rect x="478" y="428" width="397" height="26" fill="#D5E8D4" stroke="#27AE60" rx="3"/>
  <text x="677" y="445" font-family="Arial" font-size="12" fill="#1E8449" font-weight="bold" text-anchor="middle">Answer: 10  ✓  (bars 2&amp;3, height=5, width=2)</text>

  <rect x="478" y="460" width="397" height="28" fill="#EAFAF1" stroke="#A9DFBF" rx="4"/>
  <text x="488" y="474" font-family="Arial" font-size="10" fill="#1E8449" font-weight="bold">✓ Each bar pushed and popped at most once → O(n)</text>
  <text x="488" y="488" font-family="Arial" font-size="10" fill="#27AE60">Width = i − stack.peek() − 1  (or i if stack empty)</text>

  <!-- ===== COMPLEXITY TABLE ===== -->
  <rect x="15" y="503" width="870" height="108" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5" rx="7"/>
  <text x="450" y="522" font-family="Arial" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">Complexity Comparison &amp; Evolution</text>
  <rect x="25" y="528" width="850" height="24" fill="#2C3E50" rx="3"/>
  <text x="200" y="544" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Approach</text>
  <text x="460" y="544" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Time</text>
  <text x="580" y="544" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Space</text>
  <text x="740" y="544" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Key Insight</text>
  <rect x="25" y="552" width="850" height="24" fill="#FDEDEC"/>
  <text x="200" y="568" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">① Brute Force (all pairs)</text>
  <text x="460" y="568" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n²)</text>
  <text x="580" y="568" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(1)</text>
  <text x="740" y="568" font-family="Arial" font-size="11" fill="#7F8C8D" text-anchor="middle">Try every start/end bar combo</text>
  <rect x="25" y="576" width="850" height="24" fill="#EAFAF1"/>
  <text x="200" y="592" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle" font-weight="bold">② Monotonic Stack ⭐ OPTIMAL</text>
  <text x="460" y="592" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
  <text x="580" y="592" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
  <text x="740" y="592" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Pop at smaller bar → compute bounded width</text>
  <text x="450" y="612" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">Evolution: O(n²) nested pairs → O(n) stack — each bar acts as height once, width derived from stack boundaries</text>
</svg>
