<svg width="900" height="620" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes push_hl{0%,10%{fill:#EBF5FB}15%,35%{fill:#D5E8D4;stroke:#27AE60}40%,100%{fill:#EBF5FB}}
  @keyframes pop_hl{0%,10%{fill:#D5E8D4}15%,35%{fill:#D5F5E3;stroke:#27AE60;stroke-width:2}40%,100%{fill:#D5E8D4}}
  @keyframes pass_hl{0%,45%{fill:#EBF5FB}52%,78%{fill:#D5E8D4;stroke:#27AE60}83%,100%{fill:#EBF5FB}}
  .vp_r1{animation:push_hl 8s 0s ease-in-out infinite}
  .vp_r2{animation:push_hl 8s 0.8s ease-in-out infinite}
  .vp_r3{animation:push_hl 8s 1.6s ease-in-out infinite}
  .vp_r4{animation:pop_hl 8s 2.4s ease-in-out infinite}
  .vp_r5{animation:pop_hl 8s 3.2s ease-in-out infinite}
  .vp_r6{animation:pop_hl 8s 4s ease-in-out infinite}
  .vp_brute{animation:pass_hl 8s 5s ease-in-out infinite}
</style>
  <rect width="900" height="620" fill="#F8F9FA" rx="10"/>
  <!-- Title Bar -->
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect x="0" y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="430" y="35" font-family="Arial" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Valid Parentheses</text>
  <rect x="800" y="13" width="85" height="28" fill="#27AE60" rx="14"/>
  <text x="843" y="32" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Easy ✅</text>

  <!-- Example row -->
  <rect x="15" y="63" width="870" height="44" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="25" y="80" font-family="Arial" font-size="12" fill="#7F8C8D">Input:</text>
  <text x="70" y="80" font-family="Arial" font-size="13" fill="#2C3E50" font-weight="bold">"([{}])"</text>
  <text x="160" y="80" font-family="Arial" font-size="13" fill="#7F8C8D">→</text>
  <text x="178" y="80" font-family="Arial" font-size="13" fill="#27AE60" font-weight="bold">true</text>
  <text x="240" y="80" font-family="Arial" font-size="12" fill="#7F8C8D">|</text>
  <text x="255" y="80" font-family="Arial" font-size="13" fill="#2C3E50" font-weight="bold">"([)]"</text>
  <text x="330" y="80" font-family="Arial" font-size="13" fill="#7F8C8D">→</text>
  <text x="348" y="80" font-family="Arial" font-size="13" fill="#E74C3C" font-weight="bold">false</text>
  <text x="430" y="80" font-family="Arial" font-size="12" fill="#7F8C8D">|</text>
  <text x="445" y="80" font-family="Arial" font-size="13" fill="#2C3E50" font-weight="bold">"("</text>
  <text x="480" y="80" font-family="Arial" font-size="13" fill="#7F8C8D">→</text>
  <text x="498" y="80" font-family="Arial" font-size="13" fill="#E74C3C" font-weight="bold">false</text>
  <text x="600" y="80" font-family="Arial" font-size="12" fill="#7F8C8D">Rule: Every open bracket must be closed in correct LIFO order</text>

  <!-- ===== APPROACH 1: BRUTE FORCE ===== -->
  <rect x="15" y="115" width="258" height="355" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="115" width="258" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="140" width="258" height="15" fill="#E74C3C"/>
  <text x="144" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">① Brute Force — String Replace</text>
  <text x="144" y="167" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle" font-weight="bold">O(n²) time · O(1) space</text>

  <text x="25" y="188" font-family="Arial" font-size="11" fill="#555">Repeatedly replace matched pairs until</text>
  <text x="25" y="202" font-family="Arial" font-size="11" fill="#555">no changes occur. Empty string = valid.</text>

  <rect x="25" y="210" width="238" height="26" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1" rx="3"/>
  <text x="144" y="227" font-family="Arial" font-size="12" fill="#2C3E50" font-weight="bold" text-anchor="middle">Start:  "( [ { } ] )"</text>

  <text x="144" y="252" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">▼  replace "{}" with ""</text>
  <rect class="vp_brute" x="25" y="257" width="238" height="26" fill="#FDEBD0" stroke="#E67E22" stroke-width="1" rx="3"/>
  <text x="144" y="274" font-family="Arial" font-size="12" fill="#2C3E50" font-weight="bold" text-anchor="middle">Pass 1:  "( [     ] )"</text>

  <text x="144" y="298" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">▼  replace "[]" with ""</text>
  <rect x="25" y="303" width="238" height="26" fill="#FDEBD0" stroke="#E67E22" stroke-width="1" rx="3"/>
  <text x="144" y="320" font-family="Arial" font-size="12" fill="#2C3E50" font-weight="bold" text-anchor="middle">Pass 2:  "(        )"</text>

  <text x="144" y="344" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">▼  replace "()" with ""</text>
  <rect x="25" y="349" width="238" height="26" fill="#D5E8D4" stroke="#27AE60" stroke-width="1.5" rx="3"/>
  <text x="144" y="366" font-family="Arial" font-size="12" fill="#27AE60" font-weight="bold" text-anchor="middle">Pass 3:  ""  → isEmpty() = true ✓</text>

  <rect x="25" y="388" width="238" height="70" fill="#FEF9F9" stroke="#FFCCCC" rx="4"/>
  <text x="35" y="404" font-family="Arial" font-size="10" fill="#E74C3C" font-weight="bold">⚠ Drawbacks:</text>
  <text x="35" y="419" font-family="Arial" font-size="10" fill="#E74C3C">Each pass is O(n), up to O(n/2) passes</text>
  <text x="35" y="433" font-family="Arial" font-size="10" fill="#E74C3C">→ Total: O(n²) worst case</text>
  <text x="35" y="447" font-family="Arial" font-size="10" fill="#E74C3C">String operations: memory-heavy</text>

  <!-- Arrow 1 with insight -->
  <line x1="275" y1="295" x2="313" y2="295" stroke="#7F8C8D" stroke-width="2"/>
  <polygon points="313,290 323,295 313,300" fill="#7F8C8D"/>
  <rect x="265" y="265" width="68" height="22" fill="#FFF8E1" stroke="#F39C12" rx="3"/>
  <text x="299" y="279" font-family="Arial" font-size="9" fill="#D35400" text-anchor="middle">💡 Use Stack</text>
  <text x="299" y="289" font-family="Arial" font-size="9" fill="#D35400" text-anchor="middle">for LIFO!</text>

  <!-- ===== APPROACH 2: STACK STANDARD ===== -->
  <rect x="323" y="115" width="258" height="355" fill="#FFFFFF" stroke="#E67E22" stroke-width="2" rx="7"/>
  <rect x="323" y="115" width="258" height="40" fill="#E67E22" rx="7"/>
  <rect x="323" y="140" width="258" height="15" fill="#E67E22"/>
  <text x="452" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">② Stack — Standard</text>
  <text x="452" y="167" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle" font-weight="bold">O(n) time · O(n) space</text>

  <text x="333" y="188" font-family="Arial" font-size="11" fill="#555">Process "( [ { } ] )" char by char:</text>

  <!-- Table header -->
  <rect x="333" y="194" width="238" height="20" fill="#F0F0F0" rx="2"/>
  <text x="355" y="208" font-family="Arial" font-size="10" fill="#555" font-weight="bold">Char</text>
  <text x="400" y="208" font-family="Arial" font-size="10" fill="#555" font-weight="bold">Action</text>
  <text x="490" y="208" font-family="Arial" font-size="10" fill="#555" font-weight="bold">Stack (top→)</text>

  <!-- Row: ( -->
  <rect class="vp_r1" x="333" y="214" width="238" height="22" fill="#EBF5FB"/>
  <text x="350" y="229" font-family="Arial" font-size="12" fill="#3498DB" font-weight="bold">(</text>
  <text x="395" y="229" font-family="Arial" font-size="11" fill="#2C3E50">push</text>
  <text x="485" y="229" font-family="Arial" font-size="11" fill="#2C3E50" font-weight="bold">( ]</text>

  <!-- Row: [ -->
  <rect class="vp_r2" x="333" y="236" width="238" height="22" fill="#EBF5FB"/>
  <text x="350" y="251" font-family="Arial" font-size="12" fill="#3498DB" font-weight="bold">[</text>
  <text x="395" y="251" font-family="Arial" font-size="11" fill="#2C3E50">push</text>
  <text x="485" y="251" font-family="Arial" font-size="11" fill="#2C3E50" font-weight="bold">( [ ]</text>

  <!-- Row: { -->
  <rect class="vp_r3" x="333" y="258" width="238" height="22" fill="#EBF5FB"/>
  <text x="350" y="273" font-family="Arial" font-size="12" fill="#3498DB" font-weight="bold">{</text>
  <text x="395" y="273" font-family="Arial" font-size="11" fill="#2C3E50">push</text>
  <text x="485" y="273" font-family="Arial" font-size="11" fill="#2C3E50" font-weight="bold">( [ { ]</text>

  <!-- Row: } MATCH -->
  <rect class="vp_r4" x="333" y="280" width="238" height="22" fill="#D5E8D4"/>
  <text x="350" y="295" font-family="Arial" font-size="12" fill="#27AE60" font-weight="bold">}</text>
  <text x="395" y="295" font-family="Arial" font-size="11" fill="#27AE60">pop { ✓</text>
  <text x="485" y="295" font-family="Arial" font-size="11" fill="#2C3E50" font-weight="bold">( [ ]</text>

  <!-- Row: ] MATCH -->
  <rect class="vp_r5" x="333" y="302" width="238" height="22" fill="#D5E8D4"/>
  <text x="350" y="317" font-family="Arial" font-size="12" fill="#27AE60" font-weight="bold">]</text>
  <text x="395" y="317" font-family="Arial" font-size="11" fill="#27AE60">pop [ ✓</text>
  <text x="485" y="317" font-family="Arial" font-size="11" fill="#2C3E50" font-weight="bold">( ]</text>

  <!-- Row: ) MATCH -->
  <rect class="vp_r6" x="333" y="324" width="238" height="22" fill="#D5E8D4"/>
  <text x="350" y="339" font-family="Arial" font-size="12" fill="#27AE60" font-weight="bold">)</text>
  <text x="395" y="339" font-family="Arial" font-size="11" fill="#27AE60">pop ( ✓</text>
  <text x="485" y="339" font-family="Arial" font-size="11" fill="#2C3E50" font-weight="bold">[ ]</text>

  <rect x="333" y="353" width="238" height="24" fill="#D5E8D4" stroke="#27AE60" rx="3"/>
  <text x="452" y="369" font-family="Arial" font-size="12" fill="#27AE60" font-weight="bold" text-anchor="middle">stack.isEmpty() → true ✓</text>

  <!-- Invalid case: ([)] -->
  <rect x="333" y="384" width="238" height="44" fill="#FDEDEC" stroke="#E74C3C" rx="3"/>
  <text x="343" y="400" font-family="Arial" font-size="10" fill="#E74C3C" font-weight="bold">Counter-example "([)]":</text>
  <text x="343" y="414" font-family="Arial" font-size="10" fill="#E74C3C">On ')': stack top = '[' ≠ '('  → false ✗</text>
  <text x="343" y="428" font-family="Arial" font-size="10" fill="#7F8C8D">Wrong bracket type → mismatch!</text>

  <text x="333" y="450" font-family="Arial" font-size="10" fill="#E67E22">⚠ Verbose if-else for matching check</text>
  <text x="333" y="463" font-family="Arial" font-size="10" fill="#E67E22">Adding new bracket types → more code</text>

  <!-- Arrow 2 with insight -->
  <line x1="583" y1="295" x2="621" y2="295" stroke="#7F8C8D" stroke-width="2"/>
  <polygon points="621,290 631,295 621,300" fill="#7F8C8D"/>
  <rect x="573" y="265" width="68" height="22" fill="#EAFAF1" stroke="#27AE60" rx="3"/>
  <text x="607" y="279" font-family="Arial" font-size="9" fill="#1E8449" text-anchor="middle">+ HashMap</text>
  <text x="607" y="289" font-family="Arial" font-size="9" fill="#1E8449" text-anchor="middle">for match</text>

  <!-- ===== APPROACH 3: STACK + HASHMAP ===== -->
  <rect x="631" y="115" width="254" height="355" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="631" y="115" width="254" height="40" fill="#27AE60" rx="7"/>
  <rect x="631" y="140" width="254" height="15" fill="#27AE60"/>
  <text x="758" y="140" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">③ Stack + HashMap ⭐</text>
  <text x="758" y="167" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle" font-weight="bold">O(n) time · O(n) space</text>

  <!-- Hashmap box -->
  <text x="641" y="188" font-family="Arial" font-size="11" fill="#555">Pre-define bracket pairs in a Map:</text>
  <rect x="641" y="193" width="234" height="60" fill="#EBF5FB" stroke="#3498DB" stroke-width="1" rx="4"/>
  <text x="655" y="211" font-family="Arial" font-size="12" fill="#2C3E50" font-weight="bold">map.put(  ')'  ,  '('  )</text>
  <text x="655" y="229" font-family="Arial" font-size="12" fill="#2C3E50" font-weight="bold">map.put(  '}'  ,  '{'  )</text>
  <text x="655" y="247" font-family="Arial" font-size="12" fill="#2C3E50" font-weight="bold">map.put(  ']'  ,  '['  )</text>

  <!-- Logic flow -->
  <text x="641" y="272" font-family="Arial" font-size="11" fill="#555">For each char c:</text>
  <rect x="641" y="277" width="234" height="110" fill="#F9FFF9" stroke="#27AE60" stroke-width="1" rx="4"/>

  <!-- Decision box -->
  <rect x="651" y="285" width="214" height="28" fill="#D5E8D4" rx="3"/>
  <text x="758" y="303" font-family="Arial" font-size="11" fill="#1E8449" font-weight="bold" text-anchor="middle">map.containsKey(c)?  (closing?)</text>

  <text x="665" y="328" font-family="Arial" font-size="10" fill="#2C3E50">YES → pop stack top</text>
  <text x="665" y="342" font-family="Arial" font-size="10" fill="#2C3E50">      if top ≠ map.get(c) → false</text>
  <text x="665" y="358" font-family="Arial" font-size="10" fill="#2C3E50">NO  → push c (opening bracket)</text>
  <text x="665" y="374" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">return stack.isEmpty()</text>

  <!-- Benefit box -->
  <rect x="641" y="395" width="234" height="60" fill="#EAFAF1" stroke="#27AE60" stroke-width="1" rx="4"/>
  <text x="651" y="412" font-family="Arial" font-size="10" fill="#1E8449" font-weight="bold">✓ Advantages over Approach 2:</text>
  <text x="651" y="427" font-family="Arial" font-size="10" fill="#27AE60">• Add new bracket type in 1 line</text>
  <text x="651" y="441" font-family="Arial" font-size="10" fill="#27AE60">• Same performance, cleaner code</text>
  <text x="651" y="455" font-family="Arial" font-size="10" fill="#27AE60">• map.get() handles all matching</text>

  <!-- ===== COMPLEXITY TABLE ===== -->
  <rect x="15" y="478" width="870" height="130" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5" rx="7"/>
  <text x="450" y="498" font-family="Arial" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">Complexity Comparison &amp; Evolution</text>
  <rect x="25" y="504" width="850" height="24" fill="#2C3E50" rx="3"/>
  <text x="180" y="520" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Approach</text>
  <text x="430" y="520" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Time</text>
  <text x="560" y="520" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Space</text>
  <text x="750" y="520" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Key Insight / When to Use</text>

  <rect x="25" y="528" width="850" height="24" fill="#FDEDEC"/>
  <text x="180" y="544" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">① Brute Force (String Replace)</text>
  <text x="430" y="544" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n²)</text>
  <text x="560" y="544" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(1)</text>
  <text x="750" y="544" font-family="Arial" font-size="11" fill="#7F8C8D" text-anchor="middle">Intuitive but slow — never in interviews</text>

  <rect x="25" y="552" width="850" height="24" fill="#FEF9EF"/>
  <text x="180" y="568" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle">② Stack (Standard if-else)</text>
  <text x="430" y="568" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle">O(n)</text>
  <text x="560" y="568" font-family="Arial" font-size="11" fill="#E67E22" text-anchor="middle">O(n)</text>
  <text x="750" y="568" font-family="Arial" font-size="11" fill="#7F8C8D" text-anchor="middle">LIFO property — works but not extensible</text>

  <rect x="25" y="576" width="850" height="24" fill="#EAFAF1"/>
  <text x="180" y="592" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle" font-weight="bold">③ Stack + HashMap ⭐ BEST</text>
  <text x="430" y="592" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
  <text x="560" y="592" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
  <text x="750" y="592" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Scalable — add any bracket pair in 1 line</text>

  <text x="450" y="615" font-family="Arial" font-size="10" fill="#7F8C8D" text-anchor="middle">Evolution: Replace String ops → Stack LIFO → HashMap for clean matching</text>
</svg>
