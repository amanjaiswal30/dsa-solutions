<svg width="900" height="560" xmlns="http://www.w3.org/2000/svg">
<style>
  @keyframes step_hl{0%,10%{fill:#F8F9FA}15%,38%{fill:#D5E8D4;stroke:#27AE60}43%,100%{fill:#F8F9FA}}
  @keyframes bar_hl{0%,60%{fill:#EBF5FB;stroke:#3498DB}68%,88%{fill:#D5E8D4;stroke:#27AE60}93%,100%{fill:#EBF5FB;stroke:#3498DB}}
  .nvp_r1{animation:step_hl 8s 0s ease-in-out infinite}
  .nvp_r2{animation:step_hl 8s 1.6s ease-in-out infinite}
  .nvp_r3{animation:step_hl 8s 3.2s ease-in-out infinite}
  .nvp_bar{animation:bar_hl 8s ease-in-out infinite}
</style>
  <rect width="900" height="560" fill="#F8F9FA" rx="10"/>
  <rect width="900" height="55" fill="#2C3E50" rx="10"/>
  <rect x="0" y="45" width="900" height="10" fill="#2C3E50"/>
  <text x="430" y="35" font-family="Arial" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Number of Visible People in a Queue</text>
  <rect x="785" y="13" width="105" height="28" fill="#E67E22" rx="14"/>
  <text x="837" y="32" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Hard 🔥</text>

  <rect x="15" y="63" width="870" height="60" fill="#FFFFFF" stroke="#DEE2E6" rx="5"/>
  <text x="25" y="84" font-family="Arial" font-size="12" fill="#7F8C8D">heights:</text>
  <text x="90" y="84" font-family="Arial" font-size="13" fill="#2C3E50" font-weight="bold">[10, 6, 8, 5, 11, 9]</text>
  <text x="260" y="84" font-family="Arial" font-size="13" fill="#7F8C8D">→</text>
  <text x="280" y="84" font-family="Arial" font-size="13" fill="#27AE60" font-weight="bold">[3, 1, 2, 1, 1, 0]</text>
  <text x="25" y="105" font-family="Arial" font-size="11" fill="#7F8C8D">Person i sees person j (i&lt;j) if everyone between them is shorter than both heights[i] and heights[j]</text>

  <!-- People bars for context -->
  <g transform="translate(25,128)">
    <text x="0" y="-4" font-family="Arial" font-size="10" fill="#7F8C8D" font-weight="bold">Queue (heights, left → right):</text>
    <g transform="translate(0,4)">
      <rect x="0"  y="30" width="34" height="30" fill="#EBF5FB" stroke="#3498DB" rx="3"/>
      <text x="17" y="50" font-family="Arial" font-size="12" font-weight="bold" fill="#3498DB" text-anchor="middle">10</text>
      <rect x="44" y="46" width="34" height="14" fill="#EBF5FB" stroke="#3498DB" rx="3"/>
      <text x="61" y="57" font-family="Arial" font-size="12" font-weight="bold" fill="#3498DB" text-anchor="middle">6</text>
      <rect x="88" y="38" width="34" height="22" fill="#EBF5FB" stroke="#3498DB" rx="3"/>
      <text x="105" y="53" font-family="Arial" font-size="12" font-weight="bold" fill="#3498DB" text-anchor="middle">8</text>
      <rect x="132" y="50" width="34" height="10" fill="#EBF5FB" stroke="#3498DB" rx="3"/>
      <text x="149" y="59" font-family="Arial" font-size="11" font-weight="bold" fill="#3498DB" text-anchor="middle">5</text>
      <rect x="176" y="20" width="34" height="40" fill="#FADBD8" stroke="#E74C3C" rx="3"/>
      <text x="193" y="45" font-family="Arial" font-size="12" font-weight="bold" fill="#E74C3C" text-anchor="middle">11</text>
      <rect x="220" y="34" width="34" height="26" fill="#EBF5FB" stroke="#3498DB" rx="3"/>
      <text x="237" y="51" font-family="Arial" font-size="12" font-weight="bold" fill="#3498DB" text-anchor="middle">9</text>
      <text x="17" y="74" font-family="Arial" font-size="9" fill="#7F8C8D" text-anchor="middle">0</text>
      <text x="61" y="74" font-family="Arial" font-size="9" fill="#7F8C8D" text-anchor="middle">1</text>
      <text x="105" y="74" font-family="Arial" font-size="9" fill="#7F8C8D" text-anchor="middle">2</text>
      <text x="149" y="74" font-family="Arial" font-size="9" fill="#7F8C8D" text-anchor="middle">3</text>
      <text x="193" y="74" font-family="Arial" font-size="9" fill="#7F8C8D" text-anchor="middle">4</text>
      <text x="237" y="74" font-family="Arial" font-size="9" fill="#7F8C8D" text-anchor="middle">5</text>
    </g>
    <!-- visibility arcs from person 0 -->
    <path d="M 17 26 Q 40 5 61 40" stroke="#27AE60" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 17 26 Q 65 -8 105 32" stroke="#27AE60" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    <path d="M 17 26 Q 100 -22 193 14" stroke="#27AE60" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
    <text x="330" y="30" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">Person 0 (h=10) sees 1, 2, 4 → answer[0] = 3</text>
    <text x="330" y="46" font-family="Arial" font-size="10" fill="#7F8C8D">Person 4 (h=11) is taller → view stops there, 5 is hidden</text>
  </g>

  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#27AE60"/>
    </marker>
  </defs>

  <!-- ===== APPROACH 1: BRUTE FORCE ===== -->
  <rect x="15" y="240" width="425" height="230" fill="#FFFFFF" stroke="#E74C3C" stroke-width="2" rx="7"/>
  <rect x="15" y="240" width="425" height="40" fill="#E74C3C" rx="7"/>
  <rect x="15" y="265" width="425" height="15" fill="#E74C3C"/>
  <text x="227" y="265" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">① Brute Force — Scan Right, Track Max</text>
  <text x="227" y="292" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle" font-weight="bold">O(n²) time · O(1) extra space</text>

  <text x="25" y="312" font-family="Arial" font-size="11" fill="#555">For person i, scan right keeping maxSoFar.</text>
  <text x="25" y="326" font-family="Arial" font-size="11" fill="#555">Every strictly taller person is visible; stop</text>
  <text x="25" y="340" font-family="Arial" font-size="11" fill="#555">once someone taller than heights[i] appears.</text>

  <rect class="nvp_r1" x="25" y="352" width="405" height="34" fill="#F8F9FA" stroke="#DEE2E6" rx="3"/>
  <text x="35" y="365" font-family="Arial" font-size="10" fill="#2C3E50" font-weight="bold">i=0 (10): j=1(6)✓ j=2(8)✓ j=3(5)✗(shorter than max 8)</text>
  <text x="35" y="379" font-family="Arial" font-size="10" fill="#2C3E50" font-weight="bold">j=4(11)✓ &amp; 11&gt;10 → stop. answer[0]=3</text>

  <rect x="25" y="392" width="405" height="60" fill="#FDEDEC" stroke="#FFCCCC" rx="4"/>
  <text x="35" y="408" font-family="Arial" font-size="10" fill="#E74C3C" font-weight="bold">Result: [3, 1, 2, 1, 1, 0] ✓</text>
  <text x="35" y="422" font-family="Arial" font-size="10" fill="#E74C3C">⚠ Worst case (strictly increasing heights):</text>
  <text x="35" y="436" font-family="Arial" font-size="10" fill="#E74C3C">every scan runs to the end → O(n²)</text>
  <text x="35" y="449" font-family="Arial" font-size="10" fill="#E67E22">Idea: process RIGHT→LEFT with a stack</text>

  <!-- Arrow between boxes -->
  <line x1="440" y1="355" x2="470" y2="355" stroke="#7F8C8D" stroke-width="2"/>
  <polygon points="470,350 480,355 470,360" fill="#7F8C8D"/>
  <rect x="428" y="330" width="64" height="22" fill="#FFF8E1" stroke="#F39C12" rx="3"/>
  <text x="460" y="343" font-family="Arial" font-size="9" fill="#D35400" text-anchor="middle">💡 Use</text>
  <text x="460" y="353" font-family="Arial" font-size="9" fill="#D35400" text-anchor="middle">Stack!</text>

  <!-- ===== APPROACH 2: MONOTONIC STACK ===== -->
  <rect x="480" y="240" width="405" height="230" fill="#FFFFFF" stroke="#27AE60" stroke-width="2.5" rx="7"/>
  <rect x="480" y="240" width="405" height="40" fill="#27AE60" rx="7"/>
  <rect x="480" y="265" width="405" height="15" fill="#27AE60"/>
  <text x="682" y="265" font-family="Arial" font-size="13" font-weight="bold" fill="white" text-anchor="middle">② Monotonic Stack (R→L) ⭐</text>
  <text x="682" y="292" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle" font-weight="bold">O(n) time · O(n) space</text>

  <text x="490" y="312" font-family="Arial" font-size="11" fill="#555">Traverse right→left. Pop everyone shorter</text>
  <text x="490" y="326" font-family="Arial" font-size="11" fill="#555">than heights[i] (visible), then +1 more if</text>
  <text x="490" y="340" font-family="Arial" font-size="11" fill="#555">someone taller/equal remains (blocks view).</text>

  <rect class="nvp_r2" x="490" y="352" width="385" height="46" fill="#FEF9EF" stroke="#E67E22" rx="3"/>
  <text x="500" y="365" font-family="Arial" font-size="10" fill="#2C3E50" font-weight="bold">i=3 (5): stack=[9,11] → top 9≥5, count=0+1=1</text>
  <text x="500" y="379" font-family="Arial" font-size="10" fill="#2C3E50" font-weight="bold">push 5 → stack=[9,11,5]. answer[3]=1</text>
  <text x="500" y="393" font-family="Arial" font-size="10" fill="#7F8C8D">i=2 (8): pop 5(&lt;8) count=1, top 9≥8 → +1 = 2</text>

  <rect x="490" y="402" width="385" height="52" fill="#EAFAF1" stroke="#27AE60" rx="4"/>
  <text x="500" y="418" font-family="Arial" font-size="10" fill="#1E8449" font-weight="bold">Why O(n)? Each height is pushed and popped</text>
  <text x="500" y="432" font-family="Arial" font-size="10" fill="#1E8449">from the stack at most once → 2n operations total.</text>
  <text x="500" y="446" font-family="Arial" font-size="10" fill="#27AE60" font-weight="bold">Result: [3, 1, 2, 1, 1, 0] ✓</text>

  <!-- ===== COMPLEXITY TABLE ===== -->
  <rect x="15" y="480" width="870" height="70" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="1.5" rx="7"/>
  <text x="450" y="498" font-family="Arial" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="middle">Complexity Comparison</text>
  <rect x="25" y="504" width="850" height="20" fill="#2C3E50" rx="3"/>
  <text x="180" y="518" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Approach</text>
  <text x="450" y="518" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Time</text>
  <text x="600" y="518" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Space</text>
  <text x="770" y="518" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Key Insight</text>
  <rect x="25" y="524" width="850" height="20" fill="#FDEDEC"/>
  <text x="180" y="538" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">① Brute Force (track running max)</text>
  <text x="450" y="538" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(n²)</text>
  <text x="600" y="538" font-family="Arial" font-size="11" fill="#E74C3C" text-anchor="middle">O(1)</text>
  <text x="770" y="538" font-family="Arial" font-size="11" fill="#7F8C8D" text-anchor="middle">Scan right for every person</text>
  <rect x="25" y="544" width="850" height="20" fill="#EAFAF1"/>
  <text x="180" y="558" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle" font-weight="bold">② Monotonic Stack (R→L) ⭐</text>
  <text x="450" y="558" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
  <text x="600" y="558" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">O(n)</text>
  <text x="770" y="558" font-family="Arial" font-size="11" fill="#27AE60" text-anchor="middle">Pop shorter people — each pushed/popped once</text>
</svg>
